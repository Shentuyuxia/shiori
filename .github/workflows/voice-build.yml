name: Build voice audio (VOICEVOX)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/voices.json", "tools/tts_texts.json", "tools/voicevox_build.py", ".github/workflows/voice-build.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        voice: [118]
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Start VOICEVOX engine
        run: docker run -d --name vv -p 50021:50021 voicevox/voicevox_engine:cpu-latest
      - name: Synthesize voice ${{ matrix.voice }}
        env:
          VV_VOICE: ${{ matrix.voice }}
          VV_COMMIT: "1"
          VV_JOBS: "3"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/voicevox_build.py
