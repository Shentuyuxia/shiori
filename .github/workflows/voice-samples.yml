name: Voice samples (VOICEVOX)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/voice-samples.yml", "tools/voice_samples.py"]
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Start VOICEVOX engine
        run: docker run -d --name vv -p 50021:50021 voicevox/voicevox_engine:cpu-latest
      - name: Generate samples
        run: |
          mkdir -p samples
          set -o pipefail
          python3 tools/voice_samples.py 2>&1 | tee samples/log.txt || (docker logs vv 2>&1 | tail -15 >> samples/log.txt; true)
      - name: Commit samples
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples
          git commit -m "Add VOICEVOX voice samples" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
