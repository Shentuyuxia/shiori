const TRP={"w-sake-e":[{"zh-Hant":"日本酒是用米和水釀成的。","zh-Hans":"日本酒是用米和水酿成的。","en":"Sake is made from rice and water.","de":"Sake wird aus Reis und Wasser gemacht."},{"zh-Hant":"首先把米蒸熟。接著使用一種叫「麴」的黴菌。麴會把米變成甜甜的糖。","zh-Hans":"首先把米蒸熟。接着使用一种叫「曲」的霉菌。曲会把米变成甜甜的糖。","en":"First, the rice is steamed. Next, a mould called koji is used. Koji turns the rice into sweet sugar.","de":"Zuerst wird der Reis gedämpft. Dann kommt ein Schimmelpilz namens Koji dazu. Koji verwandelt den Reis in süßen Zucker."},{"zh-Hant":"然後，酵母再把糖變成酒精。日本酒多半在冬天釀造，因為天冷的時候壞菌比較少。","zh-Hans":"然后，酵母再把糖变成酒精。日本酒多半在冬天酿造，因为天冷的时候坏菌比较少。","en":"Then yeast turns the sugar into alcohol. Sake is usually made in winter, because when it's cold there are fewer bad germs.","de":"Danach verwandelt Hefe den Zucker in Alkohol. Sake wird meist im Winter gemacht, weil es bei Kälte weniger schädliche Keime gibt."}],"w-sake":[{"zh-Hant":"日本酒的原料簡單得令人驚訝：米和水，再加上麴和酵母。光靠這些，就能釀出帶著水果香氣的酒。","zh-Hans":"日本酒的原料简单得令人惊讶：米和水，再加上曲和酵母。光靠这些，就能酿出带着水果香气的酒。","en":"The ingredients of sake are surprisingly simple: rice and water, plus koji and yeast. That alone produces a drink with a fruity aroma.","de":"Die Zutaten von Sake sind erstaunlich schlicht: Reis und Wasser, dazu Koji und Hefe. Mehr braucht es nicht für ein Getränk mit fruchtigem Duft."},{"zh-Hant":"首先要磨掉米粒的外層，這叫「精米」。外層含有很多會帶來雜味的成分，所以磨得越多，味道就越清爽。把米磨到剩一半以下所釀的酒，稱為「大吟釀」。","zh-Hans":"首先要磨掉米粒的外层，这叫「精米」。外层含有很多会带来杂味的成分，所以磨得越多，味道就越清爽。把米磨到剩一半以下所酿的酒，称为「大吟酿」。","en":"First, the outer layer of the rice is ground away. This is called polishing. The outer layer contains a lot of what causes off-flavours, so the more you polish, the cleaner the taste. Sake made from rice polished to half its size or less is called daiginjō.","de":"Zuerst wird die äußere Schicht des Reiskorns abgeschliffen – das „Polieren“. Außen sitzen viele Stoffe, die Fehlaromen verursachen; je mehr man abschleift, desto klarer der Geschmack. Sake aus Reis, der auf die Hälfte oder weniger poliert wurde, heißt Daiginjō."},{"zh-Hant":"葡萄酒的原料葡萄本身就含有糖分，但米的主要成分是澱粉，酵母沒辦法直接把它變成酒精。這時就輪到麴登場了：麴菌這種黴菌會把澱粉轉化成糖，同時，在同一個酒槽裡，酵母再把糖變成酒精。糖化和發酵同時進行的這種機制叫「平行複式發酵」，這也是日本酒在釀造酒中酒精度數偏高的原因。","zh-Hans":"葡萄酒的原料葡萄本身就含有糖分，但米的主要成分是淀粉，酵母没办法直接把它变成酒精。这时就轮到曲登场了：曲菌这种霉菌会把淀粉转化成糖，同时，在同一个酒槽里，酵母再把糖变成酒精。糖化和发酵同时进行的这种机制叫「平行复式发酵」，这也是日本酒在酿造酒中酒精度数偏高的原因。","en":"Grapes, the raw material of wine, already contain sugar. Rice, however, is mainly starch, which yeast cannot turn into alcohol directly. That is where koji comes in: the koji mould converts starch into sugar, and in the same tank the yeast turns that sugar into alcohol. This simultaneous saccharification and fermentation is called multiple parallel fermentation, and it is why sake has a relatively high alcohol content for a brewed drink.","de":"Trauben, der Rohstoff für Wein, enthalten von Natur aus Zucker. Reis besteht dagegen vor allem aus Stärke, die Hefe nicht direkt in Alkohol umwandeln kann. Hier kommt Koji ins Spiel: Der Koji-Pilz wandelt Stärke in Zucker um, und im selben Tank macht die Hefe daraus Alkohol. Dieses gleichzeitige Verzuckern und Vergären nennt man parallele Mehrfachgärung – deshalb hat Sake für ein gebrautes Getränk relativ viel Alkohol."},{"zh-Hant":"自古以來，釀酒都在冬天進行，因為氣溫低時雜菌不容易繁殖。在酒藏裡帶領工匠們的總負責人叫「杜氏」。冬天的早晨，在冒著熱氣的蒸米後方，寄託著這一年酒的味道。","zh-Hans":"自古以来，酿酒都在冬天进行，因为气温低时杂菌不容易繁殖。在酒藏里带领工匠们的总负责人叫「杜氏」。冬天的早晨，在冒着热气的蒸米后方，寄托着这一年酒的味道。","en":"Brewing has traditionally been done in winter, because unwanted bacteria multiply less when it's cold. The person who leads the craftsmen in the brewery is called the tōji. On a winter morning, behind the steaming rice, that year's flavour is placed in their hands.","de":"Traditionell wird im Winter gebraut, weil sich unerwünschte Keime bei Kälte kaum vermehren. Wer in der Brauerei die Handwerker anleitet, heißt Tōji. An einem Wintermorgen, hinter dem dampfenden Reis, liegt der Geschmack des ganzen Jahrgangs in seinen Händen."}],"w-natto-e":[{"zh-Hant":"納豆是用黃豆做的日本食物。","zh-Hans":"纳豆是用黄豆做的日本食物。","en":"Natto is a Japanese food made from soybeans.","de":"Natto ist ein japanisches Lebensmittel aus Sojabohnen."},{"zh-Hant":"攪拌納豆，就會牽出白色的絲。攪得越多，絲也越多。","zh-Hans":"搅拌纳豆，就会牵出白色的丝。搅得越多，丝也越多。","en":"When you stir natto, white strings appear. The more you stir, the more strings there are.","de":"Wenn man Natto umrührt, entstehen weiße Fäden. Je mehr man rührt, desto mehr Fäden gibt es."},{"zh-Hant":"納豆的氣味很重，有人喜歡，也有人怕。很多人早餐時配白飯一起吃。","zh-Hans":"纳豆的气味很重，有人喜欢，也有人怕。很多人早餐时配白饭一起吃。","en":"Natto has a strong smell. Some people love it, others can't stand it. Many people eat it with rice for breakfast.","de":"Natto riecht stark. Manche lieben es, andere mögen es gar nicht. Viele essen es zum Frühstück mit Reis."}],"w-natto":[{"zh-Hant":"來日本的外國人常把納豆列為「最怕的食物」。除了氣味，用筷子夾起來時那種沒完沒了牽絲的樣子，似乎最讓人吃驚。","zh-Hans":"来日本的外国人常把纳豆列为「最怕的食物」。除了气味，用筷子夹起来时那种没完没了牵丝的样子，似乎最让人吃惊。","en":"Natto is often named by visitors to Japan as the food they like least. Besides the smell, it's the look that surprises them: the endless strings when you lift it with chopsticks.","de":"Besucher in Japan nennen Natto oft als das Essen, das sie am wenigsten mögen. Neben dem Geruch überrascht vor allem der Anblick: die endlosen Fäden, wenn man es mit Stäbchen anhebt."},{"zh-Hant":"納豆的做法是在蒸熟的黃豆裡加入納豆菌，放在四十度左右的溫暖地方約一天。納豆菌是枯草桿菌的一種，原本大量生活在稻草上。以前是用稻草把煮好的豆子包起來做的。","zh-Hans":"纳豆的做法是在蒸熟的黄豆里加入纳豆菌，放在四十度左右的温暖地方约一天。纳豆菌是枯草杆菌的一种，原本大量生活在稻草上。以前是用稻草把煮好的豆子包起来做的。","en":"Natto is made by adding natto bacteria to steamed soybeans and leaving them in a warm place at around 40 °C for about a day. Natto bacteria are a kind of hay bacillus that originally lives in large numbers on rice straw. In the past, cooked beans were wrapped in straw to make it.","de":"Für Natto gibt man Natto-Bakterien zu gedämpften Sojabohnen und lässt sie etwa einen Tag bei rund 40 °C warm stehen. Natto-Bakterien gehören zum Heubazillus, der ursprünglich in großer Zahl auf Reisstroh lebt. Früher wickelte man gekochte Bohnen dafür in Stroh."},{"zh-Hant":"那些絲的真面目，是納豆菌製造的一種叫「聚麩胺酸」的物質。它是胺基酸之一的麩胺酸像鎖鏈一樣長長連在一起而成，是黏性的來源。據說攪拌得越久，絲就越多，鮮味也更容易感受到。","zh-Hans":"那些丝的真面目，是纳豆菌制造的一种叫「聚谷氨酸」的物质。它是氨基酸之一的谷氨酸像锁链一样长长连在一起而成，是黏性的来源。据说搅拌得越久，丝就越多，鲜味也更容易感受到。","en":"The strings are a substance called polyglutamic acid, produced by the natto bacteria. It consists of glutamic acid, an amino acid, linked in a long chain, and it's the source of the stickiness. It's said that the more you stir, the more strings form and the more umami you taste.","de":"Die Fäden bestehen aus Polyglutaminsäure, die die Natto-Bakterien bilden. Das ist die Aminosäure Glutaminsäure, zu einer langen Kette verbunden – sie macht Natto klebrig. Je länger man rührt, heißt es, desto mehr Fäden entstehen und desto stärker schmeckt man das Umami."},{"zh-Hant":"在日本國內，對納豆的喜好也因地區而異。傳統上東日本吃得多，關西則不太吃。不過因為有「對健康好」的形象，現在全國各地都吃了。","zh-Hans":"在日本国内，对纳豆的喜好也因地区而异。传统上东日本吃得多，关西则不太吃。不过因为有「对健康好」的形象，现在全国各地都吃了。","en":"Even within Japan, liking natto depends on the region. Traditionally it was eaten a lot in eastern Japan and much less in Kansai. Thanks partly to its healthy image, it's now eaten all over the country.","de":"Auch innerhalb Japans hängt die Vorliebe für Natto von der Region ab. Traditionell aß man es viel im Osten und wenig in Kansai. Auch wegen seines gesunden Images isst man es heute im ganzen Land."}],"w-katsuo-e":[{"zh-Hant":"柴魚是用一種叫鰹魚的魚做的。","zh-Hans":"柴鱼是用一种叫鲣鱼的鱼做的。","en":"Katsuobushi is made from a fish called bonito.","de":"Katsuobushi wird aus einem Fisch namens Bonito gemacht."},{"zh-Hant":"把魚煮過，再用煙燻乾。它非常硬，就像木頭一樣。","zh-Hans":"把鱼煮过，再用烟熏干。它非常硬，就像木头一样。","en":"The fish is boiled and then dried with smoke. It's very hard, like wood.","de":"Der Fisch wird gekocht und dann im Rauch getrocknet. Er ist sehr hart, wie Holz."},{"zh-Hant":"用來做菜的時候，要把它削成薄片。對日本的高湯來說，柴魚非常重要。","zh-Hans":"用来做菜的时候，要把它削成薄片。对日本的高汤来说，柴鱼非常重要。","en":"When you cook with it, you shave it thinly. Katsuobushi is essential for Japanese dashi.","de":"Zum Kochen hobelt man ihn in dünne Späne. Für japanische Dashi-Brühe ist Katsuobushi unverzichtbar."}],"w-katsuo":[{"zh-Hant":"兩根互相敲擊，會發出像梆子一樣「鏗鏗」的聲音。這就是柴魚，有時被稱為「世界上最硬的食物」。","zh-Hans":"两根互相敲击，会发出像梆子一样「铿铿」的声音。这就是柴鱼，有时被称为「世界上最硬的食物」。","en":"Knock two of them together and they clack like wooden clappers. This is katsuobushi, sometimes called the hardest food in the world.","de":"Schlägt man zwei Stück aneinander, klappern sie wie Holzklappern. Das ist Katsuobushi, manchmal das härteste Lebensmittel der Welt genannt."},{"zh-Hant":"做法很費工。先把鰹魚切成三片，煮過後去骨，再一邊用煙燻一邊逼出水分。做到這一步的叫「荒節」。接著削去表面，刻意讓它長黴，再拿去曬太陽。這樣反覆好幾次的就是「本枯節」，有時要花半年以上才完成。","zh-Hans":"做法很费工。先把鲣鱼切成三片，煮过后去骨，再一边用烟熏一边逼出水分。做到这一步的叫「荒节」。接着削去表面，刻意让它长霉，再拿去晒太阳。这样反复好几次的就是「本枯节」，有时要花半年以上才完成。","en":"Making it is laborious. The bonito is filleted into three pieces, boiled, deboned and then smoked to drive out the moisture. At this stage it's called arabushi. Then the surface is shaved, mould is deliberately applied, and it's dried in the sun. Repeat this several times and you get honkarebushi, which can take more than six months to finish.","de":"Die Herstellung ist aufwendig. Der Bonito wird in drei Teile filetiert, gekocht, entgrätet und dann geräuchert, um ihm das Wasser zu entziehen. In diesem Stadium heißt er Arabushi. Danach wird die Oberfläche abgehobelt, gezielt Schimmel aufgebracht und in der Sonne getrocknet. Mehrfach wiederholt entsteht Honkarebushi – das kann über ein halbes Jahr dauern."},{"zh-Hant":"聽到「黴」也許會嚇一跳，但正是這些黴菌吸走殘餘的水分、分解脂肪，讓香氣和鮮味更深。它和起司、日本酒一樣，是借助微生物力量的發酵食品。","zh-Hans":"听到「霉」也许会吓一跳，但正是这些霉菌吸走残余的水分、分解脂肪，让香气和鲜味更深。它和起司、日本酒一样，是借助微生物力量的发酵食品。","en":"Mould may sound alarming, but it soaks up the remaining moisture and breaks down the fat, deepening the aroma and umami. Like cheese and sake, it's a fermented food made with the help of microorganisms.","de":"Schimmel mag erschrecken, doch er saugt die restliche Feuchtigkeit auf und baut Fett ab – so werden Duft und Umami tiefer. Wie Käse und Sake ist es ein fermentiertes Lebensmittel, das auf Mikroorganismen setzt."},{"zh-Hant":"以前家裡都有專用的刨具，有人說早上是被削柴魚的聲音叫醒的。現在一般都買已經削好、裝在袋子裡的「柴魚片」，但它作為高湯基礎的地位沒有改變。","zh-Hans":"以前家里都有专用的刨具，有人说早上是被削柴鱼的声音叫醒的。现在一般都买已经削好、装在袋子里的「柴鱼片」，但它作为高汤基础的地位没有改变。","en":"Homes used to have a special shaving box, and some people say they woke up to the sound of katsuobushi being shaved. Today people usually buy ready-made flakes in a bag, but it is still the basis of dashi.","de":"Früher hatten Haushalte einen eigenen Hobel, und manche erzählen, sie seien morgens vom Geräusch des Hobelns aufgewacht. Heute kauft man meist fertige Flocken im Beutel, doch als Grundlage für Dashi ist er geblieben."}],"w-tanuki-e":[{"zh-Hant":"日本的民間故事裡常常出現狸和狐狸。","zh-Hans":"日本的民间故事里常常出现狸和狐狸。","en":"Tanuki and foxes often appear in Japanese folk tales.","de":"In japanischen Märchen kommen oft Tanuki und Füchse vor."},{"zh-Hant":"以前的人認為狸和狐狸都會變成人，也很會騙人。","zh-Hans":"以前的人认为狸和狐狸都会变成人，也很会骗人。","en":"People long ago believed that both tanuki and foxes could turn into humans. They're also good at tricking people.","de":"Früher glaubte man, dass sich Tanuki und Füchse in Menschen verwandeln können. Sie sind auch gut darin, Leute hereinzulegen."},{"zh-Hant":"烏龍麵店裡有「豆皮烏龍麵（きつねうどん）」，裡面放了油豆皮。據說狐狸喜歡吃油豆皮。","zh-Hans":"乌龙面店里有「豆皮乌龙面（きつねうどん）」，里面放了油豆皮。据说狐狸喜欢吃油豆皮。","en":"Udon shops have kitsune udon, which comes with fried tofu. Foxes are said to love fried tofu.","de":"In Udon-Läden gibt es Kitsune-Udon mit frittiertem Tofu. Man sagt, Füchse lieben frittierten Tofu."}],"w-tanuki":[{"zh-Hant":"日本有句話說「狐狸七變，狸八變」。兩者都是會迷惑人的動物，在民間故事裡一再登場。","zh-Hans":"日本有句话说「狐狸七变，狸八变」。两者都是会迷惑人的动物，在民间故事里一再登场。","en":"Japan has a saying: \"the fox has seven disguises, the tanuki eight.\" Both appear again and again in folk tales as animals that bewitch people.","de":"In Japan sagt man: „Der Fuchs hat sieben Verwandlungen, der Tanuki acht.“ Beide tauchen in Märchen immer wieder als Tiere auf, die Menschen foppen."},{"zh-Hant":"狸在英文叫 raccoon dog，是犬科動物，廣泛分布在東亞。牠們晝伏夜出，住在都市公園或鐵路旁也不稀奇。民間故事裡的狸大多被描寫成傻乎乎、讓人恨不起來的角色，變成茶壺後變不回來的「分福茶釜」就是代表。店門口擺的信樂燒狸擺飾，因為「狸（たぬき）」諧音「他を抜く（勝過別人）」，被當成生意興隆的吉祥物。","zh-Hans":"狸在英文叫 raccoon dog，是犬科动物，广泛分布在东亚。牠们昼伏夜出，住在都市公园或铁路旁也不稀奇。民间故事里的狸大多被描写成傻乎乎、让人恨不起来的角色，变成茶壶后变不回来的「分福茶釜」就是代表。店门口摆的信乐烧狸摆饰，因为「狸（たぬき）」谐音「他を抜く（胜过别人）」，被当成生意兴隆的吉祥物。","en":"The tanuki, called raccoon dog in English, belongs to the dog family and lives across East Asia. It's nocturnal and often settles in city parks or along railway lines. In folk tales the tanuki is usually a lovable fool; the best-known example is Bunbuku Chagama, where it turns into a tea kettle and can't change back. The Shigaraki ceramic tanuki outside shops is a lucky charm for business, thanks to a pun on \"outdoing others\" (ta-nuki).","de":"Der Tanuki, auf Englisch raccoon dog, gehört zu den Hunden und lebt in ganz Ostasien. Er ist nachtaktiv und wohnt oft in Stadtparks oder an Bahngleisen. Im Märchen ist er meist ein liebenswerter Tollpatsch – am bekanntesten in Bunbuku Chagama, wo er sich in einen Teekessel verwandelt und nicht mehr zurückkann. Die Tanuki-Figuren aus Shigaraki-Keramik vor Läden gelten dank eines Wortspiels („andere überholen“, ta-nuki) als Glücksbringer fürs Geschäft."},{"zh-Hant":"另一方面，狐狸就神秘一些。全國據說有三萬座以上的稻荷神社，狐狸被當作神的使者供奉。用狐狸愛吃的油豆皮做的料理叫「きつね」，就是這個緣故。","zh-Hans":"另一方面，狐狸就神秘一些。全国据说有三万座以上的稻荷神社，狐狸被当作神的使者供奉。用狐狸爱吃的油豆皮做的料理叫「きつね」，就是这个缘故。","en":"The fox, on the other hand, is more mysterious. At Inari shrines, of which there are said to be over 30,000 across the country, the fox is revered as the messenger of the god. That is why dishes made with fried tofu, its supposed favourite food, are called kitsune.","de":"Der Fuchs dagegen ist geheimnisvoller. In den Inari-Schreinen, von denen es über 30.000 im Land geben soll, wird er als Bote der Gottheit verehrt. Deshalb heißen Gerichte mit frittiertem Tofu, seiner angeblichen Leibspeise, „Kitsune“."},{"zh-Hant":"順帶一提，關東的「狸蕎麥麵」裡放的是炸天婦羅剩下的麵衣碎。有一種說法是：那是「去掉料（たね抜き）」的天婦羅，也就是沒有配料的天婦羅。","zh-Hans":"顺带一提，关东的「狸荞麦面」里放的是炸天妇罗剩下的面衣碎。有一种说法是：那是「去掉料（たね抜き）」的天妇罗，也就是没有配料的天妇罗。","en":"By the way, tanuki soba in the Kantō region comes with crunchy tempura bits. One theory says it's tempura with the filling taken out (tane-nuki), in other words tempura without anything inside.","de":"Übrigens: Tanuki-Soba in der Kantō-Region kommt mit knusprigen Tempura-Krümeln. Eine Erklärung lautet, es sei Tempura „ohne Füllung“ (tane-nuki), also Tempura ohne Inhalt."}],"w-shika-e":[{"zh-Hant":"奈良的公園裡有很多鹿，超過一千頭。","zh-Hans":"奈良的公园里有很多鹿，超过一千头。","en":"There are many deer in the park in Nara — more than a thousand.","de":"Im Park von Nara gibt es viele Hirsche – über tausend."},{"zh-Hant":"鹿自由地走來走去，會穿過馬路，也會在店門口休息。","zh-Hans":"鹿自由地走来走去，会穿过马路，也会在店门口休息。","en":"The deer walk around freely. They cross roads and rest in front of shops.","de":"Die Hirsche laufen frei herum. Sie überqueren Straßen und ruhen sich vor Läden aus."},{"zh-Hant":"拿出「鹿仙貝」給牠們看，鹿就會低下頭，好像在鞠躬一樣。不過要小心，牠們有時也會咬人。","zh-Hans":"拿出「鹿仙贝」给牠们看，鹿就会低下头，好像在鞠躬一样。不过要小心，牠们有时也会咬人。","en":"If you show them deer crackers, the deer lower their heads, as if they were bowing. But be careful — they sometimes bite.","de":"Zeigt man ihnen Hirschkekse, senken sie den Kopf, als würden sie sich verbeugen. Aber Vorsicht – manchmal beißen sie."}],"w-shika":[{"zh-Hant":"奈良公園周邊住著一千多頭野生的鹿。牠們不是被飼養的，也沒有圍欄。鹿從等紅綠燈的人身旁走過的景象，是奈良獨有的。","zh-Hans":"奈良公园周边住着一千多头野生的鹿。牠们不是被饲养的，也没有围栏。鹿从等红绿灯的人身旁走过的景象，是奈良独有的。","en":"More than a thousand wild deer live around Nara Park. They aren't kept, and there are no fences. Deer walking past people waiting at traffic lights is a sight you'll only see in Nara.","de":"Rund um den Nara-Park leben über tausend wilde Hirsche. Sie werden nicht gehalten, Zäune gibt es keine. Hirsche, die an Menschen an der Ampel vorbeilaufen – das gibt es nur in Nara."},{"zh-Hant":"奈良的鹿受到珍視，是因為傳說春日大社的神明是騎著白鹿來的。鹿被視為神的使者，據說以前殺鹿會受到重罰。現在牠們被指定為國家天然紀念物。","zh-Hans":"奈良的鹿受到珍视，是因为传说春日大社的神明是骑著白鹿来的。鹿被视为神的使者，据说以前杀鹿会受到重罚。现在牠们被指定为国家天然纪念物。","en":"Nara's deer have been cherished because of a legend that the deity of Kasuga Taisha arrived riding a white deer. Deer were seen as the god's messengers, and killing one was once said to bring severe punishment. Today they are designated a national natural monument.","de":"Naras Hirsche werden geschätzt, weil die Gottheit des Kasuga-Taisha der Legende nach auf einem weißen Hirsch ankam. Hirsche galten als Boten der Gottheit, und wer einen tötete, soll früher hart bestraft worden sein. Heute sind sie ein nationales Naturdenkmal."},{"zh-Hant":"遊客一拿出鹿仙貝，鹿就會上下擺頭，看起來像在鞠躬。但有人說，這本來是鹿之間互相威嚇的動作。也有一種看法是：人類回禮鞠躬就會給仙貝，所以是鹿自己學會的。","zh-Hans":"游客一拿出鹿仙贝，鹿就会上下摆头，看起来像在鞠躬。但有人说，这本来是鹿之间互相威吓的动作。也有一种看法是：人类回礼鞠躬就会给仙贝，所以是鹿自己学会的。","en":"When visitors hold up deer crackers, the deer bob their heads up and down. It looks like bowing, but some say it was originally a threat display between deer. Another view is that the deer learned it, because people bow back and hand over a cracker.","de":"Halten Besucher Hirschkekse hoch, nicken die Tiere mit dem Kopf. Es sieht aus wie eine Verbeugung, ursprünglich soll es aber eine Drohgebärde unter Hirschen sein. Eine andere Erklärung: Die Hirsche haben es gelernt, weil Menschen sich zurückverbeugen und einen Keks geben."},{"zh-Hant":"不過，鹿終究是野生動物。拿著仙貝吊牠們胃口，可能會被衝撞或咬傷。鹿誤食塑膠袋的問題也越來越嚴重。正因為可愛，才更要保持適當的距離。","zh-Hans":"不过，鹿终究是野生动物。拿着仙贝吊牠们胃口，可能会被冲撞或咬伤。鹿误食塑料袋的问题也越来越严重。正因为可爱，才更要保持适当的距离。","en":"Still, the deer are wild animals. If you tease them while holding crackers, they may charge at you or bite. Deer eating plastic bags has also become a problem. Precisely because they're cute, it's worth keeping a proper distance.","de":"Trotzdem sind die Hirsche wilde Tiere. Wer sie mit Keksen hinhält, riskiert, angerempelt oder gebissen zu werden. Dass Hirsche Plastiktüten fressen, ist ebenfalls ein Problem. Gerade weil sie so niedlich sind, sollte man Abstand halten."}],"w-saru-e":[{"zh-Hant":"長野縣的山裡，有會泡溫泉的猴子。","zh-Hans":"长野县的山里，有会泡温泉的猴子。","en":"In the mountains of Nagano there are monkeys that bathe in a hot spring.","de":"In den Bergen von Nagano gibt es Affen, die in einer heißen Quelle baden."},{"zh-Hant":"冬天，山被雪染得一片白，非常冷。猴子們泡進溫暖的熱水裡，露出很舒服的表情。","zh-Hans":"冬天，山被雪染得一片白，非常冷。猴子们泡进温暖的热水里，露出很舒服的表情。","en":"In winter the mountains turn white with snow. It's very cold. The monkeys soak in the warm water and look very comfortable.","de":"Im Winter sind die Berge weiß vom Schnee. Es ist sehr kalt. Die Affen baden im warmen Wasser und sehen sehr zufrieden aus."},{"zh-Hant":"世界各地的遊客都來看這些猴子。牠們在英文裡被叫作「雪猴」。","zh-Hans":"世界各地的游客都来看这些猴子。牠们在英文里被叫作「雪猴」。","en":"Tourists come from all over the world to see these monkeys. In English they're called snow monkeys.","de":"Touristen aus aller Welt kommen, um diese Affen zu sehen. Auf Englisch heißen sie Snow Monkeys."}],"w-saru":[{"zh-Hant":"在長野縣山谷裡的「地獄谷野猿公苑」，一到冬天就能看到日本獼猴泡溫泉。頭上頂著雪、瞇著眼睛泡在熱水裡的猴子照片，在海外也以「雪猴」聞名。","zh-Hans":"在长野县山谷里的「地狱谷野猿公苑」，一到冬天就能看到日本猕猴泡温泉。头上顶着雪、瞇着眼睛泡在热水里的猴子照片，在海外也以「雪猴」闻名。","en":"At Jigokudani Monkey Park in a valley in Nagano, Japanese macaques can be seen bathing in a hot spring in winter. Photos of monkeys soaking with snow on their heads and eyes half-closed are known abroad as \"snow monkeys\".","de":"Im Jigokudani-Affenpark in einem Tal in Nagano kann man im Winter Japanmakaken beim Baden in einer heißen Quelle beobachten. Fotos von Affen mit Schnee auf dem Kopf und halb geschlossenen Augen sind im Ausland als „Snow Monkeys“ bekannt."},{"zh-Hant":"據說日本獼猴是除了人類以外，世界上住得最北的靈長類。本州最北端的下北半島也有猴群。雖然有厚毛可以禦寒，但在雪中過冬並不輕鬆。","zh-Hans":"据说日本猕猴是除了人类以外，世界上住得最北的灵长类。本州最北端的下北半岛也有猴群。虽然有厚毛可以御寒，但在雪中过冬并不轻松。","en":"The Japanese macaque is said to be the northernmost-living primate in the world, apart from humans. There are troops even on the Shimokita Peninsula at the northern tip of Honshu. Their thick fur helps against the cold, but surviving winter in the snow is not easy.","de":"Der Japanmakak gilt – vom Menschen abgesehen – als der am nördlichsten lebende Primat der Welt. Selbst auf der Shimokita-Halbinsel an der Nordspitze Honshus gibt es Gruppen. Das dicke Fell schützt zwar, doch ein Winter im Schnee ist kein Vergnügen."},{"zh-Hant":"猴子開始泡溫泉是一九六〇年代的事。據說起因是一隻年輕母猴進了熱水，其他猴子也開始模仿，就這樣在猴群中擴散開來。這也被視為新行為在猴子社會裡作為「文化」傳承下去的例子而受到關注。","zh-Hans":"猴子开始泡温泉是一九六〇年代的事。据说起因是一只年轻母猴进了热水，其他猴子也开始模仿，就这样在猴群中扩散开来。这也被视为新行为在猴子社会里作为「文化」传承下去的例子而受到关注。","en":"The monkeys started bathing in the 1960s. It's said that after one young female got into the water, others began to copy her, and the habit spread through the troop. It has drawn attention as an example of a new behaviour being passed on as \"culture\" in monkey society.","de":"Mit dem Baden begannen die Affen in den 1960er-Jahren. Ein junges Weibchen soll ins Wasser gegangen sein, andere ahmten es nach, und so breitete sich das Verhalten in der Gruppe aus. Es gilt als Beispiel dafür, wie neues Verhalten in einer Affengesellschaft als „Kultur“ weitergegeben wird."},{"zh-Hant":"研究發現，泡溫泉的猴子比不泡的猴子，因寒冷造成的壓力比較低。不過，泡溫泉的主要是母猴和小猴，能不能下水有時還取決於在猴群裡的地位。溫泉也有猴子世界的內情。","zh-Hans":"研究发现，泡温泉的猴子比不泡的猴子，因寒冷造成的压力比较低。不过，泡温泉的主要是母猴和小猴，能不能下水有时还取决于在猴群里的地位。温泉也有猴子世界的内情。","en":"Research has found that monkeys that bathe have lower cold-related stress than those that don't. However, it's mainly females and young who bathe, and whether a monkey may get in can depend on its rank in the troop. Even the hot spring has its monkey politics.","de":"Studien zeigen, dass badende Affen weniger kältebedingten Stress haben als die, die nicht baden. Baden tun aber vor allem Weibchen und Jungtiere, und ob ein Affe ins Wasser darf, kann von seinem Rang in der Gruppe abhängen. Auch an der heißen Quelle gibt es Affenpolitik."}],"w-sake2-e":[{"zh-Hant":"鮭魚在河裡出生。小時候，牠們從河流游向大海。","zh-Hans":"鲑鱼在河里出生。小时候，牠们从河流游向大海。","en":"Salmon are born in rivers. When they are small, they go from the river to the sea.","de":"Lachse werden in Flüssen geboren. Wenn sie klein sind, schwimmen sie vom Fluss ins Meer."},{"zh-Hant":"牠們在海裡長大三四年，然後回到自己出生的河流。","zh-Hans":"牠们在海里长大三四年，然后回到自己出生的河流。","en":"They grow big in the sea for three or four years. Then they come back to the river where they were born.","de":"Drei oder vier Jahre lang wachsen sie im Meer. Dann kehren sie in den Fluss zurück, in dem sie geboren wurden."},{"zh-Hant":"牠們怎麼知道哪一條是自己的河呢？據說是因為牠們記得河水的氣味。","zh-Hans":"牠们怎么知道哪一条是自己的河呢？据说是因为牠们记得河水的气味。","en":"How do they know which river is theirs? It is said that they remember the smell of the river.","de":"Woher wissen sie, welcher Fluss ihrer ist? Man sagt, sie erinnern sich an den Geruch des Flusses."}],"w-sake2":[{"zh-Hant":"秋天，在北海道和東北的河流裡，可以看到從海裡回來的鮭魚逆流而上。牠們在淺灘露出背鰭，有時還跳過小瀑布，一心朝上游前進。","zh-Hans":"秋天，在北海道和东北的河流里，可以看到从海里回来的鲑鱼逆流而上。牠们在浅滩露出背鳍，有时还跳过小瀑布，一心朝上游前进。","en":"In autumn, in the rivers of Hokkaido and Tōhoku, you can see salmon back from the sea swimming upstream against the current. They show their dorsal fins in the shallows and sometimes leap small waterfalls, heading single-mindedly upstream.","de":"Im Herbst sieht man in den Flüssen von Hokkaido und Tōhoku Lachse, die aus dem Meer zurück sind und gegen die Strömung aufsteigen. In flachen Stellen ragen ihre Rückenflossen heraus, manchmal springen sie über kleine Wasserfälle – immer flussaufwärts."},{"zh-Hant":"日本最多的白鮭在河裡出生，春天游向大海。然後在北太平洋迴游數千公里，花大約三到五年長大。產卵期接近時，就回到自己出生的河流，這叫「母川洄游」。","zh-Hans":"日本最多的白鲑在河里出生，春天游向大海。然后在北太平洋回游数千公里，花大约三到五年长大。产卵期接近时，就回到自己出生的河流，这叫「母川洄游」。","en":"Chum salmon, the most common kind in Japan, are born in rivers and head to sea in spring. They then roam thousands of kilometres around the North Pacific and grow for about three to five years. When spawning time approaches, they return to the river they were born in. This is called natal homing.","de":"Der Ketalachs, die häufigste Art in Japan, wird im Fluss geboren und wandert im Frühjahr ins Meer. Dort zieht er Tausende Kilometer durch den Nordpazifik und wächst drei bis fünf Jahre. Naht die Laichzeit, kehrt er in seinen Geburtsfluss zurück – die sogenannte Heimfindung."},{"zh-Hant":"牠們在廣闊的大海中如何辨別方向，至今還沒有完全弄清楚。有一種說法是牠們以地球磁場或太陽的位置為線索。另一方面，到了河口附近之後，嗅覺被認為扮演了重要角色：牠們記得小時候故鄉河流的氣味，記好幾年。","zh-Hans":"牠们在广阔的大海中如何辨别方向，至今还没有完全弄清楚。有一种说法是牠们以地球磁场或太阳的位置为线索。另一方面，到了河口附近之后，嗅觉被认为扮演了重要角色：牠们记得小时候故乡河流的气味，记好几年。","en":"How they find their way in the open ocean is still not fully understood. One theory is that they use the Earth's magnetic field or the position of the sun. Once they get close to the river, however, smell is thought to play a key role: they remember the scent of their home river from their days as fry, for years.","de":"Wie sie sich im offenen Meer orientieren, ist noch nicht ganz geklärt. Eine Theorie: Sie nutzen das Erdmagnetfeld oder den Sonnenstand. In Flussnähe spielt dann wohl der Geruchssinn die Hauptrolle – sie merken sich den Geruch ihres Heimatflusses aus der Jungfischzeit über Jahre."},{"zh-Hant":"產完卵的鮭魚，大多就這樣結束一生。牠們的身體成為河裡生物和森林動物的食物，養分也被帶到上游的森林。鮭魚的旅程，也是一趟連結大海和森林的旅程。","zh-Hans":"产完卵的鲑鱼，大多就这样结束一生。牠们的身体成为河里生物和森林动物的食物，养分也被带到上游的森林。鲑鱼的旅程，也是一趟链接大海和森林的旅程。","en":"After spawning, most salmon end their lives right there. Their bodies become food for river creatures and forest animals, and their nutrients are carried all the way to the forests upstream. The salmon's journey is also one that links the sea and the forest.","de":"Nach dem Laichen sterben die meisten Lachse. Ihre Körper werden Nahrung für Flusstiere und Waldtiere, und ihre Nährstoffe gelangen bis in die Wälder am Oberlauf. Die Reise des Lachses verbindet Meer und Wald."}],"w-koyo-e":[{"zh-Hant":"到了秋天，葉子會變成紅色或黃色，這叫「紅葉」。","zh-Hans":"到了秋天，叶子会变成红色或黄色，这叫「红叶」。","en":"In autumn, leaves turn red or yellow. This is called kōyō.","de":"Im Herbst werden die Blätter rot oder gelb. Das nennt man Kōyō."},{"zh-Hant":"夏天的葉子是綠色的。綠色的來源在秋天會消失，原本藏在葉子裡的黃色就顯現出來了。","zh-Hans":"夏天的叶子是绿色的。绿色的来源在秋天会消失，原本藏在叶子里的黄色就显现出来了。","en":"In summer the leaves are green. In autumn, what makes them green disappears, and the yellow that was inside becomes visible.","de":"Im Sommer sind die Blätter grün. Im Herbst verschwindet das, was sie grün macht, und das Gelb, das schon darin war, wird sichtbar."},{"zh-Hant":"如果白天晴朗、晚上寒冷的日子持續下去，葉子就會變成漂亮的紅色。","zh-Hans":"如果白天晴朗、晚上寒冷的日子持续下去，叶子就会变成漂亮的红色。","en":"If sunny days and cold nights continue, the leaves turn a beautiful red.","de":"Folgen sonnige Tage und kalte Nächte aufeinander, werden die Blätter schön rot."}],"w-koyo":[{"zh-Hant":"點綴秋山的紅葉，其實有兩種機制：變黃的機制，和變紅的機制。","zh-Hans":"点缀秋山的红叶，其实有两种机制：变黄的机制，和变红的机制。","en":"The autumn colours on the mountains actually come from two mechanisms: one that turns leaves yellow and one that turns them red.","de":"Die Herbstfarben in den Bergen entstehen eigentlich durch zwei Mechanismen: einen, der Blätter gelb macht, und einen, der sie rot macht."},{"zh-Hant":"夏天的葉子是綠色的，是因為含有大量葉綠素。氣溫下降、白天變短，樹木開始準備落葉，葉綠素就逐漸被分解。這時，原本就在葉子裡的黃色色素——類胡蘿蔔素——就顯現出來。銀杏變黃就是這個原因。","zh-Hans":"夏天的叶子是绿色的，是因为含有大量叶绿素。气温下降、白天变短，树木开始准备落叶，叶绿素就逐渐被分解。这时，原本就在叶子里的黄色色素——类胡萝卜素——就显现出来。银杏变黄就是这个原因。","en":"Summer leaves are green because they contain a lot of chlorophyll. As temperatures drop and days get shorter, trees prepare to shed their leaves and the chlorophyll breaks down. Then the yellow pigments that were in the leaf all along, carotenoids, become visible. That's why ginkgo turns yellow.","de":"Sommerblätter sind grün, weil sie viel Chlorophyll enthalten. Wenn es kühler wird und die Tage kürzer werden, bereiten sich die Bäume auf den Laubfall vor, und das Chlorophyll wird abgebaut. Dann werden die gelben Farbstoffe sichtbar, die schon immer im Blatt waren: Carotinoide. Deshalb wird der Ginkgo gelb."},{"zh-Hant":"另一方面，楓樹等會變紅，是因為入秋後新合成的一種紅色色素「花青素」。葉柄基部形成離層後，葉子製造的糖分不容易運到樹枝，留在葉子裡的糖分就被用來合成花青素。","zh-Hans":"另一方面，枫树等会变红，是因为入秋后新合成的一种红色色素「花青素」。叶柄基部形成离层后，叶子制造的糖分不容易运到树枝，留在叶子里的糖分就被用来合成花青素。","en":"Maples and similar trees, on the other hand, turn red because of a red pigment called anthocyanin that is newly produced in autumn. An abscission layer forms at the base of the leaf stalk, so the sugar made in the leaf can't easily move to the branch. Anthocyanin is made from the sugar that stays behind in the leaf.","de":"Ahorn und ähnliche Bäume werden dagegen rot durch einen roten Farbstoff, Anthocyan, der erst im Herbst neu gebildet wird. Am Blattstiel entsteht eine Trennschicht, sodass der im Blatt gebildete Zucker kaum noch in den Zweig gelangt. Aus dem Zucker, der im Blatt bleibt, entsteht Anthocyan."},{"zh-Hant":"據說要有漂亮的紅葉，需要白天日照充足、夜晚驟冷，再加上適度的濕度。一般認為最低氣溫降到八度以下時開始變色。溫差大的山上紅葉特別鮮豔，就是這個緣故。","zh-Hans":"据说要有漂亮的红叶，需要白天日照充足、夜晚骤冷，再加上适度的湿度。一般认为最低气温降到八度以下时开始变色。温差大的山上红叶特别鲜艳，就是这个缘故。","en":"Beautiful colours are said to need plenty of sun by day, sharp cold at night and moderate humidity. Leaves generally start changing when the minimum temperature falls below about 8 °C. That's why the colours in the mountains, with their big temperature swings, are so vivid.","de":"Für schöne Farben braucht es angeblich viel Sonne am Tag, kalte Nächte und mäßige Luftfeuchtigkeit. Allgemein beginnt die Färbung, wenn die Tiefsttemperatur unter etwa 8 °C fällt. Deshalb leuchten die Farben in den Bergen mit ihren großen Temperaturunterschieden so stark."}],"w-sakura-e":[{"zh-Hant":"說到日本的春天，就是櫻花。","zh-Hans":"说到日本的春天，就是樱花。","en":"When you think of spring in Japan, you think of cherry blossoms.","de":"Frühling in Japan – das heißt Kirschblüte."},{"zh-Hant":"最多的櫻花品種是「染井吉野」。這種櫻花在同一個地方，差不多會在同一天開花。","zh-Hans":"最多的樱花品种是「染井吉野」。这种樱花在同一个地方，差不多会在同一天开花。","en":"The most common cherry tree is the Somei-yoshino. In the same place, these trees bloom on roughly the same day.","de":"Die häufigste Kirschsorte ist Somei-yoshino. Am selben Ort blühen diese Bäume ungefähr am selben Tag."},{"zh-Hant":"櫻花開了，人們會在樹下吃飯、聊天，這叫「賞花」。櫻花大約一週就會凋謝。","zh-Hans":"樱花开了，人们会在树下吃饭、聊天，这叫「赏花」。樱花大约一周就会凋谢。","en":"When the cherry trees bloom, people eat and chat under the trees. This is called hanami. The blossoms fall after about a week.","de":"Wenn die Kirschbäume blühen, essen und plaudern die Leute unter den Bäumen. Das nennt man Hanami. Nach etwa einer Woche fallen die Blüten ab."}],"w-sakura":[{"zh-Hant":"每到春天，新聞裡就會聽到「櫻花前線」這個詞。這是把各地開花日期連起來的線，三月從九州開始，五月左右抵達北海道。之所以能做這樣的預報，是因為日本的櫻花大部分都是同一個品種。","zh-Hans":"每到春天，新闻里就会听到「樱花前线」这个词。这是把各地开花日期连起来的线，三月从九州开始，五月左右抵达北海道。之所以能做这样的预报，是因为日本的樱花大部分都是同一个品种。","en":"Every spring the news talks about the cherry blossom front. It's a line connecting the first-bloom dates across the country, starting in Kyushu in March and reaching Hokkaido around May. Forecasts like this work because most of Japan's cherry trees are a single variety.","de":"Jeden Frühling spricht man in den Nachrichten von der Kirschblütenfront. Sie verbindet die Blühtermine im ganzen Land, beginnt im März in Kyushu und erreicht um Mai Hokkaido. Solche Vorhersagen funktionieren, weil die meisten Kirschbäume Japans zu einer einzigen Sorte gehören."},{"zh-Hant":"這個品種就是「染井吉野」。據說是江戶時代末期，由江戶染井村（現在的東京都豐島區）的園藝師傅推廣開來的。它的花大，而且在長葉子之前就只有花一齊盛開，非常好看，所以明治以後被大量種在學校、公園和河邊。","zh-Hans":"这个品种就是「染井吉野」。据说是江户时代末期，由江户染井村（现在的东京都丰岛区）的园艺师傅推广开来的。它的花大，而且在长叶子之前就只有花一齐盛开，非常好看，所以明治以后被大量种在学校、公园和河边。","en":"That variety is the Somei-yoshino. It is said to have been spread by gardeners in Somei village in Edo (today Toshima, Tokyo) at the end of the Edo period. Its flowers are large and they all open before the leaves appear, which looks spectacular, so from the Meiji era on it was planted at schools, in parks and along rivers.","de":"Diese Sorte ist die Somei-yoshino. Gärtner aus dem Dorf Somei in Edo (heute Toshima, Tokio) sollen sie gegen Ende der Edo-Zeit verbreitet haben. Die Blüten sind groß und öffnen sich alle, bevor die Blätter kommen – ein prächtiger Anblick. Ab der Meiji-Zeit pflanzte man sie deshalb an Schulen, in Parks und entlang von Flüssen."},{"zh-Hant":"其實，染井吉野用自己的花互相授粉很難結出種子，所以繁殖時用的是「嫁接」：把枝條接到別的樹的砧木上培育。也就是說，全國的染井吉野追溯起來都是從同一棵樹分出來的複製體，遺傳性質被認為幾乎相同。","zh-Hans":"其实，染井吉野用自己的花互相授粉很难结出种子，所以繁殖时用的是「嫁接」：把枝条接到别的树的砧木上培育。也就是说，全国的染井吉野追溯起来都是从同一棵树分出来的拷贝体，遗传性质被认为几乎相同。","en":"Somei-yoshino rarely sets seed from its own flowers, so it is propagated by grafting: a branch is joined onto the rootstock of another tree. In other words, the Somei-yoshino trees across Japan are clones that trace back to a single tree, and are thought to be almost genetically identical.","de":"Somei-yoshino bildet mit eigenen Blüten kaum Samen, deshalb vermehrt man sie durch Pfropfen: Ein Zweig wird auf die Unterlage eines anderen Baums gesetzt. Die Somei-yoshino im ganzen Land sind also Klone, die auf einen einzigen Baum zurückgehen, und gelten als genetisch fast identisch."},{"zh-Hant":"所以只要氣溫等條件一致，同一地區的櫻花就會幾乎同時開、同時謝。一齊盛開，又短暫凋零——日本人寄託在櫻花上的審美意識，也許其實是由這種植物的特性支撐著的。","zh-Hans":"所以只要气温等条件一致，同一地区的樱花就会几乎同时开、同时谢。一齐盛开，又短暂凋零——日本人寄托在樱花上的审美意识，也许其实是由这种植物的特性支撑着的。","en":"So when temperature and other conditions are the same, cherry trees in one area bloom and fall almost at the same time. Blooming all at once and scattering so briefly — the aesthetic the Japanese have long seen in cherry blossoms may in fact rest on the nature of this one plant.","de":"Herrschen also gleiche Bedingungen wie die Temperatur, blühen und verblühen die Kirschbäume einer Gegend fast gleichzeitig. Alle auf einmal blühen und schnell vergehen – das Schönheitsempfinden, das die Japaner mit der Kirschblüte verbinden, beruht vielleicht tatsächlich auf den Eigenschaften dieser einen Pflanze."}],"w-jihanki-e":[{"zh-Hant":"日本的自動販賣機非常多。車站有，路邊有，連山上都有。","zh-Hans":"日本的自动贩卖机非常多。车站有，路边有，连山上都有。","en":"Japan has a lot of vending machines. They're at stations, on streets, even on mountains.","de":"In Japan gibt es sehr viele Automaten. An Bahnhöfen, auf Straßen, sogar auf Bergen."},{"zh-Hant":"最多的是賣飲料的。冬天，同一台機器可以買到熱飲和冷飲。","zh-Hans":"最多的是卖饮料的。冬天，同一台机器可以买到热饮和冷饮。","en":"Most of them sell drinks. In winter you can buy hot and cold drinks from the same machine.","de":"Die meisten verkaufen Getränke. Im Winter bekommt man warme und kalte Getränke aus demselben Automaten."},{"zh-Hant":"就算放在戶外，也很少被破壞。有人說，這是因為日本很安全。","zh-Hans":"就算放在户外，也很少被破坏。有人说，这是因为日本很安全。","en":"Even when they stand outdoors, they're rarely broken into. Some people say this is because Japan is safe.","de":"Selbst draußen werden sie kaum aufgebrochen. Manche sagen, das liegt daran, dass Japan sicher ist."}],"w-jihanki":[{"zh-Hant":"第一次來日本的人會驚訝的事情之一，就是自動販賣機之多。月台上、住宅區的轉角、田中央，甚至連富士山的山屋都有。包含飲料以外的機器，全國據說有將近四百萬台，以人口比例來看是世界頂尖水準。","zh-Hans":"第一次来日本的人会惊讶的事情之一，就是自动贩卖机之多。月台上、住宅区的转角、田中央，甚至连富士山的山屋都有。包含饮料以外的机器，全国据说有将近四百万台，以人口比例来看是世界顶尖水准。","en":"One of the things that surprises first-time visitors to Japan is the sheer number of vending machines: on platforms, on residential street corners, in the middle of rice fields, even at mountain huts on Mount Fuji. Including machines that sell things other than drinks, there are said to be close to four million nationwide — one of the highest numbers per person in the world.","de":"Was Japan-Neulinge oft überrascht, ist die schiere Zahl der Automaten: auf Bahnsteigen, an Ecken in Wohnvierteln, mitten im Reisfeld, sogar an Berghütten am Fuji. Zählt man Automaten für andere Waren mit, sollen es landesweit fast vier Millionen sein – pro Kopf einer der höchsten Werte weltweit."},{"zh-Hant":"普及到這種程度的原因之一，據說是治安良好。即使把裝著現金的機器放在戶外，被破壞盜竊的情況也相對少。而且在人事成本高、土地狹小的日本，與其開一家店，不如放一台販賣機更有效率。","zh-Hans":"普及到这种程度的原因之一，据说是治安良好。即使把装着现金的机器放在户外，被破坏盗窃的情况也相对少。而且在人事成本高、土地狭小的日本，与其开一家店，不如放一台贩卖机更有效率。","en":"One reason they spread so widely is said to be public safety. Even with cash inside and standing outdoors, they are relatively rarely broken into. And in Japan, with its high labour costs and little space, placing a machine was more efficient than opening a shop.","de":"Ein Grund für ihre Verbreitung soll die Sicherheit sein: Obwohl Bargeld darin steckt und sie draußen stehen, werden sie relativ selten aufgebrochen. Außerdem war in Japan mit hohen Personalkosten und wenig Platz ein Automat effizienter als ein Laden."},{"zh-Hant":"技術進步也很驚人。在同一台機器裡同時販賣熱飲和冷飲的設計，就是在日本普及的。最近，不但可以用電子錢包付款，災害時能免費提供內部飲料的「災害對應型」販賣機也越來越多。","zh-Hans":"技术进步也很惊人。在同一台机器里同时贩卖热饮和冷饮的设计，就是在日本普及的。最近，不但可以用电子钱包付款，灾害时能免费提供内部饮料的「灾害对应型」贩卖机也越来越多。","en":"The technology has also come a long way. Selling hot and cold drinks from the same machine is something that took off in Japan. Today you can of course pay by e-money, and there are more and more disaster-ready machines that can hand out their drinks for free during an emergency.","de":"Auch technisch hat sich viel getan. Warme und kalte Getränke aus demselben Automaten – das hat sich in Japan durchgesetzt. Heute zahlt man selbstverständlich mit E-Geld, und es gibt immer mehr katastrophentaugliche Automaten, die ihre Getränke im Notfall kostenlos ausgeben."},{"zh-Hant":"另一方面，由於耗電量大，加上人口減少導致銷售低迷，販賣機的數量正在一點一點減少。照亮夜路的販賣機燈光，既是日本街景的一部分，也是映照社會變化的一面鏡子。","zh-Hans":"另一方面，由于耗电量大，加上人口减少导致销售低迷，贩卖机的数量正在一点一点减少。照亮夜路的贩卖机灯光，既是日本街景的一部分，也是映照社会变化的一面镜子。","en":"On the other hand, because of high power use and falling sales as the population shrinks, the number of machines is slowly going down. The glow of vending machines lighting up the streets at night is part of Japan's townscape — and a mirror of how society is changing.","de":"Andererseits sinkt ihre Zahl langsam – wegen des hohen Stromverbrauchs und schwächerer Umsätze durch die schrumpfende Bevölkerung. Das Licht der Automaten an nächtlichen Straßen gehört zum japanischen Stadtbild und spiegelt zugleich den Wandel der Gesellschaft."}]};
ARTICLES.push(...[{"id":"w-sake-e","lv":"n4","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"お酒はどうやって作る？","sub":"日本酒是怎麼釀的？（簡單版）","body":"[[日本酒|にほんしゅ]]は、[[米|こめ]]と[[水|みず]]で{作|つく}ります。\n\nまず、{米|こめ}を[[蒸します|むします]]。{次|つぎ}に、[[麹|こうじ]]という[[かび|かび]]を{使|つか}います。{麹|こうじ}は、{米|こめ}を{甘|あま}い[[砂糖|さとう]]に{変|か}えます。\n\nそれから、[[酵母|こうぼ]]が{砂糖|さとう}を[[アルコール|アルコール]]に{変|か}えます。{日本酒|にほんしゅ}は、{冬|ふゆ}に{作|つく}ることが{多|おお}いです。{寒|さむ}いと、{悪|わる}い{菌|きん}が{少|すく}ないからです。","gloss":{"日本酒":{"m":"日本酒（清酒）"},"米":{"m":"米"},"水":{"m":"水"},"蒸します":{"m":"蒸（原形：蒸す）"},"麹":{"m":"麴（米麴）"},"かび":{"m":"黴菌"},"砂糖":{"m":"糖"},"酵母":{"m":"酵母"},"アルコール":{"m":"酒精"}}},{"id":"w-sake","lv":"n2","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"日本酒ができるまで","sub":"日本酒的誕生","body":"日本酒の原料は、驚くほどシンプルだ。米と水、そして[[麹|こうじ]]と[[酵母|こうぼ]]。それだけで、果物のような香りの酒が生まれる。\n\nまず、米の表面を削る。これを「[[精米|せいまい]]」と言う。表面には雑味のもとになる成分が多いため、削れば削るほど、すっきりした味になる。米を半分以下まで削った酒は「大吟醸」と呼ばれる。\n\nワインの原料であるぶどうには、もともと糖分がある。ところが米の主成分は[[でんぷん|でんぷん]]で、そのままでは酵母がアルコールに変えられない。そこで活躍するのが麹だ。麹菌というかびが、でんぷんを糖に変える。そして同じタンクの中で、酵母がその糖をアルコールに変えていく。糖化と発酵が同時に進むこの仕組みを「[[並行複発酵|へいこうふくはっこう]]」と言い、日本酒のアルコール度数が醸造酒としては高くなる理由でもある。\n\n昔から、酒造りは冬に行われてきた。気温が低いと雑菌が増えにくいからだ。蔵で職人たちを率いる責任者を「[[杜氏|とうじ]]」と言う。冬の朝、湯気の立つ蒸し米の向こうに、その年の酒の味が[[託されて|たくされて]]いる。","gloss":{"麹":{"m":"米麴"},"酵母":{"m":"酵母"},"精米":{"m":"碾米、精米（磨去米粒外層）"},"でんぷん":{"m":"澱粉"},"並行複発酵":{"m":"平行複式發酵","n":"糖化和酒精發酵在同一個桶裡同時進行。"},"杜氏":{"m":"杜氏（釀酒總負責人）"},"託されて":{"m":"被寄託（原形：託す）"}}},{"id":"w-natto-e","lv":"n4","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"納豆","sub":"納豆（簡單版）","body":"[[納豆|なっとう]]は、[[大豆|だいず]]から{作|つく}る{日本|にほん}の{食|た}べ{物|もの}です。\n\n{納豆|なっとう}を[[混ぜる|まぜる]]と、{白|しろ}い[[糸|いと]]が{出|で}ます。たくさん{混|ま}ぜると、{糸|いと}も{多|おお}くなります。\n\n{納豆|なっとう}は、においが[[強い|つよい]]です。{好|す}きな{人|ひと}も、[[苦手|にがて]]な{人|ひと}もいます。{朝|あさ}ごはんに、ごはんと{一緒|いっしょ}に{食|た}べる{人|ひと}が{多|おお}いです。","gloss":{"納豆":{"m":"納豆"},"大豆":{"m":"黃豆"},"混ぜる":{"m":"攪拌"},"糸":{"m":"絲"},"強い":{"m":"強烈"},"苦手":{"m":"不擅長；不喜歡"}}},{"id":"w-natto","lv":"n2","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"納豆はなぜ糸を引くのか","sub":"納豆為什麼會牽絲？","body":"日本を訪れた外国人が「最も苦手な食べ物」として挙げることが多いのが、納豆だ。においもさることながら、箸で持ち上げるとどこまでも[[糸を引く|いとをひく]]、あの見た目に驚くらしい。\n\n納豆は、蒸した大豆に[[納豆菌|なっとうきん]]を加え、四十度前後の温かい場所で一日ほど置いて作る。納豆菌は[[枯草菌|こそうきん]]の仲間で、もともとは稲わらに多くすむ[[細菌|さいきん]]だ。昔は煮た豆をわらで包んで作っていた。\n\nあの糸の正体は、納豆菌が作り出す「[[ポリグルタミン酸|ポリグルタミンさん]]」という物質だ。アミノ酸の一種であるグルタミン酸が、鎖のように長くつながったもので、[[粘り|ねばり]]のもとになる。よく混ぜるほど糸が増え、[[うま味|うまみ]]も感じやすくなると言われる。\n\n納豆の好き嫌いは、日本国内でも地域によって差がある。伝統的に東日本ではよく食べられ、関西ではあまり食べられてこなかった。ただ、健康によいというイメージもあって、今では全国で食べられるようになった。","gloss":{"糸を引く":{"m":"牽絲"},"納豆菌":{"m":"納豆菌"},"枯草菌":{"m":"枯草桿菌"},"細菌":{"m":"細菌"},"ポリグルタミン酸":{"m":"聚麩胺酸"},"粘り":{"m":"黏性"},"うま味":{"m":"鮮味"}}},{"id":"w-katsuo-e","lv":"n4","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"かつおぶし","sub":"柴魚（簡單版）","body":"[[かつおぶし|かつおぶし]]は、[[かつお|かつお]]という{魚|さかな}から{作|つく}ります。\n\n{魚|さかな}を{煮|に}て、[[煙|けむり]]で[[乾かします|かわかします]]。とても[[硬い|かたい]]です。{木|き}のようです。\n\n{料理|りょうり}に{使|つか}うときは、[[薄く|うすく]][[削ります|けずります]]。{日本|にほん}の[[だし|だし]]には、かつおぶしが{大切|たいせつ}です。","gloss":{"かつおぶし":{"m":"柴魚（鰹節）"},"かつお":{"m":"鰹魚"},"煙":{"m":"煙"},"乾かします":{"m":"弄乾（原形：乾かす）"},"硬い":{"m":"硬"},"薄く":{"m":"薄薄地"},"削ります":{"m":"削、刨（原形：削る）"},"だし":{"m":"高湯"}}},{"id":"w-katsuo","lv":"n2","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"世界一硬い食べ物","sub":"世界上最硬的食物：柴魚","body":"二本を打ち合わせると、カンカンと[[拍子木|ひょうしぎ]]のような音がする。それが[[鰹節|かつおぶし]]、「世界一硬い食べ物」と呼ばれることもある食品だ。\n\n作り方は手間がかかる。鰹を[[三枚におろし|さんまいにおろし]]、煮てから骨を抜き、煙で[[いぶし|いぶし]]ながら水分を抜いていく。ここまでのものを「[[荒節|あらぶし]]」と言う。さらに表面を削り、わざと[[かび|かび]]をつけて、天日に干す。これを何度も繰り返したものが「[[本枯節|ほんかれぶし]]」で、完成までに半年以上かかることもある。\n\nかびと聞くと驚くかもしれないが、このかびが残った水分を吸い取り、脂肪を分解して、香りとうま味を深くする。チーズや日本酒と同じく、[[微生物|びせいぶつ]]の力を借りた[[発酵食品|はっこうしょくひん]]なのだ。\n\nかつては家庭に専用の削り器があり、朝、鰹節を削る音で目を覚ましたという人もいる。今では削った状態の「[[削り節|けずりぶし]]」を袋で買うのが普通になったが、だしの基本であることは変わらない。","gloss":{"拍子木":{"m":"梆子（木製響板）"},"鰹節":{"m":"柴魚、鰹節"},"三枚におろし":{"m":"把魚切成三片（兩片魚肉加中骨）"},"いぶし":{"m":"煙燻（原形：いぶす）"},"荒節":{"m":"荒節（只燻乾、未上黴的柴魚）"},"かび":{"m":"黴"},"本枯節":{"m":"本枯節（反覆上黴、日曬的高級柴魚）"},"微生物":{"m":"微生物"},"発酵食品":{"m":"發酵食品"},"削り節":{"m":"柴魚片"}}},{"id":"w-tanuki-e","lv":"n4","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"タヌキとキツネ","sub":"狸與狐（簡單版）","body":"{日本|にほん}の{昔話|むかしばなし}には、[[タヌキ|タヌキ]]と[[キツネ|キツネ]]がよく{出|で}てきます。\n\n{昔|むかし}の{人|ひと}は、タヌキもキツネも{人|ひと}に[[化ける|ばける]]と{思|おも}っていました。{人|ひと}を[[だます|だます]]のも{上手|じょうず}です。\n\nうどんの{店|みせ}に「きつねうどん」があります。[[油揚げ|あぶらあげ]]が{入|はい}っています。キツネは{油揚|あぶらあ}げが{好|す}きだと[[言われて|いわれて]]います。","gloss":{"タヌキ":{"m":"狸（貉）"},"キツネ":{"m":"狐狸"},"化ける":{"m":"變身、化成"},"だます":{"m":"騙"},"油揚げ":{"m":"油豆皮"},"言われて":{"m":"被說（原形：言う）"}}},{"id":"w-tanuki","lv":"n2","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"化けるのはどっち？","sub":"會變身的是誰？狸與狐","body":"日本には「キツネは七化け、タヌキは八化け」という言葉がある。どちらも人を[[化かす|ばかす]]動物として、昔話に繰り返し登場してきた。\n\nタヌキは、英語で raccoon dog と呼ばれるイヌ科の動物で、東アジアに広く[[生息|せいそく]]している。夜行性で、都会の公園や線路沿いに住みついていることも珍しくない。民話の中のタヌキは、[[間が抜けて|まがぬけて]]いて憎めない存在として描かれることが多い。茶釜に化けて戻れなくなる「[[分福茶釜|ぶんぶくちゃがま]]」はその代表だ。店先に置かれる信楽焼のタヌキの置物も、「他を抜く」という[[語呂合わせ|ごろあわせ]]で、商売繁盛の[[縁起物|えんぎもの]]とされている。\n\n一方、キツネはもう少し[[神秘的|しんぴてき]]だ。全国に三万社以上あるとされる[[稲荷神社|いなりじんじゃ]]では、キツネは神様の[[使い|つかい]]として祀られている。好物とされる油揚げを使った料理が「きつね」と呼ばれるのはそのためだ。\n\nちなみに、関東の「たぬきそば」には、天ぷらの揚げ玉が入っている。「種（たね）抜き」の天ぷら、つまり[[具|ぐ]]のない天ぷらだから、という説がある。","gloss":{"化かす":{"m":"迷惑、捉弄（使人上當）"},"生息":{"m":"棲息"},"間が抜けて":{"m":"傻乎乎、少根筋"},"分福茶釜":{"m":"分福茶釜（狸變茶壺的民間故事）"},"語呂合わせ":{"m":"諧音"},"縁起物":{"m":"吉祥物"},"神秘的":{"m":"神秘"},"稲荷神社":{"m":"稻荷神社"},"使い":{"m":"使者"},"具":{"m":"料、配料"}}},{"id":"w-shika-e","lv":"n4","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"奈良の鹿","sub":"奈良的鹿（簡單版）","body":"[[奈良|なら]]の{公園|こうえん}には、[[鹿|しか]]がたくさんいます。{千|せん}{頭|とう}{以上|いじょう}います。\n\n{鹿|しか}は[[自由|じゆう]]に{歩|ある}いています。{道|みち}を{渡|わた}ったり、{店|みせ}の{前|まえ}で{休|やす}んだりします。\n\n「[[鹿せんべい|しかせんべい]]」を{見|み}せると、{鹿|しか}が{頭|あたま}を{下|さ}げます。[[お辞儀|おじぎ]]をしているようです。でも、{気|き}をつけてください。[[かむ|かむ]]こともあります。","gloss":{"奈良":{"m":"奈良"},"鹿":{"m":"鹿"},"自由":{"m":"自由"},"鹿せんべい":{"m":"鹿仙貝（餵鹿的餅乾）"},"お辞儀":{"m":"鞠躬"},"かむ":{"m":"咬"}}},{"id":"w-shika","lv":"n2","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"奈良の鹿はなぜお辞儀をするのか","sub":"奈良的鹿為什麼會鞠躬？","body":"奈良公園の周辺には、千頭を超える野生の鹿が暮らしている。[[飼育|しいく]]されているわけではなく、柵もない。信号待ちの人の横を鹿が歩いていく光景は、奈良ならではだ。\n\n奈良の鹿が大切にされてきたのは、[[春日大社|かすがたいしゃ]]の神様が白い鹿に乗ってやってきたという伝説があるからだ。鹿は神の使いとされ、昔は鹿を[[殺める|あやめる]]と重い罰を受けたという。現在は国の[[天然記念物|てんねんきねんぶつ]]に指定されている。\n\n観光客が「鹿せんべい」を持つと、鹿は頭を上下に振る。まるでお辞儀をしているように見えるが、これは本来、鹿同士が[[威嚇|いかく]]するときの動きだとも言われる。人間がお辞儀を返すとせんべいがもらえるため、鹿のほうが[[学習|がくしゅう]]した、という見方もある。\n\nただし、鹿はあくまで野生動物だ。せんべいを持ったまま[[じらす|じらす]]と、[[突進|とっしん]]されたり、かまれたりすることもある。ビニール袋を食べてしまう被害も問題になっている。かわいいからこそ、適切な距離を保ちたい。","gloss":{"飼育":{"m":"飼養"},"春日大社":{"m":"春日大社（奈良的神社）"},"殺める":{"m":"殺害"},"天然記念物":{"m":"天然紀念物（受保護的動植物）"},"威嚇":{"m":"威嚇"},"学習":{"m":"學習"},"じらす":{"m":"吊胃口、故意讓人著急"},"突進":{"m":"衝撞"}}},{"id":"w-saru-e","lv":"n4","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"温泉に入るサル","sub":"泡溫泉的猴子（簡單版）","body":"{長野県|ながのけん}の{山|やま}に、[[温泉|おんせん]]に{入|はい}る[[サル|サル]]がいます。\n\n{冬|ふゆ}、{山|やま}は[[雪|ゆき]]でまっ{白|しろ}になります。とても{寒|さむ}いです。サルたちは{温|あたた}かいお{湯|ゆ}に{入|はい}って、[[気持ち|きもち]]がよさそうな{顔|かお}をします。\n\n{世界中|せかいじゅう}から、このサルを{見|み}に{観光客|かんこうきゃく}が{来|き}ます。{英語|えいご}では「スノーモンキー」と[[呼ばれて|よばれて]]います。","gloss":{"温泉":{"m":"溫泉"},"サル":{"m":"猴子"},"雪":{"m":"雪"},"気持ち":{"m":"心情、感覺"},"呼ばれて":{"m":"被叫作（原形：呼ぶ）"}}},{"id":"w-saru","lv":"n2","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"サルはなぜ温泉に入るのか","sub":"會泡溫泉的雪猴","body":"長野県の山あいにある「[[地獄谷|じごくだに]]野猿公苑」では、冬になると、[[ニホンザル|ニホンザル]]が温泉に入る姿が見られる。頭に雪をのせ、目を細めて湯に浸かるサルの写真は、海外でも「スノーモンキー」として知られている。\n\nニホンザルは、人間を除く[[霊長類|れいちょうるい]]の中で、世界で最も北に住む種だとされる。本州最北の下北半島にも群れがいる。厚い毛で寒さに耐えるとはいえ、雪の中で冬を越すのは楽ではない。\n\nサルが温泉に入るようになったのは、一九六〇年代のことだ。一匹の若いメスが湯に入ったのをきっかけに、ほかのサルたちも真似をし始め、群れの中に[[広まって|ひろまって]]いったという。サルの社会で、新しい行動が「文化」として[[受け継がれる|うけつがれる]]例としても注目されてきた。\n\n研究によると、温泉に入るサルは、入らないサルに比べて、寒さによる[[ストレス|ストレス]]が低いことが分かっている。ただし、湯に入るのは主にメスと子どもで、群れの[[順位|じゅんい]]によって入れるかどうかが決まることもあるそうだ。温泉にも、サルの世界の[[事情|じじょう]]がある。","gloss":{"地獄谷":{"m":"地獄谷（長野縣地名）"},"ニホンザル":{"m":"日本獼猴"},"霊長類":{"m":"靈長類"},"広まって":{"m":"擴散開來（原形：広まる）"},"受け継がれる":{"m":"被傳承"},"ストレス":{"m":"壓力"},"順位":{"m":"排名、地位"},"事情":{"m":"情況、內情"}}},{"id":"w-sake2-e","lv":"n4","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"川に帰る鮭","sub":"回到河裡的鮭魚（簡單版）","body":"[[鮭|さけ]]は{川|かわ}で{生|う}まれます。{小|ちい}さいとき、{川|かわ}から[[海|うみ]]へ{行|い}きます。\n\n{海|うみ}で{三|さん}{年|ねん}か{四|よん}{年|ねん}、{大|おお}きくなります。それから、{生|う}まれた{川|かわ}に[[戻って|もどって]]きます。\n\nどうして{自分|じぶん}の{川|かわ}が[[分かる|わかる]]のでしょうか。{川|かわ}の[[におい|におい]]を{覚|おぼ}えている、と{言|い}われています。","gloss":{"鮭":{"m":"鮭魚"},"海":{"m":"海"},"戻って":{"m":"回來（原形：戻る）"},"分かる":{"m":"知道、明白"},"におい":{"m":"氣味"}}},{"id":"w-sake2","lv":"n2","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"鮭はなぜ生まれた川に帰るのか","sub":"鮭魚為什麼會回到出生的河流？","body":"秋、北海道や東北の川では、海から戻ってきた鮭が流れに[[逆らって|さからって]]上っていく姿が見られる。浅瀬で背びれを出し、ときには小さな滝を跳び越えながら、ひたすら[[上流|じょうりゅう]]を目指す。\n\n日本で最も多いシロザケは、川で生まれ、春に海へ下る。そして北太平洋を数千キロも回遊しながら、およそ三年から五年かけて大きくなる。やがて[[産卵|さんらん]]の時期が近づくと、自分が生まれた川に戻ってくる。これを「[[母川回帰|ぼせんかいき]]」と言う。\n\n広い海の中でどうやって方向を知るのかは、まだ完全には分かっていない。地球の[[磁気|じき]]や太陽の位置を手がかりにしているという説がある。一方、川の近くまで来てからは、[[嗅覚|きゅうかく]]が重要な役割を果たすと考えられている。稚魚のころに覚えた故郷の川の[[におい|におい]]を、何年も記憶しているというのだ。\n\n産卵を終えた鮭は、多くがそのまま一生を終える。その体は川の生き物や森の動物の[[餌|えさ]]となり、[[栄養|えいよう]]が上流の森にまで運ばれていく。鮭の旅は、海と森をつなぐ旅でもある。","gloss":{"逆らって":{"m":"逆著（原形：逆らう）"},"上流":{"m":"上游"},"産卵":{"m":"產卵"},"母川回帰":{"m":"母川洄游（回到出生河流）"},"磁気":{"m":"磁場、磁力"},"嗅覚":{"m":"嗅覺"},"におい":{"m":"氣味"},"餌":{"m":"飼料、食物"},"栄養":{"m":"營養"}}},{"id":"w-koyo-e","lv":"n4","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"葉はどうして赤くなる？","sub":"葉子為什麼會變紅？（簡單版）","body":"{秋|あき}になると、[[葉|は]]が{赤|あか}や[[黄色|きいろ]]になります。これを「[[紅葉|こうよう]]」と{言|い}います。\n\n{夏|なつ}の{葉|は}は[[緑|みどり]]です。{緑|みどり}の{色|いろ}のもとが、{秋|あき}に[[なくなります|なくなります]]。すると、{中|なか}にあった{黄色|きいろ}が{見|み}えてきます。\n\n{昼|ひる}は{晴|は}れて、{夜|よる}は{寒|さむ}い{日|ひ}が{続|つづ}くと、{葉|は}は[[きれい|きれい]]な{赤|あか}になります。","gloss":{"葉":{"m":"葉子"},"黄色":{"m":"黃色"},"紅葉":{"m":"紅葉、葉子變色"},"緑":{"m":"綠色"},"なくなります":{"m":"消失、沒有了"},"きれい":{"m":"漂亮"}}},{"id":"w-koyo","lv":"n2","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"紅葉の色のひみつ","sub":"紅葉顏色的秘密","body":"秋の山を[[彩る|いろどる]]紅葉には、実は二つの[[仕組み|しくみ]]がある。黄色くなる仕組みと、赤くなる仕組みだ。\n\n夏の葉が緑なのは、[[葉緑素|ようりょくそ]]（クロロフィル）がたくさん含まれているからだ。気温が下がり、日が短くなると、木は葉を落とす準備を始め、葉緑素は分解されていく。すると、もともと葉の中にあった黄色い[[色素|しきそ]]、カロテノイドが見えてくる。イチョウが黄色くなるのはこのためだ。\n\n一方、カエデなどが赤くなるのは、秋になってから新しく作られる「[[アントシアニン|アントシアニン]]」という赤い色素による。葉の付け根に[[離層|りそう]]ができて、葉で作られた糖分が枝へ運ばれにくくなる。その葉に残った糖分から、アントシアニンが作られるのだ。\n\nきれいな紅葉には、昼は日がよく当たり、夜はぐっと冷え込むこと、そして適度な[[湿度|しつど]]が必要だと言われる。一般に、最低気温が八度を下回るころから色づき始めるという。寒暖の差が大きい山の紅葉が[[鮮やか|あざやか]]なのは、そのためだ。","gloss":{"彩る":{"m":"點綴、增添色彩"},"仕組み":{"m":"機制、原理"},"葉緑素":{"m":"葉綠素"},"色素":{"m":"色素"},"アントシアニン":{"m":"花青素"},"離層":{"m":"離層（葉柄基部的隔離層）"},"湿度":{"m":"濕度"},"鮮やか":{"m":"鮮豔"}}},{"id":"w-sakura-e","lv":"n4","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"桜","sub":"櫻花（簡單版）","body":"{日本|にほん}の{春|はる}といえば、[[桜|さくら]]です。\n\n{一番|いちばん}{多|おお}い{桜|さくら}は「[[ソメイヨシノ|ソメイヨシノ]]」です。この{桜|さくら}は、{同|おな}じ{場所|ばしょ}では、だいたい{同|おな}じ{日|ひ}に[[咲きます|さきます]]。\n\n{桜|さくら}が{咲|さ}くと、{人|ひと}びとは{木|き}の{下|した}でごはんを{食|た}べたり、{話|はな}したりします。これを「[[花見|はなみ]]」と{言|い}います。{桜|さくら}は{一週間|いっしゅうかん}ぐらいで[[散って|ちって]]しまいます。","gloss":{"桜":{"m":"櫻花"},"ソメイヨシノ":{"m":"染井吉野櫻"},"咲きます":{"m":"開花（原形：咲く）"},"花見":{"m":"賞花"},"散って":{"m":"凋落（原形：散る）"}}},{"id":"w-sakura","lv":"n2","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"桜はなぜ一斉に咲くのか","sub":"櫻花為什麼會同時盛開？","body":"春になると、ニュースで「[[桜前線|さくらぜんせん]]」という言葉を耳にする。各地の[[開花日|かいかび]]を結んだ線で、三月に九州から始まり、五月ごろ北海道に達する。こうした予報が成り立つのは、日本の桜の大部分が、ある一つの品種だからだ。\n\nその品種が「ソメイヨシノ」。江戸時代の末ごろ、江戸の染井村（今の東京都豊島区）の植木職人たちが広めたとされる。花が大きく、葉が出る前に花だけが一斉に咲くため、見栄えがよく、明治以降、学校や公園、川沿いに次々と植えられた。\n\n実は、ソメイヨシノは自分の花どうしでは種ができにくい。そのため、増やすときは[[接ぎ木|つぎき]]という方法を使う。ほかの木の枝を[[台木|だいき]]につないで育てるのだ。つまり、全国のソメイヨシノは、元をたどれば同じ一本の木から分かれた[[クローン|クローン]]であり、遺伝的な性質がほぼ同じだと考えられている。\n\nだから、気温などの条件がそろえば、同じ地域の桜はほぼ同時に咲き、同時に散る。一斉に咲いて、はかなく散る。日本人が桜に重ねてきた[[美意識|びいしき]]は、実はこの植物の[[性質|せいしつ]]に支えられているのかもしれない。","gloss":{"桜前線":{"m":"櫻花前線（各地開花日期的連線）"},"開花日":{"m":"開花日"},"接ぎ木":{"m":"嫁接"},"台木":{"m":"砧木"},"クローン":{"m":"複製體（無性繁殖系）"},"美意識":{"m":"審美意識"},"性質":{"m":"性質、特性"}}},{"id":"w-jihanki-e","lv":"n4","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"自動販売機","sub":"自動販賣機（簡單版）","body":"{日本|にほん}には、[[自動販売機|じどうはんばいき]]がとても{多|おお}いです。{駅|えき}にも、{道|みち}にも、{山|やま}の{上|うえ}にもあります。\n\n{飲み物|のみもの}が{一番|いちばん}{多|おお}いです。{冬|ふゆ}は、[[温かい|あたたかい]]{飲み物|のみもの}と[[冷たい|つめたい]]{飲み物|のみもの}が、{一|ひと}つの{機械|きかい}で{買|か}えます。\n\n{外|そと}に{置|お}いてあっても、あまり[[壊されません|こわされません]]。{日本|にほん}が[[安全|あんぜん]]だからだと{言|い}う{人|ひと}もいます。","gloss":{"自動販売機":{"m":"自動販賣機"},"温かい":{"m":"溫的、熱的"},"冷たい":{"m":"冰的、冷的"},"壊されません":{"m":"不會被破壞（原形：壊す）"},"安全":{"m":"安全"}}},{"id":"w-jihanki","lv":"n2","wiki":true,"d":-1,"genre":{"zh-Hant":"奇妙百科","ja":"ふしぎ百科"},"title":"自販機大国ニッポン","sub":"自動販賣機大國日本","body":"日本を初めて訪れた人が驚くものの一つに、[[自動販売機|じどうはんばいき]]の多さがある。駅のホーム、住宅街の角、田んぼの真ん中、さらには富士山の山小屋にまで置かれている。飲料以外のものも含めると、全国でおよそ四百万台近くあるとされ、人口当たりの台数は世界でもトップクラスだ。\n\nこれほど普及した理由の一つは、[[治安|ちあん]]のよさだと言われる。現金の入った機械を屋外に置いても、壊されて盗まれることが比較的少ない。また、[[人件費|じんけんひ]]が高く、[[土地|とち]]の狭い日本では、店を構えるより自販機を一台置くほうが効率がよかった。\n\n技術の進化もめざましい。一台の中で、温かい飲み物と冷たい飲み物を同時に売る仕組みは、日本で広まったものだ。最近は、電子マネーで支払えるのはもちろん、[[災害|さいがい]]時に中の飲み物を無料で提供できる「災害対応型」の自販機も増えている。\n\n一方で、[[電力|でんりょく]]消費の多さや、人口減少による売り上げの[[低迷|ていめい]]から、台数は少しずつ減っている。夜道を照らす自販機の光は、日本の街の風景の一部であると同時に、社会の変化を映す鏡でもある。","gloss":{"自動販売機":{"m":"自動販賣機"},"治安":{"m":"治安"},"人件費":{"m":"人事成本"},"土地":{"m":"土地"},"災害":{"m":"災害"},"電力":{"m":"電力"},"低迷":{"m":"低迷"}}}]);

const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const uid=()=>Math.random().toString(36).slice(2,9);
function guessUI(){try{const l=(navigator.language||"").toLowerCase();if(/^zh-(tw|hk|mo|hant)/.test(l))return"zh-Hant";if(l.startsWith("zh"))return"zh-Hans";if(l.startsWith("de"))return"de";if(l.startsWith("ja"))return"ja";if(l.startsWith("en"))return"en"}catch(e){}return"zh-Hant"}
function seedCards(){return SEED.map(([w,r,m,n])=>{const x=SEED_TR[w]||{};return{id:uid(),w,r,m,mi:x.mi,ex:"",note:n,ni:x.ni,src:"",box:0,due:todayStr(),seed:true}})}
function fresh(){const ui=guessUI();return{set:{ui,gl:ui==="ja"?"zh-Hant":ui,fg:"annot",size:19,dir:"j2z",goal:20,vert:false,lvl:"all",showAll:false,rate:0.9,voice:"",autoSay:true,romaji:false,mode:"read",onb:false},
cards:seedCards(),log:{},read:{},kana:{},les:{}}}
let FIRST=false;
function load(){try{const raw=localStorage.getItem(KEY)||localStorage.getItem(OLDKEY);const s=JSON.parse(raw);
  if(s&&s.cards){const f=fresh(),o=Object.assign(f,s,{set:Object.assign(f.set,{gl:"",onb:true},s.set)});
    if(!o.set.gl)o.set.gl=o.set.ui==="ja"?"zh-Hant":o.set.ui;
    o.kana=o.kana||{};o.les=o.les||{};
    o.cards.forEach(c=>{if(c.seed&&!c.mi&&SEED_TR[c.w]){c.mi=SEED_TR[c.w].mi;c.ni=SEED_TR[c.w].ni}});
    return o}}catch(e){}
  FIRST=true;return fresh()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(), V={view:S.set.mode==="begin"?"start":"read",art:null,q:"",showAdd:false,sess:null,flip:false,confirm:null,sel:"",sv:null,kscript:"h",kq:null,kqSet:"basic",kqDir:"k2r",showTr:true};
const L=()=>I18N[S.set.ui]||I18N["zh-Hant"];
const t=(k,...a)=>{let v=L()[k];if(v===undefined)v=I18N.en[k];return typeof v==="function"?v(...a):v};
const GL=()=>S.set.gl||"zh-Hant";
const tri=o=>o?(o[GL()]||o["zh-Hant"]||""):"";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);

/* ---------- multilingual content lookup ---------- */
const TRK=l=>l==="zh-Hans"?"hans":l;
function trOf(a){const l=GL();return l==="zh-Hant"?null:(TR[TRK(l)]||{})[a.id]}
function aSub(a){if(a.les)return tri(a.s);const x=trOf(a);return x&&x.s||a.sub}
function aGenre(a){const u=S.set.ui;if(u==="zh-Hant"||u==="ja")return a.genre[u];const zh=a.genre["zh-Hant"],g=GLAB[zh];return g?(u==="zh-Hans"?g.hans:g[u]):zh}
function aGloss(a,w){
  if(a.les){const v=a.vm[w];return v?{m:tri(v.m)}:{m:""}}
  const x=trOf(a),v=x&&x.g[w];if(v)return{m:v[0],n:v[1]||""};return a.gloss[w]||{m:""}}
function allGloss(a,w){const mi={},ni={};
  if(a.les){const v=a.vm[w];if(v)Object.assign(mi,v.m);return{mi,ni}}
  const g=a.gloss[w]||{};mi["zh-Hant"]=g.m||"";ni["zh-Hant"]=g.n||"";
  ["zh-Hans","en","de"].forEach(l=>{const x=(TR[TRK(l)]||{})[a.id],v=x&&x.g[w];if(v){mi[l]=v[0];ni[l]=v[1]||""}});return{mi,ni}}
const findArt=id=>ARTICLES.find(x=>x.id===id)||LESSONS.find(x=>x.id===id);

/* ---------- romaji ---------- */
const KS="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんがぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽゔ";
const KR="a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa o n ga gi gu ge go za ji zu ze zo da ji zu de do ba bi bu be bo pa pi pu pe po vu".split(" ");
const KM={};[...KS].forEach((k,i)=>KM[k]=KR[i]);
const toHira=s=>s.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
function romaji(s){s=toHira(String(s||""));let o="",dbl=false;
  for(let i=0;i<s.length;i++){const c=s[i],n=s[i+1];
    if(c==="っ"){dbl=true;continue}
    if(c==="ー"){const m=o.match(/[aiueo](?=[^aiueo]*$)/);o+=m?m[0]:"";continue}
    let r=KM[c];
    if(r===undefined){o+=c==="、"?", ":c==="。"?". ":c==="　"?" ":c;dbl=false;continue}
    if(n&&"ゃゅょ".includes(n)){const v={"ゃ":"a","ゅ":"u","ょ":"o"}[n],b=r.slice(0,-1);r=/(sh|ch|j)$/.test(b)?b+v:b+"y"+v;i++}
    else if(n&&"ぁぃぅぇぉ".includes(n)){r=r.replace(/[aiueo]$/,"")+{"ぁ":"a","ぃ":"i","ぅ":"u","ぇ":"e","ぉ":"o"}[n];i++}
    if(dbl){o+=r.startsWith("ch")?"t":r[0];dbl=false}
    if(c==="ん"&&n&&/^[aiueoy]/.test(KM[n]||""))r="n'";
    o+=r}
  return o.replace(/\s+/g," ").trim()}

/* ---------- kana data ---------- */
const KROWS=["あいうえお","かきくけこ","さしすせそ","たちつてと","なにぬねの","はひふへほ","まみむめも","や・ゆ・よ","らりるれろ","わ・・・を","ん・・・・"];
const KDROWS=["がぎぐげご","ざじずぜぞ","だぢづでど","ばびぶべぼ","ぱぴぷぺぽ"];
const KYROWS=["きしちにひみりぎじびぴ"].join("").split("").map(c=>[c+"ゃ",c+"ゅ",c+"ょ"]);
const kList=set=>{const b=KROWS.join("").replace(/・/g,"").split(""),d=KDROWS.join("").split(""),y=KYROWS.flat();return set==="basic"?b:set==="daku"?b.concat(d):b.concat(d,y)};
const toKata=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60));
const kOK=k=>{const v=S.kana[k];return v&&v[0]>=3&&v[0]>v[1]};

/* ---------- parsing ---------- */
const RX=/\[\[([^|\]]+)\|([^\]]+)\]\]|\{([^|}]+)\|([^}]+)\}/g;
const plain=s=>s.replace(RX,(m,a,b,c)=>a||c);
let SENTS=[];
const sayText=s=>s.replace(RX,(m,w,r,k,kr)=>w?r:kr);
function renderPara(p,art){
  return (p.match(/[^。！？]+[。！？」]*|[。！？」]+/g)||[p]).map(sen=>{
    const sp=esc(plain(sen).trim()), si=SENTS.length; SENTS.push(sayText(sen).trim());
    return `<span class="sen" data-i="${si}">`+sen0(sen,sp,si,art)+`</span>`}).join("");
}
function sen0(sen,sp,si,art){
    return sen.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])).replace(RX,(m,w,r,k,kr)=>{
      if(w){const sv=has(w)?" saved":"";const inner=r===w?esc(w):`${esc(w)}<rt>${esc(r)}</rt>`;
        return `<ruby class="an${sv}" tabindex="0" role="button" data-w="${esc(w)}" data-r="${esc(r)}" data-a="${art.id}" data-s="${sp}" data-i="${si}">${inner}</ruby>`}
      return `<ruby>${esc(k)}<rt>${esc(kr)}</rt></ruby>`});
}
const roHTML=r=>S.set.romaji&&r?`<span class="ro">${esc(romaji(r))}</span>`:"";

}

function kanaCell(k){if(!k||k==="・")return `<span class="kc empty"></span>`;const kk=V.kscript==="k"?toKata(k):k;

function newQuiz(){const pool=kList(V.kqSet).map(k=>V.kscript==="k"?toKata(k):k);
  const weak=pool.slice().sort(()=>Math.random()-.5).sort((a,b)=>(kOK(a)?1:0)-(kOK(b)?1:0));
  const q=weak.slice(0,10).map(k=>{const others=pool.filter(x=>x!==k&&romaji(x)!==romaji(k)).sort(()=>Math.random()-.5).slice(0,3);return{k,opts:[k,...others].sort(()=>Math.random()-.5)}});
  V.kq={q,i:0,ok:0,pick:null}}

  const head=`<button class="back" data-act="sback">${t("back2")}</button><p class="eyebrow">${t("step",2)}</p><h2>${t("quizH")}</h2>`;

     <div class="item"><span class="lab">${t("qDir")}</span><p></p><div class="c"><span class="seg">${[["k2r","k2r"],["r2k","r2k"]].map(([v,k])=>`<button data-kqdir="${v}" aria-pressed="${V.kqDir===v}">${t(k)}</button>`).join("")}</span></div></div>

    if(s.i>=s.q.length){const n=s.n;V.sess=null;return `<p class="eyebrow">${t("pracEy")}</p><h2>${t("doneH")}</h2><p class="lede">${t("doneP",n)}</p>${statsBlock(done,goal,due)}`}
    const c=S.cards.find(x=>x.id===s.q[s.i]);if(!c){s.i++;return viewPrac()}

}

/* ---------- speech ---------- */
const SPK='<svg class="spk" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>';
const TTS={ok:"speechSynthesis" in window,voices:[],playing:false,paused:false,idx:-1,gen:0};
function loadVoices(){if(!TTS.ok)return;try{TTS.voices=speechSynthesis.getVoices().filter(v=>/^ja/i.test(v.lang))}catch(e){TTS.voices=[]}}
if(TTS.ok){loadVoices();try{speechSynthesis.addEventListener("voiceschanged",()=>{loadVoices();if(V.view==="set")render()})}catch(e){}}
function pickVoice(){return TTS.voices.find(v=>v.voiceURI===S.set.voice)||TTS.voices.find(v=>/ja-JP/i.test(v.lang))||TTS.voices[0]||null}
function utter(text,rate){const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";const v=pickVoice();if(v)u.voice=v;u.rate=rate||S.set.rate;return u}
let warned=false;function noVoiceOnce(){if(!warned){warned=true;toast(t("noVoice"))}}
function say(text){if(!TTS.ok){toast(t("noTTS"));return}if(!text)return;stopAll();if(!TTS.voices.length)loadVoices();if(!TTS.voices.length)noVoiceOnce();try{speechSynthesis.speak(utter(text))}catch(e){toast(t("noTTS"))}}
function hl(i){document.querySelectorAll(".sen.reading").forEach(e=>e.classList.remove("reading"));if(i<0)return;const el=document.querySelector(`.sen[data-i="${i}"]`);if(el){el.classList.add("reading");try{el.scrollIntoView({block:"nearest",inline:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}catch(e){}}}
function playFrom(i){if(!TTS.ok){toast(t("noTTS"));return}stopAll();if(!TTS.voices.length)loadVoices();if(!TTS.voices.length)noVoiceOnce();
  const g=++TTS.gen;TTS.playing=true;TTS.paused=false;
  const step=k=>{if(g!==TTS.gen)return;if(k>=SENTS.length){TTS.playing=false;TTS.idx=-1;hl(-1);updPlayer();return}
    if(!SENTS[k].replace(/[「」、。！？\s]/g,"")){step(k+1);return}
    TTS.idx=k;hl(k);updPlayer();const u=utter(SENTS[k]);u.onend=()=>step(k+1);u.onerror=ev=>{if(g===TTS.gen&&ev.error!=="interrupted"&&ev.error!=="canceled")step(k+1)};
    try{speechSynthesis.speak(u)}catch(e){stopAll()}};
  step(i);}
function stopAll(){TTS.gen++;TTS.playing=false;TTS.paused=false;TTS.idx=-1;try{if(TTS.ok)speechSynthesis.cancel()}catch(e){}hl(-1);updPlayer()}
function togglePause(){if(!TTS.playing)return;try{if(TTS.paused){speechSynthesis.resume();TTS.paused=false}else{speechSynthesis.pause();TTS.paused=true}}catch(e){}updPlayer()}
function playerHTML(){const rates=[[0.7,"0.7×"],[0.9,"0.9×"],[1.1,"1.1×"]];
  return `${TTS.playing?`<button class="btn" data-act="tpause">${SPK}${TTS.paused?t("resume"):t("pause")}</button><button class="btn ghost" data-act="tstop">${t("stop")}</button>`:`<button class="btn primary" data-act="tplay">${SPK}${t("listen")}</button>`}
  <span class="seg" role="group" aria-label="${t("speed")}">${rates.map(([v,l])=>`<button data-rate="${v}" aria-pressed="${S.set.rate===v}">${l}</button>`).join("")}</span>`}
function updPlayer(){const p=$("#player");if(p)p.innerHTML=playerHTML()}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-showall],[data-say],[data-from],[data-rate],[data-voice],[data-autosay],[data-tab],[data-art],[data-act],[data-fg],[data-vert],[data-ui],[data-gl],[data-mode],[data-romaji],[data-wlang],[data-wmode],[data-sv],[data-ks],[data-kana],[data-kqset],[data-kqdir],[data-kpick],[data-addles],[data-addcat],[data-pdir],[data-goal],[data-lvl],[data-del],[data-ans],.an,#card");
  if(!b)return; const d=b.dataset;
  if(d.say!==undefined){e.stopPropagation();say(d.say);return}
  if(d.kana){say(d.kana);return}
  if(d.from!==undefined){closeSheet();playFrom(+d.from);return}
  if(d.rate){S.set.rate=+d.rate;persist();if(V.view==="set")render();else updPlayer();return}
  if(d.showall){S.set.showAll=d.showall==="1";persist();render();return}

  if(d.sv){V.sv=d.sv;V.kq=null;render();scrollTo(0,0);return}
  if(d.ks){V.ks=d.ks;V.kscript=d.ks;V.kq=null;render();return}
  if(d.kqset){V.kqSet=d.kqset;render();return}
  if(d.kqdir){V.kqDir=d.kqdir;render();return}
  if(d.kpick){const s=V.kq;if(!s||s.pick!==null)return;const it=s.q[s.i],ok=d.kpick===it.k;s.pick=d.kpick;
    const v=S.kana[it.k]||[0,0];if(ok){v[0]++;s.ok++}else v[1]++;S.kana[it.k]=v;persist();say(it.k);render();return}
  if(d.addles){const l=LESSONS.find(x=>x.id===d.addles);addWords(l.vocab.map(v=>({w:v[0],r:v[1]===v[0]?"":v[1],m:l.vm[v[0]].m["zh-Hant"],mi:l.vm[v[0]].m,src:l.t})),l.t);render();return}
  if(d.addcat){const c=STARTER.find(x=>x.id===d.addcat);addWords(c.w.map(x=>({w:x[0],r:x[1]===x[0]?"":x[1],m:x.m["zh-Hant"],mi:x.m})),tri(c.l));render();return}
  if(d.art){V.art=d.art;V.view="read";V.sv=null;render();scrollTo(0,0);return}
  if(b.classList.contains("an")){openGloss(b);return}
  if(b.id==="card"&&!V.flip){V.flip=true;render();if(S.set.autoSay&&V.sess){const c=S.cards.find(x=>x.id===V.sess.q[V.sess.i]);if(c)say(c.r||c.w)}return}
  if(d.lvl){S.set.lvl=d.lvl;persist();render();return}
  if(d.fg){S.set.fg=d.fg;persist();render();return}
  if(d.vert!==undefined){S.set.vert=d.vert==="1";persist();render();return}
  if(d.ui){S.set.ui=d.ui;if(d.ui!=="ja")S.set.gl=d.ui;persist();render();return}
  if(d.gl){S.set.gl=d.gl;persist();render();return}
  if(d.mode){S.set.mode=d.mode;persist();render();return}
  if(d.romaji!==undefined){S.set.romaji=d.romaji==="1";persist();render();return}
  if(d.pdir){S.set.dir=d.pdir;persist();render();return}
  if(d.goal){S.set.goal=+d.goal;persist();render();return}
  if(d.del){if(V.confirm===d.del){S.cards=S.cards.filter(c=>c.id!==d.del);V.confirm=null;persist()}else V.confirm=d.del;render();return}
  if(d.ans){const s=V.sess,c=S.cards.find(x=>x.id===s.q[s.i]),a=+d.ans,td=todayStr();
    if(a===0){c.box=0;c.due=td;if(!s.re[c.id]){s.q.push(c.id);s.re[c.id]=1}}
    else if(a===1){c.box=Math.max(1,c.box);c.due=addDays(td,1)}
    else{c.box=Math.min(c.box+1,IV.length-1);c.due=addDays(td,IV[c.box])}
    S.log[td]=(S.log[td]||0)+1;s.n++;s.i++;V.flip=false;persist();render();return}
  switch(d.act){
    case "welgo":{S.set.onb=true;if(S.set.mode==="begin"){S.cards=S.cards.filter(c=>!c.seed);const g=STARTER[0];g.w.forEach(x=>S.cards.push({id:uid(),w:x[0],r:x[1]===x[0]?"":x[1],m:x.m["zh-Hant"],mi:x.m,ex:"",note:"",src:"",box:0,due:todayStr(),seed:true}));S.set.fg="all";V.view="start"}else V.view="read";persist();render();scrollTo(0,0);break}
    case "sback":V.sv=null;V.kq=null;render();scrollTo(0,0);break;

    case "lesdone":S.les[d.l]=!S.les[d.l];persist();render();break;

    case "rmseed":S.cards=S.cards.filter(c=>!c.seed);persist();render();toast(t("removedSeed"));break;
  }
});

  e.preventDefault();
  if(e.target.id==="addForm"){const w=$("#f_w").value.trim(),m=$("#f_m").value.trim();if(!w||!m){toast(t("needWord"));return}
    addCard({w,r:$("#f_r").value.trim(),m,ex:$("#f_ex").value.trim(),note:$("#f_n").value.trim()});V.showAdd=false;render()}
  if(e.target.id==="selForm"){const w=$("#s_w").value.trim(),m=$("#s_m").value.trim();if(!w||!m){toast(t("needWord"));return}
    addCard({w,r:$("#s_r").value.trim(),m,ex:$("#s_ex").value.trim(),src:e.target.dataset.src||""});closeSheet();window.getSelection().removeAllRanges();render()}
});
/* selection → add */
let selTimer;
document.addEventListener("selectionchange",()=>{clearTimeout(selTimer);selTimer=setTimeout(()=>{
  const sel=window.getSelection(),r=$("#reader"),old=$("#selbtn");
  const txt=sel&&sel.rangeCount?sel.toString().replace(/\s+/g,"").trim():"";
  const inside=r&&sel.rangeCount&&r.contains(sel.getRangeAt(0).commonAncestorContainer);
  if(!inside||!txt||txt.length>30){if(old)old.remove();return}
  let sentence="";const node=sel.anchorNode&&(sel.anchorNode.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode);const p=node&&(node.closest("p")||node.closest(".ljp"));
  if(p){const c=p.cloneNode(true);c.querySelectorAll("rt,button").forEach(x=>x.remove());const full=c.textContent;
    sentence=((full.match(/[^。！？\n]+[。！？」]*/g)||[full]).find(x=>x.includes(txt))||"").trim()}
  V.sel=txt;let b=old;if(!b){b=document.createElement("button");b.id="selbtn";b.className="selbtn";document.body.appendChild(b);
    b.addEventListener("mousedown",ev=>ev.preventDefault());b.addEventListener("touchstart",ev=>ev.preventDefault(),{passive:false});
    const go=ev=>{ev.preventDefault();if(!b.isConnected)return;b.remove();openCustom(V.sel,b.dataset.s||"")};b.addEventListener("click",go);b.addEventListener("touchend",go)}
  b.textContent=t("addSel",txt.length>12?txt.slice(0,12)+"…":txt);b.dataset.s=sentence;
},250)});

Object.assign(TRP,{"sento":[{"zh-Hant":"附近有一家老澡堂。上週我第一次去。在入口付了費，一位奶奶問我：「有帶毛巾嗎？」","zh-Hans":"附近有一家老澡堂。上周我第一次去。在入口付了费，一位奶奶问我：「有带毛巾吗？」","en":"There is an old public bath near my home. I went for the first time last week. When I paid at the entrance, an elderly woman asked me, \"Do you have a towel?\"","de":"There is an old public bath near my home. I went for the first time last week. When I paid at the entrance, an elderly woman asked me, \"Do you have a towel?\""},{"zh-Hant":"水非常燙，不過一邊看著牆上畫的富士山，一邊泡進去，感覺很舒服。旁邊的爺爺問我：「你從哪裡來的？」我就聊了一點台灣的事。","zh-Hans":"水非常烫，不过一边看着墙上画的富士山，一边泡进去，感觉很舒服。旁边的爷爷问我：「你从哪里来的？」我就聊了一点台湾的事。","en":"The water was very hot, but it felt good to soak while looking at the painting of Mt. Fuji on the wall. The old man next to me asked, \"Where are you from?\" and I told him a little about Taiwan.","de":"The water was very hot, but it felt good to soak while looking at the painting of Mt. Fuji on the wall. The old man next to me asked, \"Where are you from?\" and I told him a little about Taiwan."},{"zh-Hant":"回家的路上，身體暖呼呼的。我想下週也會再去。","zh-Hans":"回家的路上，身体暖呼呼的。我想下周也会再去。","en":"On the way home, my body was warm and cozy. I think I'll go again next week.","de":"On the way home, my body was warm and cozy. I think I'll go again next week."}],"oden":[{"zh-Hant":"日本的便利商店一到秋天就開始賣關東煮。收銀台旁邊有一口大鍋，可以自己挑喜歡的料。","zh-Hans":"日本的便利商店一到秋天就开始卖关东煮。收银台旁边有一口大锅，可以自己挑喜欢的料。","en":"In Japanese convenience stores, oden goes on sale in autumn. There is a big pot beside the register, and you pick the ingredients you like yourself.","de":"In Japanese convenience stores, oden goes on sale in autumn. There is a big pot beside the register, and you pick the ingredients you like yourself."},{"zh-Hant":"我最愛的是白蘿蔔和蛋。台灣的便利商店也有「關東煮」，不過味道有點不一樣。我覺得日本的高湯味道更濃。","zh-Hans":"我最爱的是白萝卜和蛋。台湾的便利商店也有「关东煮」，不过味道有点不一样。我觉得日本的高汤味道更浓。","en":"My favorites are daikon radish and egg. Taiwanese convenience stores also sell 關東煮, but the taste is a little different. I feel the dashi in Japan has a stronger flavor.","de":"My favorites are daikon radish and egg. Taiwanese convenience stores also sell 關東煮, but the taste is a little different. I feel the dashi in Japan has a stronger flavor."},{"zh-Hant":"寒冷的日子裡，在回家路上吃的關東煮，是給自己的小小獎勵。","zh-Hans":"寒冷的日子里，在回家路上吃的关东煮，是给自己的小小奖励。","en":"On cold days, eating oden on the way home is a small reward for yourself.","de":"On cold days, eating oden on the way home is a small reward for yourself."}],"kanji":[{"zh-Hant":"剛從台灣來到日本的時候，大學的公告欄上寫著「本日授業休講」，我愣了一下。看漢字大致能猜到意思，但以為自己懂了，反而最危險。","zh-Hans":"刚从台湾来到日本的时候，大学的公告栏上写着「本日授业休讲」，我愣了一下。看汉字大致能猜到意思，但以为自己懂了，反而最危险。","en":"When I first came to Japan from Taiwan, I saw a notice on the university bulletin board that read 「本日の授業は休講」, and I hesitated for a moment. You can roughly guess the meaning from the kanji, but thinking you understand is the most dangerous thing.","de":"When I first came to Japan from Taiwan, I saw a notice on the university bulletin board that read 「本日の授業は休講」, and I hesitated for a moment. You can roughly guess the meaning from the kanji, but thinking you understand is the most dangerous thing."},{"zh-Hant":"朋友對我說「前次給你添麻煩了，對不起」，那時我以為日文的「迷惑」接近中文的「困惑」。其實日文的「迷惑」是指給對方添麻煩。我發現自己誤會，已經是很久以後的事了。","zh-Hans":"朋友对我说「前次给你添麻烦了，对不起」，那时我以为日文的「迷惑」接近中文的「困惑」。其实日文的「迷惑」是指给对方添麻烦。我发现自己误会，已经是很久以后的事了。","en":"When a friend said to me, 「この前は迷惑をかけてごめんね」, I had assumed that 「迷惑」 in Japanese was close to the Chinese 「困惑」. But in Japanese, 「迷惑」 means causing trouble for someone else. I only realized my mistake long afterward.","de":"When a friend said to me, 「この前は迷惑をかけてごめんね」, I had assumed that 「迷惑」 in Japanese was close to the Chinese 「困惑」. But in Japanese, 「迷惑」 means causing trouble for someone else. I only realized my mistake long afterward."},{"zh-Hant":"漢字這個共同點，既是捷徑，也是陷阱。越是相似的詞，越要停下來查一次字典。也許這就是在兩種語言之間生活的人，那一點小小的智慧吧。","zh-Hans":"汉字这个共同点，既是捷径，也是陷阱。越是相似的词，越要停下来查一次字典。也许这就是在两种语言之间生活的人，那一点小小的智能吧。","en":"Shared kanji are both a shortcut and a trap. The more similar two words look, the more you should stop and check a dictionary. Perhaps this small wisdom is what people who live between two languages learn.","de":"Shared kanji are both a shortcut and a trap. The more similar two words look, the more you should stop and check a dictionary. Perhaps this small wisdom is what people who live between two languages learn."}],"yonaga":[{"zh-Hant":"過了立秋，東京的暑氣還是遲遲不退。不過一進入十月，太陽下山明顯變早了。在俳句的世界裡，這段時節被稱為「夜長」。不是為夜晚變長而嘆息，而是用來細細品味的詞語。","zh-Hans":"过了立秋，东京的暑气还是迟迟不退。不过一进入十月，太阳下山明显变早了。在俳句的世界里，这段时节被称为「夜长」。不是为夜晚变长而叹息，而是用来细细品味的词语。","en":"Even after 立秋, the summer heat in Tokyo is slow to fade. Still, once October arrives, the sun sets noticeably earlier. In the world of haiku, this season is called 「夜長」. It is not a word for lamenting the long nights, but for savoring them.","de":"Even after 立秋, the summer heat in Tokyo is slow to fade. Still, once October arrives, the sun sets noticeably earlier. In the world of haiku, this season is called 「夜長」. It is not a word for lamenting the long nights, but for savoring them."},{"zh-Hant":"一邊聽蟲鳴，一邊看書。泡一杯溫熱的焙茶。寫信給某個人。這些小小的時光，大概正是秋天這個季節的醍醐味吧。","zh-Hans":"一边听虫鸣，一边看书。泡一杯温热的焙茶。写信给某个人。这些小小的时光，大概正是秋天这个季节的醍醐味吧。","en":"Reading a book while listening to insects sing. Brewing a cup of warm hojicha. Writing a letter to someone. These small moments are probably the true pleasure of autumn.","de":"Reading a book while listening to insects sing. Brewing a cup of warm hojicha. Writing a letter to someone. These small moments are probably the true pleasure of autumn."},{"zh-Hant":"順帶一提，還有一個季語叫「燈火親しむ」，意思是適合在燈下讀書的季節。今晚要不要早一點回家休息呢？","zh-Hans":"顺带一提，还有一个季语叫「灯火亲しむ」，意思是适合在灯下读书的季节。今晚要不要早一点回家休息呢？","en":"By the way, there is also a seasonal word 「灯火親しむ」, meaning a season well suited to reading under the lamp. Shall I head home a little earlier tonight?","de":"By the way, there is also a seasonal word 「灯火親しむ」, meaning a season well suited to reading under the lamp. Shall I head home a little earlier tonight?"}],"mail":[{"zh-Hant":"綠書房股份有限公司\n業務部　佐藤先生","zh-Hans":"绿书房股份有限公司\n业务部　佐藤先生","en":"Midori Shobo Co., Ltd.\nAttn: Mr. Sato, Sales Department","de":"Midori Shobo Co., Ltd.\nAttn: Mr. Sato, Sales Department"},{"zh-Hant":"一直承蒙您的關照。我是台北設計事務所的林。\n前些日子您百忙之中撥冗與我們洽談，真的非常感謝。","zh-Hans":"一直承蒙您的关照。我是台北设计事务所的林。\n前些日子您百忙之中拨冗与我们洽谈，真的非常感谢。","en":"Thank you very much for your continued support. I am Lin of Taipei Design Office.\nThank you for taking the time out of your busy schedule for our meeting the other day.","de":"Thank you very much for your continued support. I am Lin of Taipei Design Office.\nThank you for taking the time out of your busy schedule for our meeting the other day."},{"zh-Hant":"您先前委託的報價單，現以附件方式寄送。敬請查收，謝謝。","zh-Hans":"您先前委托的报价单，现以附件方式寄送。敬请查收，谢谢。","en":"Please find attached the quotation you requested. Kindly review it at your convenience. Thank you.","de":"Please find attached the quotation you requested. Kindly review it at your convenience. Thank you."},{"zh-Hant":"另外，交貨期方面，在收到正式訂單後，預計約需三週。如有任何不明之處，請不吝隨時告知。","zh-Hans":"另外，交货期方面，在收到正式订单后，预计约需三周。如有任何不明之处，请不吝随时告知。","en":"Regarding delivery, we expect approximately three weeks after we receive your formal order. If anything is unclear, please feel free to let me know.","de":"Regarding delivery, we expect approximately three weeks after we receive your formal order. If anything is unclear, please feel free to let me know."},{"zh-Hant":"今後也請多多指教。","zh-Hans":"今后也请多多指教。","en":"I look forward to working with you.","de":"I look forward to working with you."}],"shoten":[{"zh-Hant":"據說全國書店的數量，在這二十多年裡減少了一半。網路購書和電子書的普及，再加上人口減少，雪上加霜。如今沒有一家書店的地方自治體，也已經不算稀奇了。","zh-Hans":"据说全国书店的数量，在这二十多年里减少了一半。网络购书和电子书的普及，再加上人口减少，雪上加霜。如今没有一家书店的地方自治体，也已经不算稀奇了。","en":"It is said that the number of bookstores nationwide has halved in roughly the last twenty years. Online retail and the spread of e-books, along with a shrinking population, have piled on. Municipalities without a single bookstore are no longer unusual.","de":"It is said that the number of bookstores nationwide has halved in roughly the last twenty years. Online retail and the spread of e-books, along with a shrinking population, have piled on. Municipalities without a single bookstore are no longer unusual."},{"zh-Hant":"另一方面，新型態的書店也在誕生。有只擺店主親自挑選的書的小型「獨立書店」，也有把書架的一個區塊出租給個人的「共享書店」。單看銷售額，收支很難平衡。儘管如此，各地仍然悄悄地擴散著一種心意：想留住一個讓人與書偶然相遇的地方。","zh-Hans":"另一方面，新型态的书店也在诞生。有只摆店主亲自挑选的书的小型「独立书店」，也有把书架的一个区块出租给个人的「共享书店」。单看销售额，收支很难平衡。尽管如此，各地仍然悄悄地扩散着一种心意：想留住一个让人与书偶然相遇的地方。","en":"On the other hand, new kinds of bookstores are also appearing. There are small \"independent bookstores\" that stock only books chosen by the owner, and \"shared bookstores\" that rent out a section of shelving to individuals. Looking only at sales, profitability is difficult. Yet across the country, a quiet desire is spreading to keep places where people and books can meet by chance.","de":"On the other hand, new kinds of bookstores are also appearing. There are small \"independent bookstores\" that stock only books chosen by the owner, and \"shared bookstores\" that rent out a section of shelving to individuals. Looking only at sales, profitability is difficult. Yet across the country, a quiet desire is spreading to keep places where people and books can meet by chance."}],"shuden":[{"zh-Hant":"這已經是第二次錯過末班電車了。","zh-Hans":"这已经是第二次错过末班电车了。","en":"This was the second time I had missed the last train.","de":"This was the second time I had missed the last train."},{"zh-Hant":"車站前的圓環上，等計程車的人排成一長列，模模糊糊地延伸著。我沒有排進去，而是在便利商店買了一罐溫熱的罐裝咖啡，站到了天橋上。","zh-Hans":"车站前的圆环上，等出租车的人排成一长列，模模糊糊地延伸着。我没有排进去，而是在便利商店买了一罐温热的罐装咖啡，站到了天桥上。","en":"In the roundabout in front of the station, a line of people waiting for taxis stretched out hazily. I didn't join the line. Instead, I bought a warm canned coffee at a convenience store and stood on the pedestrian bridge.","de":"In the roundabout in front of the station, a line of people waiting for taxis stretched out hazily. I didn't join the line. Instead, I bought a warm canned coffee at a convenience store and stood on the pedestrian bridge."},{"zh-Hant":"腳下流動的車燈，和台北的夜晚有些相似。不同的只是，這裡聞不到夜市攤的香味。","zh-Hans":"脚下流动的车灯，和台北的夜晚有些相似。不同的只是，这里闻不到夜市摊的香味。","en":"The car lights flowing below looked somewhat like Taipei's night. The only difference was that there was no smell of street food stalls.","de":"The car lights flowing below looked somewhat like Taipei's night. The only difference was that there was no smell of street food stalls."},{"zh-Hant":"我想著「想回去」。但是，想回去的地方到底在哪裡，我自己也不太清楚。直到罐裝咖啡涼掉，我就那樣呆呆地站在那裡。","zh-Hans":"我想着「想回去」。但是，想回去的地方到底在哪里，我自己也不太清楚。直到罐装咖啡凉掉，我就那样呆呆地站在那里。","en":"I thought, \"I want to go home.\" But where I wanted to go home to, I didn't really know myself. I stood there, lost in thought, until the canned coffee went lukewarm.","de":"I thought, \"I want to go home.\" But where I wanted to go home to, I didn't really know myself. I stood there, lost in thought, until the canned coffee went lukewarm."}],"kuki":[{"zh-Hant":"在日本生活，「讀空氣」這個說法會反覆出現。會議上沒有人反對，並不是因為大家都贊成。很多時候，只是因為提出反對會讓場面變尷尬，所以大家避開了。","zh-Hans":"在日本生活，「读空气」这个说法会反复出现。会议上没有人反对，并不是因为大家都赞成。很多时候，只是因为提出反对会让场面变尴尬，所以大家避开了。","en":"Living in Japan, you run into the expression 「空気を読む」 again and again. When no one objects in a meeting, it is not necessarily because everyone agrees. Quite often, it is simply that voicing an objection would make the atmosphere awkward, so people avoid it.","de":"Living in Japan, you run into the expression 「空気を読む」 again and again. When no one objects in a meeting, it is not necessarily because everyone agrees. Quite often, it is simply that voicing an objection would make the atmosphere awkward, so people avoid it."},{"zh-Hant":"當然，體察對方心情的能力，對於順暢的人際關係不可或缺。但如果太過分，就會變成「同調壓力」，束縛個人的判斷。揣摩上位者的意向、搶先行動，久而久之，原本的目的被忘記，只剩下形式逐漸空洞化。","zh-Hans":"当然，体察对方心情的能力，对于顺畅的人际关系不可或缺。但如果太过分，就会变成「同调压力」，束缚个人的判断。揣摩上位者的意向、抢先行动，久而久之，原本的目的被忘记，只剩下形式逐渐空洞化。","en":"Of course, the ability to sense how others feel is essential for smooth relationships. But when it goes too far, it becomes 「同調圧力」, pressure to conform that constrains individual judgment. Anticipating the wishes of those above and acting on them in advance, the original purpose gets lost, and only the procedures become hollow.","de":"Of course, the ability to sense how others feel is essential for smooth relationships. But when it goes too far, it becomes 「同調圧力」, pressure to conform that constrains individual judgment. Anticipating the wishes of those above and acting on them in advance, the original purpose gets lost, and only the procedures become hollow."},{"zh-Hant":"矛盾的是，真正能讀懂空氣的人，或許是有勇氣刻意不去讀空氣的人。在沉默被當作默契的場合，問一句「真的可以這樣嗎？」。這一句話的分量，不應該被一概而論地輕視。","zh-Hans":"矛盾的是，真正能读懂空气的人，或许是有勇气刻意不去读空气的人。在沉默被当作默契的场合，问一句「真的可以这样吗？」。这一句话的分量，不应该被一概而论地轻视。","en":"Paradoxically, perhaps those who truly can read the air are the ones with the courage to deliberately not follow it. In a setting where silence is taken as tacit agreement, to ask, \"Is it really all right to proceed like this?\" The weight of that one sentence should not be dismissed out of hand.","de":"Paradoxically, perhaps those who truly can read the air are the ones with the courage to deliberately not follow it. In a setting where silence is taken as tacit agreement, to ask, \"Is it really all right to proceed like this?\" The weight of that one sentence should not be dismissed out of hand."}],"shasetsu":[{"zh-Hant":"推行「工作方式改革」以矯正長時間勞動，已經過了很久。加班時間有了上限，帶薪休假的取得也被規定為義務。從數字上看，可以說取得了一定的成果。","zh-Hans":"推行「工作方式改革」以矫正长时间劳动，已经过了很久。加班时间有了上限，带薪休假的取得也被规定为义务。从数字上看，可以说取得了一定的成果。","en":"It has been a long time since the 「work style reform」 began, aiming to correct long working hours. Overtime now has upper limits, and taking paid leave has been made mandatory. In terms of numbers, it can be said that some results have been achieved.","de":"It has been a long time since the 「work style reform」 began, aiming to correct long working hours. Overtime now has upper limits, and taking paid leave has been made mandatory. In terms of numbers, it can be said that some results have been achieved."},{"zh-Hant":"但是，現場的真實感受未必如此。工作量沒有改變，時間卻被削減，帶回家加班或無償加班來湊數的例子也層出不窮
