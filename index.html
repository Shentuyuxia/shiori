<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<title>Shiori 栞</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;700&family=Noto+Serif+JP:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}
/* Layout: one narrow column like a pocket notebook; sticky tab strip; bottom sheet for glosses. Ink-indigo on cool paper, celadon (青磁) as the single accent. */
:root{
  --paper:#f2f4f3; --surface:#ffffff; --ink:#1c2930; --muted:#5d6a70; --line:#d5dbda;
  --accent:#2c6b64; --accent-soft:#dbeae6; --on-accent:#ffffff;
  --again:#a8473a; --hard:#9a6f17; --good:#2c6b64; --shade:rgba(20,30,34,.32);
  --f-display:"Zen Old Mincho","Noto Serif JP","Noto Serif TC",serif;
  --f-read:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --read-size:19px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12181b; --surface:#1a2226; --ink:#e3eaeb; --muted:#93a1a6; --line:#2b373b;
  --accent:#7ebdb2; --accent-soft:#1f3735; --on-accent:#0f1a19;
  --again:#e08a7c; --hard:#d6ad5c; --good:#7ebdb2; --shade:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12181b; --surface:#1a2226; --ink:#e3eaeb; --muted:#93a1a6; --line:#2b373b;
  --accent:#7ebdb2; --accent-soft:#1f3735; --on-accent:#0f1a19;
  --again:#e08a7c; --hard:#d6ad5c; --good:#7ebdb2; --shade:rgba(0,0,0,.55); color-scheme:dark}
html[lang="ja"]{--f-ui:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif}

body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 6px}
.lockup{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;letter-spacing:.02em}
.brand h1 span{color:var(--accent)}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.08em}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 12px 11px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}

main{padding-block:20px 120px}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin:0 0 6px}
h2{font-family:var(--f-display);font-size:22px;margin:0 0 4px;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 18px;font-size:14px}

/* reading list */
.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.alist li{border-top:1px solid var(--line)}
.alist li:last-child{border-bottom:1px solid var(--line)}
.alist button{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;padding:16px 4px}
.alist .t{font-family:var(--f-display);font-size:19px;min-width:0}
.alist .s{grid-column:1;color:var(--muted);font-size:13px}
.alist .lv{grid-row:1/3;grid-column:2;align-self:center}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.k-adv{border-color:var(--accent);color:var(--accent)}
.alist .done{color:var(--accent);font-size:12px}

/* reader */
.back{background:none;border:0;color:var(--accent);padding:0;margin-bottom:14px;font-weight:500}
.rhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.reader-title{font-family:var(--f-display);font-size:28px;line-height:1.35;margin:4px 0 4px;text-wrap:balance}
.reader-sub{color:var(--muted);margin:0 0 18px}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:5px 10px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);font-weight:500}
#reader{font-family:var(--f-read);font-size:var(--read-size);line-height:2.15;letter-spacing:.02em}
#reader p{margin:0 0 1.1em}
#reader.vert{writing-mode:vertical-rl;height:min(70vh,560px);overflow-x:auto;overflow-y:hidden;line-height:2;padding:4px 2px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
#reader.vert p{margin:0 0 0 1em}
rt{font-size:.5em;color:var(--muted);font-family:var(--f-ui)}
.fg-none rt{visibility:hidden}
.fg-annot ruby:not(.an) rt{visibility:hidden}
.an{cursor:pointer;text-decoration:underline dotted var(--accent);text-underline-offset:.32em;text-decoration-thickness:1.5px;border-radius:3px}
.an.saved{text-decoration-style:solid}
.an:hover,.an.on{background:var(--accent-soft)}
.letter{white-space:pre-line}
.tip{font-size:13px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:22px 0 0}
.mark-done{margin-top:18px}

/* vocab */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input{flex:1 1 180px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none}
.btn.danger{color:var(--again);border-color:var(--again)}
.vlist{list-style:none;margin:0;padding:0}
.vlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 2px;border-top:1px solid var(--line)}
.vw{font-family:var(--f-read);font-size:20px}
.vr{font-size:13px;color:var(--muted);margin-left:8px;font-family:var(--f-ui)}
.vm{grid-column:1;min-width:0}
.vx{grid-column:1/3;font-family:var(--f-read);color:var(--muted);font-size:14px;min-width:0}
.vside{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.boxpip{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:12px;text-decoration:underline}
.linkbtn.warn{color:var(--again)}
form.add{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:18px}
form.add label,.sheet label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
form.add .full{grid-column:1/-1}
form.add input,form.add textarea,.sheet input,.sheet textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:15px;color:var(--ink)}
form.add .row{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
@media (max-width:480px){form.add{grid-template-columns:1fr}}
.empty{color:var(--muted);padding:24px 0;text-align:center}

/* practice */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:20px}
.stat{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums;font-weight:500}
.stat span{font-size:12px;color:var(--muted)}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent)}
.boxes{display:flex;flex-direction:column;gap:6px;margin:4px 0 22px}
.boxes .r{display:grid;grid-template-columns:64px minmax(0,1fr) 32px;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.boxes .bar{height:8px;background:var(--accent-soft);border-radius:4px;overflow:hidden}
.boxes .bar i{display:block;height:100%;background:var(--accent)}
.boxes .n{text-align:right;font-variant-numeric:tabular-nums}
.card{min-height:280px;border:1px solid var(--line);border-radius:16px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;gap:10px;cursor:pointer;user-select:none}
.card .big{font-family:var(--f-read);font-size:40px;line-height:1.3}
.card .meaning{font-size:20px}
.card .reading{color:var(--accent);font-size:16px}
.card .ex{font-family:var(--f-read);color:var(--muted);font-size:15px;max-width:34em}
.card .hint{color:var(--muted);font-size:12px}
.card.flip{animation:fade .25s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.card.flip{animation:none}}
.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.answers button{padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.answers .a0{color:var(--again)} .answers .a1{color:var(--hard)} .answers .a2{color:var(--good);border-color:var(--good)}
.answers small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.qcount{text-align:center;color:var(--muted);font-size:12px;margin-top:10px;font-variant-numeric:tabular-nums}

/* settings */
.set{display:flex;flex-direction:column}
.set .item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.set .item p{margin:0;font-size:12px;color:var(--muted);grid-column:1}
.set .item .lab{font-weight:500}
.set .item .c{grid-row:1/3;grid-column:2}
.set .stack{grid-template-columns:1fr}
.set .stack .c{grid-row:auto;grid-column:1}
.set input[type=range]{width:140px;accent-color:var(--accent)}
textarea.io{width:100%;min-height:110px;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:ui-monospace,Menlo,monospace;font-size:12px}
.iorow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* today */
.today{margin-bottom:30px}
.todaycard{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
.todaycard:hover{border-color:var(--accent)}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tt{font-family:var(--f-display);font-size:26px;line-height:1.35;text-wrap:balance}
.ts{color:var(--muted);font-size:14px}
.go{color:var(--accent);font-weight:500;font-size:14px}
.dn{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.done{color:var(--accent);font-size:12px}
.newsh{font-size:12px;color:var(--muted);margin:14px 0 6px}
.news{display:flex;flex-wrap:wrap;gap:6px}
.news a{font-size:13px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--surface)}
.news a:hover{border-color:var(--accent);color:var(--accent)}
nav.tabs .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle}
/* speech */
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-4px 0 18px}
.btn{display:inline-flex;align-items:center;gap:6px}
.btn.sm{padding:6px 10px;font-size:13px}
.spk{width:16px;height:16px;flex:none}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent);margin-left:8px;vertical-align:middle;padding:0}
.iconbtn.sm{width:26px;height:26px}.iconbtn.sm .spk{width:13px;height:13px}
.card .iconbtn{margin:0}
.sen{border-radius:4px;transition:background-color .2s}
.sen.reading{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
@media (prefers-reduced-motion:reduce){.sen{transition:none}}
.whead{display:flex;align-items:center;flex-wrap:wrap}
.sheet .row.left{justify-content:flex-start}
.sel{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:200px}
/* sheet & floating */
.scrim{position:fixed;inset:0;background:var(--shade);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px var(--shade);max-height:80vh;overflow-y:auto}
.sheet .wrap{padding-block:18px 0;display:flex;flex-direction:column;gap:10px}
.sheet .w{font-family:var(--f-read);font-size:30px;line-height:1.3}
.sheet .r{color:var(--accent);margin-left:10px;font-size:16px;font-family:var(--f-ui)}
.sheet .m{font-size:17px}
.sheet .n{font-size:13px;color:var(--muted)}
.sheet .ex{font-family:var(--f-read);font-size:15px;color:var(--muted);border-left:2px solid var(--accent-soft);padding-left:10px}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.selbtn{position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:11px 18px;font-weight:500;box-shadow:0 6px 20px var(--shade);max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:13px}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><div class="lockup"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--ink)"/><path d="M9 21 Q20 16.5 31 20.5 V45 Q20 41 9 45.5 Z M33 20.5 Q44 16.5 55 21 V45.5 Q44 41 33 45 Z" fill="var(--paper)"/><path d="M13 26 Q20 23.5 27 25.5 M13 31 Q20 28.5 27 30.5 M37 25.5 Q44 23.5 51 26 M37 30.5 Q44 28.5 51 31" stroke="var(--line)" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M29.5 17 H34.5 V55 L32 51.6 L29.5 55 Z" fill="var(--accent)"/></svg><h1>栞 <span>Shiori</span></h1></div><small id="brandSub"></small></div>
  <nav class="tabs" id="tabs"></nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="layer"></div>

<script>
/* ---------- content ---------- */
const ARTICLES=[
{id:"sento",lv:"n3",genre:{"zh-Hant":"日常","ja":"くらし"},title:"はじめての銭湯",sub:"第一次去澡堂",
body:`近所に古い[[銭湯|せんとう]]がある。先週、はじめて行ってみた。入り口で[[料金|りょうきん]]を払うと、おばあさんが「タオルは持ってる？」と聞いてくれた。

お湯はとても熱かったけれど、[[壁|かべ]]に{描|か}かれた富士山の絵を見ながら入ると、[[気持ち|きもち]]がよかった。となりのおじいさんが「どこから来たの？」と[[話しかけて|はなしかけて]]くれて、台湾の話を少しした。

帰り道、体が[[ぽかぽか|ぽかぽか]]していた。また来週も行こうと思う。`,
gloss:{"銭湯":{m:"公共澡堂"},"料金":{m:"費用、價錢"},"壁":{m:"牆壁"},"気持ち":{m:"心情、感覺",n:"「気持ちがいい」＝很舒服。"},"話しかけて":{m:"搭話（原形：話しかける）"},"ぽかぽか":{m:"暖呼呼的"}}},

{id:"oden",lv:"n3",genre:{"zh-Hant":"飲食","ja":"たべもの"},title:"コンビニのおでん",sub:"便利商店的關東煮",
body:`日本のコンビニでは、秋になると[[おでん|おでん]]を売りはじめる。レジの{横|よこ}に大きな[[鍋|なべ]]があって、自分で好きな[[具|ぐ]]を選ぶ。

私のお気に入りは、[[大根|だいこん]]と[[卵|たまご]]だ。台湾のコンビニにも「関東煮」があるけれど、[[味|あじ]]は少し違う。日本のほうが[[だし|だし]]の味が強い気がする。

寒い日の帰り道に食べるおでんは、小さな[[ご褒美|ごほうび]]だ。`,
gloss:{"おでん":{m:"關東煮"},"鍋":{m:"鍋子"},"具":{m:"料、配料"},"大根":{m:"白蘿蔔"},"卵":{m:"蛋"},"味":{m:"味道"},"だし":{m:"高湯（柴魚、昆布熬的湯底）"},"ご褒美":{m:"獎勵、犒賞自己"}}},
{id:"kanji",lv:"n2",genre:{"zh-Hant":"專欄","ja":"コラム"},title:"同じ漢字、違う意味",sub:"同一個漢字，不同的意思",
body:`台湾から日本に来たばかりの頃、大学の[[掲示板|けいじばん]]に「{本日|ほんじつ}の授業は[[休講|きゅうこう]]」と書いてあって、一瞬だけ戸惑った。漢字を見れば意味はだいたい分かる。けれど、分かったつもりになるのがいちばん危ない。

友人に「この前は[[迷惑|めいわく]]をかけてごめんね」と言われたとき、私は「迷惑」を中国語の「困惑」に近い言葉だと思い込んでいた。日本語の「迷惑」は、相手に面倒をかけることだ。[[勘違い|かんちがい]]に気づいたのは、ずいぶん後になってからだった。

漢字という[[共通点|きょうつうてん]]は、[[近道|ちかみち]]であると同時に[[落とし穴|おとしあな]]でもある。{似|に}ている言葉ほど、一度立ち止まって辞書を引く。それが、二つの言語のあいだで暮らす人の、ささやかな[[知恵|ちえ]]なのかもしれない。`,
gloss:{"掲示板":{m:"公告欄、布告欄"},"休講":{m:"停課（課程臨時取消）"},"迷惑":{m:"給人添麻煩；困擾",n:"中文「迷惑」是困惑不解，日文是「麻煩到別人」。"},"勘違い":{m:"誤會、搞錯"},"共通点":{m:"共同點"},"近道":{m:"捷徑"},"落とし穴":{m:"陷阱"},"知恵":{m:"智慧、生活中的巧思"}}},

{id:"yonaga",lv:"n1",genre:{"zh-Hant":"季節的詞","ja":"季節のことば"},title:"秋の夜長",sub:"秋夜漫長",
body:`[[立秋|りっしゅう]]を過ぎても、東京の暑さはなかなか{引|ひ}かない。それでも十月に入ると、{日|ひ}が{暮|く}れるのがはっきりと早くなる。俳句の世界では、この{頃|ころ}を「[[夜長|よなが]]」と呼ぶ。夜が長いことを[[嘆く|なげく]]のではなく、むしろ[[味わう|あじわう]]ための言葉だ。

[[虫の音|むしのね]]を聞きながら本を読む。温かいほうじ茶を{淹|い}れる。誰かに手紙を書く。そんな[[ささやかな|ささやかな]]時間こそが、秋という季節の[[醍醐味|だいごみ]]なのだろう。

ちなみに「[[灯火親しむ|とうかしたしむ]]」という[[季語|きご]]もある。{灯|あか}りの下で読書を楽しむのにふさわしい季節、という意味だ。今夜は少しだけ早く[[家路|いえじ]]につこうか。`,
gloss:{"立秋":{m:"立秋（節氣）"},"夜長":{m:"秋夜漫長",n:"秋季的季語。"},"嘆く":{m:"嘆息、悲嘆"},"味わう":{m:"品味、細細體會"},"虫の音":{m:"蟲鳴聲"},"ささやかな":{m:"小小的、不起眼卻珍貴的"},"醍醐味":{m:"真正的樂趣、精髓"},"灯火親しむ":{m:"適合燈下讀書的時節",n:"秋季季語，典出韓愈〈符讀書城南〉「燈火稍可親」。"},"季語":{m:"季語（俳句中表示季節的詞）"},"家路":{m:"回家的路"}}},

{id:"mail",lv:"n2",genre:{"zh-Hant":"商務書信","ja":"ビジネスメール"},title:"お見積書送付の件",sub:"寄送報價單",letter:true,
body:`株式会社みどり書房
営業部　佐藤様

いつも大変お世話になっております。台北デザイン事務所の林でございます。
先日は[[お忙しいところ|おいそがしいところ]]、打ち合わせのお時間をいただき、{誠|まこと}にありがとうございました。

ご依頼いただいておりました[[お見積書|おみつもりしょ]]を[[添付|てんぷ]]にてお送りいたします。[[ご査収|ごさしゅう]]のほど、よろしくお願い申し上げます。

なお、[[納期|のうき]]につきましては、正式なご[[発注|はっちゅう]]をいただいてから約三週間を予定しております。ご不明な点がございましたら、[[お気軽に|おきがるに]]お[[申し付け|もうしつけ]]ください。

引き続きどうぞよろしくお願いいたします。`,
gloss:{"お忙しいところ":{m:"在您百忙之中"},"お見積書":{m:"報價單"},"添付":{m:"附件、附上"},"ご査収":{m:"請查收",n:"寄送文件時的固定商務用語。"},"納期":{m:"交期、交貨期限"},"発注":{m:"下訂單"},"お気軽に":{m:"請別客氣、隨時"},"申し付け":{m:"吩咐、交代",n:"「お申し付けください」＝請儘管吩咐。"}}},

{id:"shoten",lv:"n1",genre:{"zh-Hant":"新聞","ja":"ニュース"},title:"町の本屋が消えていく",sub:"街角書店正在消失",
body:`全国の書店の数は、この二十年あまりで[[半減|はんげん]]したと言われる。[[ネット通販|ネットつうはん]]や電子書籍の[[普及|ふきゅう]]に加え、人口減少も[[追い打ち|おいうち]]をかけた。書店が一軒もない自治体も、もはや[[珍しく|めずらしく]]ない。

一方で、新しい形の本屋も生まれている。店主が選んだ本だけを並べる小さな「[[独立系書店|どくりつけいしょてん]]」や、本棚の{一区画|ひとくかく}を個人に貸し出す「[[シェア型書店|シェアがたしょてん]]」だ。売り上げだけを見れば[[採算|さいさん]]は厳しい。それでも、人と本が[[偶然|ぐうぜん]]出会える場所を残したいという思いが、各地で静かに広がっている。`,
gloss:{"半減":{m:"減半"},"ネット通販":{m:"網購"},"普及":{m:"普及"},"追い打ち":{m:"雪上加霜",n:"「追い打ちをかける」＝落井下石、雪上加霜。"},"珍しく":{m:"罕見、稀奇（原形：珍しい）"},"独立系書店":{m:"獨立書店"},"シェア型書店":{m:"共享書架型書店",n:"個人承租一格書櫃，擺自己選的書來賣。"},"採算":{m:"收支平衡、划不划算"},"偶然":{m:"偶然"}}},

{id:"shuden",lv:"n2",genre:{"zh-Hant":"短篇","ja":"掌編"},title:"終電のあと",sub:"末班車之後",
body:`[[終電|しゅうでん]]を[[逃した|のがした]]のは、これで二度目だった。

駅前のロータリーには、タクシーを待つ人の列が[[ぼんやり|ぼんやり]]と{伸|の}びている。私はその列には{並|なら}ばず、コンビニで温かい缶コーヒーを買って、[[歩道橋|ほどうきょう]]の上に立った。

{眼下|がんか}を流れる車の{光|ひかり}は、台北の夜とどこか似ていた。違うのは、[[屋台|やたい]]の匂いがしないことくらいだ。

「帰りたい」と思った。けれど、どこへ帰りたいのか、自分でもよく分からなかった。缶コーヒーが[[ぬるく|ぬるく]]なるまで、私はそこに[[立ち尽くして|たちつくして]]いた。`,
gloss:{"終電":{m:"末班電車"},"逃した":{m:"錯過（原形：逃す）"},"ぼんやり":{m:"模模糊糊、朦朧"},"歩道橋":{m:"天橋（行人陸橋）"},"屋台":{m:"路邊攤、攤販"},"ぬるく":{m:"變得溫溫的、不冷不熱（原形：ぬるい）"},"立ち尽くして":{m:"呆立良久（原形：立ち尽くす）"}}},
{id:"kuki",lv:"pro",genre:{"zh-Hant":"評論","ja":"評論"},title:"「空気を読む」ということ",sub:"所謂「察言觀色」",
body:`日本で暮らしていると、「空気を読む」という言葉に何度も出会う。会議で誰も反対しないのは、全員が賛成しているからではない。反対を口にすることで場が[[気まずく|きまずく]]なるのを避けているだけ、ということも少なくない。

もちろん、相手の気持ちを[[察する|さっする]]力は、[[円滑|えんかつ]]な人間関係に欠かせない。しかしそれが行き過ぎると、[[同調圧力|どうちょうあつりょく]]となって個人の判断を[[縛る|しばる]]。上の立場の人の{意向|いこう}を先回りして[[忖度|そんたく]]するうちに、本来の目的が見失われ、手続きだけが[[形骸化|けいがいか]]していく。

[[逆説的|ぎゃくせつてき]]だが、本当に空気を読める人とは、あえて空気を読まない勇気を持つ人なのかもしれない。{沈黙|ちんもく}が[[暗黙の了解|あんもくのりょうかい]]と[[見なされる|みなされる]]場で、「本当にそれでいいのでしょうか」と問うこと。その一言の[[重み|おもみ]]を、[[一概に|いちがいに]][[軽んじる|かろんじる]]べきではないだろう。`,
gloss:{"気まずく":{m:"尷尬（原形：気まずい）"},"察する":{m:"體察、揣測（對方心意）"},"円滑":{m:"順暢、圓融"},"同調圧力":{m:"從眾壓力、同儕壓力"},"縛る":{m:"束縛、綁住"},"忖度":{m:"揣摩上意",n:"原意是推測他人心思，近年多指「看上面臉色主動行事」。"},"形骸化":{m:"流於形式、徒具形式"},"逆説的":{m:"弔詭地、看似矛盾地"},"暗黙の了解":{m:"心照不宣的默契"},"見なされる":{m:"被視為"},"重み":{m:"分量、份量"},"一概に":{m:"一概",n:"多接否定：一概に～とは言えない。"},"軽んじる":{m:"輕視"}}},

{id:"shasetsu",lv:"pro",genre:{"zh-Hant":"社論","ja":"社説"},title:"働き方改革の陰で",sub:"「工作方式改革」的陰影",
body:`長時間労働の[[是正|ぜせい]]を[[掲げた|かかげた]]「働き方改革」が始まって久しい。残業時間には上限が設けられ、[[有給休暇|ゆうきゅうきゅうか]]の取得も[[義務付け|ぎむづけ]]られた。数字の上では、一定の成果が上がったと言えよう。

だが、現場の実感は必ずしもそうではない。仕事の量が変わらないまま時間だけが[[削られ|けずられ]]、持ち帰り残業や[[サービス残業|サービスざんぎょう]]で[[帳尻を合わせる|ちょうじりをあわせる]]例も後を絶たない。管理職に負担が[[しわ寄せ|しわよせ]]される[[弊害|へいがい]]も指摘されている。

制度を整えるだけでは[[看板倒れ|かんばんだおれ]]に終わりかねない。業務そのものを見直す[[抜本的|ばっぽんてき]]な取り組みと、それを[[検証|けんしょう]]する仕組みこそが[[喫緊|きっきん]]の課題である。`,
gloss:{"是正":{m:"矯正、導正"},"掲げた":{m:"標舉（口號、目標）（原形：掲げる）"},"有給休暇":{m:"帶薪休假"},"義務付け":{m:"規定為義務（義務付ける）"},"削られ":{m:"被削減（原形：削る）"},"サービス残業":{m:"無償加班"},"帳尻を合わせる":{m:"把帳湊平；勉強交差"},"しわ寄せ":{m:"負擔被轉嫁（到弱勢一方）"},"弊害":{m:"弊端"},"看板倒れ":{m:"名不副實、徒有其名"},"抜本的":{m:"根本性的、徹底的"},"検証":{m:"驗證、檢討"},"喫緊":{m:"迫切、當務之急"}}},

{id:"kansai",lv:"pro",genre:{"zh-Hant":"方言","ja":"方言"},title:"なんぼしたん？",sub:"關西腔對話",letter:true,
body:`「あんた、それ[[なんぼ|なんぼ]]したん？」
「三千円やったかな」
「[[高っ|たかっ]]！ そんなん、うちの近所[[やったら|やったら]]半額で売ってるで」
「[[ほんまに|ほんまに]]？ [[ほな|ほな]]今度連れてってや」
「ええよ。[[せやけど|せやけど]]、あそこの[[おっちゃん|おっちゃん]]話長いから[[覚悟しときや|かくごしときや]]」`,
gloss:{"なんぼ":{m:"多少（錢）",n:"標準語：いくら。「～したん？」＝「～したの？」"},"高っ":{m:"好貴！",n:"形容詞去掉「い」加促音，口語感嘆。"},"やったら":{m:"如果是…的話",n:"標準語：だったら。關西腔「だ」→「や」。"},"ほんまに":{m:"真的嗎",n:"標準語：本当に。"},"ほな":{m:"那麼",n:"標準語：それなら。"},"せやけど":{m:"可是、不過",n:"標準語：そうだけど。"},"おっちゃん":{m:"大叔",n:"標準語：おじさん。"},"覚悟しときや":{m:"要有心理準備喔",n:"＝覚悟しておきなさい。「～とき」＝「～ておき」。"}}},

{id:"kusamakura",lv:"pro",genre:{"zh-Hant":"文學原文","ja":"文学（原文）"},title:"草枕（冒頭）",sub:"夏目漱石《草枕》開頭（1906）",
body:`[[山路|やまみち]]を登りながら、こう考えた。

[[智に働けば角が立つ|ちにはたらけばかどがたつ]]。[[情に棹させば|じょうにさおさせば]]流される。[[意地を通せば|いじをとおせば]][[窮屈|きゅうくつ]]だ。[[とかくに|とかくに]]人の世は住みにくい。

住みにくさが[[高じる|こうじる]]と、安い所へ引き越したくなる。どこへ越しても住みにくいと[[悟った|さとった]]時、詩が{生|うま}れて、{画|え}が{出来|でき}る。`,
gloss:{"山路":{m:"山路"},"智に働けば角が立つ":{m:"太講理，就會與人起衝突"},"情に棹させば":{m:"太順著感情走（就會被沖走）",n:"「棹さす」原意是撐篙順流而行；現代常被誤用成「逆流」。"},"意地を通せば":{m:"堅持己見的話"},"窮屈":{m:"拘束、侷促、不自在"},"とかくに":{m:"總之、反正（古風）"},"高じる":{m:"加劇、越來越嚴重"},"悟った":{m:"領悟（原形：悟る）"}}},

{id:"kumo",lv:"n1",genre:{"zh-Hant":"文學原文","ja":"文学（原文）"},title:"蜘蛛の糸（冒頭）",sub:"芥川龍之介《蜘蛛之絲》開頭（1918）",
body:`ある日の事でございます。[[御釈迦様|おしゃかさま]]は[[極楽|ごくらく]]の[[蓮池|はすいけ]]のふちを、独りで[[ぶらぶら|ぶらぶら]][[御歩きになっていらっしゃいました|おあるきになっていらっしゃいました]]。

池の中に咲いている{蓮|はす}の花は、みんな{玉|たま}のようにまっ白で、そのまん中にある金色の[[蕊|ずい]]からは、[[何とも云えない|なんともいえない]]好い{匂|におい}が、[[絶間なく|たえまなく]]あたりへ[[溢れて|あふれて]][[居ります|おります]]。極楽は{丁度|ちょうど}朝なのでございましょう。`,
gloss:{"御釈迦様":{m:"釋迦牟尼佛"},"極楽":{m:"極樂世界"},"蓮池":{m:"蓮花池"},"ぶらぶら":{m:"悠閒地散步"},"御歩きになっていらっしゃいました":{m:"（佛祖）正在散步",n:"「お～になる」加「いらっしゃる」的雙重尊敬語，是說書人口吻。"},"蕊":{m:"花蕊"},"何とも云えない":{m:"難以言喻",n:"「云う」是「言う」的舊寫法。"},"絶間なく":{m:"不間斷地"},"溢れて":{m:"滿溢（原形：溢れる）"},"居ります":{m:"＝おります（いる的謙讓／鄭重語）"}}},
{id:"makura",lv:"x",genre:{"zh-Hant":"古典","ja":"古典"},title:"枕草子・秋は夕暮れ",sub:"清少納言《枕草子》第一段（秋）",
body:`秋は[[夕暮れ|ゆうぐれ]]。夕日のさして[[山の端|やまのは]][[いと|いと]][[近うなりたる|ちこうなりたる]]に、{烏|からす}の[[寝どころ|ねどころ]]へ行くとて、三つ四つ、二つ三つなど[[飛び急ぐ|とびいそぐ]]さへ[[あはれなり|あはれなり]]。[[まいて|まいて]][[雁|かり]]などの[[連ねたる|つらねたる]]が、いと小さく見ゆるは、いと[[をかし|をかし]]。

[[日入り果てて|ひいりはてて]]、風の音、虫の音など、はた[[言ふべきにあらず|いうべきにあらず]]。`,
gloss:{"夕暮れ":{m:"黃昏、傍晚"},"山の端":{m:"山稜線"},"いと":{m:"非常、很（古語）"},"近うなりたる":{m:"變近了",n:"現代語：近くなった。"},"寝どころ":{m:"歸巢處、睡覺的地方"},"飛び急ぐ":{m:"急急飛去"},"あはれなり":{m:"令人動容、深有感觸（古語）",n:"「さへ」＝連…都。"},"まいて":{m:"更何況",n:"現代語：まして。"},"雁":{m:"雁"},"連ねたる":{m:"排成一列的"},"をかし":{m:"有趣、雅致（古語）",n:"與「あはれ」並列為平安文學兩大美感。"},"日入り果てて":{m:"太陽完全落下之後"},"言ふべきにあらず":{m:"無法言喻",n:"「はた」＝更是、又。"}}}
];

{d:0,lv:"pro",g:"es",t:"「栞」という字",s:"「栞」這個字",
b:`「栞」は、もともと「[[枝折り|しおり]]」と書いた。山道を行く人が、帰り道に迷わないよう、木の枝を折って[[目印|めじるし]]にした。それが[[転じて|てんじて]]、読みかけの本に挟む紙を指すようになったという。

だから栞は、ただ「どこまで読んだか」を示すだけのものではない。知らない森に分け入った人が、自分の来た道を[[振り返る|ふりかえる]]ための[[手がかり|てがかり]]でもある。

新しい言葉を一つ覚えるたびに、心の中で小さな枝を折る。百日後、振り返ったときに、その枝が[[点々|てんてん]]と道になっていたら[[素敵|すてき]]だと思う。今日から、一日一編。[[気負わず|きおわず]]に、どうぞ。`,
gl:{"枝折り":["折枝（做記號）","「栞」的語源。古時在山路折樹枝當路標。"],"目印":"記號、標誌","転じて":"引申為（原形：転じる）","振り返る":"回顧、回頭看","手がかり":"線索、憑藉","点々":"點點、零星分布","素敵":"很棒、美好","気負わず":["不必太用力、輕鬆地","原形：気負う＝幹勁過頭、逞強。"]}},

{d:1,lv:"n1",g:"ff",t:"「愛人」に気をつけて",s:"同字異義①：愛人、大家、小人",
b:`台湾の友人が日本人の同僚に「こちらは私の愛人です」と夫を紹介して、場が[[凍りついた|こおりついた]]という話がある。中国語の「愛人」は配偶者を指す地域もあるが、日本語ではほぼ[[例外なく|れいがいなく]]「不倫相手」の意味になる。

似たような[[落とし穴|おとしあな]]はほかにもある。日本語の「大家」は、たいてい「[[おおや|おおや]]」と読んで、アパートの[[家主|やぬし]]のこと。「たいか」と読めば、その道の[[第一人者|だいいちにんしゃ]]を指す。また「小人」は「こびと」と読めば童話の[[登場人物|とうじょうじんぶつ]]だが、遊園地の料金表では「しょうにん」、つまり子ども料金のことだ。

漢字が読めるからこそ、読み方と[[文脈|ぶんみゃく]]に注意したい。`,
gl:{"凍りついた":"（氣氛）凍結、僵住","例外なく":"毫無例外","落とし穴":"陷阱","おおや":["房東","寫作「大家」。"],"家主":"屋主、房東","第一人者":"第一把交椅、權威","登場人物":"登場人物、角色","文脈":"上下文、脈絡"}},

{d:2,lv:"pro",g:"dl",t:"なんしようと？",s:"博多腔對話",l:1,
b:`「[[なんしようと|なんしようと]]？」
「明日の発表の準備。[[ばり|ばり]]焦っとう」
「[[よかよか|よかよか]]、あんたなら[[なんとかなるっちゃない|なんとかなるっちゃない]]？」
「そげん簡単に言わんで。資料、まだ半分も[[できとらん|できとらん]]と」
「[[しょんなか|しょんなか]]ねえ。ラーメン[[おごっちゃるけん|おごっちゃるけん]]、[[がんばらんね|がんばらんね]]」`,

{d:3,lv:"x",g:"hk",t:"百人一首・秋の歌",s:"《百人一首》中的秋歌",l:1,src:"『小倉百人一首』（猿丸大夫・在原業平）",
b:`[[奥山|おくやま]]に　[[紅葉|もみじ]][[踏み分け|ふみわけ]]　鳴く鹿の
声聞く時ぞ　秋は悲しき
（猿丸大夫）

[[ちはやぶる|ちはやぶる]]　[[神代|かみよ]]も聞かず　[[竜田川|たつたがわ]]
[[からくれなゐ|からくれない]]に　水[[くくる|くくる]]とは
（在原業平）

一首目は、深い山の中で、落ち葉を踏みながら鳴く鹿の声に秋の[[寂しさ|さびしさ]]を聞く歌。二首目は、川面を[[埋め尽くす|うめつくす]]紅葉を、真紅に染め上げた布に[[見立てた|みたてた]]、[[華やかな|はなやかな]]歌である。`,
gl:{"奥山":"深山","紅葉":["紅葉","古文中「もみぢ」，此處讀「もみじ」。"],"踏み分け":"撥開、踩過（落葉）","ちはやぶる":["（枕詞）修飾「神」","枕詞本身沒有實際意思，用來引出特定詞語。"],"神代":"神的時代、太古","竜田川":"龍田川（奈良的紅葉名勝）","からくれなゐ":["深紅色","「韓紅」，歷史假名讀作「からくれない」。"],"くくる":["紮染","把布紮起來染色，比喻紅葉漂滿河面。"],"寂しさ":"寂寞、冷清","埋め尽くす":"填滿、覆滿","見立てた":["比作（原形：見立てる）","日本和歌與庭園常用的手法。"],"華やかな":"華麗的"}},

{d:4,lv:"n1",g:"ki",t:"霜降",s:"節氣：霜降",
b:`二十四[[節気|せっき]]の「霜降」は、[[露|つゆ]]が霜に変わり始める頃を言う。暦の上では秋の最後の節気で、これが過ぎると、もう立冬である。

実際には、東京で霜が降りるのはまだずっと先のことだ。それでも、朝晩の[[冷え込み|ひえこみ]]は日ごとに[[厳しく|きびしく]]なり、山では紅葉が[[見頃|みごろ]]を迎える。[[衣替え|ころもがえ]]を済ませていない人は、そろそろ冬物を出しておこう。

台湾で暮らしていた人にとっては、「霜」という字そのものが、どこか遠い国の言葉のように感じられるかもしれない。息が白くなる最初の朝は、もうすぐそこまで来ている。`,
gl:{"節気":"節氣","露":"露水","冷え込み":"（氣溫）驟降、寒意","厳しく":"嚴峻、嚴寒（原形：厳しい）","見頃":"最佳觀賞期","衣替え":["換季（整理衣櫃）","傳統上是6月1日與10月1日。"]}},

{d:5,lv:"pro",g:"bz",t:"「させていただきます」の功罪",s:"「させていただく」的功與過",
b:`「本日の司会を[[務めさせていただきます|つとめさせていただきます]]」「資料を[[拝見させていただきました|はいけんさせていただきました]]」――ビジネスの場で、この表現を聞かない日はない。

本来、「させていただく」は、相手の[[許可|きょか]]や[[恩恵|おんけい]]を受けて何かをする、という意味だ。だから「お休みをいただいて、旅行に行かせていただきます」には、ちゃんと理由がある。

一方、相手の許可と関係のない場面で使うと、[[過剰|かじょう]]な、時に[[卑屈|ひくつ]]な印象を与える。「拝見させていただく」に至っては、「拝見する」自体がすでに[[謙譲語|けんじょうご]]なので、[[二重敬語|にじゅうけいご]]だと[[指摘|してき]]されることもある。迷ったら「務めます」「拝見しました」で十分だ。`,
gl:{"務めさせていただきます":"請容我擔任","拝見させていただきました":["拜讀了","常被認為是重複謙讓。"],"許可":"許可、同意","恩恵":"恩惠","過剰":"過度","卑屈":"卑躬屈膝、自卑","謙譲語":"謙讓語","二重敬語":"雙重敬語（冗贅敬語）","指摘":"指出"}},

{d:6,lv:"pro",g:"co",t:"「とりあえずビール」",s:"「先來杯啤酒」",
b:`居酒屋で全員がそろうと、誰かが「とりあえずビールで」と言う。メニューを[[開く|ひらく]]前に、最初の一杯が[[決まって|きまって]]しまう。この[[お決まり|おきまり]]の一言には、日本の[[集団|しゅうだん]]文化がよく表れている。

まず、全員で同じものを頼めば、注文がすぐに[[済む|すむ]]。[[乾杯|かんぱい]]も早くできる。何より、最初の一杯で個人の好みを[[主張|しゅちょう]]しない、という[[暗黙|あんもく]]の[[配慮|はいりょ]]がある。

ただ、最近はこの[[慣習|かんしゅう]]も変わりつつある。お酒を飲まない人、最初から[[ハイボール|ハイボール]]を頼む人も増え、「とりあえず」に[[縛られない|しばられない]]空気が広がっている。良くも悪くも、乾杯の[[風景|ふうけい]]は少しずつ多様になっているようだ。`,
gl:{"開く":"打開","決まって":"就這樣決定了","お決まり":"老套、慣例的","集団":"集體、團體","済む":"完成、了事","乾杯":"乾杯","主張":"主張、堅持","暗黙":"默然、不言明","配慮":"顧慮、體貼","慣習":"慣例、習俗","ハイボール":"威士忌蘇打（Highball）","縛られない":"不受束縛","風景":"風景、光景"}},

{d:7,lv:"n1",g:"lt",t:"吾輩は猫である（冒頭）",s:"夏目漱石《我是貓》開頭（1905）",src:"青空文庫（夏目漱石『吾輩は猫である』）",
b:`[[吾輩|わがはい]]は猫である。名前はまだ無い。

どこで生れたか[[とんと|とんと]][[見当|けんとう]]がつかぬ。何でも[[薄暗い|うすぐらい]][[じめじめ|じめじめ]]した所でニャーニャー泣いていた事だけは記憶している。`,
gl:{"吾輩":["吾輩、本大爺","自稱，帶有自大、裝腔作勢的語氣。由貓來說，形成幽默反差。"],"とんと":["完全（不）","後接否定。古風說法。"],"見当":["頭緒、推測","「見当がつかぬ」＝完全想不出來。「ぬ」＝ない。"],"薄暗い":"昏暗","じめじめ":"潮濕陰暗"}},

{d:8,lv:"pro",g:"tw",t:"「便當」と「弁当」",s:"便當與弁当",
b:`台湾で「便當」と言えば、温かいご飯に[[排骨|パイコー]]や[[鶏腿|ジートゥイ]]がのった、[[ボリューム|ボリューム]]のある食事を思い浮かべる人が多いだろう。一方、日本の弁当は、[[冷めて|さめて]]も[[美味しく|おいしく]]食べられるように作られている。

この違いは、[[蒸し器|むしき]]や電子レンジで温め直す文化と、作り置きを冷たいまま食べる文化の差でもある。日本の弁当に[[酢|す]]や梅干し、[[濃いめ|こいめ]]の味付けが多いのは、[[傷み|いたみ]]にくくするための[[工夫|くふう]]だ。

ちなみに、台湾の「便當」という言葉自体が、日本統治時代に日本語から入ったものだとされている。同じ言葉が、海を[[隔てて|へだてて]]別の[[味|あじ]]に育ったわけだ。`,
gl:{"排骨":"排骨","鶏腿":"雞腿","ボリューム":"份量","冷めて":"變涼、冷掉（原形：冷める）","美味しく":"美味","蒸し器":"蒸籠、蒸鍋","酢":"醋","濃いめ":"偏濃","傷み":"（食物）腐壞","工夫":["巧思、下功夫","中文「工夫」偏指時間或功夫。"],"隔てて":"隔著","味":"味道"}},

{d:9,lv:"pro",g:"ne",t:"キャッシュレスは進んだのか",s:"時事解說：無現金支付",
b:`日本は長く「現金大国」と呼ばれてきた。治安が良く、[[偽札|にせさつ]]が少なく、ATM がどこにでもある。現金を持ち歩くことに[[不便|ふべん]]も不安も感じにくい社会だった。

その状況は、ここ数年で大きく変わった。スマートフォンの[[QRコード決済|キューアールコードけっさい]]が[[急速|きゅうそく]]に普及し、小さな商店でもカードや電子マネーが使えることが[[珍しくなくなった|めずらしくなくなった]]。政府による[[ポイント還元|ポイントかんげん]]などの[[後押し|あとおし]]や、感染症の流行で「非接触」が求められたことも、変化を[[加速|かそく]]させた。

ただし、[[手数料|てすうりょう]]の負担に悩む小規模店や、操作に慣れない高齢者など、取り残される側の声もある。便利さの[[陰|かげ]]で誰が負担しているのか、という問いは残る。`,
gl:{"偽札":"偽鈔","不便":"不方便","QRコード決済":"QR code 支付","急速":"快速、迅速","珍しくなくなった":"不再稀奇","ポイント還元":"點數回饋","後押し":"推動、支持","加速":"加速","手数料":"手續費","陰":"背後、陰影"}}
);

{d:10,lv:"n1",g:"fi",t:"もみじの手紙",s:"掌篇：紅葉的信",
b:`祖母から[[封筒|ふうとう]]が届いた。[[便箋|びんせん]]は一枚だけで、「庭の[[楓|かえで]]が今年もきれいです」と、少し[[震えた|ふるえた]]字で書いてあった。

封筒の底に、赤い葉が一枚入っていた。[[押し葉|おしば]]にしたのだろう、薄く、平らで、光に[[かざす|かざす]]と[[葉脈|ようみゃく]]が細かく[[透けて|すけて]]見えた。

電話ならすぐに話せる。写真なら、もっと[[鮮やか|あざやか]]な色を送れる。それでも祖母は、毎年この季節になると、一枚の葉を[[わざわざ|わざわざ]]紙に包んで送ってくる。

私はその葉を、読みかけの本に挟んだ。今年の秋が、そこで[[止まって|とまって]]くれるような気がした。`,
gl:{"封筒":"信封","便箋":"信紙","楓":"楓樹","震えた":"顫抖的（原形：震える）","押し葉":"壓葉標本","かざす":"舉起（對著光）","葉脈":"葉脈","透けて":"透出來、看得透（原形：透ける）","鮮やか":"鮮豔、鮮明","わざわざ":"特地、專程","止まって":"停住"}},

{d:11,lv:"pro",g:"wd",t:"雨の音はいくつある？",s:"擬聲擬態語：雨",
b:`日本語は[[オノマトペ|オノマトペ]]が豊かな言語だと言われる。雨ひとつとっても、その降り方を[[言い分ける|いいわける]]言葉がいくつもある。

「[[しとしと|しとしと]]」は、静かに、細かく、長く降り続ける雨。梅雨の雨の[[典型|てんけい]]だ。「[[ぱらぱら|ぱらぱら]]」は、[[まばら|まばら]]に降り始めた雨。「[[ざあざあ|ざあざあ]]」は、音を立てて激しく降る雨で、「[[どしゃ降り|どしゃぶり]]」とも言う。

雨そのものではなく、雨が[[もたらす|もたらす]]空気を表す言葉もある。「[[じめじめ|じめじめ]]」は湿気が多くて不快な様子、「[[しっとり|しっとり]]」は適度な湿り気があって落ち着いた様子だ。同じ湿気でも、評価が[[正反対|せいはんたい]]なのが面白い。

中国語なら「毛毛雨」「傾盆大雨」と漢字で描くところを、日本語は音で描く。[[耳|みみ]]で読む言語、と言えるかもしれない。`,
gl:{"オノマトペ":"擬聲擬態語（onomatopoeia）","言い分ける":"分別使用不同說法","しとしと":"淅淅瀝瀝（綿綿細雨）","典型":"典型","ぱらぱら":"稀稀落落","まばら":"稀疏、零星","ざあざあ":"嘩啦嘩啦（大雨）","どしゃ降り":"傾盆大雨","もたらす":"帶來","じめじめ":"潮濕黏膩（負面）","しっとり":"濕潤、溫潤沉靜（正面）","正反対":"完全相反","耳":"耳朵"}},

{d:12,lv:"n1",g:"co",t:"渋谷のハロウィン",s:"澀谷的萬聖節",
b:`十月三十一日の夜、東京の渋谷には、[[仮装|かそう]]した若者たちが集まる。かつては[[スクランブル交差点|スクランブルこうさてん]]が人で埋まり、テレビの[[中継|ちゅうけい]]も入るほどの「名物」だった。

しかし、[[混雑|こんざつ]]に[[乗じた|じょうじた]][[騒動|そうどう]]やごみの問題が続き、近年は区が「ハロウィン目的で渋谷に来ないで」と呼びかけるようになった。路上での飲酒を[[規制|きせい]]する[[条例|じょうれい]]もできた。

もともと日本のハロウィンは、宗教的な意味よりも「仮装して楽しむ日」として広まったものだ。商業的なイベントとして[[定着|ていちゃく]]した一方、[[大勢|おおぜい]]が集まること自体が目的になってしまった面もある。祭りと[[迷惑|めいわく]]の[[境目|さかいめ]]はどこにあるのか、毎年のように議論になる。`,
gl:{"仮装":"變裝、扮裝","スクランブル交差点":"全向十字路口（澀谷大十字路口）","中継":"實況轉播","混雑":"擁擠","乗じた":"趁著（原形：乗じる）","騒動":"騷動、騷亂","規制":"管制、限制","条例":"（地方）條例","定着":"紮根、固定下來","大勢":"大批人","迷惑":["給人添麻煩","和中文「迷惑」意思不同。"],"境目":"分界、界線"}},

{d:13,lv:"x",g:"cl",t:"方丈記（冒頭）",s:"鴨長明《方丈記》開頭（1212）",src:"鴨長明『方丈記』",
b:`ゆく河の流れは[[絶えずして|たえずして]]、しかも[[もとの水にあらず|もとのみずにあらず]]。[[よどみ|よどみ]]に浮かぶ[[うたかた|うたかた]]は、[[かつ消えかつ結びて|かつきえかつむすびて]]、久しく[[とどまりたるためしなし|とどまりたるためしなし]]。世の中にある人と[[栖|すみか]]と、またかくのごとし。

【現代語訳】流れていく川の水は絶えることがなく、それでいて、もとの水ではない。よどんだところに浮かぶ泡は、消えたかと思えば[[できて|できて]]、長くとどまっている[[例|れい]]はない。世の中の人と住まいも、またこれと同じである。`,
gl:{"絶えずして":"不斷地","もとの水にあらず":"已非原來的水","よどみ":"水流停滯處","うたかた":"泡沫","かつ消えかつ結びて":"一邊消失一邊形成","とどまりたるためしなし":["從無長久停留之例","「ためし」＝前例。"],"栖":"住處、棲身之所","できて":"形成、出現","例":"例子"}},

{d:14,lv:"n2",g:"fd",t:"新米の季節",s:"新米上市",
b:`秋になると、スーパーの[[米売り場|こめうりば]]に「新米」の[[シール|シール]]が並ぶ。その年に[[収穫|しゅうかく]]されたばかりのお米のことだ。

新米は水分が多く、炊くとつやつやして、[[香り|かおり]]も強い。そのため、炊くときは水を[[ほんの少し|ほんのすこし]]減らすのがよいと言われる。[[おかず|おかず]]がなくても、塩むすびだけで十分においしい。

日本人がお米に[[こだわる|こだわる]]のは、味だけの問題ではないかもしれない。田植えから稲刈りまで、お米は一年の季節の[[巡り|めぐり]]と結びついている。新米を口にすることは、「今年も[[実り|みのり]]の秋が来た」と確かめることでもあるのだ。`,
gl:{"米売り場":"米的賣場","シール":"貼紙","収穫":"收成","香り":"香氣","ほんの少し":"一點點","おかず":"配菜","こだわる":"講究、執著","巡り":"循環、輪轉","実り":"結實、收穫"}},

{d:15,lv:"n1",g:"ki",t:"文化の日",s:"文化之日（11月3日）",
b:`十一月三日は「文化の日」。「自由と平和を愛し、文化をすすめる」日として、[[国民の祝日|こくみんのしゅくじつ]]に定められている。この日には皇居で[[文化勲章|ぶんかくんしょう]]の[[授与式|じゅよしき]]が行われ、学問や芸術で大きな[[功績|こうせき]]を残した人が[[表彰|ひょうしょう]]される。

実はこの日は、[[明治天皇|めいじてんのう]]の誕生日でもあった。戦後、日本国憲法が[[公布|こうふ]]された日であることから、平和と文化を[[重んじる|おもんじる]]祝日として生まれ変わった。

また、文化の日は「晴れの[[特異日|とくいび]]」としても知られている。[[統計的|とうけいてき]]に晴れることが多い日、という意味だ。多くの美術館や博物館では、この日に[[入館料|にゅうかんりょう]]を無料にしているので、出かけるにはちょうどいい。`,
gl:{"国民の祝日":"國定假日","文化勲章":"文化勳章","授与式":"頒發典禮","功績":"功績","表彰":"表揚","明治天皇":"明治天皇","公布":"公布","重んじる":"重視、尊重","特異日":["特異日","統計上某種天氣特別容易出現的日子。"],"統計的":"統計上","入館料":"入館費"}},

{d:16,lv:"pro",g:"ed",t:"地方の足をどう守るか",s:"社論風：如何守住地方的交通",
b:`地方の[[路線バス|ろせんバス]]や[[鉄道|てつどう]]の[[廃止|はいし]]・[[減便|げんびん]]が相次いでいる。人口減少で[[利用者|りようしゃ]]が減り、[[採算|さいさん]]が取れないうえ、[[運転手|うんてんしゅ]]不足も深刻だ。

公共交通は、単なる移動手段ではない。車を運転できない高齢者や学生にとっては、病院や学校へ通うための[[生命線|せいめいせん]]である。路線がなくなれば、地域から人が[[離れ|はなれ]]、さらに利用者が減るという[[悪循環|あくじゅんかん]]に陥りかねない。

[[乗合タクシー|のりあいタクシー]]や[[ライドシェア|ライドシェア]]など、新しい形の模索も始まっている。だが、民間の努力だけに[[委ねる|ゆだねる]]には限界がある。交通を道路や水道と同じ[[公共財|こうきょうざい]]と位置づけ、国と自治体が[[責任|せきにん]]を持って支える[[発想|はっそう]]への転換が求められる。`,
gl:{"路線バス":"定線公車","鉄道":"鐵路","廃止":"廢止","減便":"減班","利用者":"使用者、乘客","採算":"收支平衡","運転手":"司機","生命線":"生命線","離れ":"離開","悪循環":"惡性循環","乗合タクシー":"共乘計程車","ライドシェア":"共乘服務（rideshare）","委ねる":"委託、交給","公共財":"公共財","責任":"責任","発想":"思維、構想"}},

{d:17,lv:"n1",g:"ff",t:"「人間」はどこにいる？",s:"同字異義②：人間、工作、放心",
b:`日本語の「人間」は、ただ「人」を意味する。「人間関係」「人間らしさ」の「人間」だ。中国語の「人間」が「人の世」を指すのとは[[ずれ|ずれ]]があるが、実は日本語にも古い用法が残っている。「[[人間万事塞翁が馬|にんげんばんじさいおうがうま]]」の「人間」は、「じんかん」とも読み、世の中のことを言う。

「工作」も注意が必要だ。日本語では、小学校の授業で[[画用紙|がようし]]や木を使って物を作ること、つまり「[[図画工作|ずがこうさく]]」の意味でよく使う。[[裏で|うらで]][[根回し|ねまわし]]をする、という意味の「工作」もあるが、中国語の「仕事」の意味はない。

そして「放心」。日本語では「心配しないで」ではなく、[[ぼんやり|ぼんやり]]として気が[[抜けた|ぬけた]]状態を言う。「[[放心状態|ほうしんじょうたい]]」と言えば、ショックで何も考えられない様子だ。安心してください、と言いたいときには使えない。`,
gl:{"ずれ":"落差、偏差","人間万事塞翁が馬":"塞翁失馬，焉知非福","画用紙":"圖畫紙","図画工作":"美勞課","裏で":"在背地裡","根回し":"事先疏通、打點","ぼんやり":"發呆、恍神","抜けた":"脫離、洩了氣（原形：抜ける）","放心状態":"失神狀態"}},

{d:18,lv:"pro",g:"dl",t:"ぶぶ漬けでもどうどす",s:"京都腔與「言外之意」",
b:`京都には、「[[ぶぶ漬け|ぶぶづけ]]でもどうどす？」と言われたら「そろそろ帰ってください」という意味だ、という有名な話がある。ぶぶ漬けとはお茶漬けのこと。[[客|きゃく]]を本当にもてなすつもりなら、お茶漬けなど出さない、というわけだ。

実際にこう言う京都人がどれほどいるかは怪しいが、京都の言葉が「[[本音|ほんね]]を直接言わない」[[象徴|しょうちょう]]として語られることは多い。「[[ええ時計|ええとけい]]してはりますなあ」が「話が長い」の意味になる、といった[[冗談|じょうだん]]も同じだ。

もっとも、こうした[[遠回し|とおまわし]]な言い方は、相手の[[面子|メンツ]]を[[潰さず|つぶさず]]に気持ちを伝えるための知恵でもある。「[[おおきに|おおきに]]」の柔らかい響きとともに、京ことばの[[奥深さ|おくぶかさ]]を味わいたい。`,
gl:{"ぶぶ漬け":["茶泡飯（京都說法）","「どうどす」＝どうですか。"],"客":"客人","本音":"真心話","象徴":"象徵","ええ時計":["好手錶","「してはります」＝しておられます。"],"冗談":"玩笑","遠回し":"拐彎抹角、委婉","面子":"面子","潰さず":"不使…掃地（原形：潰す）","おおきに":"謝謝（關西）","奥深さ":"深奧、韻味"}},

{d:19,lv:"n1",g:"ki",t:"立冬",s:"節氣：立冬",
b:`今日から暦の上では冬。二十四節気の「立冬」である。まだ紅葉の[[盛り|さかり]]の地方も多く、冬と言われても[[ぴんと来ない|ぴんとこない]]かもしれない。

それでも、[[日脚|ひあし]]はずいぶん短くなった。夕方五時にはもう[[薄暗く|うすぐらく]]、街の明かりが早く[[灯る|ともる]]。北のほうからは「[[木枯らし一号|こがらしいちごう]]」の[[便り|たより]]も届く頃だ。木枯らしとは、晩秋から初冬にかけて吹く、強く冷たい北風のこと。木の葉を落として枯れ木にしてしまう風、という意味である。

こたつを出す家、[[加湿器|かしつき]]を[[引っ張り出す|ひっぱりだす]]家。冬支度の[[段取り|だんどり]]は、[[家々|いえいえ]]でそれぞれ違うが、どこか[[浮き立つ|うきたつ]]ような気分は同じだ。`,
gl:{"盛り":"最盛期","ぴんと来ない":"沒有實感、無法立刻理解","日脚":"白晝的長度","薄暗く":"昏暗","灯る":"點亮","木枯らし一号":"當年第一道寒風","便り":"消息","加湿器":"加濕器","引っ張り出す":"拉出來、拿出來","段取り":"步驟、安排","家々":"家家戶戶","浮き立つ":"雀躍、興奮"}}
);

{d:20,lv:"n1",g:"lt",t:"走れメロス（冒頭）",s:"太宰治《奔跑吧！美樂斯》開頭（1940）",src:"青空文庫（太宰治『走れメロス』）",
b:`メロスは[[激怒|げきど]]した。必ず、かの[[邪智暴虐|じゃちぼうぎゃく]]の王を[[除かなければならぬ|のぞかなければならぬ]]と決意した。メロスには政治がわからぬ。メロスは、村の[[牧人|ぼくじん]]である。笛を吹き、羊と遊んで[[暮して来た|くらしてきた]]。けれども[[邪悪|じゃあく]]に対しては、[[人一倍|ひといちばい]]に[[敏感|びんかん]]であった。`,

{d:21,lv:"n1",g:"bz",t:"上手に断るメール",s:"商務日語：婉拒的郵件",l:1,
b:`件名：講演のご依頼について

山田様

いつもお世話になっております。
このたびは講演のご依頼をいただき、誠にありがとうございます。

[[大変恐縮|たいへんきょうしゅく]]ではございますが、当日はあいにく[[先約|せんやく]]がございまして、お引き受けすることが[[難しい|むずかしい]]状況です。
せっかくお声がけいただいたにもかかわらず、ご期待に[[添えず|そえず]]申し訳ございません。

[[差し支えなければ|さしつかえなければ]]、別の日程であれば調整が可能ですので、[[改めて|あらためて]]ご相談いただけますと幸いです。
今後とも何卒よろしくお願い申し上げます。`,
gl:{"大変恐縮":["非常過意不去","婉拒時的開場白。"],"先約":"已有約在先","難しい":["困難","商務上「難しい」幾乎等於「不行」。"],"添えず":"無法符合（原形：添う）","差し支えなければ":"如果方便的話","改めて":"另外、重新"}},

{d:22,lv:"n1",g:"tr",t:"金沢の「弁当忘れても傘忘れるな」",s:"金澤：便當可以忘，傘不能忘",
b:`石川県の金沢には、「弁当忘れても傘忘れるな」という言葉がある。晴れていたかと思えば急に[[時雨れる|しぐれる]]。それほど天気が変わりやすい土地だということだ。

特に晩秋から冬にかけては、日本海からの湿った風が山にぶつかり、雨や雪の日が続く。[[兼六園|けんろくえん]]では、雪の[[重み|おもみ]]で枝が折れないよう、松に縄を張る「[[雪吊り|ゆきづり]]」が始まる。[[円錐形|えんすいけい]]に張られた縄は、金沢の冬の[[風物詩|ふうぶつし]]だ。

雨の多い町は、どこか[[しっとり|しっとり]]とした美しさを持つ。濡れた石畳の[[茶屋街|ちゃやがい]]を、傘を差して歩くのも悪くない。もちろん、傘は忘れずに。`,
gl:{"時雨れる":["下陣雨","名詞「時雨（しぐれ）」是晚秋初冬的季語。"],"兼六園":"兼六園（日本三名園之一）","重み":"重量","雪吊り":"雪吊（防雪壓的繩架）","円錐形":"圓錐形","風物詩":"季節的代表景物","しっとり":"溫潤沉靜","茶屋街":"茶屋街（藝妓街）"}},

{d:23,lv:"pro",g:"wd",t:"「エモい」と「推し」",s:"年輕人用語",
b:`「この写真、[[エモい|エモい]]ね」。若い世代がよく使う「エモい」は、英語の emotional から来た言葉で、言葉にしにくい[[懐かしさ|なつかしさ]]や切なさ、心が[[揺さぶられる|ゆさぶられる]]感じを表す。古語の「[[あはれ|あわれ]]」に近い、と[[評する|ひょうする]]人もいる。

「[[推し|おし]]」もすっかり定着した。もとはアイドルファンの言葉で、「[[推薦|すいせん]]したいほど好きなメンバー」のこと。今では俳優、[[キャラクター|キャラクター]]、[[ひいては|ひいては]]好きなパン屋まで「推し」と呼ぶ。「推し活」は、その対象を応援する活動全般を指す。

新しい言葉を「日本語の乱れ」と[[眉をひそめる|まゆをひそめる]]向きもある。だが、言葉は使われる中でしか生き残れない。「エモい」が百年後の[[辞書|じしょ]]に残っているかどうか、確かめられないのが残念だ。`,
gl:{"エモい":"感性、讓人觸動（emotional）","懐かしさ":"懷念","揺さぶられる":"被撼動","あはれ":["物哀、感動","古語，平安文學的核心美感。"],"評する":"評論","推し":"本命、最喜歡的偶像或角色","推薦":"推薦","キャラクター":"角色","ひいては":"甚至、進而","眉をひそめる":"皺眉（表示不以為然）","辞書":"辭典"}},

{d:24,lv:"pro",g:"co",t:"「ご自愛ください」",s:"「請保重身體」",
b:`日本語の手紙やメールの結びに、「寒さ厳しき[[折|おり]]、どうぞご[[自愛|じあい]]ください」という一文がよく添えられる。「自愛」とは、自分の体を大切にすること。中国語の「自愛」が「[[品行|ひんこう]]を慎む」意味にもなるのとは、少し[[趣|おもむき]]が違う。

注意したいのは、「お体をご自愛ください」という言い方だ。「自愛」にすでに「体を大切に」の意味が含まれているため、「[[重言|じゅうげん]]」だとして避ける人も多い。また、病気の人に使うのは[[ふさわしくない|ふさわしくない]]とされる。その場合は「どうぞお大事になさってください」がよい。

季節の挨拶で始め、相手の体を気づかって終わる。この型は[[堅苦しい|かたくるしい]]ようでいて、実は書き手を助けてくれる。何を書けばいいか迷ったときの、[[頼もしい|たのもしい]][[枠|わく]]なのだ。`,
gl:{"折":"時節、時候","自愛":"保重","品行":"品行","趣":"意趣、韻味","重言":"贅語、重複表達","ふさわしくない":"不恰當","堅苦しい":"拘謹、生硬","頼もしい":"可靠","枠":"框架"}},

{d:25,lv:"x",g:"hk",t:"秋の俳句二句",s:"芭蕉與子規的秋句",l:1,src:"松尾芭蕉／正岡子規",
b:`この道や　行く人なしに　秋の[[暮|くれ]]
（松尾芭蕉）

柿[[食へば|くえば]]　鐘が鳴るなり　法隆寺
（正岡子規）

芭蕉の句は、[[晩年|ばんねん]]の作。一本の道を、ほかに歩く人もいない秋の夕暮れ。目に見える風景であると同時に、芸の道を一人で[[究める|きわめる]][[孤独|こどく]]も読み取れる。

子規の句は、奈良を旅したときのもの。柿を食べていると、ちょうど法隆寺の鐘が鳴った。それだけのことなのに、柿の[[甘み|あまみ]]と鐘の音、秋の[[澄んだ|すんだ]]空気が一度に伝わってくる。子規は柿が大好物だったという。`,
gl:{"暮":"日暮、黃昏","食へば":["吃著（柿子）","歷史假名「食へば」讀作「くえば」。"],"晩年":"晚年","究める":"鑽研到極致","孤独":"孤獨","甘み":"甜味","澄んだ":"清澈的"}},

{d:26,lv:"pro",g:"es",t:"喫茶店という居場所",s:"名為「喫茶店」的容身之處",
b:`日本の街には、カフェとは少し違う「喫茶店」がある。[[ネルドリップ|ネルドリップ]]のコーヒー、[[厚切り|あつぎり]]のトースト、ナポリタン。店主は[[寡黙|かもく]]で、[[常連|じょうれん]]は決まった席に座り、新聞を広げる。

チェーンのカフェが「誰でも同じように使える場所」だとすれば、喫茶店は「[[顔なじみ|かおなじみ]]になれる場所」だ。名前を知らなくても、毎朝同じ時間に同じ席にいる人同士には、[[ゆるやか|ゆるやか]]な[[連帯|れんたい]]のようなものが生まれる。

近年、[[後継者|こうけいしゃ]]不足で閉店する喫茶店が増えている。一方で、「[[純喫茶|じゅんきっさ]]」の[[レトロ|レトロ]]な雰囲気を好む若い客も多い。家でも職場でもない「[[第三の場所|だいさんのばしょ]]」として、喫茶店が[[担って|になって]]きた役割は、思っている以上に大きいのかもしれない。`,
gl:{"ネルドリップ":"法蘭絨濾布手沖","厚切り":"厚片","寡黙":"沉默寡言","常連":"常客","顔なじみ":"熟面孔","ゆるやか":"鬆散、和緩","連帯":"連結、團結感","後継者":"接班人","純喫茶":["純喫茶","原指不賣酒的喫茶店，今多指昭和風老派咖啡館。"],"レトロ":"復古","第三の場所":"第三空間","担って":"承擔（原形：担う）"}},

{d:27,lv:"n1",g:"ki",t:"七五三と千歳飴",s:"七五三與千歲糖（11月15日）",
b:`十一月十五日前後、神社には着物を着た小さな子どもたちの姿が見られる。「七五三」は、三歳・五歳・七歳の子どもの成長を祝い、これからの健康を[[祈る|いのる]]行事だ。

昔は子どもが[[無事|ぶじ]]に育つことが今よりずっと難しく、「七つまでは神のうち」と言われた。節目の年齢まで育ったことを神様に感謝し、[[報告|ほうこく]]する。そこに七五三の[[原点|げんてん]]がある。

七五三に[[欠かせない|かかせない]]のが「[[千歳飴|ちとせあめ]]」だ。紅白の細長い飴で、鶴や亀が描かれた袋に入っている。「千歳」は千年。細く長く、長生きしてほしいという願いが込められている。最近は写真スタジオで[[記念撮影|きねんさつえい]]をするのも[[定番|ていばん]]になった。`,
gl:{"祈る":"祈求","無事":"平安","報告":"報告","原点":"原點","欠かせない":"不可或缺","千歳飴":"千歲糖","記念撮影":"拍紀念照","定番":"慣例、經典款"}},

{d:28,lv:"pro",g:"ne",t:"空き家はなぜ増えるのか",s:"時事解說：空屋問題",
b:`日本では、誰も住んでいない「空き家」が増え続けている。地方だけでなく、都市部の住宅地でも、[[雨戸|あまど]]が閉まったままの家を見かけることが珍しくなくなった。

背景には、人口減少と高齢化がある。親が亡くなったり施設に入ったりしても、子どもは別の都市に住んでいて戻らない。売ろうにも[[買い手|かいて]]がつかず、[[解体|かいたい]]するには費用がかかる。さらに、建物を壊して[[更地|さらち]]にすると、土地の[[固定資産税|こていしさんぜい]]が高くなる仕組みが、空き家を[[放置|ほうち]]させる一因になってきた。

[[倒壊|とうかい]]の危険や[[景観|けいかん]]の悪化を防ぐため、国は管理の悪い空き家への対策を強めている。一方で、空き家を安く借りて店や[[シェアハウス|シェアハウス]]に[[改装|かいそう]]する動きもある。[[負の遺産|ふのいさん]]と見るか、地域の[[資源|しげん]]と見るか。発想の転換が求められている。`,
gl:{"雨戸":"防雨窗板","買い手":"買家","解体":"拆除","更地":"空地（無建物的土地）","固定資産税":"固定資產稅（類似房屋稅、地價稅）","放置":"放任不管","倒壊":"倒塌","景観":"景觀","シェアハウス":"分租公寓","改装":"改裝","負の遺産":"負面遺產、包袱","資源":"資源"}},

{d:29,lv:"pro",g:"lt",t:"山月記（冒頭）",s:"中島敦《山月記》開頭（1942）",src:"青空文庫（中島敦『山月記』）",
b:`[[隴西|ろうさい]]の[[李徴|りちょう]]は博学[[才穎|さいえい]]、天宝の末年、若くして名を[[虎榜|こぼう]]に連ね、ついで江南尉に[[補せられた|ほせられた]]が、性、[[狷介|けんかい]]、自ら[[恃む|たのむ]]ところ[[頗る|すこぶる]]厚く、[[賤吏|せんり]]に甘んずるを[[潔しとしなかった|いさぎよしとしなかった]]。

唐代の伝奇『人虎伝』を下敷きにした短編。漢文訓読調の[[硬質|こうしつ]]な文体は、中国語の素養がある読者には、むしろ読みやすいかもしれない。[[自尊心|じそんしん]]と[[羞恥心|しゅうちしん]]のために虎になってしまった男の物語である。`,
gl:{"隴西":"隴西","李徴":"李徵","才穎":"才華出眾","虎榜":"虎榜（進士榜）","補せられた":"被補任為","狷介":"狷介、孤傲不合群","恃む":"自恃","頗る":"頗為、非常","賤吏":"小官吏","潔しとしなかった":"不屑於、不甘心","硬質":"剛硬、硬派","自尊心":"自尊心","羞恥心":"羞恥心"}}
);

{d:30,lv:"n1",g:"ff",t:"「結構です」はイエスかノーか",s:"同字異義③：得意、結構、適當",
b:`「コーヒーのおかわりはいかがですか」「結構です」。この「結構です」は、ほとんどの場合「[[要りません|いりません]]」という意味だ。一方、「結構なお[[点前|てまえ]]でした」と言えば、「すばらしい」という[[褒め言葉|ほめことば]]になる。同じ言葉が、[[文脈|ぶんみゃく]]次第で正反対の意味になる。

「適当」も[[厄介|やっかい]]だ。中国語では「ちょうどよい」だが、日本語の会話では「いいかげん」の意味で使われることが多い。「適当にやっといて」は「[[ほどほどに|ほどほどに]]」なのか「[[雑に|ざつに]]」なのか、言われた側は悩むことになる。

「得意」は「[[得意げ|とくいげ]]」なら中国語と同じく「得意洋洋」だが、「料理が得意です」なら「[[上手|じょうず]]で[[自信|じしん]]がある」の意味。さらにビジネスでは「お得意様」、つまり大切な取引先を指す。一つの漢字語に、三つの顔があるわけだ。`,
gl:{"要りません":"不需要","点前":"（茶道的）點茶手法","褒め言葉":"讚美的話","文脈":"上下文","厄介":"麻煩、棘手","ほどほどに":"適可而止","雑に":"草率地","得意げ":"得意洋洋的樣子","上手":"擅長、拿手","自信":"自信"}},

{d:31,lv:"n1",g:"fd",t:"鍋を囲む",s:"圍著火鍋",
b:`寒くなると、日本の食卓には鍋が登場する。[[寄せ鍋|よせなべ]]、[[水炊き|みずたき]]、[[すき焼き|すきやき]]、キムチ鍋。土鍋を[[卓上|たくじょう]]コンロにのせて、家族や友人と[[囲む|かこむ]]。

鍋のいいところは、準備が簡単で、みんなで同じものを[[つつき|つつき]]ながら話せることだ。「鍋奉行」という言葉もある。具を入れる順番や火加減に[[うるさく|うるさく]]、[[仕切りたがる|しきりたがる]]人のことだ。奉行とは、江戸時代の役職名である。

そして、鍋の[[締め|しめ]]。残った[[だし|だし]]にご飯を入れて[[雑炊|ぞうすい]]にするか、うどんを入れるか。これもまた、家庭ごとに[[譲れない|ゆずれない]][[こだわり|こだわり]]がある。台湾の火鍋とは違い、取り皿にタレを作らず、だしの味そのものを楽しむ鍋が多いのも特徴だ。`,
gl:{"寄せ鍋":"什錦火鍋","水炊き":"雞肉清湯鍋（博多名物）","すき焼き":"壽喜燒","卓上":"桌上","囲む":"圍著","つつき":"（用筷子）夾、戳","うるさく":"嘮叨、挑剔","仕切りたがる":"愛主導、愛指揮","締め":"收尾（最後一道）","だし":"高湯","雑炊":"雜炊（鹹粥）","譲れない":"不肯讓步的","こだわり":"堅持、講究"}},

{d:32,lv:"pro",g:"dl",t:"えらいでかんわ",s:"名古屋腔對話",l:1,
b:`「今日は[[えらい|えらい]]寒いがね」
「ほんと、[[でら|でら]]寒いわ。手が[[ちんちん|ちんちん]]……じゃなくて、[[かじかんどる|かじかんどる]]」
「ちんちんは熱いときだがね。[[どえりゃあ|どえりゃあ]][[間違い|まちがい]]だわ」
「[[ほうだね|ほうだね]]。もう疲れて[[えらいでかんわ|えらいでかんわ]]。帰って[[味噌煮込み|みそにこみ]]でも食べよ」`,
gl:{"えらい":["非常（副詞）；累、辛苦（形容詞）","名古屋腔的「えらい」常指「疲累」。"],"でら":["超、非常","名古屋腔。＝とても。"],"ちんちん":["（水、鐵壺等）滾燙","名古屋腔，注意與標準語的意思完全不同。"],"かじかんどる":["凍僵了","＝かじかんでいる。"],"どえりゃあ":["非常、厲害","＝どえらい。"],"間違い":"錯誤","ほうだね":["是啊","＝そうだね。"],"えらいでかんわ":["累死了、受不了","「でかん」＝いけない。"],"味噌煮込み":"味噌燉烏龍麵（名古屋名物）"}},

{d:33,lv:"pro",g:"fi",t:"留守番電話",s:"掌篇：電話答錄機",
b:`母が[[施設|しせつ]]に入って、実家の電話を解約することになった。最後に、[[留守番電話|るすばんでんわ]]の録音を聞いてみた。

古い機械は、[[意外|いがい]]なほど多くの声を覚えていた。歯医者の予約の確認。近所の人からの、[[回覧板|かいらんばん]]の連絡。そして、私自身の声。「お母さん、今日は帰れなくなった。ごめん」。何年前のものだろう。思い出せなかった。

最後の一件は、母の声だった。外から自分の家にかけたらしい。「あら、誰もいないのね。……当たり前か」。小さく笑って、それで切れていた。

私は、[[消去|しょうきょ]]ボタンの上に指を置いたまま、しばらく動けなかった。窓の外では、[[銀杏|いちょう]]の葉が音もなく[[散って|ちって]]いた。`,
gl:{"施設":"（養老）機構","留守番電話":"電話答錄機","意外":"出乎意料","回覧板":"（社區）傳閱板","消去":"刪除","銀杏":"銀杏","散って":"飄落（原形：散る）"}},

{d:34,lv:"n1",g:"ki",t:"小雪",s:"節氣：小雪",
b:`二十四節気の「小雪」。わずかながら雪が降り始める頃、という意味だ。北国や山では初雪の[[便り|たより]]が届き、平地でも冷たい雨が雪に変わる日がある。

この時期によく使われる言葉に「[[小春日和|こはるびより]]」がある。「春」という字が入っているので春の言葉と思われがちだが、実は[[晩秋|ばんしゅう]]から初冬にかけての、春のように暖かく穏やかな晴れの日のことだ。英語の Indian summer に近い。

冷え込みが続いたあとに訪れる小春日和は、[[格別|かくべつ]]にありがたい。[[縁側|えんがわ]]に座って日を[[浴びる|あびる]]猫の姿は、まさにこの言葉の[[絵|え]]そのものだ。`,
gl:{"便り":"消息","小春日和":["小陽春","晚秋初冬溫暖晴朗的日子，不是春天。"],"晩秋":"晚秋","格別":"格外","縁側":"簷廊（日式房屋外側的走廊）","浴びる":"沐浴（在陽光下）","絵":"圖畫"}},

{d:35,lv:"n1",g:"ki",t:"勤労感謝の日",s:"勤勞感謝日（11月23日）",
b:`十一月二十三日は「勤労感謝の日」。「勤労を[[尊び|たっとび]]、生産を祝い、国民たがいに感謝しあう」日とされている。

この日のもとになったのは、[[新嘗祭|にいなめさい]]という古い[[宮中行事|きゅうちゅうぎょうじ]]だ。その年に収穫された新しいお米を神に[[供え|そなえ]]、天皇自らも口にして、実りに感謝する。戦後、祝日の名前は変わったが、宮中ではいまもこの儀式が続いている。

「勤労」と聞くと、つい会社勤めを思い浮かべる。だが、家事や子育て、[[介護|かいご]]も立派な勤労だ。今日くらいは、身近な人に「いつもありがとう」と言ってみてはどうだろう。言われた側は、案外[[照れる|てれる]]ものだ。`,
gl:{"尊び":"尊重（原形：尊ぶ）","新嘗祭":"新嘗祭（感謝新穀的祭典）","宮中行事":"宮廷儀式","供え":"供奉","介護":"照護","照れる":"害羞、不好意思"}},

{d:36,lv:"pro",g:"co",t:"行間を読む",s:"讀出字裡行間",
b:`日本語には「[[行間|ぎょうかん]]を読む」という言い方がある。文字に書かれていないことを[[汲み取る|くみとる]]、という意味だ。手紙やメールだけでなく、会話にも使う。

たとえば、取引先に提案をして「[[前向きに|まえむきに]]検討します」と言われたとする。[[字面|じづら]]通りなら「[[積極的|せっきょくてき]]に考える」だが、実際には[[断り|ことわり]]の[[決まり文句|きまりもんく]]として使われることも少なくない。逆に、[[即答|そくとう]]で「やりましょう」と言われると、日本ではかえって驚かれることもある。

行間を読む文化は、[[衝突|しょうとつ]]を避け、相手の面子を守る[[潤滑油|じゅんかつゆ]]として働いてきた。だが、外国から来た人や、言葉を額面通りに受け取る人にとっては、見えない[[壁|かべ]]にもなる。[[察し|さっし]]の文化は、察せない人を[[置き去り|おきざり]]にしやすいのだ。`,
gl:{"行間":"字裡行間","汲み取る":"體察、領會","前向きに":"積極地、正面地","字面":"字面","積極的":"積極","断り":"拒絕","決まり文句":"套話","即答":"立即回答","衝突":"衝突","潤滑油":"潤滑劑","壁":"牆、障礙","察し":"體察、察覺","置き去り":"丟下、拋在後頭"}},

{d:37,lv:"n1",g:"lt",t:"こころ（冒頭）",s:"夏目漱石《心》開頭（1914）",src:"青空文庫（夏目漱石『こころ』）",
b:`私はその人を常に先生と呼んでいた。だからここでもただ先生と書くだけで本名は[[打ち明けない|うちあけない]]。これは世間を[[憚かる|はばかる]][[遠慮|えんりょ]]というよりも、その方が私にとって自然だからである。`,
gl:{"打ち明けない":"不透露","憚かる":["顧忌、忌憚","現代一般寫作「憚る」。"],"遠慮":["顧慮、客氣","中文「遠慮」是長遠的考量。"]}},

{d:38,lv:"pro",g:"bz",t:"「持ち帰って検討します」",s:"「帶回去研究一下」",
b:`日本の会議でよく聞く一言に、「一度[[持ち帰って|もちかえって]]検討します」がある。その場で決めず、自分の会社や部署に戻ってから[[判断|はんだん]]する、という意味だ。

外国の取引先からは、「なぜ決定権のある人が来ないのか」と[[不満|ふまん]]の声が出ることもある。しかし、日本の組織では、[[稟議|りんぎ]]と呼ばれる手続きで関係者の[[合意|ごうい]]を一つずつ取りつけるのが一般的だ。担当者の一存で決めると、あとで「聞いていない」と[[反発|はんぱつ]]を招きかねない。

[[時間がかかる|じかんがかかる]]のは[[欠点|けってん]]だが、いったん決まれば[[実行|じっこう]]が早い、という利点もある。交渉する側としては、相手が持ち帰ったあとに誰を説得すべきかを見極め、[[判断材料|はんだんざいりょう]]をそろえて渡すのが[[近道|ちかみち]]だ。`,
gl:{"持ち帰って":"帶回去","判断":"判斷","不満":"不滿","稟議":["簽呈、層層批示","以公文在組織內逐級傳閱取得同意的制度。"],"合意":"共識、同意","反発":"反彈","時間がかかる":"費時","欠点":"缺點","実行":"執行","判断材料":"判斷依據","近道":"捷徑"}},

{d:39,lv:"n1",g:"tw",t:"ごみの分け方に驚く",s:"台灣人對日本垃圾分類的驚訝",
b:`台湾の[[ごみ収集車|ごみしゅうしゅうしゃ]]は、[[音楽|おんがく]]を流しながら町を回る。人々は決まった時間に家から出てきて、自分の手でごみを車に投げ入れる。日本から来た人は、この[[光景|こうけい]]にまず驚くそうだ。

逆に、台湾から来た人が日本で驚くのは、ごみの[[分別|ぶんべつ]]の細かさだろう。燃えるごみ、燃えないごみ、[[資源|しげん]]ごみ、[[粗大|そだい]]ごみ。[[ペットボトル|ペットボトル]]はキャップとラベルを外し、中を[[すすいで|すすいで]]出す。曜日ごとに出せるごみが決まっていて、自治体によってルールも違う。

最初は面倒に感じても、慣れると不思議と[[苦にならない|くにならない]]。台湾も日本も、それぞれのやり方で、ごみと[[真剣に|しんけんに]]向き合ってきたのだ。`,
gl:{"ごみ収集車":"垃圾車","音楽":"音樂","光景":"光景","分別":["分類","讀「ぶんべつ」時是分類；讀「ふんべつ」是判斷力、理智。"],"資源":"資源（回收）","粗大":"大型（垃圾）","ペットボトル":"寶特瓶","すすいで":"沖洗（原形：すすぐ）","苦にならない":"不覺得辛苦","真剣に":"認真地"}}
);

{d:40,lv:"pro",g:"wd",t:"マンションは豪邸ではない",s:"和製英語",
b:`日本で「マンションに住んでいます」と聞いても、英語の mansion のような[[豪邸|ごうてい]]を想像してはいけない。日本の「マンション」は、[[鉄筋|てっきん]]コンクリート造りの[[集合住宅|しゅうごうじゅうたく]]、つまり台湾で言う「大樓」の一室のことだ。

このように、英語の単語を使っているのに英語圏では通じない言葉を「[[和製英語|わせいえいご]]」と呼ぶ。「サラリーマン」「ノートパソコン」「[[コンセント|コンセント]]」「ガソリンスタンド」「[[ペーパードライバー|ペーパードライバー]]」などが[[代表例|だいひょうれい]]だ。

和製英語は「間違った英語」として笑われがちだが、見方を変えれば、外来の部品を[[組み合わせて|くみあわせて]]日本語に必要な言葉を作った、[[創造的|そうぞうてき]]な[[営み|いとなみ]]とも言える。漢字で新しい言葉を作ってきた歴史と、どこか通じるところがある。`,
gl:{"豪邸":"豪宅","鉄筋":"鋼筋","集合住宅":"集合住宅、公寓","和製英語":"和製英語","コンセント":"插座","ペーパードライバー":"有駕照卻幾乎不開車的人","代表例":"代表例子","組み合わせて":"組合","創造的":"有創造性的","営み":"行為、活動"}},

{d:41,lv:"pro",g:"ed",t:"書くことを手放さないために",s:"社論風：不放棄「書寫」",
b:`文章を自動で[[生成|せいせい]]する AI が身近になった。メールの[[下書き|したがき]]も、報告書の[[要約|ようやく]]も、数秒で[[整った|ととのった]]文章が出てくる。[[恩恵|おんけい]]は大きく、もう後戻りはできないだろう。

だが、書くという行為は、出来上がった文章だけに価値があるのではない。何を言いたいのか分からないまま書き始め、言葉を選び、[[削り|けずり]]、[[並べ替える|ならべかえる]]うちに、自分の考えの[[輪郭|りんかく]]が見えてくる。書くことは、考えることそのものでもある。

[[道具|どうぐ]]を使うことと、道具に考えを[[丸ごと|まるごと]]預けることは違う。学校でも職場でも、AI をどう使うかと同時に、人が自分の手で書く機会をどう守るかを議論すべき時期に来ている。[[効率|こうりつ]]だけで測れないものを、[[見失わない|みうしなわない]]ために。`,
gl:{"生成":"生成","下書き":"草稿","要約":"摘要","整った":"工整的","恩恵":"恩惠、好處","削り":"刪減","並べ替える":"重新排列","輪郭":"輪廓","道具":"工具","丸ごと":"整個、全部","効率":"效率","見失わない":"不迷失、不看丟"}},

{d:42,lv:"x",g:"cl",t:"徒然草（序段）",s:"吉田兼好《徒然草》序段（約1330）",src:"兼好法師『徒然草』",
b:`[[つれづれなるままに|つれづれなるままに]]、[[日暮らし|ひぐらし]]、[[硯|すずり]]にむかひて、心にうつりゆく[[よしなし事|よしなしごと]]を、[[そこはかとなく|そこはかとなく]]書きつくれば、[[あやしうこそものぐるほしけれ|あやしゅうこそものぐるおしけれ]]。

【現代語訳】することもなく退屈なのにまかせて、一日中、硯に向かって、心に浮かんでは消えていくとりとめもないことを、なんとなく書きつけていると、[[妙に|みょうに]]おかしな気分になってくる。`,
gl:{"つれづれなるままに":"百無聊賴之際","日暮らし":"整日","硯":"硯台","よしなし事":"無關緊要的瑣事","そこはかとなく":"漫無邊際地、隨意地","あやしうこそものぐるほしけれ":["不可思議地心緒紛亂起來","「こそ～けれ」是係結法。讀作「あやしゅうこそものぐるおしけれ」。"],"妙に":"莫名地"}},

{d:43,lv:"pro",g:"es",t:"師走",s:"十二月叫「師走」",
b:`十二月の[[異名|いみょう]]は「師走」。普段は落ち着いている先生（師）でさえ、[[走り回る|はしりまわる]]ほど忙しい月だから、と説明されることが多い。ここでの「師」は、もともと[[お経|おきょう]]を読むために家々を回る[[僧侶|そうりょ]]のことだったという説もある。

[[もっとも|もっとも]]、これは後から作られた「[[語呂合わせ|ごろあわせ]]」で、本当の[[語源|ごげん]]ははっきりしない。年が[[果てる|はてる]]「年果つ（としはつ）」が変化したという説など、いくつもの説が[[並立|へいりつ]]している。

[[由来|ゆらい]]がどうであれ、十二月が慌ただしいのは確かだ。[[忘年会|ぼうねんかい]]、大掃除、年賀状、仕事の締め切り。手帳はすぐに予定で埋まっていく。せめて一日のうち数分くらいは、[[走らず|はしらず]]に、ゆっくり本を開く時間を持ちたいものだ。`,
gl:{"異名":"別稱","走り回る":"到處奔走","お経":"佛經","僧侶":"僧侶","もっとも":"不過、話雖如此","語呂合わせ":"諧音附會","語源":"語源","果てる":"終了、到盡頭","並立":"並存","由来":"由來","忘年会":"尾牙、年終聚會","走らず":"不奔走"}},

{d:44,lv:"n1",g:"tr",t:"京都の底冷え",s:"京都的「底冷」",
b:`京都の冬は「[[底冷え|そこびえ]]」がすると言われる。気温の数字以上に、足元から体の芯まで、[[じわじわ|じわじわ]]と冷えが[[染みて|しみて]]くる寒さだ。

その理由の一つは地形にある。京都は三方を山に囲まれた[[盆地|ぼんち]]で、夜のあいだに冷たい空気が底に[[溜まり|たまり]]やすい。風が少ない分、冷気が逃げないのだ。古い[[町家|まちや]]は夏の暑さをしのぐように作られていて、冬は[[隙間風|すきまかぜ]]が入りやすい、という事情もある。

それでも、冬の京都には冬にしかない[[良さ|よさ]]がある。観光客の少ない朝の寺、雪化粧をした金閣寺、湯気の立つ[[湯豆腐|ゆどうふ]]。[[厚手|あつで]]の靴下を履いて、出かけてみる価値は十分にある。`,
gl:{"底冷え":"由內而外的濕冷、寒氣透骨","じわじわ":"慢慢地、一點一點","染みて":"滲入","盆地":"盆地","溜まり":"積聚","町家":"町家（京都傳統町屋）","隙間風":"從縫隙吹進來的風","良さ":"好處","湯豆腐":"湯豆腐","厚手":"厚的"}},

{d:45,lv:"pro",g:"dl",t:"なんくるないさ",s:"沖繩的話語",
b:`沖縄の言葉で最もよく知られているのは、おそらく「[[なんくるないさ|なんくるないさ]]」だろう。「なんとかなるさ」と訳されることが多く、沖縄の人の[[おおらかさ|おおらかさ]]を表す言葉として観光の[[キャッチフレーズ|キャッチフレーズ]]にもなっている。

しかし、本来の[[ニュアンス|ニュアンス]]は少し違うという指摘もある。もとは「[[まくとぅそーけー|まくとぅそーけー]]、なんくるないさ」、つまり「[[誠|まこと]]を尽くしていれば、なんとかなる」という言葉だった、というのだ。何もしなくても大丈夫、という意味ではない。

ほかにも「[[めんそーれ|めんそーれ]]」（いらっしゃい）、「[[ちゅらさん|ちゅらさん]]」（美しい人）、「[[ゆいまーる|ゆいまーる]]」（助け合い）など、沖縄の言葉には[[響き|ひびき]]の美しいものが多い。標準語とは大きく異なり、[[独立した|どくりつした]]言語として扱う研究者もいる。`,
gl:{"なんくるないさ":"總會有辦法的","おおらかさ":"大方、從容","キャッチフレーズ":"標語","ニュアンス":"語感、細微差異","まくとぅそーけー":["只要真誠以對","沖繩語。＝誠を尽くせば。"],"誠":"真誠","めんそーれ":"歡迎光臨（沖繩語）","ちゅらさん":"美麗的人（沖繩語）","ゆいまーる":"互相幫助（沖繩語）","響き":"聲音、音韻","独立した":"獨立的"}},

{d:46,lv:"n1",g:"ff",t:"「怪我」はけがのこと",s:"同字異義④：怪我、出世、皮肉",
b:`日本語の「怪我」は「けが」と読み、体に[[傷|きず]]を負うことを言う。「怪」も「我」も、字の意味とはほとんど関係がない。[[当て字|あてじ]]の一種と考えたほうがよい。中国語の「怪我（怪我嗎？）」とは、もちろん何の関係もない。

「出世」は、中国語では「[[生まれる|うまれる]]」の意味もあるが、日本語ではもっぱら「社会的に高い地位につく」ことを言う。「出世[[魚|うお]]」とは、成長に[[伴って|ともなって]]名前が変わる魚のこと。ブリは、ワカシ、イナダ、ワラサと名前を変えて、ようやくブリになる。

そして「皮肉」。日本語では、相手を遠回しに[[批判|ひはん]]する言い方、つまり「[[嫌味|いやみ]]」のことだ。「皮肉なことに」と言えば、思惑とは逆の結果になる様子を表す。中国語の「皮肉（皮と肉）」とは、だいぶ[[距離|きょり]]がある。`,
gl:{"傷":"傷","当て字":"借字（只借音的漢字寫法）","生まれる":"出生","魚":"魚","伴って":"伴隨","批判":"批評","嫌味":"挖苦、酸言酸語","距離":"距離"}},

{d:47,lv:"pro",g:"fd",t:"柚子の香り",s:"柚子的香氣",
b:`冬の日本料理に欠かせない香りといえば、柚子だろう。[[吸い物|すいもの]]に皮をひとかけら浮かべるだけで、[[椀|わん]]のふたを開けた瞬間、[[ふわり|ふわり]]と冬の香りが立ちのぼる。

日本の柚子は、台湾で「柚子」と呼ぶ[[文旦|ぶんたん]]の仲間とはまったく別の果物だ。小さく、[[でこぼこ|でこぼこ]]した皮をしていて、[[果汁|かじゅう]]は酸っぱく、そのまま食べることはほとんどない。使うのは主に皮と果汁で、[[ポン酢|ポンず]]や柚子[[胡椒|こしょう]]の原料にもなる。

柚子胡椒の「胡椒」は、[[九州|きゅうしゅう]]の方言で[[唐辛子|とうがらし]]のこと。青い柚子の皮と青唐辛子、塩を[[すり合わせた|すりあわせた]][[薬味|やくみ]]で、鍋や焼き鳥によく合う。名前に[[だまされず|だまされず]]、一度試してみてほしい。`,
gl:{"吸い物":"清湯","文旦":"文旦（柚子）","椀":"碗","ふわり":"輕飄飄地","でこぼこ":"凹凸不平","果汁":"果汁","ポン酢":"柑橘醋醬油","胡椒":["胡椒","此處九州方言指辣椒。"],"九州":"九州","唐辛子":"辣椒","すり合わせた":"研磨混合","薬味":"佐料、辛香料","だまされず":"不被騙"}},

{d:48,lv:"n1",g:"lt",t:"注文の多い料理店（冒頭）",s:"宮澤賢治《要求很多的餐廳》開頭（1924）",src:"青空文庫（宮沢賢治『注文の多い料理店』）",
b:`二人の若い[[紳士|しんし]]が、すっかりイギリスの兵隊のかたちをして、ぴかぴかする[[鉄砲|てっぽう]]をかついで、白熊のような犬を二[[疋|ひき]]つれて、だいぶ山奥の、木の葉の[[かさかさ|かさかさ]]したとこを、こんなことを[[云いながら|いいながら]]、あるいておりました。`,
gl:{"紳士":"紳士","鉄砲":"槍","疋":["隻（量詞）","舊時用於動物的量詞，今寫作「匹」。"],"かさかさ":"乾巴巴、沙沙作響","云いながら":["一邊說著","「云う」是「言う」的舊寫法。"]}},

{d:49,lv:"n1",g:"ki",t:"大雪",s:"節氣：大雪",
b:`二十四節気の「大雪」。山々は雪に[[覆われ|おおわれ]]、平地でも雪が降り始める頃とされる。もっとも、太平洋側の都市では、この時期に大雪が降ることはまれだ。暦と実際の天気の[[ずれ|ずれ]]も、また季節の楽しみ方の一つである。

雪国では、本格的な冬に備えて「[[雪囲い|ゆきがこい]]」をする。家の窓や庭木を[[板|いた]]や[[わら|わら]]で囲い、雪の重みや吹雪から守るのだ。[[軒先|のきさき]]には[[つらら|つらら]]が下がり、朝は[[除雪車|じょせつしゃ]]の音で目が覚める。

台湾では雪を見る機会はほとんどないが、合歡山などの高い山では、寒波の日に雪が降ることがある。雪が降るとニュースになり、見物の車で道路が[[渋滞|じゅうたい]]する。雪の[[珍しさ|めずらしさ]]は、そのまま[[ありがたさ|ありがたさ]]なのかもしれない。`,
gl:{"覆われ":"被覆蓋","ずれ":"落差","雪囲い":"防雪圍籬","板":"木板","わら":"稻草","軒先":"屋簷前端","つらら":"冰柱","除雪車":"除雪車","渋滞":"塞車","珍しさ":"稀奇","ありがたさ":"可貴"}}
);

{d:50,lv:"pro",g:"co",t:"年賀状じまい",s:"「結束寄賀年卡」",
b:`年末が近づくと、「今年をもちまして、年始のご挨拶を[[失礼|しつれい]]させていただくことにしました」という[[はがき|はがき]]が届くことがある。年賀状のやりとりをやめることを知らせる、いわゆる「年賀状じまい」だ。

年賀状の発行枚数は、ピーク時から大きく減った。SNS やメッセージアプリで新年の挨拶を済ませる人が増え、はがきの[[値上げ|ねあげ]]も[[追い打ち|おいうち]]をかけた。高齢になって書くのが[[負担|ふたん]]になった、という人も多い。

それでも、年に一度だけ近況を知らせ合う関係を、[[惜しむ|おしむ]]声は根強い。手書きの一言が添えられた年賀状には、画面の[[スタンプ|スタンプ]]にはない[[温もり|ぬくもり]]がある。やめるのも続けるのも自由だ。ただ、「じまい」という言葉に、関係を丁寧に[[閉じる|とじる]]という、日本らしい[[作法|さほう]]を感じる。`,
gl:{"失礼":"失禮、恕不（再）","はがき":"明信片","値上げ":"漲價","追い打ち":"雪上加霜","負担":"負擔","惜しむ":"惋惜、珍惜","スタンプ":"貼圖","温もり":"溫暖","閉じる":"關閉、結束","作法":"禮法、規矩"}},

{d:51,lv:"n1",g:"wd",t:"一期一会",s:"四字熟語",
b:`日本で好まれる四字熟語の一つに「一期一会」がある。もとは茶道の言葉で、「この茶会は[[一生|いっしょう]]に一度きりのものと思い、心を尽くしてもてなせ」という[[教え|おしえ]]だ。「一期」は仏教の言葉で、人の一生を意味する。

中国語の成語と共通する四字熟語も多いが、日本で独自に生まれたものも少なくない。「[[以心伝心|いしんでんしん]]」は禅の言葉から、「[[一石二鳥|いっせきにちょう]]」は英語の[[ことわざ|ことわざ]]の翻訳から広まったとされる。「[[十人十色|じゅうにんといろ]]」は、人の好みや考えがそれぞれ違うことを言う日本の言葉だ。

逆に、中国語では日常的な成語でも、日本ではほとんど使われないものもある。共通の漢字の土台の上で、二つの言語は別々の[[枝|えだ]]を伸ばしてきた。その違いを見比べるのも、二つの言葉を知る人の[[特権|とっけん]]だろう。`,
gl:{"一生":"一生","教え":"教誨","以心伝心":"心領神會、以心傳心","一石二鳥":"一石二鳥","ことわざ":"諺語","十人十色":"人各有所好、一人一個樣","枝":"枝","特権":"特權"}},

{d:52,lv:"pro",g:"ne",t:"観光客が増えすぎると",s:"時事解說：過度觀光",
b:`日本を訪れる外国人観光客は、[[円安|えんやす]]などを背景に大きく増えた。観光は地域経済を[[潤す|うるおす]]一方で、人気の観光地では「オーバーツーリズム（観光公害）」と呼ばれる問題も起きている。

京都では、路線バスが観光客で満員になり、地元の住民が乗れないことがあった。[[祇園|ぎおん]]の[[花見小路|はなみこうじ]]周辺では、[[舞妓|まいこ]]を無断で撮影する観光客への[[苦情|くじょう]]が相次ぎ、私道への立ち入りを制限する[[看板|かんばん]]も立てられた。富士山の[[登山道|とざんどう]]では、入山料の[[徴収|ちょうしゅう]]や人数制限が導入された。

観光客を「[[呼び込む|よびこむ]]」段階から、「[[受け入れ方|うけいれかた]]を[[設計|せっけい]]する」段階へ。住民の生活と観光をどう[[両立|りょうりつ]]させるかは、日本だけでなく、多くの観光地に共通する課題である。`,
gl:{"円安":"日圓貶值","潤す":"滋潤、帶動","祇園":"祇園（京都花街）","花見小路":"花見小路","舞妓":"舞妓","苦情":"抱怨、客訴","看板":"告示牌","登山道":"登山步道","徴収":"徵收","呼び込む":"招攬","受け入れ方":"接待方式","設計":"設計、規劃","両立":"兼顧"}},

{d:53,lv:"n1",g:"fi",t:"忘年会の帰り",s:"掌篇：尾牙歸途",
b:`[[二次会|にじかい]]を[[断って|ことわって]]店を出ると、外は思ったより冷えていた。[[マフラー|マフラー]]を巻き直しながら、駅までの道を歩く。

今年もいろいろあった。部署が変わり、上司が変わり、[[通勤|つうきん]]の電車が変わった。乾杯のとき、隣の席の後輩に「来年もよろしくお願いします」と言われて、私はとっさに「こちらこそ」と返した。来年、自分がこの会社にいるかどうかも分からないのに。

駅前の[[イルミネーション|イルミネーション]]の下で、若い二人が写真を撮っていた。私はその横を通り過ぎて、[[改札|かいさつ]]に[[交通系ICカード|こうつうけいアイシーカード]]をかざした。ピッという[[軽い|かるい]]音。今年が、あと何日で終わるのか数えてみた。指が、少し足りなかった。`,
gl:{"二次会":"續攤","断って":"拒絕","マフラー":"圍巾","通勤":"通勤","イルミネーション":"燈飾","改札":"剪票口","交通系ICカード":"交通IC卡（類似悠遊卡）","軽い":"輕快的"}},

{d:54,lv:"n1",g:"bz",t:"年末のご挨拶",s:"商務日語：年終問候郵件",l:1,
b:`件名：年末のご挨拶

株式会社さくら商事
営業部　鈴木様

いつも大変お世話になっております。
本年も[[格別|かくべつ]]のお[[引き立て|ひきたて]]を[[賜り|たまわり]]、誠にありがとうございました。

[[誠に勝手ながら|まことにかってながら]]、弊社の年末年始休業は下記のとおりとさせていただきます。
休業期間：12月27日（日）〜1月4日（月）
期間中にいただいたお問い合わせは、1月5日（火）以降、順次対応いたします。

来年も変わらぬご[[愛顧|あいこ]]のほど、よろしくお願い申し上げます。

{d:55,lv:"n1",g:"ki",t:"正月事始め",s:"迎新年準備的開始（12月13日）",
b:`十二月十三日は「正月事始め」。この日から、新しい年を迎える準備を始めるのが[[習わし|ならわし]]とされてきた。

まず行うのが「[[煤払い|すすはらい]]」だ。一年の[[煤|すす]]や[[埃|ほこり]]を払い、家を清めて[[年神様|としがみさま]]を迎える。今の大掃除の原型である。寺や神社では、長い竹の先に[[笹|ささ]]をつけた道具で、[[本堂|ほんどう]]の高い[[梁|はり]]の埃を払う光景がニュースになる。

また、[[門松|かどまつ]]に使う松を山から取ってくる「松迎え」も、この日に行うとされた。現代の生活では十三日に[[こだわる|こだわる]]人は少ないが、年末に一気に片付けようとして[[疲れ果てる|つかれはてる]]より、少しずつ始めるほうが賢明なのは今も昔も変わらない。`,
gl:{"習わし":"習俗、慣例","煤払い":"掃煤（年終大掃除）","煤":"煤灰","埃":"灰塵","年神様":"年神（新年降臨的神）","笹":"小竹葉","本堂":"正殿","梁":"橫樑","門松":"門松（新年擺在門口的松竹裝飾）","こだわる":"拘泥","疲れ果てる":"精疲力竭"}},

{d:56,lv:"x",g:"hk",t:"雪の句",s:"一茶與子規的雪之句",l:1,src:"小林一茶／正岡子規",
b:`これがまあ　[[終の栖|ついのすみか]]か　雪五尺
（小林一茶）

いくたびも　雪の深さを　[[尋ねけり|たずねけり]]
（正岡子規）

一茶の句は、[[故郷|こきょう]]の信濃に戻り、晩年を過ごすことに決めたときのもの。五尺（約一・五メートル）もの雪に埋もれた家を見て、「これが自分の最後の住まいか」とつぶやく。あきらめとも[[安堵|あんど]]ともつかない、複雑な[[心境|しんきょう]]が[[にじむ|にじむ]]。

子規の句は、[[病床|びょうしょう]]で作られた。病気で起き上がれない子規は、外に雪が降っていると知り、どれくらい積もったかと何度も家族に尋ねる。自分の目で見られない雪への[[憧れ|あこがれ]]が、十七音に込められている。`,
gl:{"終の栖":"最後的棲身之所","尋ねけり":["詢問了（多次）","「けり」是表示詠嘆的文語助動詞。"],"故郷":"故鄉","安堵":"安心","心境":"心境","にじむ":"滲出、流露","病床":"病床","憧れ":"嚮往"}},

{d:57,lv:"pro",g:"dl",t:"なまらしばれるっしょ",s:"北海道腔對話",l:1,
b:`「今朝、[[なまら|なまら]][[しばれた|しばれた]]っしょ」
「ほんとさ。車のフロントガラス、[[真っ白|まっしろ]]で[[ゆるくなかった|ゆるくなかった]]わ」
「手袋、ちゃんと[[はいてった|はいてった]]？」
「はいてった、はいてった。でも[[こわい|こわい]]から、今日はもう家にいるわ」
「[[したっけ|したっけ]]、また明日ね」`,
gl:{"なまら":["非常","北海道腔。＝とても。"],"しばれた":["冷得結凍","北海道・東北腔。＝ひどく冷え込む。"],"真っ白":"一片白","ゆるくなかった":["很辛苦、不輕鬆","北海道腔。「ゆるくない」＝大変だ。"],"はいてった":["戴去了","北海道人說「手袋をはく」，標準語是「はめる」。"],"こわい":["累","北海道腔「こわい」是疲累，不是害怕。"],"したっけ":["那麼、掰啦","北海道腔。＝それじゃあ。"]}},

{d:58,lv:"pro",g:"es",t:"台北の冬、東京の冬",s:"台北的冬天，東京的冬天",
b:`台北から東京に来た人は、[[口を揃えて|くちをそろえて]]こう言う。「東京の冬は、思ったより寒くない」。

数字の上では、東京のほうがずっと寒い。それなのにそう感じるのは、東京の冬が乾いて晴れた日が多く、日差しが暖かいからだろう。対して台北の冬は、雨が多く、[[湿気|しっけ]]を含んだ冷たさが服の中まで[[入り込んで|はいりこんで]]くる。しかも多くの家には暖房がない。室内のほうが外より寒い、ということさえある。

一方、東京の家では[[エアコン|エアコン]]の暖房が当たり前で、冬は[[乾燥|かんそう]]との戦いになる。[[加湿器|かしつき]]を回し、唇には[[リップクリーム|リップクリーム]]を塗り、[[静電気|せいでんき]]に[[びくっ|びくっ]]とする。

寒さには、温度計では測れない[[質|しつ]]がある。どちらの冬が[[厳しい|きびしい]]かは、結局、どちらの冬に慣れているかで決まるのかもしれない。`,
gl:{"口を揃えて":"異口同聲","湿気":"濕氣","入り込んで":"鑽進","エアコン":"冷氣（空調）","乾燥":"乾燥","加湿器":"加濕器","リップクリーム":"護唇膏","静電気":"靜電","びくっ":"嚇一跳","質":"質感、性質","厳しい":"嚴酷"}},

{d:59,lv:"n1",g:"ff",t:"人参は高麗人参ではない",s:"同字異義⑤：人參、野菜、饅頭",
b:`日本のスーパーで「人参」を買うと、オレンジ色のにんじん、つまり台湾で言う「紅蘿蔔」が出てくる。中国語の「人參」は、日本語では「[[高麗人参|こうらいにんじん]]」や「[[朝鮮人参|ちょうせんにんじん]]」と呼んで区別する。

「野菜」も、日本語では[[ごく|ごく]]普通の「[[蔬菜|そさい]]」のことだ。中国語の「野菜」のように、山野に自生する草を指すなら、日本語では「[[山菜|さんさい]]」と言う。

そして「饅頭」。日本の「まんじゅう」は、小麦粉の皮で[[あんこ|あんこ]]を包んで蒸した、甘い[[和菓子|わがし]]である。台湾の「饅頭」のような、具の入っていない[[蒸しパン|むしパン]]を期待すると[[拍子抜け|ひょうしぬけ]]するだろう。[[肉まん|にくまん]]、つまり中国語の「包子」は、日本ではまんじゅうの[[仲間|なかま]]として名前がつけられている。`,
gl:{"高麗人参":"高麗參","朝鮮人参":"朝鮮人參","ごく":"極為","蔬菜":"蔬菜","山菜":"山菜、野菜","あんこ":"紅豆餡","和菓子":"和菓子","蒸しパン":"蒸麵包、饅頭類","拍子抜け":"掃興、洩氣","肉まん":"肉包","仲間":"同類"}}

DAILY.push(
{d:60,lv:"n1",g:"lt",t:"手袋を買いに（冒頭）",s:"新美南吉《去買手套》開頭（1943）",src:"青空文庫（新美南吉『手袋を買いに』）",
b:`寒い冬が北方から、[[狐|きつね]]の親子の[[棲んでいる|すんでいる]]森へもやって来ました。

[[或朝|あるあさ]][[洞穴|ほらあな]]から子供の狐が出ようとしましたが、「あっ」と叫んで眼を[[抑えながら|おさえながら]]母さん狐のところへ[[ころげて|ころげて]]来ました。

雪を初めて見た子狐は、[[まぶしい|まぶしい]]雪の光を、何かが目に刺さったと思ったのでした。日本の子どもたちが教科書で読み継いできた、冬の童話です。`,

{d:61,lv:"pro",g:"ed",t:"静かになっていく教室で",s:"社論風：在越來越安靜的教室裡",
b:`日本で一年に生まれる子どもの数は、[[過去最少|かこさいしょう]]を更新し続けている。地方では小学校の[[統廃合|とうはいごう]]が進み、一学年に数人しかいない学校も珍しくない。

少子化の原因は一つではない。若い世代の[[雇用|こよう]]と[[収入|しゅうにゅう]]の不安定さ、長時間労働、教育費の重さ、そして子育ての負担が女性に[[偏りがち|かたよりがち]]な現実。結婚や出産をためらう理由は、[[個人|こじん]]の選択というより、社会の[[構造|こうぞう]]に根ざしている。

[[給付金|きゅうふきん]]の上乗せだけでは、流れは変わらないだろう。子どもを持つかどうかを、誰もが[[経済的|けいざいてき]]な不安なしに選べる社会をつくること。持たない選択も[[尊重|そんちょう]]されること。その両方がそろって初めて、教室の静けさに向き合う[[土台|どだい]]ができる。`,
gl:{"過去最少":"史上最少","統廃合":"整併與廢校","雇用":"雇用、就業","収入":"收入","偏りがち":"容易偏向","個人":"個人","構造":"結構","給付金":"補助金","経済的":"經濟上","尊重":"尊重","土台":"基礎"}},

{d:62,lv:"pro",g:"wd",t:"峠・凪・畑",s:"日本自創的漢字「國字」",
b:`漢字は中国から伝わったものだが、日本で独自に作られた漢字もある。これを「[[国字|こくじ]]」または「和製漢字」と呼ぶ。

「峠」は、山の上りと下りの[[境目|さかいめ]]、つまり山道の最も高いところ。山へんに上と下を組み合わせた、見事な[[発想|はっそう]]だ。「凪」は、風が止まって海が静かになること。「畑」は、火で草を焼いて作った[[耕作地|こうさくち]]を表す。水田の「田」と区別するために生まれた。

ほかにも、「働」「込」「[[枠|わく]]」「[[匂|にお]]う」などが国字とされる。中でも「[[腺|せん]]」は、江戸時代の[[蘭学者|らんがくしゃ]]が[[オランダ語|オランダご]]の[[医学書|いがくしょ]]を翻訳するために作った字で、のちに中国語にも取り入れられ、「淋巴腺」などに使われている。漢字は一方通行で伝わったのではなく、[[行き来|ゆきき]]しながら育ってきたのである。`,
gl:{"国字":"國字（日本自創漢字）","境目":"分界","発想":"構想","耕作地":"耕地","枠":"框","匂":"散發香氣（匂う）","行き来":"往返交流","腺":"腺","蘭学者":"蘭學者（研究荷蘭學術的學者）","オランダ語":"荷蘭語","医学書":"醫學書"}},

{d:63,lv:"n1",g:"co",t:"年末ジャンボの夢",s:"年末大樂透",
b:`年末になると、[[宝くじ売り場|たからくじうりば]]に長い列ができる。「年末ジャンボ宝くじ」だ。一等の[[賞金|しょうきん]]は数億円。当たる確率は[[限りなく|かぎりなく]]ゼロに近いと分かっていても、人はつい列に並ぶ。

面白いのは、「よく当たる」と[[評判|ひょうばん]]の売り場があることだ。東京・銀座の売り場には、[[大安|たいあん]]の日になると何時間もの行列ができる。[[統計|とうけい]]的には、たくさん売れる売り場から当たりが多く出るのは当然なのだが、人は[[縁起|えんぎ]]を担がずにはいられない。

買った宝くじを神棚に[[供えて|そなえて]]おく人もいる。[[抽選日|ちゅうせんび]]までの数週間、「もし当たったら」と想像する時間こそが、宝くじの本当の[[商品|しょうひん]]なのかもしれない。`,
gl:{"宝くじ売り場":"彩券行","賞金":"獎金","限りなく":"無限地","評判":"有名、評價","大安":["大安","六曜之一，諸事皆宜的吉日。"],"統計":"統計","縁起":["吉凶、兆頭","「縁起を担ぐ」＝講究吉利。"],"供えて":"供奉","抽選日":"開獎日","商品":"商品"}},

{d:64,lv:"n1",g:"ki",t:"冬至とゆず湯",s:"冬至與柚子浴",
b:`今年もいよいよ冬至の頃。一年で最も昼が短く、夜が長い日だ。この日を境に、日は少しずつ長くなっていく。古くは「[[一陽来復|いちようらいふく]]」と言い、悪いことが続いた後に運が上向く[[兆し|きざし]]ともされた。

日本の冬至の[[風習|ふうしゅう]]といえば、「ゆず湯」と「かぼちゃ」だ。湯船に柚子を[[浮かべて|うかべて]]入ると、[[風邪|かぜ]]をひかないと言われる。「冬至」を「[[湯治|とうじ]]」に、「柚子」を「[[融通|ゆうずう]]がきく」に[[かけた|かけた]][[洒落|しゃれ]]だという説もある。かぼちゃを食べるのは、栄養をとって冬を乗り切るため。「ん」のつく食べ物を食べると「[[運|うん]]」が呼び込める、とも言う。

台湾の冬至は湯圓を食べる日だ。同じ日に、海を[[挟んだ|はさんだ]]二つの土地で、まったく違う[[温まり方|あたたまりかた]]をしているのが面白い。`,
gl:{"一陽来復":"一陽來復、否極泰來","兆し":"徵兆","風習":"習俗","浮かべて":"讓…漂浮","風邪":"感冒","湯治":"溫泉療養","融通":["融通、通融","「融通がきく」＝能變通。"],"かけた":"雙關","洒落":"雙關語、俏皮話","運":"運氣","挟んだ":"隔著","温まり方":"暖身的方式"}},

{d:65,lv:"pro",g:"bz",t:"お詫びのメール",s:"商務日語：道歉郵件",l:1,
b:`件名：商品発送遅延のお詫び

田中様

このたびは、ご注文の商品の発送が遅れ、多大なるご迷惑をおかけしましたことを、心より[[お詫び申し上げます|おわびもうしあげます]]。

[[調査|ちょうさ]]の結果、弊社倉庫での[[在庫管理|ざいこかんり]]の[[不備|ふび]]により、出荷手続きに[[遅れ|おくれ]]が生じていたことが判明いたしました。
商品は本日発送いたしましたので、明日中にお届けできる見込みです。

今後このようなことがないよう、[[確認体制|かくにんたいせい]]を見直し、再発防止に努めてまいります。
[[重ねて|かさねて]]お詫び申し上げますとともに、今後とも変わらぬご愛顧を賜りますよう、お願い申し上げます。`,
gl:{"お詫び申し上げます":"謹此致歉","調査":"調查","在庫管理":"庫存管理","不備":"疏失、不完善","遅れ":"延遲","確認体制":"確認機制","重ねて":"再次"}},

{d:66,lv:"n1",g:"tr",t:"北海道の家は暖かい",s:"北海道的房子很溫暖",
b:`「北海道の冬より、東京の冬のほうが寒い」。北海道から東京に出てきた人が、よくこう言う。もちろん、外の気温は北海道のほうがはるかに低い。寒いのは、家の中の話だ。

北海道の住宅は、[[断熱材|だんねつざい]]が厚く、窓は二重、三重になっていることが多い。暖房は[[灯油|とうゆ]]ストーブなどで家全体を暖め、冬でも室内では半袖で過ごす家庭もある。冬に[[アイス|アイス]]がよく売れるのも、北海道ならではだ。

一方、本州の古い家は、夏の[[蒸し暑さ|むしあつさ]]をしのぐことを優先して建てられてきた。風通しがよい[[反面|はんめん]]、冬は[[底冷え|そこびえ]]がする。寒さへの[[備え|そなえ]]は、寒さの厳しい土地ほど[[徹底|てってい]]している。その地で生きてきた人々の知恵の差が、そのまま家の[[造り|つくり]]に表れているのだ。`,
gl:{"断熱材":"隔熱材","灯油":"燈油、煤油","アイス":"冰淇淋","蒸し暑さ":"悶熱","反面":"另一方面","底冷え":"透骨的寒冷","備え":"準備、防備","徹底":"徹底","造り":"構造"}},

{d:67,lv:"n1",g:"co",t:"クリスマスはケーキとチキン",s:"日本的聖誕節：蛋糕和炸雞",
b:`日本のクリスマスの食卓には、[[苺|いちご]]と[[生クリーム|なまクリーム]]のショートケーキ、そしてフライドチキンが並ぶ。海外から来た人は、これに驚くことが多い。

フライドチキンが定着したのは、[[ファストフード|ファストフード]]店の[[宣伝|せんでん]]がきっかけだったと言われる。七面鳥が手に入りにくい日本で、「クリスマスにはチキンを」という[[呼びかけ|よびかけ]]が見事に[[根付いた|ねづいた]]のだ。今では、何週間も前から予約しないと買えない店もある。

また、日本のクリスマスは、家族で過ごす宗教的な日というより、恋人や友人と過ごす[[イベント|イベント]]としての性格が強い。その分、[[翌朝|よくあさ]]にはツリーが片付けられ、街は一気に[[門松|かどまつ]]と[[しめ飾り|しめかざり]]に[[衣替え|ころもがえ]]する。この切り替えの早さこそ、日本らしいと言えるかもしれない。`,
gl:{"苺":"草莓","生クリーム":"鮮奶油","ファストフード":"速食","宣伝":"宣傳","呼びかけ":"號召","根付いた":"紮根（原形：根付く）","イベント":"活動","翌朝":"隔天早上","門松":"門松","しめ飾り":"注連飾（新年門飾）","衣替え":"換裝"}},

{d:68,lv:"x",g:"cl",t:"平家物語（冒頭）",s:"《平家物語》開頭（13世紀）",src:"『平家物語』巻第一",
b:`[[祇園精舎|ぎおんしょうじゃ]]の鐘の声、[[諸行無常|しょぎょうむじょう]]の響きあり。[[沙羅双樹|さらそうじゅ]]の花の色、[[盛者必衰|じょうしゃひっすい]]の[[理|ことわり]]を[[あらはす|あらわす]]。[[おごれる人|おごれるひと]]も久しからず、ただ春の夜の夢のごとし。[[たけき者|たけきもの]]も[[遂にはほろびぬ|ついにはほろびぬ]]、[[ひとへに|ひとえに]]風の前の[[塵|ちり]]に同じ。

【現代語訳】祇園精舎の鐘の音には、すべてのものは移り変わるという響きがある。沙羅双樹の花の色は、勢いの盛んな者も必ず衰えるという道理を表している。[[驕り高ぶる|おごりたかぶる]]人も長くは続かない。ただ春の夜の夢のようにはかない。勇ましい者もついには滅びる。まったく風の前の塵と同じである。`,
gl:{"祇園精舎":"祇園精舍","諸行無常":"諸行無常","沙羅双樹":"娑羅雙樹","盛者必衰":["盛者必衰","「盛者」讀「じょうしゃ」。"],"理":"道理","あらはす":["顯示","歷史假名，讀作「あらわす」。"],"おごれる人":"驕奢之人","たけき者":"勇猛之人","遂にはほろびぬ":"終究滅亡了","ひとへに":"完全、簡直","塵":"塵土","驕り高ぶる":"驕傲自大"}},

{d:69,lv:"pro",g:"fi",t:"年の瀬の銭湯",s:"掌篇：年終的澡堂",
b:`年の瀬の銭湯は、いつもより混んでいた。大掃除を終えた人たちが、一年の[[垢|あか]]を落としに来るのだろう。

湯船の[[縁|ふち]]で、知らないおばあさんが「今年もお世話さまでした」と言った。私に言ったのか、隣の人に言ったのか分からなかったが、「こちらこそ」と返した。おばあさんは満足そうに[[頷いて|うなずいて]]、また目を閉じた。

[[脱衣所|だついじょ]]では、[[番台|ばんだい]]の主人が[[来年|らいねん]]のカレンダーを常連客に配っていた。私も一枚もらった。地元の工務店の名前が入った、どこにでもあるカレンダーだ。

外に出ると、[[湯冷め|ゆざめ]]しそうなほどの寒さだった。それでも、[[首筋|くびすじ]]から立ちのぼる湯気が、しばらく私を[[守って|まもって]]くれた。もうすぐ、今年が終わる。`,
gl:{"垢":"污垢","縁":"邊緣","頷いて":"點頭","脱衣所":"更衣室","番台":"澡堂收費櫃台","来年":"明年","湯冷め":"洗澡後著涼","首筋":"後頸","守って":"守護"}}
);

{d:70,lv:"n1",g:"fd",t:"おせちに込められた願い",s:"年菜裡的祈願",
b:`正月に食べる「おせち料理」は、[[重箱|じゅうばこ]]に美しく詰められた[[保存食|ほぞんしょく]]だ。年神様を迎えている間は台所に立たない、正月くらいは[[主婦|しゅふ]]を休ませる、といった理由から、年末のうちに作っておく。

一品一品に、[[縁起|えんぎ]]のよい意味がある。[[黒豆|くろまめ]]は「[[まめ|まめ]]に働く」、[[数の子|かずのこ]]は子孫繁栄、海老は腰が曲がるまで長生きするように。[[昆布巻き|こぶまき]]は「よろこぶ」、[[栗きんとん|くりきんとん]]は黄金色にちなんで[[金運|きんうん]]を願う。多くが[[語呂合わせ|ごろあわせ]]で、日本語の言葉遊びの宝庫でもある。

近年は、百貨店やコンビニで買う人も多い。洋風や中華風のおせちも登場した。中身が変わっても、新しい年に[[願い|ねがい]]を込めて食べる、という[[営み|いとなみ]]は変わらない。`,

{d:71,lv:"pro",g:"dl",t:"たいぎいけえ",s:"廣島腔對話",l:1,
b:`「大掃除、[[たいぎい|たいぎい]]けえ、明日にせん？」
「明日は大晦日[[じゃろう|じゃろう]]が。今日やらんと[[いけん|いけん]]よ」
「ほうじゃのう。[[ほいじゃが|ほいじゃが]]、窓だけでも[[ぶち|ぶち]]多いけえ」

{d:72,lv:"n1",g:"wd",t:"「よいお年を」",s:"年底與年初的問候語",
b:`年末に人と別れるとき、日本人は「よいお年を」と言う。「よいお年をお迎えください」を短くした形だ。一方、年が明けてから会ったときには「あけましておめでとうございます」と言う。

この二つは、使う時期がはっきり分かれている。年内に「あけましておめでとう」と言うのは[[気が早すぎる|きがはやすぎる]]し、年が明けてから「よいお年を」と言うのは[[間が抜けて|まがぬけて]]いる。[[仕事納め|しごとおさめ]]の日に会社で交わされるのは、もちろん「よいお年を」だ。

なお、「あけましておめでとう」は、一般に[[松の内|まつのうち]]（一月七日、地域によっては十五日まで）に使うものとされる。また、[[喪中|もちゅう]]の人には「おめでとう」を避け、「今年もよろしくお願いします」とだけ伝えるのが[[心遣い|こころづかい]]だ。挨拶一つにも、季節と相手を[[読む|よむ]]感覚が求められる。`,
gl:{"気が早すぎる":"太心急","間が抜けて":"顯得遲鈍、脫線","仕事納め":"年終最後一個工作日","松の内":"松之內（新年擺門松的期間）","喪中":"服喪期間","心遣い":"體貼、關照","読む":"揣摩"}},

{d:73,lv:"n1",g:"ki",t:"大晦日",s:"除夕",
b:`一年の最後の日、十二月三十一日は「大晦日（おおみそか）」。「[[晦日|みそか]]」は月の最後の日のことで、一年の最後だから「大」がつく。

大晦日の夜には、[[年越しそば|としこしそば]]を食べる。そばのように細く長く生きられるように、また、切れやすいそばにちなんで一年の[[厄|やく]]を断ち切るように、という意味があるとされる。テレビでは紅白歌合戦が放送され、多くの家庭が[[こたつ|こたつ]]でそれを見ながら年を越す。

[[深夜|しんや]]になると、各地の寺で「[[除夜の鐘|じょやのかね]]」が[[撞かれる|つかれる]]。その数は百八回。人間の[[煩悩|ぼんのう]]の数だと言われる。台湾の除夕は旧暦で、家族で[[団欒|だんらん]]の食卓を囲む日だ。にぎやかな台湾の年越しと、静かな日本の年越し。どちらにも、去っていく一年への[[名残惜しさ|なごりおしさ]]がある。`,
gl:{"晦日":"月底最後一天","年越しそば":"跨年蕎麥麵","厄":"災厄","こたつ":"暖桌","深夜":"深夜","除夜の鐘":"除夕夜的鐘聲","撞かれる":"被敲響（撞鐘）","煩悩":"煩惱","団欒":"團聚","名残惜しさ":"依依不捨"}},

{d:74,lv:"n1",g:"ki",t:"元日",s:"元旦",
b:`あけましておめでとうございます。

一月一日は「元日」。その朝を「元旦」と言う。「旦」という字は、地平線から太陽が昇る形を表している。だから、「元旦の朝」と言うと、厳密には重複表現になる。

日本では、元日の朝に「[[初日の出|はつひので]]」を見に行く人が多い。海や山の上で、その年最初の太陽を[[拝む|おがむ]]のだ。家では[[お雑煮|おぞうに]]を食べ、[[お屠蘇|おとそ]]で祝う。雑煮は地域による違いが大きく、[[餅|もち]]の形が四角か丸か、[[汁|しる]]が[[すまし|すまし]]か白味噌かで、出身地が分かるとも言われる。

[[初詣|はつもうで]]に行き、[[おみくじ|おみくじ]]を引いて、新しい一年を占う。今年最初の一編を、ここまで読んでくれてありがとう。どうぞ今年も、よろしくお願いいたします。`,
gl:{"初日の出":"新年第一道日出","拝む":"參拜、膜拜","お雑煮":"年糕湯","お屠蘇":"屠蘇酒（新年喝的藥酒）","餅":"年糕、麻糬","汁":"湯","すまし":"清湯","初詣":"新年初次參拜","おみくじ":"神籤"}},

{d:75,lv:"n1",g:"ki",t:"書き初めと初夢",s:"新春試筆與新年初夢",
b:`一月二日は、年が明けて初めて何かをする「[[初|はつ]]」の日とされてきた。その代表が「書き初め」だ。[[毛筆|もうひつ]]で、新年の[[抱負|ほうふ]]やめでたい言葉を書く。小学校の冬休みの宿題としても[[おなじみ|おなじみ]]である。

もう一つは「初夢」。一般には、一月一日の夜から二日の朝にかけて見る夢のことを言う。縁起のよい初夢として、「一[[富士|ふじ]]、二[[鷹|たか]]、三[[茄子|なすび]]」が知られている。なぜこの三つなのか、理由には諸説ある。[[徳川家康|とくがわいえやす]]のゆかりの地、[[駿河|するが]]の名物だった、という説が有名だ。

[[よい夢|よいゆめ]]を見るために、[[宝船|たからぶね]]の絵を[[枕の下|まくらのした]]に入れて寝る、という風習もあった。今夜、何の夢を見るだろうか。`,
gl:{"初":"初次","毛筆":"毛筆","抱負":"抱負、新年目標","おなじみ":"熟悉的、常見的","富士":"富士山","鷹":"老鷹","茄子":["茄子","此處讀「なすび」，也可讀「なす」。"],"徳川家康":"德川家康","駿河":"駿河（今靜岡縣中部）","よい夢":"好夢","宝船":"寶船（載七福神的船）","枕の下":"枕頭底下"}},

{d:76,lv:"pro",g:"co",t:"箱根駅伝",s:"箱根驛傳",
b:`正月二日と三日、日本の多くの家庭のテレビには、[[襷|たすき]]をつないで走る大学生の姿が映っている。「東京箱根間往復大学駅伝競走」、通称「箱根駅伝」だ。

東京・大手町から箱根の[[芦ノ湖|あしのこ]]まで、往路と[[復路|ふくろ]]の二日間で二百キロ以上を十人でつなぐ。中でも、標高差八百メートル以上を一気に駆け上がる「山登り」の区間は、毎年[[ドラマ|ドラマ]]を生む。

駅伝が日本でこれほど愛されるのは、個人の速さだけでなく、襷を「つなぐ」ことに価値が置かれるからだろう。[[繰り上げスタート|くりあげスタート]]で襷が[[途切れる|とぎれる]]場面では、走り終えた選手が[[泣き崩れ|なきくずれ]]、見ている側も胸が[[詰まる|つまる]]。チームのために走るという[[美学|びがく]]は、良くも悪くも、日本の組織文化の[[縮図|しゅくず]]のようにも見える。`,
gl:{"襷":"接力帶","芦ノ湖":"蘆之湖","復路":"回程","ドラマ":"戲劇性場面","繰り上げスタート":["提前出發","前一棒超時未到，下一棒就用備用接力帶先跑。"],"途切れる":"中斷","泣き崩れ":"痛哭倒地","詰まる":"哽住","美学":"美學","縮図":"縮影"}},

{d:77,lv:"x",g:"hk",t:"百人一首・冬の歌",s:"《百人一首》中的冬歌",l:1,src:"『小倉百人一首』（山部赤人・坂上是則）",
b:`[[田子の浦|たごのうら]]に　うち出でてみれば　[[白妙|しろたえ]]の
富士の[[高嶺|たかね]]に　雪は降りつつ
（山部赤人）

[[朝ぼらけ|あさぼらけ]]　[[有明の月|ありあけのつき]]と　見るまでに
吉野の里に　降れる白雪
（坂上是則）

正月の家庭では、百人一首を使った[[かるた|かるた]]遊びをする伝統がある。読み手が上の句を読み始めると、取り手は下の句が書かれた札を探して[[素早く|すばやく]]取る。

一首目は、田子の浦の海辺に出て見上げると、真っ白な富士の[[頂|いただき]]に雪が降り続いている、という歌。二首目は、夜明けの[[薄明かり|うすあかり]]の中、[[有明の月|ありあけのつき]]の光かと思うほど白く、吉野の里に雪が降り積もっている、という歌だ。`,
gl:{"田子の浦":"田子之浦（靜岡縣海岸）","白妙":"雪白的","高嶺":"高峰","朝ぼらけ":"破曉時分","有明の月":"殘月（黎明時仍掛在天上的月）","かるた":"歌牌","素早く":"迅速地","頂":"頂峰","薄明かり":"微光"}},

{d:78,lv:"n1",g:"ki",t:"小寒・寒の入り",s:"節氣：小寒",
b:`二十四節気の「小寒」。この日から「寒の入り」となり、次の節気「大寒」を経て、二月初めの立春の前日（[[節分|せつぶん]]）までの約三十日間を「[[寒の内|かんのうち]]」と呼ぶ。一年で最も寒い時期だ。

この時期に届ける[[便り|たより]]を「[[寒中見舞い|かんちゅうみまい]]」と言う。年賀状を出しそびれた人への[[返礼|へんれい]]や、喪中の人への挨拶としても使われる。「寒中お見舞い申し上げます」で始め、相手の健康を気づかう言葉を添える。

寒さを[[逆手|さかて]]にとった行事もある。[[寒稽古|かんげいこ]]は、武道や芸事の稽古を、あえて寒さの厳しい早朝に行うもの。[[寒仕込み|かんじこみ]]は、雑菌の少ない寒い時期に、味噌や酒を[[仕込む|しこむ]]ことだ。寒さは[[厄介者|やっかいもの]]であると同時に、何かを[[鍛え|きたえ]]、[[育てる|そだてる]]力でもある。`,
gl:{"節分":"節分（立春前一天）","寒の内":"寒之內（小寒到節分）","便り":"信、消息","寒中見舞い":"寒冬問候信","返礼":"回禮","逆手":"反過來利用","寒稽古":"寒冬練功","寒仕込み":"寒冬釀造","仕込む":"釀造、醃製","厄介者":"麻煩的東西","鍛え":"鍛鍊","育てる":"培育"}},

{d:79,lv:"n1",g:"lt",t:"坊っちゃん（冒頭）",s:"夏目漱石《少爺》開頭（1906）",src:"青空文庫（夏目漱石『坊っちゃん』）",
b:`親譲りの[[無鉄砲|むてっぽう]]で[[小供|こども]]の時から損ばかりしている。小学校に居る[[時分|じぶん]]学校の二階から飛び降りて一週間ほど[[腰を抜かした|こしをぬかした]]事がある。`,
gl:{"無鉄砲":["魯莽、不顧後果","「親譲り」＝遺傳自父母。"],"小供":["小孩","今寫作「子供」。"],"時分":"時候","腰を抜かした":["站不起來、閃到腰","原意是嚇得腿軟。"]}}
);

{d:80,lv:"n1",g:"ki",t:"七草粥",s:"七草粥（1月7日）",
b:`一月七日の朝には、「七草粥」を食べる習わしがある。「せり、なずな、ごぎょう、はこべら、ほとけのざ、すずな、すずしろ、これぞ七草」。春の七草を[[刻んで|きざんで]]入れた、[[塩味|しおあじ]]のやさしいお粥だ。

すずなは[[蕪|かぶ]]、すずしろは大根のこと。残りの五つは、野や川辺に生える草である。[[無病息災|むびょうそくさい]]を願うとともに、正月のごちそうで疲れた胃を休める、という[[実用的|じつようてき]]な意味もある。

この行事は、中国の「人日」の[[節句|せっく]]に、七種類の[[若菜|わかな]]の[[羹|あつもの]]を食べた風習に由来するとされる。今ではスーパーで「七草セット」が売られ、手軽に作れる。台湾で暮らしたことのある人なら、「人日」という言葉に、どこか[[懐かしい|なつかしい]]響きを感じるかもしれない。`,
gl:{"刻んで":"切碎","塩味":"鹹味","蕪":"蕪菁","無病息災":"無病無災","実用的":"實用的","節句":"節日（傳統節令）","若菜":"嫩菜","羹":"羹湯","懐かしい":"令人懷念"}},

{d:81,lv:"n1",g:"ff",t:"娘・姑・老婆",s:"同字異義⑥：家人的稱呼",
b:`家族を表す漢字にも、日本語と中国語でずれがあるものが多い。

日本語の「娘」は、「むすめ」と読み、自分の女の子どもを指す。若い女性一般を言うこともある。中国語の「娘」が[[母親|ははおや]]を指すのとは、世代が一つ[[ずれて|ずれて]]いる。

「姑」は「しゅうとめ」と読み、夫の母、つまり[[義理|ぎり]]の母のこと。中国語の「姑」（父の姉妹）とは別人だ。「嫁と姑」と言えば、日本のドラマで[[繰り返し|くりかえし]]描かれてきた、[[永遠|えいえん]]の対立の[[構図|こうず]]である。

そして「老婆」。日本語では「ろうば」と読み、年をとった女性のことだ。中国語の「老婆」（妻）のつもりで「これが私の老婆です」と紹介したら、とんでもない[[誤解|ごかい]]を[[招く|まねく]]。「[[老婆心|ろうばしん]]ながら」は、「[[余計なお世話|よけいなおせわ]]かもしれませんが」という前置きの言葉だ。`,
gl:{"母親":"母親","ずれて":"錯開","義理":"（姻親上的）","繰り返し":"反覆","永遠":"永恆","構図":"構圖、格局","誤解":"誤會","招く":"招致","老婆心":"老婆心切、多管閒事的好意","余計なお世話":"多管閒事"}},

{d:82,lv:"pro",g:"ed",t:"「大人」になるとは",s:"社論風：何謂「成年」",
b:`日本では、成年年齢が二十歳から十八歳に引き下げられた。十八歳になれば、親の[[同意|どうい]]なしに[[携帯電話|けいたいでんわ]]の契約やローンを組むことができる。一方、飲酒や[[喫煙|きつえん]]は、健康への影響を考慮して二十歳からのままだ。

法律上の大人と、社会が考える大人。その線引きは、思ったより[[曖昧|あいまい]]である。多くの自治体では、成人式にあたる式典を、いまも二十歳を対象に「二十歳の[[集い|つどい]]」などの名前で開いている。十八歳は受験や就職の時期と重なり、[[参加|さんか]]が難しいという事情もある。

[[年齢|ねんれい]]で区切ることはできても、「大人になる」ことに決まった日付はない。[[契約|けいやく]]の責任を負い、自分の[[判断|はんだん]]を引き受け、他人の[[弱さ|よわさ]]に想像を[[巡らせる|めぐらせる]]こと。社会の側にも、若者を「一人前」として扱う[[覚悟|かくご]]が問われている。`,
gl:{"同意":"同意","携帯電話":"手機","喫煙":"吸菸","曖昧":"模糊","集い":"聚會","参加":"參加","年齢":"年齡","契約":"契約","判断":"判斷","弱さ":"軟弱、脆弱","巡らせる":"運轉（想像）","覚悟":"心理準備、決心"}},

{d:83,lv:"pro",g:"tw",t:"台湾華語の中の日本語",s:"台灣華語裡的日語",
b:`台湾の中国語には、日本語に由来する言葉が少なくない。「便當」「[[歐吉桑|おじさん]]」「[[歐巴桑|おばさん]]」「[[阿莎力|あっさり]]」などがその例だ。

面白いのは、意味が少し変わって定着したものがあることだ。「阿莎力」は日本語の「あっさり」から来たとされるが、台湾では「[[気前|きまえ]]がいい」「[[さっぱり|さっぱり]]した性格だ」という意味で使われる。日本語では、主に味が「淡白だ」という意味や、物事が「簡単に」済む様子を言う。

また、「[[看板|かんばん]]」「[[口紅|くちべに]]」のように、[[台湾語|たいわんご]]では日本語に近い音のまま使われている言葉もある。一つの言葉が海を渡り、別の土地の[[暮らし|くらし]]の中で新しい意味をまとう。その[[軌跡|きせき]]をたどると、二つの社会の歴史が[[浮かび上がって|うかびあがって]]くる。`,
gl:{"歐吉桑":"歐吉桑（來自おじさん）","歐巴桑":"歐巴桑（來自おばさん）","阿莎力":"阿莎力（來自あっさり）","気前":"慷慨大方","さっぱり":"爽快、不拘小節","看板":"招牌","口紅":"口紅","台湾語":"台語","暮らし":"生活","軌跡":"軌跡","浮かび上がって":"浮現"}},

{d:84,lv:"n1",g:"ki",t:"成人の日と鏡開き",s:"成人之日與開鏡（1月11日）",
b:`一月の第二月曜日は「成人の日」。各地で「二十歳の集い」が開かれ、[[振袖|ふりそで]]や[[袴|はかま]]を着た若者たちで会場が華やぐ。

同じ頃、一月十一日には「[[鏡開き|かがみびらき]]」が行われる。正月に年神様に供えた[[鏡餅|かがみもち]]を下ろし、[[お汁粉|おしるこ]]や[[ぜんざい|ぜんざい]]にして食べる行事だ。神様の力が宿った餅を食べることで、一年の無病息災を願う。

注意したいのは、鏡餅を「切る」とは言わないこと。[[刃物|はもの]]を使うのは[[切腹|せっぷく]]を連想させるとして[[避け|さけ]]、木槌などで「割る」。さらに「割る」も縁起が悪いので、「開く」と言い換える。だから「鏡開き」なのだ。言葉の上での[[忌み|いみ]]を避ける、[[忌み言葉|いみことば]]の[[典型|てんけい]]と言える。`,
gl:{"振袖":"振袖（未婚女性的長袖和服）","袴":"袴（和服褲裙）","鏡開き":"開鏡（把供奉的鏡餅敲開來吃）","鏡餅":"鏡餅（新年供奉的圓年糕）","お汁粉":"紅豆湯","ぜんざい":"紅豆年糕湯","刃物":"刀具","切腹":"切腹","避け":"避開","忌み":"忌諱","忌み言葉":"忌諱詞","典型":"典型"}},

{d:85,lv:"pro",g:"wd",t:"「てくれる」の恩",s:"授受表現與「恩」",
b:`日本語で「友達が手伝った」と言うと、どこか[[素っ気なく|そっけなく]]聞こえる。普通は「友達が手伝ってくれた」と言う。この「てくれる」は、相手の行為が自分にとってありがたいものだったことを表す。

同じ出来事を、[[視点|してん]]を変えて「友達に手伝ってもらった」と言うこともできる。こちらは、自分が[[頼んだ|たのんだ]]ニュアンスが出やすい。そして、自分が他人のために何かをするときの「てあげる」は、目上の人に使うと[[恩着せがましく|おんきせがましく]]聞こえるので注意が必要だ。「先生に[[傘|かさ]]を貸してあげた」より、「先生に傘をお貸しした」のほうが[[自然|しぜん]]である。

中国語の「幫我」に近いようで、日本語の[[授受表現|じゅじゅひょうげん]]は、誰が誰に恩を与えたのかを、文法の中で常に[[意識|いしき]]させる。日本語の会話が丁寧に聞こえる理由の一つは、ここにあるのかもしれない。`,
gl:{"素っ気なく":"冷淡、乾巴巴","視点":"視角","頼んだ":"拜託了","恩着せがましく":"施恩於人似的","傘":"傘","自然":"自然","授受表現":"授受表現（あげる・くれる・もらう）","意識":"意識到"}},

{d:86,lv:"pro",g:"lt",t:"檸檬（冒頭）",s:"梶井基次郎《檸檬》開頭（1925）",src:"青空文庫（梶井基次郎『檸檬』）",
b:`[[えたいの知れない|えたいのしれない]][[不吉|ふきつ]]な[[塊|かたまり]]が私の心を[[始終|しじゅう]][[圧えつけて|おさえつけて]]いた。[[焦躁|しょうそう]]と言おうか、[[嫌悪|けんお]]と言おうか――酒を飲んだあとに[[宿酔|ふつかよい]]があるように、酒を毎日飲んでいると宿酔に相当した時期がやって来る。

三十一歳で亡くなった作家の代表作。[[憂鬱|ゆううつ]]を抱えた「私」が、一個の檸檬を手にして、心がふっと軽くなる。その短い時間を、[[鮮烈|せんれつ]]な色彩で描いた[[短編|たんぺん]]である。`,
gl:{"えたいの知れない":"莫名的、來路不明的","不吉":"不祥","塊":"團、塊","始終":"始終","圧えつけて":"壓住（今多寫「押さえつける」）","焦躁":"焦躁","嫌悪":"厭惡","宿酔":["宿醉","讀作「ふつかよい」。"],"憂鬱":"憂鬱","鮮烈":"鮮明強烈","短編":"短篇"}},

{d:87,lv:"pro",g:"es",t:"冬の朝のパン屋",s:"冬天早晨的麵包店",
b:`まだ暗い冬の朝、[[駅前|えきまえ]]の小さなパン屋にだけ、明かりがついている。[[ガラス|ガラス]]は内側から白く[[曇り|くもり]]、その向こうで店主が[[天板|てんばん]]を運んでいるのが見える。

日本のパン屋の[[品揃え|しなぞろえ]]は、ほかの国の人には不思議に映るらしい。あんパン、カレーパン、[[メロンパン|メロンパン]]、焼きそばパン。[[惣菜|そうざい]]や甘いものを[[挟んだり|はさんだり]]包んだりした「[[菓子パン|かしパン]]」「惣菜パン」は、日本で独自に発展した[[文化|ぶんか]]だ。あんパンは明治時代、[[饅頭|まんじゅう]]の発想をパンに応用して生まれたと言われる。

[[焼きたて|やきたて]]の匂いのする袋を抱えて、駅の階段を上る。指先は冷たいのに、[[胸元|むなもと]]だけが[[ほんのり|ほんのり]]温かい。冬の朝の、ささやかな[[贅沢|ぜいたく]]である。`,
gl:{"駅前":"車站前","ガラス":"玻璃","曇り":"起霧","天板":"烤盤","品揃え":"品項","メロンパン":"菠蘿麵包","惣菜":"熟食配菜","挟んだり":"夾著","菓子パン":"甜麵包","文化":"文化","饅頭":"豆沙包（日式饅頭）","焼きたて":"剛出爐","胸元":"胸口","ほんのり":"微微地","贅沢":"奢侈、享受"}},

{d:88,lv:"pro",g:"dl",t:"もうかりまっか",s:"大阪商人的招呼",l:1,
b:`「[[もうかりまっか|もうかりまっか]]」
「[[ぼちぼちでんな|ぼちぼちでんな]]」

大阪の商人の挨拶として有名なやりとりだ。「もうかっていますか」と聞かれ、「まあまあですね」と返す。実際にこう挨拶する人は今では少ないが、大阪の人の[[商売|しょうばい]]への[[意識|いしき]]の高さを表す[[決まり文句|きまりもんく]]として知られている。

大阪の言葉には、[[値段|ねだん]]をめぐる表現も多い。「[[まけて|まけて]]」は「安くして」、「[[勉強|べんきょう]]しときます」は「値引きします」という意味だ。そして別れ際には「[[おおきに|おおきに]]」。もともとは「おおきにありがとう」の[[略|りゃく]]で、「とても」という意味だった。`,
gl:{"もうかりまっか":["生意好嗎？","大阪腔。＝もうかっていますか。"],"ぼちぼちでんな":["馬馬虎虎啦","＝まあまあですね。"],"商売":"生意","意識":"意識","決まり文句":"套話","値段":"價錢","まけて":"算便宜一點","勉強":["打折","商人用語「勉強する」＝降價。"],"おおきに":"謝謝","略":"簡稱"}},

{d:89,lv:"pro",g:"bz",t:"クッション言葉",s:"緩衝用語",
b:`ビジネス日本語では、何かを頼んだり断ったりするとき、本題の前に「クッション言葉」と呼ばれる一言を置く。相手への[[衝撃|しょうげき]]をやわらげる[[緩衝材|かんしょうざい]]、という意味だ。

頼むときには「お忙しいところ恐れ入りますが」「お手数をおかけしますが」「[[お手すきの際に|おてすきのさいに]]」。断るときには「あいにくですが」「せっかくですが」「[[申し上げにくいのですが|もうしあげにくいのですが]]」。尋ねるときには「[[差し支えなければ|さしつかえなければ]]」「[[失礼ですが|しつれいですが]]」。

例えば、「資料を送ってください」より、「お手数をおかけしますが、資料をお送りいただけますでしょうか」のほうが、[[角|かど]]が立たない。[[回りくどい|まわりくどい]]と感じるかもしれないが、このひと手間が、日本の職場の人間関係を[[滑らか|なめらか]]にしている。`,
gl:{"衝撃":"衝擊","緩衝材":"緩衝材","お手すきの際に":"您有空的時候","申し上げにくいのですが":"雖然很難開口","差し支えなければ":"如果方便的話","失礼ですが":"冒昧請問","角":"稜角","回りくどい":"拐彎抹角","滑らか":"順暢"}}

{d:91,lv:"n1",g:"fi",t:"試験の朝",s:"掌篇：考試的早晨",
b:`母は何も言わずに、いつもより早く起きて[[味噌汁|みそしる]]を作っていた。[[験担ぎ|げんかつぎ]]の[[カツ丼|カツどん]]は、昨日の夜に済ませた。「試験に勝つ」の「カツ」だ。

玄関で靴を履いていると、母が[[使い捨てカイロ|つかいすてカイロ]]を二つ[[手渡して|てわたして]]きた。「一つは手、一つは[[背中|せなか]]」。それから[[お守り|おまもり]]。去年、合格[[祈願|きがん]]で有名な神社まで行って買ってきたものだ。

「行ってきます」と言うと、母は「行ってらっしゃい」とだけ言った。[[頑張って|がんばって]]とは言わなかった。それが母なりの[[気遣い|きづかい]]だと分かったのは、ずっと後になってからだ。

外は[[凍える|こごえる]]ほど寒かった。私はポケットの中のカイロを[[握りしめて|にぎりしめて]]、駅に向かって歩き出した。`,
gl:{"味噌汁":"味噌湯","験担ぎ":"討吉利","カツ丼":"豬排丼","使い捨てカイロ":"拋棄式暖暖包","手渡して":"親手遞給","背中":"背","お守り":"護身符","祈願":"祈願","頑張って":"加油","気遣い":"體貼","凍える":"凍僵","握りしめて":"緊握"}},

{d:92,lv:"pro",g:"ne",t:"共通テストという関門",s:"時事解說：大學入學共通考試",
b:`一月中旬の週末、日本全国で「大学入学共通テスト」が行われる。かつての「センター試験」を[[引き継いだ|ひきついだ]]試験で、国公立大学を目指す受験生の多くにとって最初の[[関門|かんもん]]となる。

共通テストでは、知識の[[暗記|あんき]]だけでなく、資料を読み取り、[[思考力|しこうりょく]]や判断力を問う問題が増えた。英語では[[リスニング|リスニング]]の比重が高まり、情報の科目も加わった。試験の[[在り方|ありかた]]は、教育の[[目標|もくひょう]]をそのまま映し出す。

この時期は雪の季節とも重なり、交通の乱れで試験開始が[[繰り下げ|くりさげ]]られることもある。また、私立大学では学力試験以外の[[推薦|すいせん]]や[[総合型選抜|そうごうがたせんばつ]]で入学する学生が増え、「一発勝負」の入試のあり方そのものが問い直されている。`,
gl:{"引き継いだ":"承接","関門":"關卡","暗記":"背誦","思考力":"思考能力","リスニング":"聽力","在り方":"應有的樣子、方式","目標":"目標","繰り下げ":"延後","推薦":"推甄","総合型選抜":"綜合型選拔（類似申請入學）"}},

{d:93,lv:"n1",g:"ki",t:"大寒",s:"節氣：大寒",
b:`二十四節気の最後、「大寒」。一年で最も寒さが厳しい頃とされ、実際に各地で最低気温を記録するのもこの時期だ。

それでも、大寒の次は立春。暦の上では、春はもうすぐそこまで来ている。冬の寒さの中に、春の兆しを探す言葉も多い。「[[春隣|はるどなり]]」は、春がすぐ隣まで来ていることを表す冬の[[季語|きご]]。「[[三寒四温|さんかんしおん]]」は、寒い日が三日ほど続くと、暖かい日が四日ほど続くという、冬から春への移り変わりを表す言葉だ。

大寒の日の早朝に[[汲んだ|くんだ]]水は「[[寒の水|かんのみず]]」と呼ばれ、一年[[腐らない|くさらない]]と言われた。この日に生まれた「[[大寒卵|だいかんたまご]]」は、[[金運|きんうん]]を呼ぶ縁起物として人気がある。寒さの[[底|そこ]]は、春への[[折り返し|おりかえし]]地点でもあるのだ。`,
gl:{"春隣":"春天將近（冬季季語）","季語":"季語","三寒四温":"三寒四溫","汲んだ":"汲取","寒の水":"寒水","腐らない":"不腐壞","大寒卵":"大寒蛋","金運":"財運","底":"谷底","折り返し":"折返"}},

{d:94,lv:"x",g:"cl",t:"おくのほそ道（冒頭）",s:"松尾芭蕉《奧之細道》開頭（1702刊）",src:"松尾芭蕉『おくのほそ道』",
b:`月日は[[百代の過客|はくたいのかかく]]にして、[[行かふ年|ゆきかうとし]]も又旅人也。舟の上に生涯をうかべ、馬の口とらへて老をむかふる物は、日々旅にして旅を[[栖|すみか]]とす。

【現代語訳】月日は永遠に旅を続ける旅人のようなもので、来ては去っていく年もまた旅人である。舟の上で一生を送る[[船頭|せんどう]]や、馬の[[轡|くつわ]]を取って老いを迎える[[馬子|まご]]は、毎日が旅であり、旅を住まいとしている。

冒頭の一文は、李白の「夫天地者萬物之逆旅，光陰者百代之過客」を踏まえている。芭蕉は中国の古典を[[自在|じざい]]に取り込みながら、日本語の[[散文|さんぶん]]の美しい[[リズム|リズム]]をつくり出した。`,
gl:{"百代の過客":["百代之過客、永恆的旅人","典出李白〈春夜宴從弟桃花園序〉。"],"行かふ年":["來來去去的歲月","歷史假名「行かふ」讀作「ゆきかう」。"],"栖":"住處","船頭":"船夫","轡":"馬嚼子","馬子":"馬夫","自在":"自如","散文":"散文","リズム":"節奏"}},

{d:95,lv:"pro",g:"co",t:"おひとりさま",s:"「一個人」的時代",
b:`「おひとりさまですか」。飲食店で一人で入ると、店員にこう聞かれる。かつては、一人で[[焼肉|やきにく]]やカラオケに行くことに、どこか[[気後れ|きおくれ]]を感じる人が多かった。

今では、一人客を[[歓迎|かんげい]]する店が増えた。[[仕切り|しきり]]のある[[カウンター席|カウンターせき]]だけのラーメン店、一人用の鍋、一人カラオケの専用ルーム。単身世帯が増え、一人で過ごす時間を[[積極的|せっきょくてき]]に楽しむ[[価値観|かちかん]]も広がった。

一人でいることは、必ずしも[[孤独|こどく]]ではない。誰にも気を遣わず、自分の[[ペース|ペース]]で食べ、考える時間は、人と過ごす時間と同じくらい大切だ。ただ、「おひとりさま」が選択であるうちはいい。[[望まない|のぞまない]]孤立にどう手を差し伸べるかは、社会全体の課題として残っている。`,
gl:{"焼肉":"燒肉","気後れ":"膽怯、不好意思","歓迎":"歡迎","仕切り":"隔板","カウンター席":"吧台座位","積極的":"積極","価値観":"價值觀","孤独":"孤獨","ペース":"步調","望まない":"不情願的"}},

{d:96,lv:"n1",g:"lt",t:"銀河鉄道の夜（冒頭）",s:"宮澤賢治《銀河鐵道之夜》開頭",src:"青空文庫（宮沢賢治『銀河鉄道の夜』）",
b:`「ではみなさんは、そういうふうに川だと[[云われたり|いわれたり]]、[[乳|ちち]]の流れたあとだと云われたりしていたこのぼんやりと白いものがほんとうは何か[[ご承知|ごしょうち]]ですか。」先生は、黒板に[[吊した|つるした]]大きな黒い[[星座|せいざ]]の図の、上から下へ白く[[けぶった|けぶった]][[銀河帯|ぎんがたい]]のようなところを指しながら、みんなに[[問|とい]]をかけました。

冬の夜空を見上げたくなる、宮沢賢治の未完の[[名作|めいさく]]。少年ジョバンニは、親友カムパネルラとともに、銀河を走る列車に乗って旅をする。`,
gl:{"云われたり":"被說成（「云う」＝言う）","乳":"乳汁（Milky Way 的意象）","ご承知":"知道（尊敬語）","吊した":"掛著的","星座":"星座","けぶった":"朦朧如煙的（原形：けぶる）","銀河帯":"銀河帶","問":"問題","名作":"名作"}},

{d:97,lv:"pro",g:"wd",t:"「つまらないものですが」",s:"謙遜的說法",
b:`日本で贈り物を渡すとき、「つまらないものですが」と言う習慣がある。外国の人には[[理解|りかい]]しにくい表現の代表格だろう。「つまらないものなら、なぜ[[渡す|わたす]]のか」と。

この言葉は、品物そのものの価値を言っているのではない。「あなたのような立派な方にとっては、取るに足らないものですが」と、相手を[[立てる|たてる]]ための[[謙遜|けんそん]]である。とはいえ、最近は「心ばかりのものですが」「お口に合うといいのですが」など、より[[前向き|まえむき]]な言い方を好む人も増えた。

結婚の挨拶で使われる「[[ふつつか者|ふつつかもの]]ですが」、自分の妻を「[[愚妻|ぐさい]]」と呼ぶ古い言い方も、同じ[[発想|はっそう]]から来ている。もっとも、「愚妻」は今では[[抵抗|ていこう]]を感じる人が多く、ほとんど使われなくなった。謙遜の[[作法|さほう]]も、時代とともに少しずつ形を変えている。`,
gl:{"理解":"理解","渡す":"交給","立てる":"抬舉、給面子","謙遜":"謙虛","前向き":"正面積極","ふつつか者":"不才、不周之人（謙稱）","愚妻":"拙荊","発想":"思維","抵抗":"抗拒感","作法":"規矩"}},

{d:98,lv:"n1",g:"tr",t:"雪の夜の温泉街",s:"雪夜的溫泉街",
b:`山形県の[[銀山温泉|ぎんざんおんせん]]は、雪の季節になると、まるで古い映画の[[一場面|いちばめん]]のような景色になる。川の両岸に、大正から昭和初期に建てられた木造の旅館が並び、夕暮れにはガス[[灯|とう]]がともる。

雪が[[しんしん|しんしん]]と降る夜、[[浴衣|ゆかた]]に[[丹前|たんぜん]]を[[羽織って|はおって]]外に出ると、橋の上から川の湯気と旅館の明かりが見える。[[吐く息|はくいき]]は白く、[[耳たぶ|みみたぶ]]が痛いほど冷たい。それでも、宿に戻って[[露天風呂|ろてんぶろ]]に入れば、[[一瞬|いっしゅん]]で体がほどけていく。

台湾にも北投や礁溪などの温泉地があり、[[湯|ゆ]]に[[浸かる|つかる]]文化は日本統治時代に広まったものも多い。雪を見ながら湯に浸かる[[体験|たいけん]]は、台湾ではなかなかできない。一度は味わってみたい冬の[[醍醐味|だいごみ]]だ。`,
gl:{"銀山温泉":"銀山溫泉","一場面":"一幕","灯":"燈","しんしん":"（雪）靜靜地下","浴衣":"浴衣","丹前":"棉袍（穿在浴衣外）","羽織って":"披上","吐く息":"呼出的氣","耳たぶ":"耳垂","露天風呂":"露天浴池","一瞬":"一瞬間","湯":"熱水、溫泉","浸かる":"泡（在水裡）","体験":"體驗","醍醐味":"精髓、真正的樂趣"}},

{d:99,lv:"pro",g:"es",t:"百日目の栞",s:"第一百天的書籤",
b:`百日前、秋の終わりに、最初の一編を置いた。山道で枝を折って目印にした人の話から始めて、霜が降り、雪が積もり、年が明けて、今は大寒を過ぎたところだ。

この百日のあいだに、どれだけの言葉を[[拾った|ひろった]]だろう。知っている漢字なのに意味が違って驚いたもの。方言の[[響き|ひびき]]に笑ったもの。千年前の文章が、[[意外|いがい]]なほど今の気持ちに近くて[[はっと|はっと]]したもの。単語帳に残った言葉は、あなたがこの百日を歩いた[[足跡|あしあと]]そのものだ。

栞は、読み終えた本からは[[抜き取られる|ぬきとられる]]。でも、本当に好きな本には、栞を挟んだまま[[しまって|しまって]]おく人もいる。いつかまた開いたとき、どこまで来たかが分かるように。

明日からは、また最初の一編に戻る。二度目に読む「栞」は、きっと少し違って見えるはずだ。`,
gl:{"拾った":"拾起","響き":"音調","意外":"意外","はっと":"猛然驚覺","足跡":"足跡","抜き取られる":"被抽出","しまって":"收起來"}}
);
