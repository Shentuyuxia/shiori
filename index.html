。也有人指出，負擔被轉嫁到管理職身上，這種弊端也值得關注。","zh-Hans":"但是，现场的真实感受未必如此。工作量没有改变，时间却被削减，带回家加班或无偿加班来凑数的例子也层出不穷。也有人指出，负担被转嫁到管理职身上，这种弊端也值得关注。","en":"However, the reality on the ground is not necessarily the same. The amount of work hasn't changed, but the time has been cut, and there are countless cases of taking work home or doing unpaid overtime to make things add up. It has also been pointed out that the burden is shifted onto managers, which is a harmful side effect.","de":"However, the reality on the ground is not necessarily the same. The amount of work hasn't changed, but the time has been cut, and there are countless cases of taking work home or doing unpaid overtime to make things add up. It has also been pointed out that the burden is shifted onto managers, which is a harmful side effect."},{"zh-Hant":"只完善制度，恐怕會淪為有名無實。真正迫切的課題，是根本性地重新檢視工作本身，以及驗證這些改革的機制。","zh-Hans":"只完善制度，恐怕会沦为有名无实。真正迫切的课题，是根本性地重新查看工作本身，以及验证这些改革的机制。","en":"Simply improving the system may end up as nothing more than a hollow promise. What is urgently needed is a fundamental effort to review the work itself, along with a mechanism to verify whether it is working.","de":"Simply improving the system may end up as nothing more than a hollow promise. What is urgently needed is a fundamental effort to review the work itself, along with a mechanism to verify whether it is working."}],"kansai":[{"zh-Hant":"「你那個多少錢買的？」\n「我記得是三千圓吧」\n「好貴！那種東西，我家附近半價就在賣啊」\n「真的嗎？那下次帶我去吧」\n「好啊。不過那家老闆話很多，你要有心理準備喔」","zh-Hans":"「你那个多少钱买的？」\n「我记得是三千圆吧」\n「好贵！那种东西，我家附近半价就在卖啊」\n「真的吗？那下次带我去吧」\n「好啊。不过那家老板话很多，你要有心理准备喔」","en":"\"How much did you pay for that?\"\n\"I think it was three thousand yen.\"\n\"That's expensive! They sell that kind of thing at half price near my place.\"\n\"Really? Then take me there next time.\"\n\"Sure. But the shopkeeper there talks a lot, so be prepared.\"","de":"\"How much did you pay for that?\"\n\"I think it was three thousand yen.\"\n\"That's expensive! They sell that kind of thing at half price near my place.\"\n\"Really? Then take me there next time.\"\n\"Sure. But the shopkeeper there talks a lot, so be prepared.\""}],"kusamakura":[{"zh-Hant":"一邊攀登山路，一邊這樣想著。","zh-Hans":"一边攀登山路，一边这样想着。","en":"As I climbed the mountain path, I thought this:","de":"As I climbed the mountain path, I thought this:"},{"zh-Hant":"講道理就會與人衝突，順著感情走就會被沖走，一味堅持己見又會活得拘束。總之，人世間真是難住。","zh-Hans":"讲道理就会与人冲突，顺着感情走就会被冲走，一味坚持己见又会活得拘束。总之，人世间真是难住。","en":"Insist on reason and you clash with others; follow your feelings and you get swept away; stubbornly hold to your own will and you feel cramped. In short, this world is hard to live in.","de":"Insist on reason and you clash with others; follow your feelings and you get swept away; stubbornly hold to your own will and you feel cramped. In short, this world is hard to live in."},{"zh-Hant":"當難住的感覺加深，就會想搬到更便宜的地方。但當人領悟到，無論搬到哪裡都一樣難住時，詩便誕生了，畫也完成了。","zh-Hans":"当难住的感觉加深，就会想搬到更便宜的地方。但当人领悟到，无论搬到哪里都一样难住时，诗便诞生了，画也完成了。","en":"When the sense of difficulty grows, you want to move somewhere cheaper. But when you realize that wherever you go it will be just as hard, poetry is born, and paintings come into being.","de":"When the sense of difficulty grows, you want to move somewhere cheaper. But when you realize that wherever you go it will be just as hard, poetry is born, and paintings come into being."}],"kumo":[{"zh-Hant":"那是某一天的事。釋迦牟尼佛獨自在極樂世界的蓮花池畔悠閒地散步。","zh-Hans":"那是某一天的事。释迦牟尼佛独自在极乐世界的莲花池畔悠闲地散步。","en":"It was one day. Lord Buddha was strolling alone along the edge of the lotus pond in Paradise.","de":"It was one day. Lord Buddha was strolling alone along the edge of the lotus pond in Paradise."},{"zh-Hant":"池中盛開的蓮花，朵朵都像珠玉一般潔白，花心裡的金色花蕊中，散發出難以言喻的美好香氣，不斷地溢滿四周。想必極樂世界正是清晨時分吧。","zh-Hans":"池中盛开的莲花，朵朵都像珠玉一般洁白，花心里的金色花蕊中，散发出难以言喻的美好香气，不断地溢满四周。想必极乐世界正是清晨时分吧。","en":"The lotus flowers blooming in the pond were all as white as jewels, and from the golden stamens at their centers rose an indescribably sweet fragrance that filled the surroundings without end. It must have been morning in Paradise.","de":"The lotus flowers blooming in the pond were all as white as jewels, and from the golden stamens at their centers rose an indescribably sweet fragrance that filled the surroundings without end. It must have been morning in Paradise."}],"makura":[{"zh-Hant":"秋天是黃昏時分。夕陽漸漸接近山稜線，烏鴉們正急急忙忙飛回巢裡，三隻四隻、兩隻三隻地飛過，這景象也令人動容。更何況是大雁成列飛過，看起來小小的，實在很有情趣。","zh-Hans":"秋天是黄昏时分。夕阳渐渐接近山棱线，乌鸦们正急急忙忙飞回巢里，三只四只、两只三只地飞过，这景象也令人动容。更何况是大雁成列飞过，看起来小小的，实在很有情趣。","en":"In autumn, it is the evening dusk. When the setting sun draws close to the mountain ridge, crows hurry off to their roosts, three or four, or two or three, flying in a rush, and even that stirs the heart. How much more so when wild geese fly in a line, looking tiny. That is truly charming.","de":"In autumn, it is the evening dusk. When the setting sun draws close to the mountain ridge, crows hurry off to their roosts, three or four, or two or three, flying in a rush, and even that stirs the heart. How much more so when wild geese fly in a line, looking tiny. That is truly charming."},{"zh-Hant":"太陽完全落下之後，風聲、蟲鳴等等，更是無法言喻。","zh-Hans":"太阳完全落下之后，风声、虫鸣等等，更是无法言喻。","en":"After the sun has completely set, the sound of the wind, the chirping of insects, and so on are beyond words.","de":"After the sun has completely set, the sound of the wind, the chirping of insects, and so on are beyond words."}],"d0":[{"zh-Hant":"「栞」原本寫作「枝折り」。走在山路上的人，為了回程不迷路，會折斷樹枝作為標記。後來這個意思轉而指夾在正在讀的書中的紙片。","zh-Hans":"「栞」原本写作「枝折り」。走在山路上的人，为了回程不迷路，会折断树枝作为标记。后来这个意思转而指夹在正在读的书中的纸片。","en":"The character 「栞」 was originally written 「枝折り」, meaning \"breaking branches.\" People walking mountain paths broke branches to mark their way back so they would not get lost. The meaning later shifted to refer to the slip of paper placed in a book you are reading.","de":"The character 「栞」 was originally written 「枝折り」, meaning \"breaking branches.\" People walking mountain paths broke branches to mark their way back so they would not get lost. The meaning later shifted to refer to the slip of paper placed in a book you are reading."},{"zh-Hant":"所以栞不只是標示「讀到哪裡」的東西。對於走進陌生森林的人而言，它也是讓人回頭看清來時之路的線索。","zh-Hans":"所以栞不只是标示「读到哪里」的东西。对于走进陌生森林的人而言，它也是让人回头看清来时之路的线索。","en":"So a bookmark is not merely a sign of how far you have read. For someone who has entered an unfamiliar forest, it is also a clue for looking back at the path they came by.","de":"So a bookmark is not merely a sign of how far you have read. For someone who has entered an unfamiliar forest, it is also a clue for looking back at the path they came by."},{"zh-Hant":"每學會一個新詞，就在心裡折斷一根小樹枝。一百天後回頭看時，若那些枝條已連成點點滴滴的道路，那將是很美好的事。從今天起，每天一篇。不必太用力，請慢慢來。","zh-Hans":"每学会一个新词，就在心里折断一根小树枝。一百天后回头看时，若那些枝条已连成点点滴滴的道路，那将是很美好的事。从今天起，每天一篇。不必太用力，请慢慢来。","en":"Each time you learn a new word, you break a small branch in your heart. A hundred days from now, if you look back and those branches have become a dotted path, that would be wonderful. Starting today, one piece a day. No need to push too hard; take your time.","de":"Each time you learn a new word, you break a small branch in your heart. A hundred days from now, if you look back and those branches have become a dotted path, that would be wonderful. Starting today, one piece a day. No need to push too hard; take your time."}],"d1":[{"zh-Hant":"有一個故事：台灣的朋友向日本同事介紹自己的丈夫時說「這位是我的愛人」，結果場面頓時凍結。中文的「愛人」在某些地區指配偶，但在日語裡，幾乎毫無例外地是「外遇對象」的意思。","zh-Hans":"有一个故事：台湾的朋友向日本同事介绍自己的丈夫时说「这位是我的爱人」，结果场面顿时冻结。中文的「爱人」在某些地区指配偶，但在日语里，几乎毫无例外地是「外遇对象」的意思。","en":"There is a story about a Taiwanese friend who introduced her husband to a Japanese colleague as \"my 愛人,\" and the room instantly froze. In Chinese, 「愛人」 refers to a spouse in some regions, but in Japanese it almost always means a lover outside marriage, without exception.","de":"There is a story about a Taiwanese friend who introduced her husband to a Japanese colleague as \"my 愛人,\" and the room instantly froze. In Chinese, 「愛人」 refers to a spouse in some regions, but in Japanese it almost always means a lover outside marriage, without exception."},{"zh-Hant":"類似的陷阱還有很多。日語的「大家」通常讀作「おおや」，指公寓的房東；若讀作「たいか」，則指某個領域的第一把交椅。還有「小人」，讀作「こびと」是童話裡的角色，但在遊樂園的票價表上讀作「しょうにん」，也就是兒童票。","zh-Hans":"类似的陷阱还有很多。日语的「大家」通常读作「おおや」，指公寓的房东；若读作「たいか」，则指某个领域的第一把交椅。还有「小人」，读作「こびと」是童话里的角色，但在游乐园的票价表上读作「しょうにん」，也就是儿童票。","en":"There are other similar traps. The Japanese 「大家」 is usually read 「おおや」 and means the landlord of an apartment; read 「たいか」, it refers to the leading authority in a field. Also 「小人」 read 「こびと」 is a character in fairy tales, but on an amusement park price list, it is read 「しょうにん」, meaning a child's fare.","de":"There are other similar traps. The Japanese 「大家」 is usually read 「おおや」 and means the landlord of an apartment; read 「たいか」, it refers to the leading authority in a field. Also 「小人」 read 「こびと」 is a character in fairy tales, but on an amusement park price list, it is read 「しょうにん」, meaning a child's fare."},{"zh-Hant":"正因為看得懂漢字，才更需要留意讀音與上下文。","zh-Hans":"正因为看得懂汉字，才更需要留意读音与上下文。","en":"Precisely because you can read the kanji, you need to pay attention to pronunciation and context.","de":"Precisely because you can read the kanji, you need to pay attention to pronunciation and context."}],"d2":[{"zh-Hant":"「你在幹嘛？」\n「明天報告的準備。超緊張的啦。」\n「沒問題啦，你的話，總會有辦法的吧？」\n「別說得那麼簡單。資料，還有一半都沒做完呢。」\n「真拿你沒辦法呢。請你吃拉麵，加油喔。」","zh-Hans":"「你在干嘛？」\n「明天报告的准备。超紧张的啦。」\n「没问题啦，你的话，总会有办法的吧？」\n「别说得那么简单。数据，还有一半都没做完呢。」\n「真拿你没办法呢。请你吃拉面，加油喔。」","en":"\"What are you doing?\"\n\"Preparing for tomorrow's presentation. I'm super nervous.\"\n\"Don't worry, you'll manage somehow, right?\"\n\"Don't say it so easily. I haven't even finished half the materials.\"\n\"Oh well. I'll treat you to ramen, so do your best.\"","de":"\"What are you doing?\"\n\"Preparing for tomorrow's presentation. I'm super nervous.\"\n\"Don't worry, you'll manage somehow, right?\"\n\"Don't say it so easily. I haven't even finished half the materials.\"\n\"Oh well. I'll treat you to ramen, so do your best.\""}],"d3":[{"zh-Hant":"深山裡　踏過楓葉的　鳴叫的鹿\n聽見牠鳴聲之時　秋天真是悲傷啊\n（猿丸大夫）","zh-Hans":"深山里　踏过枫叶的　鸣叫的鹿\n听见牠鸣声之时　秋天真是悲伤啊\n（猿丸大夫）","en":"Deep in the mountains, where stags tread on fallen maple leaves and call out,\nwhen I hear their cries, autumn is truly sad.\n(Sarumaru Dayū)","de":"Deep in the mountains, where stags tread on fallen maple leaves and call out,\nwhen I hear their cries, autumn is truly sad.\n(Sarumaru Dayū)"},{"zh-Hant":"神代以來未曾聽聞　龍田川\n竟將水染成了深紅色\n（在原業平）","zh-Hans":"神代以来未曾听闻　龙田川\n竟将水染成了深红色\n（在原业平）","en":"Not even in the age of the gods was it ever heard\nthat the Tatsuta River would be dyed crimson, water and all.\n(Ariwara no Narihira)","de":"Not even in the age of the gods was it ever heard\nthat the Tatsuta River would be dyed crimson, water and all.\n(Ariwara no Narihira)"},{"zh-Hant":"第一首是在深山中，聽著踩著落葉鳴叫的鹿聲，感受秋天的寂寞之歌。第二首則是把鋪滿河面的紅葉，比作染成真紅的布，是一首華麗的和歌。","zh-Hans":"第一首是在深山中，听着踩着落叶鸣叫的鹿声，感受秋天的寂寞之歌。第二首则是把铺满河面的红叶，比作染成真红的布，是一首华丽的和歌。","en":"The first poem hears in the stag's call, as it walks through fallen leaves deep in the mountains, the loneliness of autumn. The second likens the maple leaves that cover the river's surface to cloth dyed a brilliant crimson, a dazzling poem.","de":"The first poem hears in the stag's call, as it walks through fallen leaves deep in the mountains, the loneliness of autumn. The second likens the maple leaves that cover the river's surface to cloth dyed a brilliant crimson, a dazzling poem."}],"d4":[{"zh-Hant":"二十四節氣中的「霜降」，指露水開始變成霜的時節。在曆法上，它是秋天的最後一個節氣，過了這一天，就是立冬了。","zh-Hans":"二十四节气中的「霜降」，指露水开始变成霜的时节。在历法上，它是秋天的最后一个节气，过了这一天，就是立冬了。","en":"「霜降」, Frost's Descent, is one of the 24 solar terms, when dew begins to turn into frost. On the calendar, it is the last solar term of autumn; once it passes, it is 立冬, the start of winter.","de":"「霜降」, Frost's Descent, is one of the 24 solar terms, when dew begins to turn into frost. On the calendar, it is the last solar term of autumn; once it passes, it is 立冬, the start of winter."},{"zh-Hant":"實際上，東京要降霜還早得很。不過，早晚的寒意一天比一天深，山裡的紅葉也正值最美的時候。還沒換季的人，差不多該把冬天的衣物拿出來了。","zh-Hans":"实际上，东京要降霜还早得很。不过，早晚的寒意一天比一天深，山里的红叶也正值最美的时候。还没换季的人，差不多该把冬天的衣物拿出来了。","en":"In reality, frost in Tokyo is still a long way off. Still, the morning and evening chill grows sharper by the day, and the autumn leaves in the mountains are reaching their peak. Anyone who hasn't yet switched their wardrobes should probably start getting out their winter clothes.","de":"In reality, frost in Tokyo is still a long way off. Still, the morning and evening chill grows sharper by the day, and the autumn leaves in the mountains are reaching their peak. Anyone who hasn't yet switched their wardrobes should probably start getting out their winter clothes."},{"zh-Hant":"對曾經住在台灣的人來說，「霜」這個字本身，或許會讓人覺得像是遠方國家的語言。呼出的氣息變成白色的第一個早晨，已經近在眼前了。","zh-Hans":"对曾经住在台湾的人来说，「霜」这个字本身，或许会让人觉得像是远方国家的语言。呼出的气息变成白色的第一个早晨，已经近在眼前了。","en":"For someone who once lived in Taiwan, the character 「霜」 itself might feel like a word from a faraway country. The first morning when your breath turns white is already almost here.","de":"For someone who once lived in Taiwan, the character 「霜」 itself might feel like a word from a faraway country. The first morning when your breath turns white is already almost here."}],"d5":[{"zh-Hant":"「本日的司會由我來擔任」「已經拜讀過資料了」——在商務場合，幾乎每天都會聽到這樣的表達。","zh-Hans":"「本日的司会由我来担任」「已经拜读过数据了」——在商务场合，几乎每天都会听到这样的表达。","en":"\"I will have the honor of serving as today's moderator\" and \"I have had the opportunity to review the materials\"—you hear expressions like these almost every day in business settings.","de":"\"I will have the honor of serving as today's moderator\" and \"I have had the opportunity to review the materials\"—you hear expressions like these almost every day in business settings."},{"zh-Hant":"「させていただく」本來的意思，是接受對方的許可或恩惠而做某件事。所以「請讓我休假，去旅行」這樣的說法，是有道理的。","zh-Hans":"「させていただく」本来的意思，是接受对方的许可或恩惠而做某件事。所以「请让我休假，去旅行」这样的说法，是有道理的。","en":"Originally, 「させていただく」 means doing something after receiving permission or a favor from the other party. So a phrase like 「お休みをいただいて、旅行に行かせていただきます」 has a proper reason behind it.","de":"Originally, 「させていただく」 means doing something after receiving permission or a favor from the other party. So a phrase like 「お休みをいただいて、旅行に行かせていただきます」 has a proper reason behind it."},{"zh-Hant":"反過來，如果用在與對方許可無關的場合，會給人過度、有時甚至卑躬屈膝的印象。至於「拝見させていただく」，「拝見する」本身已經是謙讓語，因此也有人指出這是雙重敬語。拿不定主意的時候，「務めます」「拝見しました」就已經足夠了。","zh-Hans":"反过来，如果用在与对方许可无关的场合，会给人过度、有时甚至卑躬屈膝的印象。至于「拝见させていただく」，「拝见する」本身已经是谦让语，因此也有人指出这是双重敬语。拿不定主意的时候，「务めます」「拝见しました」就已经足够了。","en":"On the other hand, using it in situations unrelated to the other party's permission can create an impression of excessive humility, and sometimes even servility. As for 「拝見させていただく」, since 「拝見する」 is already a humble form, some point out that it is a double honorific. When in doubt, 「務めます」 or 「拝見しました」 is perfectly sufficient.","de":"On the other hand, using it in situations unrelated to the other party's permission can create an impression of excessive humility, and sometimes even servility. As for 「拝見させていただく」, since 「拝見する」 is already a humble form, some point out that it is a double honorific. When in doubt, 「務めます」 or 「拝見しました」 is perfectly sufficient."}],"d6":[{"zh-Hant":"居酒屋裡人一到齊，就有人說「先來杯啤酒吧」。還沒打開菜單，第一杯酒就定下來了。這句成了慣例的開場白，很能體現日本的集體文化。","zh-Hans":"居酒屋里人一到齐，就有人说「先来杯啤酒吧」。还没打开菜单，第一杯酒就定下来了。这句成了惯例的开场白，很能体现日本的集体文化。","en":"When everyone has gathered at an izakaya, someone says, \"Let's start with beer.\" Before anyone opens the menu, the first drink is already decided. This set phrase reflects Japan's group culture well.","de":"When everyone has gathered at an izakaya, someone says, \"Let's start with beer.\" Before anyone opens the menu, the first drink is already decided. This set phrase reflects Japan's group culture well."},{"zh-Hant":"首先，大家點一樣的東西，點餐就能很快完成，乾杯也能早點開始。更重要的是，第一杯不去強調個人的喜好，這裡面有一種不言而喻的體貼。","zh-Hans":"首先，大家点一样的东西，点餐就能很快完成，干杯也能早点开始。更重要的是，第一杯不去强调个人的喜好，这里面有一种不言而喻的体贴。","en":"First, if everyone orders the same thing, ordering is quick and the toast can begin sooner. More importantly, not insisting on personal preference with the first drink reflects an unspoken consideration.","de":"First, if everyone orders the same thing, ordering is quick and the toast can begin sooner. More importantly, not insisting on personal preference with the first drink reflects an unspoken consideration."},{"zh-Hant":"不過，近來這樣的習慣也在慢慢改變。不喝酒的人、一開始就點威士忌蘇打的人越來越多，不受「先來啤酒」束縛的氛圍正在擴散。無論好壞，乾杯的景象正逐漸變得多樣起來。","zh-Hans":"不过，近来这样的习惯也在慢慢改变。不喝酒的人、一开始就点威士忌苏打的人越来越多，不受「先来啤酒」束缚的氛围正在扩散。无论好坏，干杯的景象正逐渐变得多样起来。","en":"However, this custom is slowly changing. More people don't drink alcohol, or order a highball right from the start, and an atmosphere free from the \"beer first\" habit is spreading. For better or worse, the scene of toasting is gradually becoming more varied.","de":"However, this custom is slowly changing. More people don't drink alcohol, or order a highball right from the start, and an atmosphere free from the \"beer first\" habit is spreading. For better or worse, the scene of toasting is gradually becoming more varied."}],"d7":[{"zh-Hant":"我是貓。名字還沒有。","zh-Hans":"我是猫。名字还没有。","en":"I am a cat. As yet I have no name.","de":"I am a cat. As yet I have no name."},{"zh-Hant":"我究竟生在哪裡，完全摸不著頭緒。只記得自己好像是在一個陰暗潮濕的地方，喵喵地哭著。","zh-Hans":"我究竟生在哪里，完全摸不着头绪。只记得自己好像是在一个阴暗潮湿的地方，喵喵地哭着。","en":"Where I was born, I have not the slightest idea. I only remember crying meow-meow in some dim, damp place.","de":"Where I was born, I have not the slightest idea. I only remember crying meow-meow in some dim, damp place."}],"d8":[{"zh-Hant":"在台灣說到「便當」，很多人會想到熱騰騰的白飯上放著排骨或雞腿、分量十足的餐點。而日本的便當，則是為了即使涼了也能好吃而做的。","zh-Hans":"在台湾说到「便当」，很多人会想到热腾腾的白饭上放着排骨或鸡腿、分量十足的餐点。而日本的便当，则是为了即使凉了也能好吃而做的。","en":"In Taiwan, when people say 便當, many picture a hearty meal of warm rice topped with pork chop or chicken leg. Japanese bento, on the other hand, are made so that they taste good even when cold.","de":"In Taiwan, when people say 便當, many picture a hearty meal of warm rice topped with pork chop or chicken leg. Japanese bento, on the other hand, are made so that they taste good even when cold."},{"zh-Hant":"這個差異，也反映了重新用蒸籠或微波爐加熱的飲食文化，與作好後趁冷吃的文化之間的不同。日本便當常用醋、梅干，或偏重的調味，是為了不易變質而下的功夫。","zh-Hans":"这个差异，也反映了重新用蒸笼或微波炉加热的饮食文化，与作好后趁冷吃的文化之间的不同。日本便当常用醋、梅干，或偏重的调味，是为了不易变质而下的功夫。","en":"This difference also reflects a gap between a culture that reheats food in a steamer or microwave and a culture that eats prepared food cold. Japanese bento often use vinegar, pickled plums, or stronger seasoning, a craft meant to keep the food from spoiling.","de":"This difference also reflects a gap between a culture that reheats food in a steamer or microwave and a culture that eats prepared food cold. Japanese bento often use vinegar, pickled plums, or stronger seasoning, a craft meant to keep the food from spoiling."},{"zh-Hant":"順帶一提，台灣的「便當」這個詞本身，據說是日治時期從日語傳入的。同一個詞，隔著海，在不同的土地上長成了不同的味道。","zh-Hans":"顺带一提，台湾的「便当」这个词本身，据说是日治时期从日语传入的。同一个词，隔着海，在不同的土地上长成了不同的味道。","en":"By the way, the word 便當 in Taiwan is said to have come from Japanese during the Japanese colonial period. The same word, separated by the sea, grew into different flavors in different lands.","de":"By the way, the word 便當 in Taiwan is said to have come from Japanese during the Japanese colonial period. The same word, separated by the sea, grew into different flavors in different lands."}],"d9":[{"zh-Hant":"日本長期被稱為「現金大國」。治安良好、假鈔少，而且到處都有ATM。在那樣的社會裡，隨身帶著現金既不麻煩也不擔心。","zh-Hans":"日本长期被称为「现金大国」。治安良好、假钞少，而且到处都有ATM。在那样的社会里，随身带着现金既不麻烦也不担心。","en":"Japan has long been called a \"cash-heavy nation.\" Public safety is good, counterfeit bills are rare, and ATMs are everywhere. In such a society, carrying cash around caused little inconvenience or worry.","de":"Japan has long been called a \"cash-heavy nation.\" Public safety is good, counterfeit bills are rare, and ATMs are everywhere. In such a society, carrying cash around caused little inconvenience or worry."},{"zh-Hant":"這種狀況在近幾年有了很大的改變。手機的QR code支付迅速普及，就算是小店，能刷卡或使用電子錢包也已經不稀奇了。政府的點數回饋等推動，以及傳染病流行時對「非接觸」的需求，也加速了這種變化。","zh-Hans":"这种状况在近几年有了很大的改变。手机的QR code支付迅速普及，就算是小店，能刷卡或使用电子钱包也已经不稀奇了。政府的点数回馈等推动，以及传染病流行时对「非接触」的需求，也加速了这种变化。","en":"This situation has changed dramatically in recent years. QR code payments on smartphones have spread rapidly, and it is no longer unusual for even small shops to accept cards or e-money. Government point-back campaigns and the demand for \"contactless\" during infectious disease outbreaks also accelerated the change.","de":"This situation has changed dramatically in recent years. QR code payments on smartphones have spread rapidly, and it is no longer unusual for even small shops to accept cards or e-money. Government point-back campaigns and the demand for \"contactless\" during infectious disease outbreaks also accelerated the change."},{"zh-Hant":"不過，也有人在被遺忘的一方發出聲音，例如為手續費負擔而煩惱的小型店家，以及不習慣操作的老年人。在便利的背後，究竟是誰在承擔？這個問題依然存在。","zh-Hans":"不过，也有人在被遗忘的一方发出声音，例如为手续费负担而烦恼的小型店家，以及不习惯操作的老年人。在便利的背后，究竟是谁在承担？这个问题依然存在。","en":"However, some voices come from those left behind: small shops struggling with the burden of transaction fees, and elderly people who are not used to the operations. Behind the convenience, the question remains of who is bearing the cost.","de":"However, some voices come from those left behind: small shops struggling with the burden of transaction fees, and elderly people who are not used to the operations. Behind the convenience, the question remains of who is bearing the cost."}],"d10":[{"zh-Hant":"奶奶寄來了一個信封。信紙只有一張，上面用略微顫抖的字寫著：「庭院的楓樹今年也很漂亮。」","zh-Hans":"奶奶寄来了一个信封。信纸只有一张，上面用略微颤抖的字写着：「庭院的枫树今年也很漂亮。」","en":"An envelope arrived from my grandmother. There was only one sheet of letter paper, on which she had written in slightly trembling handwriting: \"The maple tree in the garden is beautiful again this year.\"","de":"An envelope arrived from my grandmother. There was only one sheet of letter paper, on which she had written in slightly trembling handwriting: \"The maple tree in the garden is beautiful again this year.\""},{"zh-Hant":"信封底部裝著一片紅色的葉子。大概是做成了壓葉吧，薄薄的、平平的，對著光舉起來，可以看見細密的葉脈透出來。","zh-Hans":"信封底部装着一片红色的叶子。大概是做成了压叶吧，薄薄的、平平的，对着光举起来，可以看见细密的叶脉透出来。","en":"At the bottom of the envelope was a single red leaf. She had probably pressed it. It was thin and flat, and when I held it up to the light, its fine veins showed through.","de":"At the bottom of the envelope was a single red leaf. She had probably pressed it. It was thin and flat, and when I held it up to the light, its fine veins showed through."},{"zh-Hant":"打電話可以馬上說話。寄照片的話，也能傳送更鮮豔的顏色。即便如此，奶奶每年到了這個季節，還是特地把一片葉子用紙包好寄來。","zh-Hans":"打电话可以马上说话。寄照片的话，也能发送更鲜艳的颜色。即便如此，奶奶每年到了这个季节，还是特地把一片叶子用纸包好寄来。","en":"A phone call lets us talk right away, and a photo can send brighter colors. Even so, every year at this season, my grandmother takes the trouble to wrap a single leaf in paper and send it.","de":"A phone call lets us talk right away, and a photo can send brighter colors. Even so, every year at this season, my grandmother takes the trouble to wrap a single leaf in paper and send it."},{"zh-Hant":"我把那片葉子夾進了正在讀的書裡。感覺今年的秋天，似乎會就此停留在那裡。","zh-Hans":"我把那片叶子夹进了正在读的书里。感觉今年的秋天，似乎会就此停留在那里。","en":"I tucked that leaf into the book I was reading. It felt as if this autumn might stay there, frozen in place.","de":"I tucked that leaf into the book I was reading. It felt as if this autumn might stay there, frozen in place."}],"d11":[{"zh-Hant":"日語被認為是擬聲擬態詞非常豐富的語言。光是雨，就有好幾個詞用來區分它的下法。","zh-Hans":"日语被认为是拟声拟态词非常丰富的语言。光是雨，就有好几个词用来区分它的下法。","en":"Japanese is said to be a language rich in onomatopoeia. Even for rain alone, there are many words to distinguish how it falls.","de":"Japanese is said to be a language rich in onomatopoeia. Even for rain alone, there are many words to distinguish how it falls."},{"zh-Hant":"「しとしと」指安靜、細密、綿長持續下著的雨，是梅雨典型的雨。「ぱらぱら」是稀稀落落開始下的雨。「ざあざあ」是發出聲響、激烈下著的雨，也叫「どしゃ降り」。","zh-Hans":"「しとしと」指安静、细密、绵长持续下着的雨，是梅雨典型的雨。「ぱらぱら」是稀稀落落开始下的雨。「ざあざあ」是发出声响、激烈下着的雨，也叫「どしゃ降り」。","en":"「しとしと」 is quiet, fine rain that keeps falling for a long time, the very essence of rainy-season rain. 「ぱらぱら」 is rain that begins to fall sparsely. 「ざあざあ」 is rain that falls noisily and hard, also called 「どしゃ降り」.","de":"「しとしと」 is quiet, fine rain that keeps falling for a long time, the very essence of rainy-season rain. 「ぱらぱら」 is rain that begins to fall sparsely. 「ざあざあ」 is rain that falls noisily and hard, also called 「どしゃ降り」."},{"zh-Hant":"也有些詞不是描寫雨本身，而是描寫雨帶來的空氣。「じめじめ」是濕氣重、令人不舒服的樣子；「しっとり」則是帶著適度濕潤、令人感到沉靜安穩的樣子。同樣是濕氣，評價卻截然相反，很有意思。","zh-Hans":"也有些词不是描写雨本身，而是描写雨带来的空气。「じめじめ」是湿气重、令人不舒服的样子；「しっとり」则是带着适度湿润、令人感到沉静安稳的样子。同样是湿气，评价却截然相反，很有意思。","en":"Some words describe not the rain itself but the air it brings. 「じめじめ」 describes a muggy, unpleasant dampness, while 「しっとり」 describes a moderate moistness that feels calm and settled. It is interesting that the same humidity can be judged in completely opposite ways.","de":"Some words describe not the rain itself but the air it brings. 「じめじめ」 describes a muggy, unpleasant dampness, while 「しっとり」 describes a moderate moistness that feels calm and settled. It is interesting that the same humidity can be judged in completely opposite ways."},{"zh-Hant":"中文會用「毛毛雨」「傾盆大雨」這樣的漢字來描繪，日語則用聲音來描繪。或許可以說，這是一種用耳朵閱讀的語言。","zh-Hans":"中文会用「毛毛雨」「倾盆大雨」这样的汉字来描绘，日语则用声音来描绘。或许可以说，这是一种用耳朵阅读的语言。","en":"Where Chinese paints with characters like 毛毛雨 (drizzle) and 傾盆大雨 (pouring rain), Japanese paints with sound. One might say it is a language read with the ears.","de":"Where Chinese paints with characters like 毛毛雨 (drizzle) and 傾盆大雨 (pouring rain), Japanese paints with sound. One might say it is a language read with the ears."}],"d12":[{"zh-Hant":"十月三十一日的夜晚，東京澀谷會聚集許多裝扮的年輕人。過去，澀谷的十字路口常被擠得水洩不通，電視台也會來實況轉播，是一項「名物」。","zh-Hans":"十月三十一日的夜晚，东京涩谷会聚集许多装扮的年轻人。过去，涩谷的十字路口常被挤得水泄不通，电视台也会来实况转播，是一项「名物」。","en":"On the night of October 31st, young people in costumes gather in Shibuya, Tokyo. In the past, the Scramble Crossing was packed with people, and it was such a famous spectacle that TV stations came to broadcast it live.","de":"On the night of October 31st, young people in costumes gather in Shibuya, Tokyo. In the past, the Scramble Crossing was packed with people, and it was such a famous spectacle that TV stations came to broadcast it live."},{"zh-Hant":"然而，趁著擁擠而發生的騷動和垃圾問題接連不斷，近年來區政府開始呼籲：「請不要為了萬聖節而來澀谷。」街頭飲酒也因此通過了條例加以規範。","zh-Hans":"然而，趁着拥挤而发生的骚动和垃圾问题接连不断，近年来区政府开始呼吁：「请不要为了万圣节而来涩谷。」街头饮酒也因此通过了条例加以规范。","en":"However, disturbances and litter problems that arose amid the crowds kept happening, and in recent years the ward has begun calling on people not to come to Shibuya just for Halloween. An ordinance was also enacted to restrict drinking on the streets.","de":"However, disturbances and litter problems that arose amid the crowds kept happening, and in recent years the ward has begun calling on people not to come to Shibuya just for Halloween. An ordinance was also enacted to restrict drinking on the streets."},{"zh-Hant":"其實，日本的萬聖節原本傳播開來時，重點不在宗教意義，而是作為「裝扮並享受的日子」。它雖然已經作為商業活動紮根下來，但聚集大批人群本身成為目的，也是問題所在。祭典與打擾他人之間的界線在哪裡？每年都會引發討論。","zh-Hans":"其实，日本的万圣节原本传播开来时，重点不在宗教意义，而是作为「装扮并享受的日子」。它虽然已经作为商业活动扎根下来，但聚集大批人群本身成为目的，也是问题所在。祭典与打扰他人之间的界线在哪里？每年都会引发讨论。","en":"Japan's Halloween originally spread as a \"day to dress up and have fun\" rather than for its religious meaning. While it has taken root as a commercial event, the gathering of crowds itself has become the goal, which is also part of the problem. Where is the line between a festival and a nuisance? It sparks debate almost every year.","de":"Japan's Halloween originally spread as a \"day to dress up and have fun\" rather than for its religious meaning. While it has taken root as a commercial event, the gathering of crowds itself has become the goal, which is also part of the problem. Where is the line between a festival and a nuisance? It sparks debate almost every year."}],"d13":[{"zh-Hant":"流淌的河水，永遠不曾停歇，然而每一瞬都已不是原來的水。浮在水潭上的泡沫，時而消散，時而凝聚，從不曾久久停留。人與居所，在世間也是如此。","zh-Hans":"流淌的河水，永远不曾停歇，然而每一瞬都已不是原来的水。浮在水潭上的泡沫，时而消散，时而凝聚，从不曾久久停留。人与居所，在世间也是如此。","en":"The river flows on without end, yet the water is never the same water. The bubbles floating on the still pools vanish and form again, never lingering for long. So it is with people and their dwellings in this world.","de":"The river flows on without end, yet the water is never the same water. The bubbles floating on the still pools vanish and form again, never lingering for long. So it is with people and their dwellings in this world."},{"zh-Hant":"【白話譯】流動的河水不曾斷絕，但已經不是原來的水。浮在淤積處的泡沫，剛消失又生成，沒有長久停留的例子。世上的人和住所，也與此相同。","zh-Hans":"【白话译】流动的河水不曾断绝，但已经不是原来的水。浮在淤积处的泡沫，刚消失又生成，没有长久停留的例子。世上的人和住所，也与此相同。","en":"[Modern translation] The flowing river never ceases, yet it is no longer the same water. The foam floating on the stagnant pool disappears and forms again, with no example of it staying for long. People in the world and their dwellings are the same.","de":"[Modern translation] The flowing river never ceases, yet it is no longer the same water. The foam floating on the stagnant pool disappears and forms again, with no example of it staying for long. People in the world and their dwellings are the same."}],"d14":[{"zh-Hant":"到了秋天，超市的米櫃區會擺出貼著「新米」標籤的商品。指的是當年剛收成的米。","zh-Hans":"到了秋天，超市的米柜区会摆出贴着「新米」标签的商品。指的是当年刚收成的米。","en":"In autumn, supermarket rice sections display products labeled 「新米」, shin-mai. This refers to rice just harvested that year.","de":"In autumn, supermarket rice sections display products labeled 「新米」, shin-mai. This refers to rice just harvested that year."},{"zh-Hant":"新米水分多，煮好後油亮亮的，香氣也很濃。因此據說煮的時候，水稍微少放一點比較好。就算沒有配菜，只吃鹽飯糰也已經足夠美味了。","zh-Hans":"新米水分多，煮好后油亮亮的，香气也很浓。因此据说煮的时候，水稍微少放一点比较好。就算没有配菜，只吃盐饭团也已经足够美味了。","en":"New rice has a high moisture content, so when cooked it turns glossy and has a strong aroma. For that reason, it is said that using slightly less water is better when cooking. Even without side dishes, plain salted rice balls are delicious enough.","de":"New rice has a high moisture content, so when cooked it turns glossy and has a strong aroma. For that reason, it is said that using slightly less water is better when cooking. Even without side dishes, plain salted rice balls are delicious enough."},{"zh-Hant":"日本人對米如此講究，或許不只是味道的問題。從插秧到割稻，米與一年四季的循環緊緊相連。吃到新米，也是在確認「今年的豐收之秋又來了」。","zh-Hans":"日本人对米如此讲究，或许不只是味道的问题。从插秧到割稻，米与一年四季的循环紧紧相连。吃到新米，也是在确认「今年的丰收之秋又来了」。","en":"The Japanese fussiness about rice may not be just about taste. From rice planting to harvest, rice is tied to the rhythm of the seasons throughout the year. Eating new rice is also a way to confirm that \"the harvest autumn has come again this year.\"","de":"The Japanese fussiness about rice may not be just about taste. From rice planting to harvest, rice is tied to the rhythm of the seasons throughout the year. Eating new rice is also a way to confirm that \"the harvest autumn has come again this year.\""}],"d15":[{"zh-Hant":"十一月三日是「文化之日」。作為「熱愛自由與和平、推動文化」的日子，它被列為國定假日。當天在皇居會舉行文化勳章的頒授儀式，表揚在學術或藝術上留下重大功績的人。","zh-Hans":"十一月三日是「文化之日」。作为「热爱自由与和平、推动文化」的日子，它被列为国定假日。当天在皇居会举行文化勋章的颁授仪式，表扬在学术或艺术上留下重大功绩的人。","en":"November 3rd is 「文化の日」, Culture Day. Designated as a national holiday for \"loving freedom and peace and promoting culture,\" it is the day the Order of Culture is conferred at the Imperial Palace, honoring people who have made great contributions in scholarship or the arts.","de":"November 3rd is 「文化の日」, Culture Day. Designated as a national holiday for \"loving freedom and peace and promoting culture,\" it is the day the Order of Culture is conferred at the Imperial Palace, honoring people who have made great contributions in scholarship or the arts."},{"zh-Hant":"其實這一天也是明治天皇的誕辰。戰後，因為這一天是《日本國憲法》公布的日子，它被重新定位為重視和平與文化的節日。","zh-Hans":"其实这一天也是明治天皇的诞辰。战后，因为这一天是《日本国宪法》公布的日子，它被重新定位为重视和平与文化的节日。","en":"In fact, this day was also the birthday of Emperor Meiji. After the war, because it was the day the Constitution of Japan was promulgated, it was reborn as a holiday that values peace and culture.","de":"In fact, this day was also the birthday of Emperor Meiji. After the war, because it was the day the Constitution of Japan was promulgated, it was reborn as a holiday that values peace and culture."},{"zh-Hant":"另外，文化之日也以「晴天的特異日」聞名，意思是統計上經常是晴天的日子。許多美術館和博物館這天會免費入場，所以很適合出門。","zh-Hans":"另外，文化之日也以「晴天的特异日」闻名，意思是统计上经常是晴天的日子。许多美术馆和博物馆这天会免费入场，所以很适合出门。","en":"Culture Day is also known as a \"special fine-weather day,\" meaning a day that statistically tends to be sunny. Many art museums and museums offer free admission that day, so it is a good time to go out.","de":"Culture Day is also known as a \"special fine-weather day,\" meaning a day that statistically tends to be sunny. Many art museums and museums offer free admission that day, so it is a good time to go out."}],"d16":[{"zh-Hant":"各地的定線公車和鐵路接連廢止或減班。人口減少導致乘客流失，難以維持收支，再加上司機不足，情況十分嚴重。","zh-Hans":"各地的定线公车和铁路接连废止或减班。人口减少导致乘客流失，难以维持收支，再加上司机不足，情况十分严重。","en":"Regional fixed-route buses and railways are being discontinued or have reduced service one after another. With population decline reducing passengers, operations are hard to keep profitable, and the shortage of drivers is also serious.","de":"Regional fixed-route buses and railways are being discontinued or have reduced service one after another. With population decline reducing passengers, operations are hard to keep profitable, and the shortage of drivers is also serious."},{"zh-Hant":"公共交通不只是移動的工具。對於不會開車的老年人和學生來說，它是通往醫院和學校的生命線。一旦路線消失，人就會離開地區，乘客進一步減少，恐怕會陷入惡性循環。","zh-Hans":"公共交通不只是移动的工具。对于不会开车的老年人和学生来说，它是通往医院和学校的生命线。一旦路线消失，人就会离开地区，乘客进一步减少，恐怕会陷入恶性循环。","en":"Public transportation is more than just a means of getting around. For elderly people who cannot drive and for students, it is a lifeline to hospitals and schools. If routes disappear, people leave the area, ridership drops further, and the community risks falling into a vicious cycle.","de":"Public transportation is more than just a means of getting around. For elderly people who cannot drive and for students, it is a lifeline to hospitals and schools. If routes disappear, people leave the area, ridership drops further, and the community risks falling into a vicious cycle."},{"zh-Hant":"共乘計程車和共乘服務等新的模式也開始探索。不過，把它們完全交給民間的努力，是有限度的。需要把交通與道路、水道一樣視為公共財，由國家和地方政府負起責任來支撐，這樣的思維轉變是必要的。","zh-Hans":"共乘出租车和共乘服务等新的模式也开始探索。不过，把它们完全交给民间的努力，是有限度的。需要把交通与道路、水道一样视为公共财，由国家和地方政府负起责任来支撑，这样的思维转变是必要的。","en":"New models such as shared taxis and ride-sharing have also begun to be explored. But leaving these solely to private efforts has its limits. A shift in thinking is needed: treating transportation as a public good, like roads and water, and having the national and local governments take responsibility for supporting it.","de":"New models such as shared taxis and ride-sharing have also begun to be explored. But leaving these solely to private efforts has its limits. A shift in thinking is needed: treating transportation as a public good, like roads and water, and having the national and local governments take responsibility for supporting it."}],"d17":[{"zh-Hant":"日語的「人間」只是指「人」，例如「人間關係」「人間味」中的「人間」。它與中文「人間」指「人世間」的用法有些錯位，不過其實日語中也保留著古老的用法。「人間萬事塞翁馬」中的「人間」，也可以讀作「じんかん」，指世間萬事。","zh-Hans":"日语的「人间」只是指「人」，例如「人间关系」「人间味」中的「人间」。它与中文「人间」指「人世间」的用法有些错位，不过其实日语中也保留着古老的用法。「人间万事塞翁马」中的「人间」，也可以读作「じんかん」，指世间万事。","en":"In Japanese, 「人間」 simply means \"person,\" as in 人間関係 (human relations) or 人間らしさ (human-like warmth). It differs from the Chinese use meaning \"the human world,\" but Japanese does preserve an old usage: in the proverb 「人間万事塞翁が馬」, the word can also be read 「じんかん」 and refers to the affairs of the world.","de":"In Japanese, 「人間」 simply means \"person,\" as in 人間関係 (human relations) or 人間らしさ (human-like warmth). It differs from the Chinese use meaning \"the human world,\" but Japanese does preserve an old usage: in the proverb 「人間万事塞翁が馬」, the word can also be read 「じんかん」 and refers to the affairs of the world."},{"zh-Hant":"「工作」也要留意。在日語中，它常指小學課堂上用畫紙、木頭等材料做東西，也就是「圖畫工作」。還有一個意思是在背後暗中打點，但沒有中文「工作」（職業、任務）的意思。","zh-Hans":"「工作」也要留意。在日语中，它常指小学课堂上用画纸、木头等材料做东西，也就是「图画工作」。还有一个意思是在背后暗中打点，但没有中文「工作」（职业、任务）的意思。","en":"「工作」 also requires caution. In Japanese, it often refers to making things with drawing paper, wood, and other materials in elementary school class, namely 図画工作 (art and craft). It also has the meaning of secretly lining up support behind the scenes, but it does not carry the Chinese sense of \"a job.\"","de":"「工作」 also requires caution. In Japanese, it often refers to making things with drawing paper, wood, and other materials in elementary school class, namely 図画工作 (art and craft). It also has the meaning of secretly lining up support behind the scenes, but it does not carry the Chinese sense of \"a job.\""},{"zh-Hant":"還有「放心」。在日語中，它不是「別擔心」的意思，而是指恍恍惚惚、心神鬆懈的狀態。說「放心狀態」，指的是因受到衝擊而腦中一片空白的樣子。若想表達「請放心」，就不能用這個詞。","zh-Hans":"还有「放心」。在日语中，它不是「别担心」的意思，而是指恍恍惚惚、心神松懈的状态。说「放心状态」，指的是因受到冲击而脑中一片空白的样子。若想表达「请放心」，就不能用这个词。","en":"And then there is 「放心」. In Japanese it does not mean \"don't worry,\" but refers to a dazed, absent-minded state in which one's attention has gone slack. 「放心状態」 describes being so shocked that you cannot think of anything. You cannot use it to say \"Rest assured.\"","de":"And then there is 「放心」. In Japanese it does not mean \"don't worry,\" but refers to a dazed, absent-minded state in which one's attention has gone slack. 「放心状態」 describes being so shocked that you cannot think of anything. You cannot use it to say \"Rest assured.\""}],"d18":[{"zh-Hant":"京都有一個很有名的說法：如果有人對你說「要不要來碗茶泡飯？」，意思是「請差不多該回去了」。茶泡飯就是御茶漬。意思是，如果真心想招待客人，就不會端出茶泡飯來。","zh-Hans":"京都有一个很有名的说法：如果有人对你说「要不要来碗茶泡饭？」，意思是「请差不多该回去了」。茶泡饭就是御茶渍。意思是，如果真心想招待客人，就不会端出茶泡饭来。","en":"There is a famous saying in Kyoto: if someone asks, \"Would you like some ochazuke?\" it means \"It's about time you went home.\" Ochazuke is rice with tea poured over it. The idea is that if you truly wanted to host a guest, you would never serve ochazuke.","de":"There is a famous saying in Kyoto: if someone asks, \"Would you like some ochazuke?\" it means \"It's about time you went home.\" Ochazuke is rice with tea poured over it. The idea is that if you truly wanted to host a guest, you would never serve ochazuke."},{"zh-Hant":"現在究竟有多少京都人會這樣說，很難說。但京都的語言常被當作「不直接說出真心話」的象徵來談論。「ええ時計してはりますなあ」（您的表真好看呢）意思是「話很長」，這類玩笑也是同樣的道理。","zh-Hans":"现在究竟有多少京都人会这样说，很难说。但京都的语言常被当作「不直接说出真心话」的象征来谈论。「ええ时计してはりますなあ」（您的表真好看呢）意思是「话很长」，这类玩笑也是同样的道理。","en":"It is doubtful how many Kyoto people actually speak this way, but Kyoto's language is often discussed as a symbol of not saying what you really mean outright. Jokes like 「ええ時計してはりますなあ」（What a nice watch you have）, which means \"your story is long,\" work the same way.","de":"It is doubtful how many Kyoto people actually speak this way, but Kyoto's language is often discussed as a symbol of not saying what you really mean outright. Jokes like 「ええ時計してはりますなあ」（What a nice watch you have）, which means \"your story is long,\" work the same way."},{"zh-Hant":"話說回來，這些委婉的說法，也是一種在不傷害對方顏面的前提下傳達心意的智慧。讓我們在「おおきに」柔和的語感中，細細品味京都話的深意吧。","zh-Hans":"话说回来，这些委婉的说法，也是一种在不伤害对方颜面的前提下传达心意的智能。让我们在「おおきに」柔和的语感中，细细品味京都话的深意吧。","en":"That said, these indirect expressions are also a kind of wisdom for conveying feelings without damaging the other person's face. Let us savor the depth of the Kyoto dialect along with the gentle sound of 「おおきに」.","de":"That said, these indirect expressions are also a kind of wisdom for conveying feelings without damaging the other person's face. Let us savor the depth of the Kyoto dialect along with the gentle sound of 「おおきに」."}],"d19":[{"zh-Hant":"從今天起，按曆法算就是冬天了。這是二十四節氣中的「立冬」。許多地方還是紅葉最盛的時候，就算說是冬天，可能也沒什麼實感。","zh-Hans":"从今天起，按历法算就是冬天了。这是二十四节气中的「立冬」。许多地方还是红叶最盛的时候，就算说是冬天，可能也没什么实感。","en":"From today, by the calendar, it is winter. This is 「立冬」, the start of winter in the 24 solar terms. In many regions the autumn leaves are still at their peak, so even if you are told it is winter, it may not feel that way yet.","de":"From today, by the calendar, it is winter. This is 「立冬」, the start of winter in the 24 solar terms. In many regions the autumn leaves are still at their peak, so even if you are told it is winter, it may not feel that way yet."},{"zh-Hant":"不過，白晝已經變短了不少。傍晚五點天色就已經暗了下來，街燈很快就亮起。北方也傳來「木枯らし一號」的消息。木枯らし是晚秋到初冬吹來的強烈寒冷北風，意思是能把樹葉吹落、讓樹木變成枯枝的風。","zh-Hans":"不过，白昼已经变短了不少。傍晚五点天色就已经暗了下来，街灯很快就亮起。北方也传来「木枯らし一号」的消息。木枯らし是晚秋到初冬吹来的强烈寒冷北风，意思是能把树叶吹落、让树木变成枯枝的风。","en":"Still, daylight has grown considerably shorter. By five in the afternoon it is already dim, and the city lights come on early. News also arrives from the north of the first 「木枯らし」 of the year. A kogarashi is a strong, cold north wind that blows from late autumn into early winter, a wind that strips the leaves and leaves the trees bare.","de":"Still, daylight has grown considerably shorter. By five in the afternoon it is already dim, and the city lights come on early. News also arrives from the north of the first 「木枯らし」 of the year. A kogarashi is a strong, cold north wind that blows from late autumn into early winter, a wind that strips the leaves and leaves the trees bare."},{"zh-Hant":"有的人家拿出暖桌，有的人家把加濕器拿出來。準備過冬的步驟，每家都不一樣，但那種有點雀躍的心情，大家都一樣。","zh-Hans":"有的人家拿出暖桌，有的人家把加湿器拿出来。准备过冬的步骤，每家都不一样，但那种有点雀跃的心情，大家都一样。","en":"Some households bring out the kotatsu, others pull out the humidifier. How each household prepares for winter differs, but that slightly excited feeling is the same for everyone.","de":"Some households bring out the kotatsu, others pull out the humidifier. How each household prepares for winter differs, but that slightly excited feeling is the same for everyone."}],"d20":[{"zh-Hant":"梅洛斯勃然大怒。他下定決心，一定要除掉那殘暴奸詐的國王。梅洛斯不懂政治。梅洛斯是村裡的牧人，吹著笛子，與羊群玩耍，過著日子。然而，對於邪惡，他比任何人都敏銳。","zh-Hans":"梅洛斯勃然大怒。他下定决心，一定要除掉那残暴奸诈的国王。梅洛斯不懂政治。梅洛斯是村里的牧人，吹着笛子，与羊群玩耍，过着日子。然而，对于邪恶，他比任何人都敏锐。","en":"Melos was furious. He resolved that he must surely rid the land of that wicked, cruel king. Melos did not understand politics. Melos was a village shepherd who lived by playing his flute and tending his sheep. Yet when it came to evil, he was more sensitive than anyone.","de":"Melos was furious. He resolved that he must surely rid the land of that wicked, cruel king. Melos did not understand politics. Melos was a village shepherd who lived by playing his flute and tending his sheep. Yet when it came to evil, he was more sensitive than anyone."}],"d21":[{"zh-Hant":"主旨：關於演講邀約","zh-Hans":"主旨：关于演讲邀约","en":"Subject: Regarding your speaking request","de":"Subject: Regarding your speaking request"},{"zh-Hant":"山田先生","zh-Hans":"山田先生","en":"Dear Mr. Yamada,","de":"Dear Mr. Yamada,"},{"zh-Hant":"一直承蒙您的關照。\n非常感謝您這次邀請我擔任演講。","zh-Hans":"一直承蒙您的关照。\n非常感谢您这次邀请我担任演讲。","en":"Thank you always for your kind support.\nThank you very much for inviting me to speak.","de":"Thank you always for your kind support.\nThank you very much for inviting me to speak."},{"zh-Hant":"非常抱歉，當天很不巧我已經有約在先，因此很難答應這次邀請。\n明明您特地來邀請我，卻無法符合您的期待，實在非常抱歉。","zh-Hans":"非常抱歉，当天很不巧我已经有约在先，因此很难答应这次邀请。\n明明您特地来邀请我，却无法符合您的期待，实在非常抱歉。","en":"I am truly sorry, but unfortunately I already have a prior engagement on that day, which makes it difficult for me to accept.\nI regret that I cannot meet your expectations, despite your kind invitation.","de":"I am truly sorry, but unfortunately I already have a prior engagement on that day, which makes it difficult for me to accept.\nI regret that I cannot meet your expectations, despite your kind invitation."},{"zh-Hant":"如果方便的話，若能安排其他日期，我可以再協調。若您願意，請另外再與我們商量，我將不勝感激。\n今後也請您多多指教。","zh-Hans":"如果方便的话，若能安排其他日期，我可以再协调。若您愿意，请另外再与我们商量，我将不胜感激。\n今后也请您多多指教。","en":"If it is convenient for you, I may be able to adjust for a different date. If you would be willing to discuss it again at another time, I would be grateful.\nI look forward to your continued support.","de":"If it is convenient for you, I may be able to adjust for a different date. If you would be willing to discuss it again at another time, I would be grateful.\nI look forward to your continued support."}],"d22":[{"zh-Hant":"石川縣的金澤有一句話：「便當忘了帶沒關係，傘可不能忘。」明明剛才還是晴天，轉眼間就下起時雨。這正說明了這塊土地的天氣變化有多快。","zh-Hans":"石川县的金泽有一句话：「便当忘了带没关系，伞可不能忘。」明明刚才还是晴天，转眼间就下起时雨。这正说明了这块土地的天气变化有多快。","en":"In Kanazawa in Ishikawa Prefecture, there is a saying: \"You can forget your lunch, but never forget your umbrella.\" It may be sunny one moment and suddenly start raining the next. This tells you how quickly the weather changes in this land.","de":"In Kanazawa in Ishikawa Prefecture, there is a saying: \"You can forget your lunch, but never forget your umbrella.\" It may be sunny one moment and suddenly start raining the next. This tells you how quickly the weather changes in this land."},{"zh-Hant":"特別是從晚秋到冬季，來自日本海的濕潤風撞上山脈，雨雪天氣會持續好一段時間。在兼六園，為了不讓積雪壓斷樹枝，會在松樹上拉起繩索，這就是「雪吊」的開始。呈圓錐形拉開的繩索，是金澤冬天的風物詩。","zh-Hans":"特别是从晚秋到冬季，来自日本海的湿润风撞上山脉，雨雪天气会持续好一段时间。在兼六园，为了不让积雪压断树枝，会在松树上拉起绳索，这就是「雪吊」的开始。呈圆锥形拉开的绳索，是金泽冬天的风物诗。","en":"Especially from late autumn into winter, the moist winds from the Sea of Japan collide with the mountains, and rainy and snowy days continue for a long time. At Kenrokuen, ropes are strung across the pines to keep the branches from snapping under the weight of snow. This is the beginning of 「雪吊り」. The ropes stretched into cone shapes are a seasonal icon of Kanazawa's winter.","de":"Especially from late autumn into winter, the moist winds from the Sea of Japan collide with the mountains, and rainy and snowy days continue for a long time. At Kenrokuen, ropes are strung across the pines to keep the branches from snapping under the weight of snow. This is the beginning of 「雪吊り」. The ropes stretched into cone shapes are a seasonal icon of Kanazawa's winter."},{"zh-Hant":"多雨的城鎮，有一種說不出的溫潤之美。撐著傘走在濕漉漉的石板路上，穿過茶屋街，也很不錯。當然，傘可別忘了帶。","zh-Hans":"多雨的城镇，有一种说不出的温润之美。撑着伞走在湿漉漉的石板路上，穿过茶屋街，也很不错。当然，伞可别忘了带。","en":"A town with much rain has a moist, gentle beauty of its own. Walking under an umbrella along the wet stone-paved streets of the Chaya district is also lovely. And of course, don't forget your umbrella.","de":"A town with much rain has a moist, gentle beauty of its own. Walking under an umbrella along the wet stone-paved streets of the Chaya district is also lovely. And of course, don't forget your umbrella."}],"d23":[{"zh-Hant":"「這張照片好 emo 喔。」年輕世代常用的「エモい」，源自英文的 emotional，用來形容難以言喻的懷念、心酸，或是內心被觸動的感覺。也有人認為它接近古語中的「あはれ」。","zh-Hans":"「这张照片好 emo 喔。」年轻世代常用的「エモい」，源自英文的 emotional，用来形容难以言喻的怀念、心酸，或是内心被触动的感觉。也有人认为它接近古语中的「あはれ」。","en":"\"This photo is so emotional, you know?\" 「エモい」, which young people often use, comes from the English word \"emotional\" and expresses nostalgia, bittersweetness, or a feeling of being moved in a way that is hard to put into words. Some people compare it to the classical word 「あはれ」.","de":"\"This photo is so emotional, you know?\" 「エモい」, which young people often use, comes from the English word \"emotional\" and expresses nostalgia, bittersweetness, or a feeling of being moved in a way that is hard to put into words. Some people compare it to the classical word 「あはれ」."},{"zh-Hant":"「推し」也已經完全普及。它原本是偶像粉絲的用語，指「值得向別人推薦的、最喜歡的成員」。如今連演員、角色，甚至喜歡的麵包店，都會被稱為「推し」。「推し活」則泛指支持自己所喜愛對象的各種活動。","zh-Hans":"「推し」也已经完全普及。它原本是偶像粉丝的用语，指「值得向别人推荐的、最喜欢的成员」。如今连演员、角色，甚至喜欢的面包店，都会被称为「推し」。「推し活」则泛指支持自己所喜爱对象的各种活动。","en":"「推し」 has also become thoroughly established. Originally a term used by idol fans, it meant \"a member you love enough to recommend to others.\" Today, actors, characters, and even a favorite bakery can be called 「推し」. 「推し活」 refers to all the activities of supporting whatever you adore.","de":"「推し」 has also become thoroughly established. Originally a term used by idol fans, it meant \"a member you love enough to recommend to others.\" Today, actors, characters, and even a favorite bakery can be called 「推し」. 「推し活」 refers to all the activities of supporting whatever you adore."},{"zh-Hant":"也有人皺眉頭，覺得新詞是「日語的混亂」。但語言只有在被使用的過程中才能存活。「エモい」一百年後是否還會留在辭典裡，目前無從確認，這一點令人遺憾。","zh-Hans":"也有人皱眉头，觉得新词是「日语的混乱」。但语言只有在被使用的过程中才能存活。「エモい」一百年后是否还会留在辞典里，目前无从确认，这一点令人遗憾。","en":"Some people frown on new words as \"the corruption of Japanese.\" But a language survives only through being used. It is a pity that no one can know whether 「エモい」 will still be in dictionaries a hundred years from now.","de":"Some people frown on new words as \"the corruption of Japanese.\" But a language survives only through being used. It is a pity that no one can know whether 「エモい」 will still be in dictionaries a hundred years from now."}],"d24":[{"zh-Hant":"日文書信或電子郵件的結尾，常會附上「寒さ厳しき折、どうぞご自愛ください」這樣一句話。「自愛」指珍惜自己的身體。與中文「自愛」有「檢點品行」的意思，略有不同。","zh-Hans":"日文书信或电子邮件的结尾，常会附上「寒さ厳しき折、どうぞご自爱ください」这样一句话。「自爱」指珍惜自己的身体。与中文「自爱」有「检点品行」的意思，略有不同。","en":"Japanese letters and emails often close with a line such as 「寒さ厳しき折、どうぞご自愛ください」, \"In this bitter cold, please take good care of yourself.\" 「自愛」 means cherishing one's own body. This differs a little from the Chinese 「自愛」, which can also mean behaving with dignity.","de":"Japanese letters and emails often close with a line such as 「寒さ厳しき折、どうぞご自愛ください」, \"In this bitter cold, please take good care of yourself.\" 「自愛」 means cherishing one's own body. This differs a little from the Chinese 「自愛」, which can also mean behaving with dignity."},{"zh-Hant":"需要注意的是「お体をご自愛ください」這種說法。因為「自愛」本身已經包含了「珍惜身體」的意思，許多人認為這是「重言」（語意重複），因此會避免使用。另外，對生病的人使用也不太合適。這種情況下，「どうぞお大事になさってください」會更好。","zh-Hans":"需要注意的是「お体をご自爱ください」这种说法。因为「自爱」本身已经包含了「珍惜身体」的意思，许多人认为这是「重言」（语意重复），因此会避免使用。另外，对生病的人使用也不太合适。这种情况下，「どうぞお大事になさってください」会更好。","en":"Be careful with the phrase 「お体をご自愛ください」. Because 「自愛」 already includes the meaning of \"caring for your body,\" many people avoid it as 「重言」, a redundancy. It is also considered unsuitable for someone who is ill. In that case, 「どうぞお大事になさってください」 is better.","de":"Be careful with the phrase 「お体をご自愛ください」. Because 「自愛」 already includes the meaning of \"caring for your body,\" many people avoid it as 「重言」, a redundancy. It is also considered unsuitable for someone who is ill. In that case, 「どうぞお大事になさってください」 is better."},{"zh-Hant":"以季節問候開頭，以關心對方的身體結尾。這種格式看似拘謹，其實反而能幫助寫信的人。當你不知道該寫什麼的時候，它是一個很可靠的框架。","zh-Hans":"以季节问候开头，以关心对方的身体结尾。这种格式看似拘谨，其实反而能帮助写信的人。当你不知道该写什么的时候，它是一个很可靠的框架。","en":"Begin with a seasonal greeting and end by expressing concern for the other person's health. This format may seem stiff, but it actually helps the writer. When you don't know what to write, it is a reliable framework.","de":"Begin with a seasonal greeting and end by expressing concern for the other person's health. This format may seem stiff, but it actually helps the writer. When you don't know what to write, it is a reliable framework."}],"d25":[{"zh-Hant":"這條路啊　無人行走　秋日黃昏","zh-Hans":"这条路啊　无人行走　秋日黄昏","en":"Along this road, with no one walking, autumn dusk.\n(Matsuo Bashō)","de":"Along this road, with no one walking, autumn dusk.\n(Matsuo Bashō)"},{"zh-Hant":"吃了柿子　鐘聲響起　法隆寺","zh-Hans":"吃了柿子　钟声响起　法隆寺","en":"Eating a persimmon — the bell rings out at Hōryū-ji.\n(Masaoka Shiki)","de":"Eating a persimmon — the bell rings out at Hōryū-ji.\n(Masaoka Shiki)"},{"zh-Hant":"芭蕉的這首句是晚年之作。在秋日黃昏裡，一條路上沒有其他行人。它既是眼前的風景，也讀得出一個人在藝道上追求極致的孤獨。","zh-Hans":"芭蕉的这首句是晚年之作。在秋日黄昏里，一条路上没有其他行人。它既是眼前的风景，也读得出一个人在艺道上追求极致的孤独。","en":"Bashō's verse is a work from his later years. At autumn dusk, a single road with no one else walking on it. It is both a visible landscape and a loneliness of one person pursuing the ultimate in an art.","de":"Bashō's verse is a work from his later years. At autumn dusk, a single road with no one else walking on it. It is both a visible landscape and a loneliness of one person pursuing the ultimate in an art."},{"zh-Hant":"子規的這首句，是他遊歷奈良時所作。正吃著柿子，法隆寺的鐘聲恰好響起。雖然只是一件小事，柿子的甘甜、鐘聲與秋天清澈的空氣，卻一起傳達過來。據說子規非常喜歡柿子。","zh-Hans":"子规的这首句，是他游历奈良时所作。正吃着柿子，法隆寺的钟声恰好响起。虽然只是一件小事，柿子的甘甜、钟声与秋天清澈的空气，却一起传达过来。据说子规非常喜欢柿子。","en":"Shiki's verse was written during a trip to Nara. As he was eating a persimmon, the bell of Hōryū-ji happened to ring. It was only a small moment, yet the sweetness of the persimmon, the sound of the bell, and the clear autumn air all come through at once. Shiki was said to be very fond of persimmons.","de":"Shiki's verse was written during a trip to Nara. As he was eating a persimmon, the bell of Hōryū-ji happened to ring. It was only a small moment, yet the sweetness of the persimmon, the sound of the bell, and the clear autumn air all come through at once. Shiki was said to be very fond of persimmons."}],"d26":[{"zh-Hant":"日本的街上有一種和咖啡館稍有不同的「喫茶店」。有手沖法蘭絨濾布咖啡、厚切吐司、拿坡里義大利麵。店主寡言少語，常客坐在固定的位置上，攤開報紙。","zh-Hans":"日本的街上有一种和咖啡馆稍有不同的「吃茶店」。有手冲法兰绒滤布咖啡、厚切吐司、拿坡里意大利面。店主寡言少语，常客坐在固定的位置上，摊开报纸。","en":"Japanese towns have a kind of place called 「喫茶店」, a little different from a café. They serve drip coffee brewed through flannel filters, thick-cut toast, and Napolitan spaghetti. The owner is quiet, and regulars sit in their usual seats and open the newspaper.","de":"Japanese towns have a kind of place called 「喫茶店」, a little different from a café. They serve drip coffee brewed through flannel filters, thick-cut toast, and Napolitan spaghetti. The owner is quiet, and regulars sit in their usual seats and open the newspaper."},{"zh-Hant":"如果說連鎖咖啡館是「任何人都能以相同方式使用的地方」，那麼喫茶店就是「能與熟面孔相處的地方」。即使不知道彼此的名字，每天同一時間坐在同一個位子的人之間，也會慢慢生出一種鬆散的連結感。","zh-Hans":"如果说连锁咖啡馆是「任何人都能以相同方式使用的地方」，那么吃茶店就是「能与熟面孔相处的地方」。即使不知道彼此的名字，每天同一时间坐在同一个位子的人之间，也会慢慢生出一种松散的链接感。","en":"If a chain café is a place anyone can use in the same way, a 「喫茶店」 is a place where you become a familiar face. Even without knowing each other's names, people who sit in the same seat at the same time every morning develop a loose sense of connection.","de":"If a chain café is a place anyone can use in the same way, a 「喫茶店」 is a place where you become a familiar face. Even without knowing each other's names, people who sit in the same seat at the same time every morning develop a loose sense of connection."},{"zh-Hant":"近年來，因為接班人不足而歇業的喫茶店越來越多。另一方面，也有很多年輕客人喜歡「純喫茶」那種復古的氛圍。作為既非家也非職場的「第三空間」，喫茶店所承擔的角色，或許比我們想像的還要重要。","zh-Hans":"近年来，因为接班人不足而歇业的吃茶店越来越多。另一方面，也有很多年轻客人喜欢「纯吃茶」那种复古的氛围。作为既非家也非职场的「第三空间」，吃茶店所承担的角色，或许比我们想像的还要重要。","en":"In recent years, more and more kissaten have closed for lack of successors. On the other hand, many young customers enjoy the retro atmosphere of 「純喫茶」. As a \"third place\" that is neither home nor workplace, the role kissaten have played may be far greater than we realize.","de":"In recent years, more and more kissaten have closed for lack of successors. On the other hand, many young customers enjoy the retro atmosphere of 「純喫茶」. As a \"third place\" that is neither home nor workplace, the role kissaten have played may be far greater than we realize."}],"d27":[{"zh-Hant":"十一月十五日前後，神社裡可以看到穿著和服的小小孩子。「七五三」是慶祝三歲、五歲、七歲孩子的成長，並祈求他們今後健康的儀式。","zh-Hans":"十一月十五日前后，神社里可以看到穿着和服的小小孩子。「七五三」是庆祝三岁、五岁、七岁孩子的成长，并祈求他们今后健康的仪式。","en":"Around November 15th, you can see small children in kimono at shrines. 「七五三」 celebrates the growth of children at ages three, five, and seven, and prays for their health in the years ahead.","de":"Around November 15th, you can see small children in kimono at shrines. 「七五三」 celebrates the growth of children at ages three, five, and seven, and prays for their health in the years ahead."},{"zh-Hant":"過去，孩子能平安長大比現在困難得多，因此有句話說：「七歲以前都是神明的。」人們感謝神明讓孩子成長到人生的關卡年齡，並向神明稟告。這就是七五三的起源。","zh-Hans":"过去，孩子能平安长大比现在困难得多，因此有句话说：「七岁以前都是神明的。」人们感谢神明让孩子成长到人生的关卡年龄，并向神明禀告。这就是七五三的起源。","en":"In the past, it was far harder for children to grow up safely than it is today, so there was a saying: \"Until seven, a child belongs to the gods.\" People thanked the gods for bringing their children to these milestone ages and reported to them. This is the origin of Shichi-Go-San.","de":"In the past, it was far harder for children to grow up safely than it is today, so there was a saying: \"Until seven, a child belongs to the gods.\" People thanked the gods for bringing their children to these milestone ages and reported to them. This is the origin of Shichi-Go-San."},{"zh-Hant":"七五三不可或缺的是「千歲飴」。它是紅白相間的細長糖果，裝在畫著鶴與龜的袋子裡。「千歲」即一千年。細細長長，寄託著希望孩子長壽的願望。近年來，到攝影工作室拍紀念照，也成了常見的做法。","zh-Hans":"七五三不可或缺的是「千岁饴」。它是红白相间的细长糖果，装在画着鹤与龟的袋子里。「千岁」即一千年。细细长长，寄托着希望孩子长寿的愿望。近年来，到摄影工作室拍纪念照，也成了常见的做法。","en":"An essential part of Shichi-Go-San is 「千歳飴」, chitose-ame. These are long, thin red-and-white candies, packed in bags decorated with cranes and turtles. 「千歳」 means a thousand years. Long and slender, they carry the wish for a long life. In recent years, taking commemorative photos at photo studios has also become standard.","de":"An essential part of Shichi-Go-San is 「千歳飴」, chitose-ame. These are long, thin red-and-white candies, packed in bags decorated with cranes and turtles. 「千歳」 means a thousand years. Long and slender, they carry the wish for a long life. In recent years, taking commemorative photos at photo studios has also become standard."}],"d28":[{"zh-Hant":"日本的「空屋」持續增加，沒有人居住。不只是鄉下，連都市的住宅區，也常能看到雨窗始終關著的房子。","zh-Hans":"日本的「空屋」持续增加，没有人居住。不只是乡下，连都市的住宅区，也常能看到雨窗始终关着的房子。","en":"In Japan, the number of \"empty houses,\" with no one living in them, continues to rise. Not only in rural areas but also in urban residential neighborhoods, it has become common to see houses with their rain shutters always closed.","de":"In Japan, the number of \"empty houses,\" with no one living in them, continues to rise. Not only in rural areas but also in urban residential neighborhoods, it has become common to see houses with their rain shutters always closed."},{"zh-Hant":"背後有人口減少與高齡化的問題。父母過世或入住機構後，子女住在其他城市，不會再回來。想賣卻找不到買家，拆除又要花錢。而且，如果把建築拆成空地，土地的固定資產稅就會變高，這種制度也是造成空屋被放置的原因之一。","zh-Hans":"背后有人口减少与高龄化的问题。父母过世或入住机构后，子女住在其他城市，不会再回来。想卖却找不到买家，拆除又要花钱。而且，如果把建筑拆成空地，土地的固定资产税就会变高，这种制度也是造成空屋被放置的原因之一。","en":"Behind this are population decline and aging. When parents pass away or move into care facilities, their children live in other cities and do not return. Even when they want to sell, there are no buyers, and demolition costs money. Moreover, when a building is torn down to make vacant land, the fixed asset tax on the land rises, and this system is one reason empty houses are left to sit.","de":"Behind this are population decline and aging. When parents pass away or move into care facilities, their children live in other cities and do not return. Even when they want to sell, there are no buyers, and demolition costs money. Moreover, when a building is torn down to make vacant land, the fixed asset tax on the land rises, and this system is one reason empty houses are left to sit."},{"zh-Hant":"為了防止倒塌的危險與景觀惡化，國家正在加強對管理不善空屋的對策。另一方面，也有人把空屋租得便宜，改裝成店鋪或分租公寓。究竟要把它看作負面遺產，還是地區的資源？需要的是觀念的轉變。","zh-Hans":"为了防止倒塌的危险与景观恶化，国家正在加强对管理不善空屋的对策。另一方面，也有人把空屋租得便宜，改装成店铺或分租公寓。究竟要把它看作负面遗产，还是地区的资源？需要的是观念的转变。","en":"To prevent the danger of collapse and the deterioration of the scenery, the government is strengthening measures against poorly maintained empty houses. On the other hand, there are also moves to rent empty houses cheaply and renovate them into shops or shared houses. Should we see them as a negative legacy or as a resource for the community? What is needed is a shift in thinking.","de":"To prevent the danger of collapse and the deterioration of the scenery, the government is strengthening measures against poorly maintained empty houses. On the other hand, there are also moves to rent empty houses cheaply and renovate them into shops or shared houses. Should we see them as a negative legacy or as a resource for the community? What is needed is a shift in thinking."}],"d29":[{"zh-Hant":"隴西的李徵，博學有才，天寶末年，年紀輕輕就名列虎榜，之後被任命為江南尉。然而他性格孤傲，極度自負，不甘心屈居卑微的小官之位。","zh-Hans":"陇西的李征，博学有才，天宝末年，年纪轻轻就名列虎榜，之后被任命为江南尉。然而他性格孤傲，极度自负，不甘心屈居卑微的小官之位。","en":"Li Zheng of Longxi was learned and talented. In the final years of the Tianbao era, while still young, he was listed on the Tiger Board of successful examination candidates, and was then appointed Commandant of Jiangnan. But his temperament was proud and aloof, and he held great self-regard, unwilling to be content with a lowly post.","de":"Li Zheng of Longxi was learned and talented. In the final years of the Tianbao era, while still young, he was listed on the Tiger Board of successful examination candidates, and was then appointed Commandant of Jiangnan. But his temperament was proud and aloof, and he held great self-regard, unwilling to be content with a lowly post."},{"zh-Hant":"這是以唐代傳奇《人虎傳》為底本寫成的短篇。漢文訓讀體的剛硬文風，對於具備中文素養的讀者來說，或許反而容易閱讀。這是一個因為自尊心與羞恥心而變成老虎的男人的故事。","zh-Hans":"这是以唐代传奇《人虎传》为底本写成的短篇。汉文训读体的刚硬文风，对于具备中文素养的读者来说，或许反而容易阅读。这是一个因为自尊心与羞耻心而变成老虎的男人的故事。","en":"This short story is based on the Tang-dynasty tale 《人虎伝》 (The Man-Tiger Tale). Its hard, literary style in the manner of kanbun-kundoku may actually be easier to read for those with a background in Chinese. It is the story of a man who became a tiger because of his pride and his sense of shame.","de":"This short story is based on the Tang-dynasty tale 《人虎伝》 (The Man-Tiger Tale). Its hard, literary style in the manner of kanbun-kundoku may actually be easier to read for those with a background in Chinese. It is the story of a man who became a tiger because of his pride and his sense of shame."}],"d30":[{"zh-Hant":"「要再來一杯咖啡嗎？」「結構です（不用了，謝謝）。」這裡的「結構です」，多數情況下是「不需要」的意思。相對地，如果說「結構なお点前でした（茶道很棒）」，就是「真好」的讚美。同樣的詞，依照上下文，意思會完全相反。","zh-Hans":"「要再来一杯咖啡吗？」「结构です（不用了，谢谢）。」这里的「结构です」，多数情况下是「不需要」的意思。相对地，如果说「结构なお点前でした（茶道很棒）」，就是「真好」的赞美。同样的词，依照上下文，意思会完全相反。","en":"\"Would you like another cup of coffee?\" \"Kekkō desu.\" In this case, 「結構です」 usually means \"No, thank you.\" But if you say 「結構なお点前でした」 about a tea ceremony, it is praise meaning \"It was splendid.\" The same word can mean the exact opposite depending on the context.","de":"\"Would you like another cup of coffee?\" \"Kekkō desu.\" In this case, 「結構です」 usually means \"No, thank you.\" But if you say 「結構なお点前でした」 about a tea ceremony, it is praise meaning \"It was splendid.\" The same word can mean the exact opposite depending on the context."},{"zh-Hant":"「適当」也很麻煩。中文是「剛剛好」的意思，但在日語的對話中，常被用來表示「隨便」。「適当にやっといて」，到底是「適度就好」還是「草率地弄」，聽的人會很困擾。","zh-Hans":"「适当」也很麻烦。中文是「刚刚好」的意思，但在日语的对话中，常被用来表示「随便」。「适当にやっといて」，到底是「适度就好」还是「草率地弄」，听的人会很困扰。","en":"「適当」 is also tricky. In Chinese it means \"just right,\" but in Japanese conversation it is often used to mean \"careless\" or \"haphazard.\" When someone says 「適当にやっといて」, the listener is left wondering whether it means \"do it reasonably\" or \"do it carelessly.\"","de":"「適当」 is also tricky. In Chinese it means \"just right,\" but in Japanese conversation it is often used to mean \"careless\" or \"haphazard.\" When someone says 「適当にやっといて」, the listener is left wondering whether it means \"do it reasonably\" or \"do it carelessly.\""},{"zh-Hant":"「得意」若是「得意げ」，就和中文一樣是「得意洋洋」；但「料理が得意です」則是指「擅長且有自信」。在商務場合，「お得意様」則指重要的客戶。一個漢字詞，有三張面孔。","zh-Hans":"「得意」若是「得意げ」，就和中文一样是「得意洋洋」；但「料理が得意です」则是指「擅长且有自信」。在商务场合，「お得意様」则指重要的客户。一个汉字词，有三张面孔。","en":"「得意」 in 「得意げ」 means \"proud,\" as in Chinese. But in 「料理が得意です」, it means \"good at cooking, with confidence.\" In business, 「お得意様」 refers to an important client. One Chinese-character word wears three faces.","de":"「得意」 in 「得意げ」 means \"proud,\" as in Chinese. But in 「料理が得意です」, it means \"good at cooking, with confidence.\" In business, 「お得意様」 refers to an important client. One Chinese-character word wears three faces."}],"d31":[{"zh-Hant":"天一冷，日本的餐桌上就會出現火鍋。寄せ鍋、水炊き、壽喜燒、泡菜鍋。把土鍋放在桌上的瓦斯爐上，和家人或朋友圍坐在一起。","zh-Hans":"天一冷，日本的餐桌上就会出现火锅。寄せ锅、水炊き、寿喜烧、泡菜锅。把土锅放在桌上的瓦斯炉上，和家人或朋友围坐在一起。","en":"When the weather turns cold, nabe (hot pot) appears on Japanese dining tables: yosenabe, mizutaki, sukiyaki, kimchi nabe. A clay pot is placed on a portable stove on the table, and family or friends gather around it.","de":"When the weather turns cold, nabe (hot pot) appears on Japanese dining tables: yosenabe, mizutaki, sukiyaki, kimchi nabe. A clay pot is placed on a portable stove on the table, and family or friends gather around it."},{"zh-Hant":"鍋料理的好處在於準備簡單，而且大家可以一邊夾著同一鍋裡的東西，一邊聊天。還有一個詞叫「鍋奉行」，指那些對放料的順序和火候特別講究、喜歡主導一切的人。「奉行」是江戶時代的官職名稱。","zh-Hans":"锅料理的好处在于准备简单，而且大家可以一边夹着同一锅里的东西，一边聊天。还有一个词叫「锅奉行」，指那些对放料的顺序和火候特别讲究、喜欢主导一切的人。「奉行」是江户时代的官职名称。","en":"The great thing about nabe is that it is easy to prepare, and everyone can chat while picking from the same pot. There is also a term, 「鍋奉行」, for someone who is fussy about the order of adding ingredients and the heat, and likes to take charge. 「奉行」 was an official title in the Edo period.","de":"The great thing about nabe is that it is easy to prepare, and everyone can chat while picking from the same pot. There is also a term, 「鍋奉行」, for someone who is fussy about the order of adding ingredients and the heat, and likes to take charge. 「奉行」 was an official title in the Edo period."},{"zh-Hant":"最後是收尾。把剩下的湯汁加入白飯做成雜炊，還是放入烏龍麵？這也是每個家庭都堅持的講究。與台灣的火鍋不同，許多日式鍋料理不會在小碟子裡調醬汁，而是重在品嚐湯頭本身的味道，這也是它的特色。","zh-Hans":"最后是收尾。把剩下的汤汁加入白饭做成杂炊，还是放入乌龙面？这也是每个家庭都坚持的讲究。与台湾的火锅不同，许多日式锅料理不会在小碟子里调酱汁，而是重在品尝汤头本身的味道，这也是它的特色。","en":"And then comes the finishing course: add rice to the leftover broth to make zōsui, or add udon noodles? Every household has its own firm preference here too. Unlike Taiwanese hot pot, many Japanese nabe do not involve making sauces in small dishes; instead, they focus on savoring the flavor of the broth itself, which is another feature of the cuisine.","de":"And then comes the finishing course: add rice to the leftover broth to make zōsui, or add udon noodles? Every household has its own firm preference here too. Unlike Taiwanese hot pot, many Japanese nabe do not involve making sauces in small dishes; instead, they focus on savoring the flavor of the broth itself, which is another feature of the cuisine."}],"d32":[{"zh-Hant":"「今天好冷啊。」\n「真的，超冷的。手都凍僵了……不對，是凍得發麻了。」\n「『ちんちん』是熱的時候用的啦，搞錯了吧。」\n「對啊。已經累得不得了，回去吃味噌燉煮吧。」","zh-Hans":"「今天好冷啊。」\n「真的，超冷的。手都冻僵了……不对，是冻得发麻了。」\n「『ちんちん』是热的时候用的啦，搞错了吧。」\n「对啊。已经累得不得了，回去吃味噌炖煮吧。」","en":"\"It's really cold today, huh?\"\n\"Yeah, super cold. My hands are all numb... no, wait, I mean frozen stiff.\"\n\"Chin-chin is what you say when something is hot, you know. That's a mistake.\"\n\"Right. I'm exhausted. Let's go home and eat miso-nikomi.\"","de":"\"It's really cold today, huh?\"\n\"Yeah, super cold. My hands are all numb... no, wait, I mean frozen stiff.\"\n\"Chin-chin is what you say when something is hot, you know. That's a mistake.\"\n\"Right. I'm exhausted. Let's go home and eat miso-nikomi.\""}],"d33":[{"zh-Hant":"母親住進了機構，老家的電話也要解約了。最後，我聽了一次留言機裡的錄音。","zh-Hans":"母亲住进了机构，老家的电话也要解约了。最后，我听了一次留言机里的录音。","en":"My mother moved into a care facility, and we were going to cancel the phone line at the family home. Before that, I listened to the recordings on the answering machine one last time.","de":"My mother moved into a care facility, and we were going to cancel the phone line at the family home. Before that, I listened to the recordings on the answering machine one last time."},{"zh-Hant":"舊機器裡，意外地保存著好多聲音。牙醫預約的確認。鄰居傳來的社區通知。還有我自己的聲音：「媽，今天沒辦法回去了。對不起。」不知道是幾年前錄的，我想不起來了。","zh-Hans":"旧机器里，意外地保存着好多声音。牙医预约的确认。邻居传来的社区通知。还有我自己的声音：「妈，今天没办法回去了。对不起。」不知道是几年前录的，我想不起来了。","en":"The old machine had kept far more voices than I expected. A confirmation of a dentist appointment. A neighborhood notice passed along from a neighbor. And my own voice: \"Mom, I can't come home today. Sorry.\" I couldn't remember how many years ago it was.","de":"The old machine had kept far more voices than I expected. A confirmation of a dentist appointment. A neighborhood notice passed along from a neighbor. And my own voice: \"Mom, I can't come home today. Sorry.\" I couldn't remember how many years ago it was."},{"zh-Hant":"最後一則，是母親的聲音。她好像是從外面打到家裡來的。「哎呀，沒有人在呢。……也是啦。」她輕輕笑了一下，然後就掛斷了。","zh-Hans":"最后一则，是母亲的声音。她好像是从外面打到家里来的。「哎呀，没有人在呢。……也是啦。」她轻轻笑了一下，然后就挂断了。","en":"The last message was my mother's voice. She must have called our home from outside. \"Oh, nobody's home. ...Well, of course.\" She gave a small laugh, and then the call ended.","de":"The last message was my mother's voice. She must have called our home from outside. \"Oh, nobody's home. ...Well, of course.\" She gave a small laugh, and then the call ended."},{"zh-Hant":"我把手指放在刪除鍵上，好一陣子都動彈不得。窗外，銀杏葉無聲地飄落。","zh-Hans":"我把手指放在删除键上，好一阵子都动弹不得。窗外，银杏叶无声地飘落。","en":"With my finger resting on the delete button, I could not move for a while. Outside the window, ginkgo leaves were falling silently.","de":"With my finger resting on the delete button, I could not move for a while. Outside the window, ginkgo leaves were falling silently."}],"d34":[{"zh-Hant":"二十四節氣中的「小雪」，意思是開始稍微下一點雪的時節。北國和山區開始傳來初雪的消息，平原地區也有冷雨轉為雪的日子。","zh-Hans":"二十四节气中的「小雪」，意思是开始稍微下一点雪的时节。北国和山区开始传来初雪的消息，平原地区也有冷雨转为雪的日子。","en":"「小雪」, Light Snow, is one of the 24 solar terms, meaning the time when a little snow begins to fall. News of the first snow arrives from northern regions and mountains, and on some days in the lowlands cold rain turns to snow.","de":"「小雪」, Light Snow, is one of the 24 solar terms, meaning the time when a little snow begins to fall. News of the first snow arrives from northern regions and mountains, and on some days in the lowlands cold rain turns to snow."},{"zh-Hant":"這個時期常用的詞是「小春日和」。因為有「春」字，常被誤以為是春天的詞，但其實它指的是晚秋到初冬，像春天一樣溫暖平和的晴天。接近英文的 Indian summer。","zh-Hans":"这个时期常用的词是「小春日和」。因为有「春」字，常被误以为是春天的词，但其实它指的是晚秋到初冬，像春天一样温暖平和的晴天。接近英文的 Indian summer。","en":"A word often used at this time is 「小春日和」, koharu-biyori, \"small spring weather.\" Because it contains the character for spring, it is often mistaken for a spring word, but it actually refers to a warm, calm, sunny day from late autumn into early winter, like spring. It is close to the English \"Indian summer.\"","de":"A word often used at this time is 「小春日和」, koharu-biyori, \"small spring weather.\" Because it contains the character for spring, it is often mistaken for a spring word, but it actually refers to a warm, calm, sunny day from late autumn into early winter, like spring. It is close to the English \"Indian summer.\""},{"zh-Hant":"連續寒冷之後到來的小春日和，格外令人感激。坐在走廊上曬太陽的貓咪，正是這個詞的畫面本身。","zh-Hans":"连续寒冷之后到来的小春日和，格外令人感激。坐在走廊上晒太阳的猫咪，正是这个词的画面本身。","en":"A koharu-biyori that arrives after a spell of cold is especially welcome. A cat sitting on the veranda basking in the sun is exactly the picture this word conjures.","de":"A koharu-biyori that arrives after a spell of cold is especially welcome. A cat sitting on the veranda basking in the sun is exactly the picture this word conjures."}],"d35":[{"zh-Hant":"十一月二十三日是「勤勞感謝日」。這一天被定為「尊重勤勞、慶祝生產，國民彼此感謝」的日子。","zh-Hans":"十一月二十三日是「勤劳感谢日」。这一天被定为「尊重勤劳、庆祝生产，国民彼此感谢」的日子。","en":"November 23rd is 「勤労感謝の日」, Labor Thanksgiving Day. It is set aside as a day to \"honor labor, celebrate production, and for the people to express gratitude to one another.\"","de":"November 23rd is 「勤労感謝の日」, Labor Thanksgiving Day. It is set aside as a day to \"honor labor, celebrate production, and for the people to express gratitude to one another.\""},{"zh-Hant":"這一天的由來，是古老的宮中儀式「新嘗祭」。把當年收成的新米獻給神明，天皇本人也會品嚐，以感謝豐收。戰後，節日的名稱改變了，但宮中至今仍延續著這項儀式。","zh-Hans":"这一天的由来，是古老的宫中仪式「新尝祭」。把当年收成的新米献给神明，天皇本人也会品尝，以感谢丰收。战后，节日的名称改变了，但宫中至今仍延续着这项仪式。","en":"This holiday originates from 「新嘗祭」, an ancient court ritual. The new rice harvested that year is offered to the gods, and the Emperor himself partakes of it, giving thanks for the harvest. After the war, the name of the holiday changed, but the ritual has continued at the Imperial Court to this day.","de":"This holiday originates from 「新嘗祭」, an ancient court ritual. The new rice harvested that year is offered to the gods, and the Emperor himself partakes of it, giving thanks for the harvest. After the war, the name of the holiday changed, but the ritual has continued at the Imperial Court to this day."},{"zh-Hant":"一聽到「勤勞」，我們很容易想到上班族。但家務、育兒、照護，同樣是了不起的勤勞。至少今天，不妨對身邊的人說一句「平常謝謝你」。被說的人，往往意外地會害羞呢。","zh-Hans":"一听到「勤劳」，我们很容易想到上班族。但家务、育儿、照护，同样是了不起的勤劳。至少今天，不妨对身边的人说一句「平常谢谢你」。被说的人，往往意外地会害羞呢。","en":"When we hear \"labor,\" we tend to think of office work. But housework, child-rearing, and caregiving are also admirable labor. At least today, why not tell someone close to you, \"Thank you, as always\"? More often than not, the person hearing it ends up blushing.","de":"When we hear \"labor,\" we tend to think of office work. But housework, child-rearing, and caregiving are also admirable labor. At least today, why not tell someone close to you, \"Thank you, as always\"? More often than not, the person hearing it ends up blushing."}],"d36":[{"zh-Hant":"日語裡有一種說法叫「讀行間」。意思是領會文字沒有寫出來的內容。不只用於書信或電郵，也用於對話。","zh-Hans":"日语里有一种说法叫「读行间」。意思是领会文本没有写出来的内容。不只用于书信或电邮，也用于对话。","en":"In Japanese there is an expression, 「行間を読む」, \"to read between the lines.\" It means to grasp what has not been written. It is used not only for letters and emails but also in conversation.","de":"In Japanese there is an expression, 「行間を読む」, \"to read between the lines.\" It means to grasp what has not been written. It is used not only for letters and emails but also in conversation."},{"zh-Hant":"舉例來說，你向客戶提了一個方案，對方回答「我們會積極研究」。照字面看，是「會認真考慮」，但實際上，這往往是拒絕時的固定說法。反過來，如果對方立刻回答「好，就這麼做」，在日本反而會讓人感到驚訝。","zh-Hans":"举例来说，你向客户提了一个方案，对方回答「我们会积极研究」。照字面看，是「会认真考虑」，但实际上，这往往是拒绝时的固定说法。反过来，如果对方立刻回答「好，就这么做」，在日本反而会让人感到惊讶。","en":"For example, you propose a plan to a client, and they reply, \"We will consider it positively.\" Taken literally, that means \"we will seriously think about it,\" but in practice it is often a set phrase for declining. Conversely, if they immediately say \"Yes, let's do it,\" Japanese people may actually be surprised.","de":"For example, you propose a plan to a client, and they reply, \"We will consider it positively.\" Taken literally, that means \"we will seriously think about it,\" but in practice it is often a set phrase for declining. Conversely, if they immediately say \"Yes, let's do it,\" Japanese people may actually be surprised."},{"zh-Hant":"讀行間的文化，一直以來都發揮著潤滑油的作用，用來避免衝突、維護對方的顏面。但對於來自國外的人，或是凡事照字面理解的人來說，它也可能成為看不見的高牆。體察他人的文化，很容易把無法體察的人留在後面。","zh-Hans":"读行间的文化，一直以来都发挥着润滑油的作用，用来避免冲突、维护对方的颜面。但对于来自国外的人，或是凡事照字面理解的人来说，它也可能成为看不见的高墙。体察他人的文化，很容易把无法体察的人留在后面。","en":"The culture of reading between the lines has long worked as a lubricant, avoiding conflict and protecting the other person's face. But for people from abroad, or for those who take words at face value, it can also become an invisible wall. A culture of sensing what others mean can easily leave behind those who cannot sense it.","de":"The culture of reading between the lines has long worked as a lubricant, avoiding conflict and protecting the other person's face. But for people from abroad, or for those who take words at face value, it can also become an invisible wall. A culture of sensing what others mean can easily leave behind those who cannot sense it."}],"d37":[{"zh-Hant":"我一直稱呼那個人為「先生」。所以在這裡，我也只寫「先生」，不透露他的本名。這與其說是對世人的顧慮，不如說是因為我覺得這樣比較自然。","zh-Hans":"我一直称呼那个人为「先生」。所以在这里，我也只写「先生」，不透露他的本名。这与其说是对世人的顾虑，不如说是因为我觉得这样比较自然。","en":"I always called that person \"Sensei.\" So here, too, I write only \"Sensei\" and do not reveal his real name. This is less out of concern for the world than because it simply feels more natural to me.","de":"I always called that person \"Sensei.\" So here, too, I write only \"Sensei\" and do not reveal his real name. This is less out of concern for the world than because it simply feels more natural to me."}],"d38":[{"zh-Hant":"在日本的會議上常聽到一句話：「我帶回去研究一下。」意思是當場不做決定，回到自己的公司或部門之後再判斷。","zh-Hans":"在日本的会议上常听到一句话：「我带回去研究一下。」意思是当场不做决定，回到自己的公司或部门之后再判断。","en":"A phrase often heard in Japanese meetings is 「一度持ち帰って検討します」, \"I will take it back and consider it.\" It means not deciding on the spot, but judging after returning to one's own company or department.","de":"A phrase often heard in Japanese meetings is 「一度持ち帰って検討します」, \"I will take it back and consider it.\" It means not deciding on the spot, but judging after returning to one's own company or department."},{"zh-Hant":"外國的客戶有時會抱怨：「為什麼有決定權的人不來？」但在日本的組織裡，一般會透過名為「稟議」的程序，逐一取得相關人員的同意。如果承辦人獨自決定，之後可能會引來「我沒聽說」的反彈。","zh-Hans":"外国的客户有时会抱怨：「为什么有决定权的人不来？」但在日本的组织里，一般会通过名为「禀议」的进程，逐一取得相关人员的同意。如果承办人独自决定，之后可能会引来「我没听说」的反弹。","en":"Foreign clients sometimes complain: \"Why doesn't the person with decision-making power come?\" But in Japanese organizations, it is common to go through a process called 「稟議」, securing the consent of each person involved one by one. If the person in charge decides on their own, it may later cause backlash from those who say \"We weren't told.\"","de":"Foreign clients sometimes complain: \"Why doesn't the person with decision-making power come?\" But in Japanese organizations, it is common to go through a process called 「稟議」, securing the consent of each person involved one by one. If the person in charge decides on their own, it may later cause backlash from those who say \"We weren't told.\""},{"zh-Hant":"花時間是缺點，但一旦決定，執行就很快，這是它的優點。作為談判的一方，最近的路徑是：在對方帶回去之後，看清楚該去說服誰，然後備妥判斷所需的材料交給對方。","zh-Hans":"花时间是缺点，但一旦决定，运行就很快，这是它的优点。作为谈判的一方，最近的路径是：在对方带回去之后，看清楚该去说服谁，然后备妥判断所需的材料交给对方。","en":"It takes time, which is a drawback, but once a decision is made, execution is fast, which is an advantage. As the negotiating side, the shortest route is to figure out whom to persuade after the other party takes the matter back, and then provide them with the materials they need to decide.","de":"It takes time, which is a drawback, but once a decision is made, execution is fast, which is an advantage. As the negotiating side, the shortest route is to figure out whom to persuade after the other party takes the matter back, and then provide them with the materials they need to decide."}],"d39":[{"zh-Hant":"台灣的垃圾車會一邊播放音樂，一邊繞著街道行駛。人們會在固定的時間走出家門，親手把垃圾丟進車裡。據說從日本來的人，首先就會對這個景象感到驚訝。","zh-Hans":"台湾的垃圾车会一边播放音乐，一边绕着街道行驶。人们会在固定的时间走出家门，亲手把垃圾丢进车里。据说从日本来的人，首先就会对这个景象感到惊讶。","en":"In Taiwan, garbage trucks drive around town playing music. People come out of their homes at set times and toss their trash into the truck by hand. It is said that visitors from Japan are first surprised by this scene.","de":"In Taiwan, garbage trucks drive around town playing music. People come out of their homes at set times and toss their trash into the truck by hand. It is said that visitors from Japan are first surprised by this scene."},{"zh-Hant":"反過來說，從台灣來的人在日本可能會驚訝於垃圾分類的細緻。可燃垃圾、不可燃垃圾、資源垃圾、大型垃圾。寶特瓶要拿掉瓶蓋和標籤，沖洗乾淨後再丟。每星期可以丟的垃圾種類都是固定的，不同的地方政府規則也不一樣。","zh-Hans":"反过来说，从台湾来的人在日本可能会惊讶于垃圾分类的细致。可燃垃圾、不可燃垃圾、资源垃圾、大型垃圾。宝特瓶要拿掉瓶盖和标签，冲洗干净后再丢。每星期可以丢的垃圾种类都是固定的，不同的地方政府规则也不一样。","en":"Conversely, people visiting from Taiwan may be surprised by how detailed Japanese garbage sorting is: burnable, non-burnable, recyclables, and oversized items. PET bottles must have their caps and labels removed and be rinsed before disposal. Which types of trash can be put out is set for each day of the week, and the rules differ from one municipality to another.","de":"Conversely, people visiting from Taiwan may be surprised by how detailed Japanese garbage sorting is: burnable, non-burnable, recyclables, and oversized items. PET bottles must have their caps and labels removed and be rinsed before disposal. Which types of trash can be put out is set for each day of the week, and the rules differ from one municipality to another."},{"zh-Hant":"剛開始可能覺得麻煩，但習慣了之後，反而不覺得辛苦。無論台灣還是日本，都是以各自的方式，認真地面對垃圾。","zh-Hans":"刚开始可能觉得麻烦，但习惯了之后，反而不觉得辛苦。无论台湾还是日本，都是以各自的方式，认真地面对垃圾。","en":"It may feel tedious at first, but once you get used to it, it strangely stops being a burden. Both Taiwan and Japan have each, in their own way, taken garbage seriously.","de":"It may feel tedious at first, but once you get used to it, it strangely stops being a burden. Both Taiwan and Japan have each, in their own way, taken garbage seriously."}],"d40":[{"zh-Hant":"在日本聽到「我住在曼森（マンション）」，不要想像成英文 mansion 那樣的豪宅。日本的「マンション」，指的是鋼筋混凝土建造的集合住宅，也就是台灣所說的「大樓」裡的一戶。","zh-Hans":"在日本听到「我住在曼森（マンション）」，不要想像成英文 mansion 那样的豪宅。日本的「マンション」，指的是钢筋混凝土建造的集合住宅，也就是台湾所说的「大楼」里的一户。","en":"When you hear someone in Japan say 「マンションに住んでいます」, do not picture a grand mansion like the English word \"mansion.\" In Japanese, マンション refers to a reinforced-concrete apartment building, that is, a unit in what Taiwanese people would call a 大樓 (high-rise building).","de":"When you hear someone in Japan say 「マンションに住んでいます」, do not picture a grand mansion like the English word \"mansion.\" In Japanese, マンション refers to a reinforced-concrete apartment building, that is, a unit in what Taiwanese people would call a 大樓 (high-rise building)."},{"zh-Hant":"像這樣，用了英文單字，但在英語圈卻說不通的詞，被稱為「和製英語」。「サラリーマン」（上班族）、「ノートパソコン」（筆記型電腦）、「コンセント」（插座）、「ガソリンスタンド」（加油站）、「ペーパードラ
