 that make it easy to prepare. Those who once lived in Taiwan may feel a familiar resonance in the word 人日.","de":"This event is said to derive from the Chinese 人日 festival, when a soup made of seven kinds of young greens was eaten. Today, supermarkets sell \"seven herb sets\" that make it easy to prepare. Those who once lived in Taiwan may feel a familiar resonance in the word 人日."}],"d81":[{"zh-Hant":"表示家人的漢字，在日語和中文之間有許多錯位。","zh-Hans":"表示家人的汉字，在日语和中文之间有许多错位。","en":"Many kanji for family members have shifts in meaning between Japanese and Chinese.","de":"Many kanji for family members have shifts in meaning between Japanese and Chinese."},{"zh-Hant":"日語的「娘」讀作「むすめ」，指自己的女兒，有時也泛指年輕女性。與中文「娘」指母親相比，差了一個世代。","zh-Hans":"日语的「娘」读作「むすめ」，指自己的女儿，有时也泛指年轻女性。与中文「娘」指母亲相比，差了一个世代。","en":"Japanese 「娘」 is read 「むすめ」 and refers to one's own daughter, though it can also refer to young women in general. Compared with the Chinese 娘, which means mother, it is one generation off.","de":"Japanese 「娘」 is read 「むすめ」 and refers to one's own daughter, though it can also refer to young women in general. Compared with the Chinese 娘, which means mother, it is one generation off."},{"zh-Hant":"「姑」讀作「しゅうとめ」，指丈夫的母親，也就是婆婆。與中文的「姑」（父親的姊妹）完全是不同的人。說到「嫁與姑」，是日本電視劇中反覆描寫的、永恆的對立結構。","zh-Hans":"「姑」读作「しゅうとめ」，指丈夫的母亲，也就是婆婆。与中文的「姑」（父亲的姊妹）完全是不同的人。说到「嫁与姑」，是日本电视剧中反复描写的、永恒的对立结构。","en":"「姑」 is read 「しゅうとめ」 and refers to one's husband's mother, the mother-in-law. It is a different person from the Chinese 姑 (a father's sister). Speaking of 「嫁と姑」, the bride and mother-in-law, this is the eternal conflict depicted again and again in Japanese TV dramas.","de":"「姑」 is read 「しゅうとめ」 and refers to one's husband's mother, the mother-in-law. It is a different person from the Chinese 姑 (a father's sister). Speaking of 「嫁と姑」, the bride and mother-in-law, this is the eternal conflict depicted again and again in Japanese TV dramas."},{"zh-Hant":"還有「老婆」。日語讀作「ろうば」，指年長的女性。如果用中文「老婆」（妻子）的意思，說「這是我的老婆」，就會造成極大的誤會。「老婆心ながら」是一句前言，意思是「或許是多管閒事」。","zh-Hans":"还有「老婆」。日语读作「ろうば」，指年长的女性。如果用中文「老婆」（妻子）的意思，说「这是我的老婆」，就会造成极大的误会。「老婆心ながら」是一句前言，意思是「或许是多管闲事」。","en":"And then there is 「老婆」. In Japanese it is read 「ろうば」 and means an elderly woman. If you introduce someone as 「これが私の老婆です」 using the Chinese meaning of 老婆 (wife), you will cause a serious misunderstanding. 「老婆心ながら」 is a preface meaning \"this may be unnecessary meddling, but...\"","de":"And then there is 「老婆」. In Japanese it is read 「ろうば」 and means an elderly woman. If you introduce someone as 「これが私の老婆です」 using the Chinese meaning of 老婆 (wife), you will cause a serious misunderstanding. 「老婆心ながら」 is a preface meaning \"this may be unnecessary meddling, but...\""}],"d82":[{"zh-Hant":"在日本，成年年齡已從二十歲降為十八歲。滿十八歲後，即使沒有父母同意，也可以簽訂手機合約或辦理貸款。另一方面，喝酒與抽菸，考量對健康的影響，仍維持在二十歲。","zh-Hans":"在日本，成年年龄已从二十岁降为十八岁。满十八岁后，即使没有父母同意，也可以签订手机合约或办理贷款。另一方面，喝酒与抽烟，考量对健康的影响，仍维持在二十岁。","en":"In Japan, the age of majority was lowered from 20 to 18. Once you turn 18, you can sign a mobile phone contract or take out a loan without parental consent. On the other hand, drinking and smoking remain at 20, out of consideration for health effects.","de":"In Japan, the age of majority was lowered from 20 to 18. Once you turn 18, you can sign a mobile phone contract or take out a loan without parental consent. On the other hand, drinking and smoking remain at 20, out of consideration for health effects."},{"zh-Hant":"法律上的大人與社會認定的大人，其界線比想像中模糊。許多地方政府仍以二十歲為對象，舉辦名為「二十歲的聚會」等相當於成人典禮的活動。十八歲正值考試與求職的時期，也有難以參加的情況。","zh-Hans":"法律上的大人与社会认定的大人，其界线比想像中模糊。许多地方政府仍以二十岁为对象，举办名为「二十岁的聚会」等相当于成人典礼的活动。十八岁正值考试与求职的时期，也有难以参加的情况。","en":"The line between an adult in law and an adult in society's eyes is more ambiguous than one might think. Many local governments still hold ceremonies equivalent to coming-of-age events for twenty-year-olds, under names like \"Twenty-Year-Old Gatherings.\" Eighteen overlaps with exam and job-hunting seasons, which makes attendance difficult for some.","de":"The line between an adult in law and an adult in society's eyes is more ambiguous than one might think. Many local governments still hold ceremonies equivalent to coming-of-age events for twenty-year-olds, under names like \"Twenty-Year-Old Gatherings.\" Eighteen overlaps with exam and job-hunting seasons, which makes attendance difficult for some."},{"zh-Hant":"即使可以用年齡來劃分，「成為大人」卻沒有固定的日期。承擔契約的責任，為自己的判斷負責，並且去想像他人的脆弱。社會這一方，也正被要求具備以「獨當一面」來對待年輕人的決心。","zh-Hans":"即使可以用年龄来划分，「成为大人」却没有固定的日期。承担契约的责任，为自己的判断负责，并且去想像他人的脆弱。社会这一方，也正被要求具备以「独当一面」来对待年轻人的决心。","en":"Age can divide people, but there is no fixed date for \"becoming an adult.\" It means bearing the responsibility of contracts, taking ownership of your own judgment, and imagining the vulnerabilities of others. Society too is asked whether it has the resolve to treat young people as capable individuals in their own right.","de":"Age can divide people, but there is no fixed date for \"becoming an adult.\" It means bearing the responsibility of contracts, taking ownership of your own judgment, and imagining the vulnerabilities of others. Society too is asked whether it has the resolve to treat young people as capable individuals in their own right."}],"d83":[{"zh-Hant":"台灣的中文裡，有不少來自日語的詞彙。「便當」「歐吉桑」「歐巴桑」「阿莎力」就是例子。","zh-Hans":"台湾的中文里，有不少来自日语的词汇。「便当」「欧吉桑」「欧巴桑」「阿莎力」就是例子。","en":"Taiwanese Chinese includes many words that come from Japanese. Examples include 便當, 歐吉桑 (ojisan), 歐巴桑 (obasan), and 阿莎力 (asari).","de":"Taiwanese Chinese includes many words that come from Japanese. Examples include 便當, 歐吉桑 (ojisan), 歐巴桑 (obasan), and 阿莎力 (asari)."},{"zh-Hant":"有趣的是，有些詞的意思稍有改變後才定著下來。「阿莎力」據說來自日語的「あっさり」，但在台灣，它的意思是「慷慨大方」「性格爽快」。日語則主要用來形容味道「清淡」，或事情「輕鬆解決」的樣子。","zh-Hans":"有趣的是，有些词的意思稍有改变后才定着下来。「阿莎力」据说来自日语的「あっさり」，但在台湾，它的意思是「慷慨大方」「性格爽快」。日语则主要用来形容味道「清淡」，或事情「轻松解决」的样子。","en":"Interestingly, some words took root after their meanings shifted slightly. 「阿莎力」 is said to come from Japanese 「あっさり」, but in Taiwan it means \"generous\" or \"straightforward in character.\" In Japanese, it mainly describes a flavor as \"light\" or something being settled \"easily.\"","de":"Interestingly, some words took root after their meanings shifted slightly. 「阿莎力」 is said to come from Japanese 「あっさり」, but in Taiwan it means \"generous\" or \"straightforward in character.\" In Japanese, it mainly describes a flavor as \"light\" or something being settled \"easily.\""},{"zh-Hant":"另外，像「看板」「口紅」這樣，在台灣語中仍保留與日語相近發音的詞也有。一個詞渡過海洋，在另一片土地的生活中，披上新的意義。循著這一路的軌跡，兩個社會的歷史便浮現出來。","zh-Hans":"另外，像「看板」「口红」这样，在台湾语中仍保留与日语相近发音的词也有。一个词渡过海洋，在另一片土地的生活中，披上新的意义。循着这一路的轨迹，两个社会的历史便浮现出来。","en":"There are also words like 「看板」 and 「口紅」 that Taiwanese still uses with pronunciation close to the Japanese. A word crosses the ocean and takes on new meanings in the lives of another land. Tracing its path, the histories of the two societies come into view.","de":"There are also words like 「看板」 and 「口紅」 that Taiwanese still uses with pronunciation close to the Japanese. A word crosses the ocean and takes on new meanings in the lives of another land. Tracing its path, the histories of the two societies come into view."}],"d84":[{"zh-Hant":"一月的第二個星期一是「成人之日」。各地會舉辦「二十歲的聚會」，穿著振袖和服、袴的年輕人讓會場熱鬧非凡。","zh-Hans":"一月的第二个星期一是「成人之日」。各地会举办「二十岁的聚会」，穿着振袖和服、袴的年轻人让会场热闹非凡。","en":"The second Monday of January is 「成人の日」, Coming-of-Age Day. Gatherings for twenty-year-olds are held in various places, and the venues come alive with young people in furisode kimono and hakama.","de":"The second Monday of January is 「成人の日」, Coming-of-Age Day. Gatherings for twenty-year-olds are held in various places, and the venues come alive with young people in furisode kimono and hakama."},{"zh-Hant":"同一時期，一月十一日會舉行「鏡開」。這是把新年時供奉給年神的鏡餅撤下來，做成紅豆湯或紅豆年糕湯來吃的活動。藉由吃下承載神明力量的年糕，祈求一年無病無災。","zh-Hans":"同一时期，一月十一日会举行「镜开」。这是把新年时供奉给年神的镜饼撤下来，做成红豆汤或红豆年糕汤来吃的活动。借由吃下承载神明力量的年糕，祈求一年无病无灾。","en":"Around the same time, on January 11th, there is 「鏡開き」, kagami-biraki, the opening of the mirror. It is an event in which the kagami-mochi offered to the New Year's deity are taken down and eaten in sweet red bean soup (oshiruko or zenzai). By eating mochi that holds the power of the gods, people pray for a year free of illness and misfortune.","de":"Around the same time, on January 11th, there is 「鏡開き」, kagami-biraki, the opening of the mirror. It is an event in which the kagami-mochi offered to the New Year's deity are taken down and eaten in sweet red bean soup (oshiruko or zenzai). By eating mochi that holds the power of the gods, people pray for a year free of illness and misfortune."},{"zh-Hant":"需要注意的是，人們不會說把鏡餅「切」開。因為用刀具會讓人聯想到切腹，所以改用木槌等「敲開」。又因為「割る」（打破）也不吉利，於是改說「開く」（開啟）。這就是「鏡開き」的由來。這可以說是避諱語言上不吉利之詞的典型例子。","zh-Hans":"需要注意的是，人们不会说把镜饼「切」开。因为用刀具会让人联想到切腹，所以改用木槌等「敲开」。又因为「割る」（打破）也不吉利，于是改说「开く」（打开）。这就是「镜开き」的由来。这可以说是避讳语言上不吉利之词的典型例子。","en":"Note that people do not say to \"cut\" the kagami-mochi. Using a blade is avoided because it recalls seppuku (ritual suicide), so it is broken apart with a wooden mallet instead. Since 「割る」 (to break) is also inauspicious, it is replaced with 「開く」 (to open). That is why it is called 「鏡開き」. It is a classic example of avoiding inauspicious words.","de":"Note that people do not say to \"cut\" the kagami-mochi. Using a blade is avoided because it recalls seppuku (ritual suicide), so it is broken apart with a wooden mallet instead. Since 「割る」 (to break) is also inauspicious, it is replaced with 「開く」 (to open). That is why it is called 「鏡開き」. It is a classic example of avoiding inauspicious words."}],"d85":[{"zh-Hant":"在日語中，如果說「朋友幫忙了」，聽起來有點冷淡。通常會說「朋友幫我了」（てくれた）。這個「てくれる」，表示對方的行為對自己而言是值得感謝的。","zh-Hans":"在日语中，如果说「朋友帮忙了」，听起来有点冷淡。通常会说「朋友帮我了」（てくれた）。这个「てくれる」，表示对方的行为对自己而言是值得感谢的。","en":"In Japanese, saying 「友達が手伝った」 sounds somewhat cold. Usually one says 「友達が手伝ってくれた」. This 「てくれる」 expresses that the other person's action was something to be grateful for.","de":"In Japanese, saying 「友達が手伝った」 sounds somewhat cold. Usually one says 「友達が手伝ってくれた」. This 「てくれる」 expresses that the other person's action was something to be grateful for."},{"zh-Hant":"同一件事，換個角度也可以說「請朋友幫了我的忙」（てもらった）。這種說法比較容易帶出是自己請託的語感。而當自己為別人做某件事時使用的「てあげる」，對長輩使用會聽起來有施恩的意味，需要注意。「先生に傘を貸してあげた」，不如說「先生に傘をお貸しした」來得自然。","zh-Hans":"同一件事，换个角度也可以说「请朋友帮了我的忙」（てもらった）。这种说法比较容易带出是自己请托的语感。而当自己为别人做某件事时使用的「てあげる」，对长辈使用会听起来有施恩的意味，需要注意。「先生に伞を贷してあげた」，不如说「先生に伞をお贷しした」来得自然。","en":"The same event can also be described as 「友達に手伝ってもらった」, which tends to convey that you asked for help. Also, 「てあげる」, used when you do something for someone else, can sound condescending when used toward a superior, so be careful. 「先生に傘を貸してあげた」 sounds less natural than 「先生に傘をお貸しした」.","de":"The same event can also be described as 「友達に手伝ってもらった」, which tends to convey that you asked for help. Also, 「てあげる」, used when you do something for someone else, can sound condescending when used toward a superior, so be careful. 「先生に傘を貸してあげた」 sounds less natural than 「先生に傘をお貸しした」."},{"zh-Hant":"雖然有點像中文的「幫我」，但日語的授受表達，會讓人在語法中時時意識到誰給了誰恩惠。日語會話聽起來特別禮貌，或許其中一個原因就在這裡。","zh-Hans":"虽然有点像中文的「帮我」，但日语的授受表达，会让人在语法中时时意识到谁给了谁恩惠。日语会话听起来特别礼貌，或许其中一个原因就在这里。","en":"It may be somewhat similar to the Chinese 幫我, but Japanese giving-and-receiving expressions constantly make you aware, within the grammar, of who has done a favor for whom. Perhaps this is one reason Japanese conversation sounds so polite.","de":"It may be somewhat similar to the Chinese 幫我, but Japanese giving-and-receiving expressions constantly make you aware, within the grammar, of who has done a favor for whom. Perhaps this is one reason Japanese conversation sounds so polite."}],"d86":[{"zh-Hant":"一團難以名狀的、不祥的硬塊，始終壓在我的心上。說是焦躁也好，說是厭惡也罷——就像喝了酒之後會宿醉，每天喝酒的人，也會來到相當於宿醉的時期。","zh-Hans":"一团难以名状的、不祥的硬块，始终压在我的心上。说是焦躁也好，说是厌恶也罢——就像喝了酒之后会宿醉，每天喝酒的人，也会来到相当于宿醉的时期。","en":"Some ominous lump I could not name constantly pressed down on my heart. Call it irritation or call it loathing: just as drinking leaves a hangover, those who drink every day eventually reach a period equivalent to a hangover.","de":"Some ominous lump I could not name constantly pressed down on my heart. Call it irritation or call it loathing: just as drinking leaves a hangover, those who drink every day eventually reach a period equivalent to a hangover."},{"zh-Hant":"這是三十一歲便去世的作家的代表作。懷著憂鬱的「我」，拿起一顆檸檬，心裡忽然輕鬆起來。這部短篇，以鮮明的色彩描繪了那段短暫的時光。","zh-Hans":"这是三十一岁便去世的作家的代表作。怀着忧郁的「我」，拿起一颗柠檬，心里忽然轻松起来。这部短篇，以鲜明的色彩描绘了那段短暂的时光。","en":"This is the representative work of a writer who died at thirty-one. The narrator, burdened by melancholy, picks up a single lemon, and his heart suddenly feels lighter. It is a short story that depicts that brief moment in vivid colors.","de":"This is the representative work of a writer who died at thirty-one. The narrator, burdened by melancholy, picks up a single lemon, and his heart suddenly feels lighter. It is a short story that depicts that brief moment in vivid colors."}],"d87":[{"zh-Hant":"在仍然昏暗的冬日清晨，只有車站前一家小小的麵包店亮著燈。玻璃從內側起了一層白霧，透過霧氣可以看見店主正在搬運烤盤。","zh-Hans":"在仍然昏暗的冬日清晨，只有车站前一家小小的面包店亮着灯。玻璃从内侧起了一层白雾，通过雾气可以看见店主正在搬运烤盘。","en":"On a dark winter morning, only a small bakery in front of the station has its lights on. The glass is clouded white from the inside, and through it you can see the owner carrying baking trays.","de":"On a dark winter morning, only a small bakery in front of the station has its lights on. The glass is clouded white from the inside, and through it you can see the owner carrying baking trays."},{"zh-Hant":"日本麵包店的種類，似乎讓其他國家的人感到不可思議。紅豆麵包、咖哩麵包、哈密瓜麵包、炒麵麵包。在麵包裡夾入或包覆菜餚與甜點的「菓子麵包」與「惣菜麵包」，是日本獨自發展出來的文化。據說紅豆麵包是明治時代，把饅頭的構想應用到麵包上而誕生的。","zh-Hans":"日本面包店的种类，似乎让其他国家的人感到不可思议。红豆面包、咖喱面包、哈密瓜面包、炒面面包。在面包里夹入或包覆菜肴与甜点的「菓子面包」与「惣菜面包」，是日本独自发展出来的文化。据说红豆面包是明治时代，把馒头的构想应用到面包上而诞生的。","en":"The variety of Japanese bakeries seems to strike people from other countries as remarkable. Anpan (sweet bean bun), curry bread, melon bread, yakisoba bread. 「菓子パン」 and 「惣菜パン」, breads with sweets or savory dishes tucked inside or wrapped around them, are a culture that developed uniquely in Japan. Anpan is said to have been born in the Meiji period when the idea of manjū was applied to bread.","de":"The variety of Japanese bakeries seems to strike people from other countries as remarkable. Anpan (sweet bean bun), curry bread, melon bread, yakisoba bread. 「菓子パン」 and 「惣菜パン」, breads with sweets or savory dishes tucked inside or wrapped around them, are a culture that developed uniquely in Japan. Anpan is said to have been born in the Meiji period when the idea of manjū was applied to bread."},{"zh-Hant":"抱著散發剛出爐香氣的紙袋，走上車站的階梯。指尖冰冷，只有胸口微微地溫暖。這是冬天早晨小小的奢侈。","zh-Hans":"抱着散发刚出炉香气的纸袋，走上车站的阶梯。指尖冰冷，只有胸口微微地温暖。这是冬天早晨小小的奢侈。","en":"Carrying a bag that smells of fresh-baked bread, I climb the station stairs. My fingertips are cold, but only my chest feels faintly warm. It is a small luxury of winter mornings.","de":"Carrying a bag that smells of fresh-baked bread, I climb the station stairs. My fingertips are cold, but only my chest feels faintly warm. It is a small luxury of winter mornings."}],"d88":[{"zh-Hant":"「生意還好嗎？」\n「馬馬虎虎啦。」","zh-Hans":"「生意还好吗？」\n「马马虎虎啦。」","en":"\"Are you making money?\"\n\"So-so, you know.\"","de":"\"Are you making money?\"\n\"So-so, you know.\""},{"zh-Hant":"這是大阪商人間著名的寒暄對話。被問「生意還好嗎」，回答「還可以吧」。如今真的這樣打招呼的人已經不多，但它被視為大阪人對生意上心的一句固定用語。","zh-Hans":"这是大阪商人间著名的寒暄对话。被问「生意还好吗」，回答「还可以吧」。如今真的这样打招呼的人已经不多，但它被视为大阪人对生意上心的一句固定用语。","en":"This is a well-known exchange of greetings among Osaka merchants. You are asked, \"Are you making money?\" and you reply, \"So-so.\" Few people actually greet each other this way nowadays, but it is known as a set phrase reflecting the Osaka people's strong attention to business.","de":"This is a well-known exchange of greetings among Osaka merchants. You are asked, \"Are you making money?\" and you reply, \"So-so.\" Few people actually greet each other this way nowadays, but it is known as a set phrase reflecting the Osaka people's strong attention to business."},{"zh-Hant":"大阪話中，與價格相關的表達也很多。「まけて」意思是「算便宜點」，「勉強しときます」意思是「給你打折」。而道別時會說「おおきに」。它原本是「おおきにありがとう」的省略，意思是「非常」。","zh-Hans":"大阪话中，与价格相关的表达也很多。「まけて」意思是「算便宜点」，「勉强しときます」意思是「给你打折」。而道别时会说「おおきに」。它原本是「おおきにありがとう」的省略，意思是「非常」。","en":"Osaka dialect has many expressions related to price. 「まけて」 means \"give me a discount,\" and 「勉強しときます」 means \"I'll knock off a bit.\" And when parting, one says 「おおきに」. It was originally a shortening of 「おおきにありがとう」, and meant \"very.\"","de":"Osaka dialect has many expressions related to price. 「まけて」 means \"give me a discount,\" and 「勉強しときます」 means \"I'll knock off a bit.\" And when parting, one says 「おおきに」. It was originally a shortening of 「おおきにありがとう」, and meant \"very.\""}],"d89":[{"zh-Hant":"在商務日語中，要請託或拒絕某件事時，會在正題之前加上一句被稱為「緩衝詞」（クッション言葉）的話。意思是緩和對方受到衝擊的緩衝材。","zh-Hans":"在商务日语中，要请托或拒绝某件事时，会在正题之前加上一句被称为「缓冲词」（クッション言叶）的话。意思是缓和对方受到冲击的缓冲材。","en":"In business Japanese, when making a request or declining something, a phrase called 「クッション言葉」, a cushion phrase, is placed before the main point. It is a buffer that softens the impact on the other party.","de":"In business Japanese, when making a request or declining something, a phrase called 「クッション言葉」, a cushion phrase, is placed before the main point. It is a buffer that softens the impact on the other party."},{"zh-Hant":"請託時說「百忙之中打擾您，非常抱歉」「麻煩您了」「方便的時候」。拒絕時說「很抱歉」「承蒙您的好意」「實在難以啟齒」。詢問時說「如果方便的話」「冒昧請教」。","zh-Hans":"请托时说「百忙之中打扰您，非常抱歉」「麻烦您了」「方便的时候」。拒绝时说「很抱歉」「承蒙您的好意」「实在难以启齿」。询问时说「如果方便的话」「冒昧请教」。","en":"When making a request, you say 「お忙しいところ恐れ入りますが」, 「お手数をおかけしますが」, or 「お手すきの際に」. When declining, you say 「あいにくですが」, 「せっかくですが」, or 「申し上げにくいのですが」. When asking a question, you say 「差し支えなければ」 or 「失礼ですが」.","de":"When making a request, you say 「お忙しいところ恐れ入りますが」, 「お手数をおかけしますが」, or 「お手すきの際に」. When declining, you say 「あいにくですが」, 「せっかくですが」, or 「申し上げにくいのですが」. When asking a question, you say 「差し支えなければ」 or 「失礼ですが」."},{"zh-Hant":"例如，比起「請把資料寄給我」，「麻煩您了，能否請您寄送資料呢？」就不會顯得生硬。也許你會覺得繞了遠路，但正是這一道工序，讓日本職場的人際關係變得圓滑。","zh-Hans":"例如，比起「请把数据寄给我」，「麻烦您了，能否请您寄送数据呢？」就不会显得生硬。也许你会觉得绕了远路，但正是这一道工序，让日本职场的人际关系变得圆滑。","en":"For example, \"Could you please send me the materials?\" can come across as abrupt, while \"I'm sorry to trouble you, but would it be possible to send the materials?\" softens the request. You may find it roundabout, but this extra step is what keeps relationships in Japanese workplaces running smoothly.","de":"For example, \"Could you please send me the materials?\" can come across as abrupt, while \"I'm sorry to trouble you, but would it be possible to send the materials?\" softens the request. You may find it roundabout, but this extra step is what keeps relationships in Japanese workplaces running smoothly."}],"d90":[{"zh-Hant":"工作了又工作，生活卻始終沒有寬裕起來，我靜靜地望著自己的雙手。","zh-Hans":"工作了又工作，生活却始终没有宽裕起来，我静静地望着自己的双手。","en":"I work and work, yet my life never grows any easier. I quietly gaze at my own hands.","de":"I work and work, yet my life never grows any easier. I quietly gaze at my own hands."},{"zh-Hant":"令人懷念的故鄉口音，在車站的人群之中，我為了聽它而前去。","zh-Hans":"令人怀念的故乡口音，在车站的人群之中，我为了听它而前去。","en":"I miss the accent of my hometown. In the crowd at the station, I go out just to hear it.","de":"I miss the accent of my hometown. In the crowd at the station, I go out just to hear it."},{"zh-Hant":"石川啄木把短歌分成三行來寫。第一首，是說即使工作再工作，生活也沒有變得輕鬆，於是靜靜凝視自己的手。雖然是一百多年前的歌，今天的勞動者讀來依然扎心。","zh-Hans":"石川啄木把短歌分成三行来写。第一首，是说即使工作再工作，生活也没有变得轻松，于是静静凝视自己的手。虽然是一百多年前的歌，今天的劳动者读来依然扎心。","en":"Ishikawa Takuboku wrote his tanka in three lines. The first is about working and working without life becoming any easier, and quietly looking at one's own hands. Though it was written more than a century ago, it still pierces the heart of today's workers.","de":"Ishikawa Takuboku wrote his tanka in three lines. The first is about working and working without life becoming any easier, and quietly looking at one's own hands. Though it was written more than a century ago, it still pierces the heart of today's workers."},{"zh-Hant":"第二首，是說在東京生活的啄木，想聽故鄉岩手的口音，於是特地前往上野車站的人群中。離鄉背井生活的人，應該能體會這份心情。","zh-Hans":"第二首，是说在东京生活的啄木，想听故乡岩手的口音，于是特地前往上野车站的人群中。离乡背井生活的人，应该能体会这份心情。","en":"The second is about Takuboku, living in Tokyo, who wanted to hear the accent of his home province of Iwate and went out into the crowds at Ueno Station. Anyone who lives far from home should understand that feeling.","de":"The second is about Takuboku, living in Tokyo, who wanted to hear the accent of his home province of Iwate and went out into the crowds at Ueno Station. Anyone who lives far from home should understand that feeling."}],"d91":[{"zh-Hant":"母親什麼也沒說，比平常更早起床，煮了味噌湯。為了討吉利吃的炸豬排蓋飯，昨晚就已經吃過了。是「考試致勝」的「カツ」。","zh-Hans":"母亲什么也没说，比平常更早起床，煮了味噌汤。为了讨吉利吃的炸猪排盖饭，昨晚就已经吃过了。是「考试致胜」的「カツ」。","en":"My mother said nothing and got up earlier than usual to make miso soup. The tonkatsu donburi I ate for good luck was already eaten last night. It was the 「カツ」 of \"winning the exam\" (katsu, the same sound as \"cutlet\").","de":"My mother said nothing and got up earlier than usual to make miso soup. The tonkatsu donburi I ate for good luck was already eaten last night. It was the 「カツ」 of \"winning the exam\" (katsu, the same sound as \"cutlet\")."},{"zh-Hant":"穿鞋時，母親遞給我兩個一次性暖暖包。「一個貼手，一個貼背。」接著又是一個護身符。那是去年我為了祈求考試合格，去著名神社買回來的。","zh-Hans":"穿鞋时，母亲递给我两个一次性暖暖包。「一个贴手，一个贴背。」接着又是一个护身符。那是去年我为了祈求考试合格，去著名神社买回来的。","en":"As I was putting on my shoes at the entrance, my mother handed me two disposable hand warmers. \"One for your hands, one for your back.\" Then there was an amulet, which I had bought last year at a famous shrine to pray for passing the exam.","de":"As I was putting on my shoes at the entrance, my mother handed me two disposable hand warmers. \"One for your hands, one for your back.\" Then there was an amulet, which I had bought last year at a famous shrine to pray for passing the exam."},{"zh-Hant":"我說「我去了」，母親只回了一句「去吧」。她沒有說要加油。直到很久以後，我才明白那是她獨特的關心。","zh-Hans":"我说「我去了」，母亲只回了一句「去吧」。她没有说要加油。直到很久以后，我才明白那是她独特的关心。","en":"When I said, \"I'm going,\" my mother only replied, \"Off you go.\" She did not say to do my best. It was only much later that I understood this was her own way of caring.","de":"When I said, \"I'm going,\" my mother only replied, \"Off you go.\" She did not say to do my best. It was only much later that I understood this was her own way of caring."},{"zh-Hant":"外面冷得幾乎凍僵。我握緊口袋裡的暖暖包，邁步走向車站。","zh-Hans":"外面冷得几乎冻僵。我握紧口袋里的暖暖包，迈步走向车站。","en":"Outside, it was cold enough to freeze me. I clenched the hand warmer in my pocket and started walking toward the station.","de":"Outside, it was cold enough to freeze me. I clenched the hand warmer in my pocket and started walking toward the station."}],"d92":[{"zh-Hant":"一月中旬的週末，全日本都會舉行「大學入學共通考試」。這是承接過去「中心考試」的考試，對於以國立、公立大學為目標的考生來說，是第一道關卡。","zh-Hans":"一月中旬的周末，全日本都会举行「大学入学共通考试」。这是承接过去「中心考试」的考试，对于以国立、公立大学为目标的考生来说，是第一道关卡。","en":"On a weekend in mid-January, the 「大学入学共通テスト」, the Common Test for University Admissions, is held across Japan. It succeeds the former \"Center Test\" and is the first major hurdle for many applicants aiming for national or public universities.","de":"On a weekend in mid-January, the 「大学入学共通テスト」, the Common Test for University Admissions, is held across Japan. It succeeds the former \"Center Test\" and is the first major hurdle for many applicants aiming for national or public universities."},{"zh-Hant":"共通考試中，不只是背誦知識，要求讀取資料、考驗思考力與判斷力的題目也增加了。英語加重了聽力的比重，還加入了資訊科目。考試的樣貌，原原本本地反映出教育的目標。","zh-Hans":"共通考试中，不只是背诵知识，要求读取数据、考验思考力与判断力的题目也增加了。英语加重了听力的比重，还加入了信息科目。考试的样貌，原原本本地反映出教育的目标。","en":"The Common Test has increasingly included questions that require reading materials and testing reasoning and judgment, rather than only memorizing knowledge. Listening has gained weight in English, and an information subject has been added. The form of the exam faithfully reflects the goals of education.","de":"The Common Test has increasingly included questions that require reading materials and testing reasoning and judgment, rather than only memorizing knowledge. Listening has gained weight in English, and an information subject has been added. The form of the exam faithfully reflects the goals of education."},{"zh-Hant":"這段時期也正值雪季，有時會因交通混亂而延後考試開始時間。另外，私立大學中，透過推薦或綜合型選拔入學的學生增加，「一決勝負」的入學考試本身，也正在被重新檢討。","zh-Hans":"这段时期也正值雪季，有时会因交通混乱而延后考试开始时间。另外，私立大学中，通过推荐或综合型选拔入学的学生增加，「一决胜负」的入学考试本身，也正在被重新检讨。","en":"This period also coincides with the snow season, and sometimes transport disruptions delay the start of the exam. Meanwhile, at private universities, more students are admitted through recommendations and comprehensive selection rather than entrance exams alone, and the very nature of the \"one-shot\" entrance exam is being questioned.","de":"This period also coincides with the snow season, and sometimes transport disruptions delay the start of the exam. Meanwhile, at private universities, more students are admitted through recommendations and comprehensive selection rather than entrance exams alone, and the very nature of the \"one-shot\" entrance exam is being questioned."}],"d93":[{"zh-Hant":"二十四節氣的最後一個，是「大寒」。據說是一年中最嚴寒的時節，實際上各地記錄到最低氣溫，也多半在這段時期。","zh-Hans":"二十四节气的最后一个，是「大寒」。据说是一年中最严寒的时节，实际上各地记录到最低气温，也多半在这段时期。","en":"The last of the 24 solar terms is 「大寒」, Major Cold. It is said to be the harshest time of the year, and indeed the lowest temperatures are often recorded across the country during this period.","de":"The last of the 24 solar terms is 「大寒」, Major Cold. It is said to be the harshest time of the year, and indeed the lowest temperatures are often recorded across the country during this period."},{"zh-Hant":"不過，大寒之後就是立春。按曆法算，春天其實已經近在眼前。在冬天的寒冷之中尋找春天跡象的詞語也很多。「春隣」是冬季的季語，表示春天已經近在隔壁。「三寒四溫」則描述寒冷的日子持續約三天，溫暖的日子又持續約四天，這樣反覆交替、由冬入春的變化。","zh-Hans":"不过，大寒之后就是立春。按历法算，春天其实已经近在眼前。在冬天的寒冷之中寻找春天迹象的词语也很多。「春隣」是冬季的季语，表示春天已经近在隔壁。「三寒四温」则描述寒冷的日子持续约三天，温暖的日子又持续约四天，这样反复交替、由冬入春的变化。","en":"However, after 大寒 comes 立春, the start of spring. By the calendar, spring is already very close. There are many words for finding signs of spring amid the winter cold. 「春隣」 is a winter seasonal word meaning spring is right next door. 「三寒四温」 describes the pattern of about three cold days followed by about four warm days, the shift from winter to spring.","de":"However, after 大寒 comes 立春, the start of spring. By the calendar, spring is already very close. There are many words for finding signs of spring amid the winter cold. 「春隣」 is a winter seasonal word meaning spring is right next door. 「三寒四温」 describes the pattern of about three cold days followed by about four warm days, the shift from winter to spring."},{"zh-Hant":"據說在大寒當天清晨汲取的水，稱為「寒之水」，可以一整年都不腐敗。當天產下的「大寒蛋」，也是受歡迎的招財吉祥物。寒冷的谷底，同時也是通往春天的轉折點。","zh-Hans":"据说在大寒当天清晨汲取的水，称为「寒之水」，可以一整年都不腐败。当天产下的「大寒蛋」，也是受欢迎的招财吉祥物。寒冷的谷底，同时也是通往春天的转折点。","en":"Water drawn in the early morning of 大寒 is called 「寒の水」, and it was said never to spoil for a whole year. 「大寒卵」, eggs laid on that day, are popular as lucky charms that attract money. The bottom of the cold is also the turning point toward spring.","de":"Water drawn in the early morning of 大寒 is called 「寒の水」, and it was said never to spoil for a whole year. 「大寒卵」, eggs laid on that day, are popular as lucky charms that attract money. The bottom of the cold is also the turning point toward spring."}],"d94":[{"zh-Hant":"歲月是百代的過客，來來往往的年歲也是旅人。把一生寄託在船上，牽著馬韁迎接老年的人，每一天都是旅程，以旅途為家。","zh-Hans":"岁月是百代的过客，来来往往的年岁也是旅人。把一生寄托在船上，牵着马缰迎接老年的人，每一天都是旅程，以旅途为家。","en":"Time is a passing traveler through a hundred generations, and the years that come and go are travelers too. Those who spend their lives on boats and those who grasp the bridles of horses to greet old age make every day a journey, making the road their home.","de":"Time is a passing traveler through a hundred generations, and the years that come and go are travelers too. Those who spend their lives on boats and those who grasp the bridles of horses to greet old age make every day a journey, making the road their home."},{"zh-Hant":"【白話譯】歲月就像永遠在旅行的旅人，來來去去的年歲也是旅人。在船上度過一生的船夫，牽著馬韁迎接老年的馬夫，每一天都是旅程，以旅途為家。","zh-Hans":"【白话译】岁月就像永远在旅行的旅人，来来去去的年岁也是旅人。在船上度过一生的船夫，牵着马缰迎接老年的马夫，每一天都是旅程，以旅途为家。","en":"[Modern translation] Time is like a traveler who journeys forever, and the years that come and go are travelers too. Boatmen who spend their lives on the water, and horse-drivers who lead their animals into old age, live every day as a journey, making the road their home.","de":"[Modern translation] Time is like a traveler who journeys forever, and the years that come and go are travelers too. Boatmen who spend their lives on the water, and horse-drivers who lead their animals into old age, live every day as a journey, making the road their home."},{"zh-Hant":"開頭一句，是化用李白的「夫天地者萬物之逆旅，光陰者百代之過客」。芭蕉自由地吸收中國古典，同時創造出日語散文美妙的節奏。","zh-Hans":"开头一句，是化用李白的「夫天地者万物之逆旅，光阴者百代之过客」。芭蕉自由地吸收中国古典，同时创造出日语散文美妙的节奏。","en":"The opening line echoes Li Bai's 「夫天地者萬物之逆旅，光陰者百代之過客」, \"Heaven and earth are the lodging-house of all things; time is the passing guest of a hundred generations.\" Bashō freely absorbed the Chinese classics while creating the beautiful rhythm of Japanese prose.","de":"The opening line echoes Li Bai's 「夫天地者萬物之逆旅，光陰者百代之過客」, \"Heaven and earth are the lodging-house of all things; time is the passing guest of a hundred generations.\" Bashō freely absorbed the Chinese classics while creating the beautiful rhythm of Japanese prose."}],"d95":[{"zh-Hant":"「請問一位嗎？」一個人走進餐廳時，店員會這樣問。過去，很多人對獨自去吃燒肉或唱卡拉OK，多少會感到不好意思。","zh-Hans":"「请问一位吗？」一个人走进餐厅时，店员会这样问。过去，很多人对独自去吃烧肉或唱卡拉OK，多少会感到不好意思。","en":"\"Just one person?\" This is what a staff member asks when you enter a restaurant alone. In the past, many people felt somewhat hesitant about going alone to a yakiniku restaurant or karaoke.","de":"\"Just one person?\" This is what a staff member asks when you enter a restaurant alone. In the past, many people felt somewhat hesitant about going alone to a yakiniku restaurant or karaoke."},{"zh-Hant":"如今，歡迎單人客的店家越來越多。只有隔板式吧台座位的拉麵店、一人份的火鍋、專供一人使用的卡拉OK包廂。單身家庭增加，積極享受獨處時光的價值觀也逐漸擴散。","zh-Hans":"如今，欢迎单人客的店家越来越多。只有隔板式吧台座位的拉面店、一人份的火锅、专供一人使用的卡拉OK包厢。单身家庭增加，积极享受独处时光的价值观也逐渐扩散。","en":"Nowadays, more and more shops welcome solo customers: ramen shops with only partitioned counter seats, one-person hot pots, and private rooms for solo karaoke. As single-person households increase, the value of actively enjoying time alone has spread.","de":"Nowadays, more and more shops welcome solo customers: ramen shops with only partitioned counter seats, one-person hot pots, and private rooms for solo karaoke. As single-person households increase, the value of actively enjoying time alone has spread."},{"zh-Hant":"一個人，不一定就是孤獨。不必顧慮任何人，按照自己的步調吃飯、思考的時間，與和他人相處的時間同樣珍貴。只是，只要「一個人」是出於自己的選擇，就很好。如何向不願意的孤立伸出援手，仍是整個社會的課題。","zh-Hans":"一个人，不一定就是孤独。不必顾虑任何人，按照自己的步调吃饭、思考的时间，与和他人相处的时间同样珍贵。只是，只要「一个人」是出于自己的选择，就很好。如何向不愿意的孤立伸出援手，仍是整个社会的课题。","en":"Being alone is not necessarily lonely. Time spent eating and thinking at your own pace, without worrying about anyone, is as precious as time spent with others. As long as \"being on your own\" is a choice, it is fine. How to reach out to isolation that people do not want remains a challenge for society as a whole.","de":"Being alone is not necessarily lonely. Time spent eating and thinking at your own pace, without worrying about anyone, is as precious as time spent with others. As long as \"being on your own\" is a choice, it is fine. How to reach out to isolation that people do not want remains a challenge for society as a whole."}],"d96":[{"zh-Hant":"「那麼各位，你們知道被說成是河流、或是奶汁流過後痕跡的這片白濛濛的東西，究竟是什麼嗎？」老師指著掛在黑板上的大型黑色星座圖，從上到下那片白霧般的銀河帶，向大家提出了問題。","zh-Hans":"「那么各位，你们知道被说成是河流、或是奶汁流过后痕迹的这片白蒙蒙的东西，究竟是什么吗？」老师指着挂在黑板上的大型黑色星座图，从上到下那片白雾般的银河带，向大家提出了问题。","en":"\"Now, do you all know what this faintly white thing is, which has been called a river, or the trail of spilled milk?\" The teacher pointed at the hazy white band of the Milky Way, running from top to bottom on the large black star chart hanging on the blackboard, and asked the class.","de":"\"Now, do you all know what this faintly white thing is, which has been called a river, or the trail of spilled milk?\" The teacher pointed at the hazy white band of the Milky Way, running from top to bottom on the large black star chart hanging on the blackboard, and asked the class."},{"zh-Hant":"這是宮澤賢治未完成的名作，讓人忍不住想仰望冬夜的天空。少年喬萬尼與好友坎帕內拉，搭乘行駛在銀河上的列車，踏上旅程。","zh-Hans":"这是宫泽贤治未完成的名作，让人忍不住想仰望冬夜的天空。少年乔万尼与好友坎帕内拉，搭乘行驶在银河上的列车，踏上旅程。","en":"This is Miyazawa Kenji's unfinished masterpiece, one that makes you want to gaze up at the winter night sky. The boy Giovanni and his best friend Campanella ride a train that runs across the Milky Way on a journey.","de":"This is Miyazawa Kenji's unfinished masterpiece, one that makes you want to gaze up at the winter night sky. The boy Giovanni and his best friend Campanella ride a train that runs across the Milky Way on a journey."}],"d97":[{"zh-Hant":"在日本送禮時，有句話叫「不成敬意」（つまらないものですが）。對外國人來說，大概是最難理解的說法之一。「如果不值錢，為什麼還要送？」","zh-Hans":"在日本送礼时，有句话叫「不成敬意」（つまらないものですが）。对外国人来说，大概是最难理解的说法之一。「如果不值钱，为什么还要送？」","en":"When giving a gift in Japan, there is a custom of saying 「つまらないものですが」, \"It is nothing special.\" This is probably one of the expressions hardest for foreigners to understand. \"If it's nothing special, why give it at all?\"","de":"When giving a gift in Japan, there is a custom of saying 「つまらないものですが」, \"It is nothing special.\" This is probably one of the expressions hardest for foreigners to understand. \"If it's nothing special, why give it at all?\""},{"zh-Hant":"這句話說的並不是物品本身的價值。它是一種謙遜，意思是「對您這樣的了不起的人來說，這不過是微不足道的東西」，以此來抬高對方。不過，近來也有越來越多人偏好更正面的說法，例如「一點心意而已」「希望合您的口味」。","zh-Hans":"这句话说的并不是物品本身的价值。它是一种谦逊，意思是「对您这样的了不起的人来说，这不过是微不足道的东西」，以此来擡高对方。不过，近来也有越来越多人偏好更正面的说法，例如「一点心意而已」「希望合您的口味」。","en":"This phrase does not speak to the value of the item itself. It is humility meant to honor the other person, meaning \"This is a trifle for someone as distinguished as you.\" That said, more people these days prefer more positive phrasing, such as 「心ばかりのものですが」 (just a token of my heart) or 「お口に合うといいのですが」 (I hope it suits your taste).","de":"This phrase does not speak to the value of the item itself. It is humility meant to honor the other person, meaning \"This is a trifle for someone as distinguished as you.\" That said, more people these days prefer more positive phrasing, such as 「心ばかりのものですが」 (just a token of my heart) or 「お口に合うといいのですが」 (I hope it suits your taste)."},{"zh-Hant":"在結婚問候時使用的「不成器的我（ふつつか者）」，以及過去把自己的妻子稱為「愚妻」的舊說法，也來自同樣的想法。不過，「愚妻」如今讓很多人感到不舒服，幾乎已經不再使用。謙遜的禮儀，也隨著時代慢慢改變了形式。","zh-Hans":"在结婚问候时使用的「不成器的我（ふつつか者）」，以及过去把自己的妻子称为「愚妻」的旧说法，也来自同样的想法。不过，「愚妻」如今让很多人感到不舒服，几乎已经不再使用。谦逊的礼仪，也随着时代慢慢改变了形式。","en":"The phrase 「ふつつか者ですが」, used in wedding greetings, and the old practice of calling one's wife 「愚妻」 come from the same idea. However, many people now find 「愚妻」 objectionable, and it is almost never used. Even the etiquette of humility gradually changes its form with the times.","de":"The phrase 「ふつつか者ですが」, used in wedding greetings, and the old practice of calling one's wife 「愚妻」 come from the same idea. However, many people now find 「愚妻」 objectionable, and it is almost never used. Even the etiquette of humility gradually changes its form with the times."}],"d98":[{"zh-Hant":"山形縣的銀山溫泉，每到下雪的季節，景色就宛如一幕老電影的場景。河流兩岸排列著大正到昭和初期建造的木造旅館，黃昏時分會點亮瓦斯燈。","zh-Hans":"山形县的银山温泉，每到下雪的季节，景色就宛如一幕老电影的场景。河流两岸排列着大正到昭和初期建造的木造旅馆，黄昏时分会点亮瓦斯灯。","en":"Ginzan Onsen in Yamagata Prefecture takes on the look of a scene from an old film when the snow season arrives. Wooden inns built from the Taishō to early Shōwa periods line both banks of the river, and at dusk the gas lamps are lit.","de":"Ginzan Onsen in Yamagata Prefecture takes on the look of a scene from an old film when the snow season arrives. Wooden inns built from the Taishō to early Shōwa periods line both banks of the river, and at dusk the gas lamps are lit."},{"zh-Hant":"在雪無聲飄落的夜晚，穿著浴衣、披上丹前走到外面，從橋上可以看見河面升起的水氣與旅館的燈光。呼出的氣息是白色的，耳朵冷得發疼。然而回到旅館，泡進露天溫泉，身體會瞬間鬆開。","zh-Hans":"在雪无声飘落的夜晚，穿着浴衣、披上丹前走到外面，从桥上可以看见河面升起的水气与旅馆的灯光。呼出的气息是白色的，耳朵冷得发疼。然而回到旅馆，泡进露天温泉，身体会瞬间松开。","en":"On a night when snow falls silently, when you step outside in a yukata with a tanzen (padded robe) over it, you can see the steam rising off the river and the lights of the inns from the bridge. Your breath is white, and your earlobes ache with cold. Yet once you return to the inn and soak in the open-air bath, your body unwinds in an instant.","de":"On a night when snow falls silently, when you step outside in a yukata with a tanzen (padded robe) over it, you can see the steam rising off the river and the lights of the inns from the bridge. Your breath is white, and your earlobes ache with cold. Yet once you return to the inn and soak in the open-air bath, your body unwinds in an instant."},{"zh-Hant":"台灣也有北投、礁溪等溫泉地，泡湯的文化有不少是在日本統治時期才流傳開來的。邊看雪邊泡湯的體驗，在台灣並不容易遇到。這是一次想親身品味的冬天醍醐味。","zh-Hans":"台湾也有北投、礁溪等温泉地，泡汤的文化有不少是在日本统治时期才流传开来的。边看雪边泡汤的体验，在台湾并不容易遇到。这是一次想亲身品味的冬天醍醐味。","en":"Taiwan also has hot-spring towns such as Beitou and Jiaoxi, and much of its bathing culture spread during the Japanese colonial period. The experience of soaking in a hot spring while watching snow is hard to find in Taiwan. It is a winter pleasure worth experiencing at least once.","de":"Taiwan also has hot-spring towns such as Beitou and Jiaoxi, and much of its bathing culture spread during the Japanese colonial period. The experience of soaking in a hot spring while watching snow is hard to find in Taiwan. It is a winter pleasure worth experiencing at least once."}],"d99":[{"zh-Hant":"一百天前，在秋天的尾聲，我放下了第一篇。從那個在山路上折斷樹枝作為記號的人的故事開始，霜降了，雪積了，年也過了，現在剛剛走過大寒。","zh-Hans":"一百天前，在秋天的尾声，我放下了第一篇。从那个在山路上折断树枝作为记号的人的故事开始，霜降了，雪积了，年也过了，现在刚刚走过大寒。","en":"A hundred days ago, at the end of autumn, I placed the first piece. Beginning with the story of someone who broke branches on a mountain path to mark the way, frost fell, snow piled up, the year turned, and now we have just passed 大寒.","de":"A hundred days ago, at the end of autumn, I placed the first piece. Beginning with the story of someone who broke branches on a mountain path to mark the way, frost fell, snow piled up, the year turned, and now we have just passed 大寒."},{"zh-Hant":"這一百天裡，你撿拾了多少詞語呢？有認得的漢字，意思卻不一樣，讓人嚇一跳的。有方言的音調，讓人笑出來的。一千年前的文章，竟意外地貼近現在的心情，令人一怔的。留在單字本裡的每一個詞，就是你走過這一百天的足跡。","zh-Hans":"这一百天里，你捡拾了多少词语呢？有认得的汉字，意思却不一样，让人吓一跳的。有方言的音调，让人笑出来的。一千年前的文章，竟意外地贴近现在的心情，令人一怔的。留在单字本里的每一个词，就是你走过这一百天的足迹。","en":"How many words have you gathered in these hundred days? Kanji you knew, but whose meanings turned out to be different and surprised you. Dialect sounds that made you laugh. Writing from a thousand years ago that felt unexpectedly close to how you feel now, and made you stop short. Every word left in your word list is simply the footprint of your hundred days of walking.","de":"How many words have you gathered in these hundred days? Kanji you knew, but whose meanings turned out to be different and surprised you. Dialect sounds that made you laugh. Writing from a thousand years ago that felt unexpectedly close to how you feel now, and made you stop short. Every word left in your word list is simply the footprint of your hundred days of walking."},{"zh-Hant":"栞會從讀完的書中被抽出來。但也有人對真正喜愛的書，會就那樣夾著栞收起來。等哪天再翻開時，就能知道自己已經走到了哪裡。","zh-Hans":"栞会从读完的书中被抽出来。但也有人对真正喜爱的书，会就那样夹着栞收起来。等哪天再翻开时，就能知道自己已经走到了哪里。","en":"A bookmark is removed once you finish a book. But some people, for books they truly love, put them away with the bookmark still inside, so that when they open them again someday, they will know how far they got.","de":"A bookmark is removed once you finish a book. But some people, for books they truly love, put them away with the bookmark still inside, so that when they open them again someday, they will know how far they got."},{"zh-Hant":"從明天起，又回到第一篇。第二次讀的「栞」，一定會看起來有些不一樣。","zh-Hans":"从明天起，又回到第一篇。第二次读的「栞」，一定会看起来有些不一样。","en":"From tomorrow, we return to the first piece. The second time you read the 「栞」, it will surely look a little different.","de":"From tomorrow, we return to the first piece. The second time you read the 「栞」, it will surely look a little different."}]});
