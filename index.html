イバー」（很久沒開車的駕駛）等，都是典型的例子。","zh-Hans":"像这样，用了英文单字，但在英语圈却说不通的词，被称为「和制英语」。「サラリーマン」（上班族）、「ノートパソコン」（笔记型电脑）、「コンセント」（插座）、「ガソリンスタンド」（加油站）、「ペーパードライバー」（很久没开车的驾驶）等，都是典型的例子。","en":"Words like these, which use English vocabulary but are not understood in English-speaking countries, are called 「和製英語」, Japanese-made English. Typical examples include サラリーマン (salaryman), ノートパソコン (laptop), コンセント (electrical outlet), ガソリンスタンド (gas station), and ペーパードライバー (a licensed driver who rarely drives).","de":"Words like these, which use English vocabulary but are not understood in English-speaking countries, are called 「和製英語」, Japanese-made English. Typical examples include サラリーマン (salaryman), ノートパソコン (laptop), コンセント (electrical outlet), ガソリンスタンド (gas station), and ペーパードライバー (a licensed driver who rarely drives)."},{"zh-Hant":"和製英語常被當成「錯誤的英文」而嘲笑，但換個角度看，它也可以說是把外來的零件組合起來，創造出日語所需詞彙的創造性行為。這與過去用漢字造新詞的歷史，有某種相通之處。","zh-Hans":"和制英语常被当成「错误的英文」而嘲笑，但换个角度看，它也可以说是把外来的零件组合起来，创造出日语所需词汇的创造性行为。这与过去用汉字造新词的历史，有某种相通之处。","en":"Japanese-made English is often laughed at as \"incorrect English,\" but from another angle it can be seen as a creative act of combining imported parts to make the words Japanese needed. It shares something with the history of creating new words using kanji.","de":"Japanese-made English is often laughed at as \"incorrect English,\" but from another angle it can be seen as a creative act of combining imported parts to make the words Japanese needed. It shares something with the history of creating new words using kanji."}],"d41":[{"zh-Hant":"能自動生成文章的 AI 已經變得很常見。電子郵件的草稿、報告的摘要，幾秒鐘內就能產出工整的文字。它帶來的好處很大，我們大概已經回不去了。","zh-Hans":"能自动生成文章的 AI 已经变得很常见。电子邮件的草稿、报告的摘要，几秒钟内就能产出工整的文本。它带来的好处很大，我们大概已经回不去了。","en":"AI that generates text automatically has become part of everyday life. Drafts of emails and summaries of reports can come out as polished prose within seconds. The benefits are considerable, and we probably cannot go back now.","de":"AI that generates text automatically has become part of everyday life. Drafts of emails and summaries of reports can come out as polished prose within seconds. The benefits are considerable, and we probably cannot go back now."},{"zh-Hant":"但是，寫作這件事的價值，不只在於寫完的文章。在還不知道自己想說什麼的情況下開始寫，選字、刪減、調整順序，在這個過程中，自己想法的輪廓才會慢慢浮現。寫作本身，也就是思考。","zh-Hans":"但是，写作这件事的价值，不只在于写完的文章。在还不知道自己想说什么的情况下开始写，选字、删减、调整顺序，在这个过程中，自己想法的轮廓才会慢慢浮现。写作本身，也就是思考。","en":"But the value of writing does not lie only in the finished text. You begin writing without knowing what you want to say, choose words, cut, and rearrange, and in the process, the outline of your own thinking gradually comes into view. Writing is itself thinking.","de":"But the value of writing does not lie only in the finished text. You begin writing without knowing what you want to say, choose words, cut, and rearrange, and in the process, the outline of your own thinking gradually comes into view. Writing is itself thinking."},{"zh-Hant":"使用工具和把思考全部交給工具，是兩回事。無論在學校還是職場，現在都到了必須一起討論的時候：如何使用 AI，以及如何守住人親手寫作的機會。為了不遺失那些無法只用效率衡量的東西。","zh-Hans":"使用工具和把思考全部交给工具，是两回事。无论在学校还是职场，现在都到了必须一起讨论的时候：如何使用 AI，以及如何守住人亲手写作的机会。为了不遗失那些无法只用效率衡量的东西。","en":"Using a tool and entrusting your thinking entirely to a tool are different things. Both at school and at work, it is time to discuss not only how to use AI but also how to protect people's chances to write with their own hands. So that we do not lose sight of what cannot be measured by efficiency alone.","de":"Using a tool and entrusting your thinking entirely to a tool are different things. Both at school and at work, it is time to discuss not only how to use AI but also how to protect people's chances to write with their own hands. So that we do not lose sight of what cannot be measured by efficiency alone."}],"d42":[{"zh-Hant":"無所事事，每天對著硯台，把心中浮現又消失的瑣碎念頭，隨意寫下來，竟會令人覺得奇怪而又有些瘋狂。","zh-Hans":"无所事事，每天对着砚台，把心中浮现又消失的琐碎念头，随意写下来，竟会令人觉得奇怪而又有些疯狂。","en":"With nothing to do, day after day, sitting before my inkstone, I idly write down the trivial thoughts that drift through my mind, and it feels strangely, almost madly, delightful.","de":"With nothing to do, day after day, sitting before my inkstone, I idly write down the trivial thoughts that drift through my mind, and it feels strangely, almost madly, delightful."},{"zh-Hant":"【白話譯】無事可做、百無聊賴，整日面對著硯台，把心中來來去去、沒有頭緒的事，隨意寫下來，竟覺得有些奇妙的好笑。","zh-Hans":"【白话译】无事可做、百无聊赖，整日面对着砚台，把心中来来去去、没有头绪的事，随意写下来，竟觉得有些奇妙的好笑。","en":"[Modern translation] With nothing to do and time hanging heavy, I sit all day before my inkstone and casually jot down the aimless thoughts that come and go in my mind, and somehow it feels oddly amusing.","de":"[Modern translation] With nothing to do and time hanging heavy, I sit all day before my inkstone and casually jot down the aimless thoughts that come and go in my mind, and somehow it feels oddly amusing."}],"d43":[{"zh-Hant":"十二月的別稱是「師走」。通常的解釋是，連平時沉穩的老師（師）也要忙得東奔西跑的月份。也有一種說法，認為這裡的「師」原本是指為了誦經而巡迴各家的僧侶。","zh-Hans":"十二月的别称是「师走」。通常的解释是，连平时沉稳的老师（师）也要忙得东奔西跑的月份。也有一种说法，认为这里的「师」原本是指为了诵经而巡回各家的僧侣。","en":"The alternative name for December is 「師走」, shiwasu. It is often explained as the month when even teachers (師), who are usually calm, must run about busily. There is also a theory that 「師」 here originally referred to monks who visited households to chant sutras.","de":"The alternative name for December is 「師走」, shiwasu. It is often explained as the month when even teachers (師), who are usually calm, must run about busily. There is also a theory that 「師」 here originally referred to monks who visited households to chant sutras."},{"zh-Hant":"不過，這其實是後來做出來的「諧音附會」，真正的語源並不清楚。也有好幾種說法並存，例如「年果つ（としはつ）」（一年將盡）演變而來的說法。","zh-Hans":"不过，这其实是后来做出来的「谐音附会」，真正的语源并不清楚。也有好几种说法并存，例如「年果つ（としはつ）」（一年将尽）演变而来的说法。","en":"However, this is a folk etymology created later, and the true origin is unclear. Several theories coexist, including one that it evolved from 「年果つ（としはつ）」, meaning \"the year comes to an end.\"","de":"However, this is a folk etymology created later, and the true origin is unclear. Several theories coexist, including one that it evolved from 「年果つ（としはつ）」, meaning \"the year comes to an end.\""},{"zh-Hant":"不管由來如何，十二月確實很忙碌。尾牙、大掃除、賀年卡、工作的截止日期。記事本很快就會被行程填滿。至少在一天之中，希望能有幾分鐘，不必奔跑，慢慢地翻開一本書。","zh-Hans":"不管由来如何，十二月确实很忙碌。尾牙、大扫除、贺年卡、工作的截止日期。记事本很快就会被行程填满。至少在一天之中，希望能有几分钟，不必奔跑，慢慢地翻开一本书。","en":"Whatever its origin, December is certainly a busy month: year-end parties, the big housecleaning, New Year's cards, work deadlines. Your planner fills up quickly. At the very least, I hope you can find a few minutes each day to slowly open a book without rushing.","de":"Whatever its origin, December is certainly a busy month: year-end parties, the big housecleaning, New Year's cards, work deadlines. Your planner fills up quickly. At the very least, I hope you can find a few minutes each day to slowly open a book without rushing."}],"d44":[{"zh-Hant":"京都的冬天，據說有「底冷」。比起氣溫的數字，那是一種從腳下慢慢滲入、直達身體深處的寒冷。","zh-Hans":"京都的冬天，据说有「底冷」。比起气温的数字，那是一种从脚下慢慢渗入、直达身体深处的寒冷。","en":"Winter in Kyoto is said to have 「底冷え」, a deep, bone-chilling cold. More than the number on the thermometer, it is a cold that seeps slowly up from your feet to the core of your body.","de":"Winter in Kyoto is said to have 「底冷え」, a deep, bone-chilling cold. More than the number on the thermometer, it is a cold that seeps slowly up from your feet to the core of your body."},{"zh-Hant":"原因之一在於地形。京都是被三面山脈環繞的盆地，夜裡冷空氣容易沉積在盆地底部。因為風少，冷氣不易散去。另外，古老的町家是為了抵禦夏天的酷熱而建造的，因此冬天容易有縫隙風灌進來，這也是原因之一。","zh-Hans":"原因之一在于地形。京都是被三面山脉环绕的盆地，夜里冷空气容易沉积在盆地底部。因为风少，冷气不易散去。另外，古老的町家是为了抵御夏天的酷热而建造的，因此冬天容易有缝隙风灌进来，这也是原因之一。","en":"One reason lies in the terrain. Kyoto is a basin surrounded by mountains on three sides, so cold air easily pools at the bottom of the basin overnight. With little wind, the cold air cannot escape. Also, old machiya townhouses were built to cope with summer heat, so in winter drafts easily get in.","de":"One reason lies in the terrain. Kyoto is a basin surrounded by mountains on three sides, so cold air easily pools at the bottom of the basin overnight. With little wind, the cold air cannot escape. Also, old machiya townhouses were built to cope with summer heat, so in winter drafts easily get in."},{"zh-Hant":"即便如此，冬天的京都仍有只屬於冬天的好處。遊客稀少的清晨寺院，披上雪妝的金閣寺，冒著熱氣的湯豆腐。穿上厚厚的襪子出門走走，絕對值得。","zh-Hans":"即便如此，冬天的京都仍有只属于冬天的好处。游客稀少的清晨寺院，披上雪妆的金阁寺，冒着热气的汤豆腐。穿上厚厚的袜子出门走走，绝对值得。","en":"Even so, Kyoto in winter has charms found only in winter: early-morning temples with few tourists, Kinkaku-ji dusted with snow, and steaming yudofu. Putting on thick socks and going out is well worth it.","de":"Even so, Kyoto in winter has charms found only in winter: early-morning temples with few tourists, Kinkaku-ji dusted with snow, and steaming yudofu. Putting on thick socks and going out is well worth it."}],"d45":[{"zh-Hant":"沖繩的方言中，最廣為人知的大概是「なんくるないさ」。常被翻譯成「總會有辦法的」，作為表現沖繩人豁達性格的詞語，也成了觀光的宣傳標語。","zh-Hans":"冲绳的方言中，最广为人知的大概是「なんくるないさ」。常被翻译成「总会有办法的」，作为表现冲绳人豁达性格的词语，也成了观光的宣传标语。","en":"Perhaps the best-known word in Okinawan dialect is 「なんくるないさ」. It is often translated as \"It'll somehow work out,\" and as an expression of the Okinawan people's easygoing nature, it has even become a tourism catchphrase.","de":"Perhaps the best-known word in Okinawan dialect is 「なんくるないさ」. It is often translated as \"It'll somehow work out,\" and as an expression of the Okinawan people's easygoing nature, it has even become a tourism catchphrase."},{"zh-Hant":"不過，也有人指出，它的本來語感略有不同。據說原本是「まくとぅそーけー、なんくるないさ」，也就是「只要盡到誠意，總會有辦法」。它的意思不是「什麼都不做也沒關係」。","zh-Hans":"不过，也有人指出，它的本来语感略有不同。据说原本是「まくとぅそーけー、なんくるないさ」，也就是「只要尽到诚意，总会有办法」。它的意思不是「什么都不做也没关系」。","en":"However, some point out that its original nuance is a little different. Apparently it was originally 「まくとぅそーけー、なんくるないさ」, meaning \"If you do your utmost in sincerity, it will somehow work out.\" It does not mean that it's fine to do nothing.","de":"However, some point out that its original nuance is a little different. Apparently it was originally 「まくとぅそーけー、なんくるないさ」, meaning \"If you do your utmost in sincerity, it will somehow work out.\" It does not mean that it's fine to do nothing."},{"zh-Hant":"此外，沖繩語中還有許多聽起來很優美的詞，例如「めんそーれ」（歡迎光臨）、「ちゅらさん」（美麗的人）、「ゆいまーる」（互助）。它與標準日語差異很大，也有研究者把它視為獨立的語言。","zh-Hans":"此外，冲绳语中还有许多听起来很优美的词，例如「めんそーれ」（欢迎光临）、「ちゅらさん」（美丽的人）、「ゆいまーる」（互助）。它与标准日语差异很大，也有研究者把它视为独立的语言。","en":"There are many other beautiful-sounding words in Okinawan, such as 「めんそーれ」 (welcome), 「ちゅらさん」 (beautiful person), and 「ゆいまーる」 (mutual aid). It differs greatly from standard Japanese, and some researchers treat it as an independent language.","de":"There are many other beautiful-sounding words in Okinawan, such as 「めんそーれ」 (welcome), 「ちゅらさん」 (beautiful person), and 「ゆいまーる」 (mutual aid). It differs greatly from standard Japanese, and some researchers treat it as an independent language."}],"d46":[{"zh-Hant":"日語的「怪我」讀作「けが」，指身體受傷。「怪」和「我」，與字的本義幾乎沒有關係，最好把它當作一種借字來理解。它和中文的「怪我（怪我嗎？）」當然毫無關係。","zh-Hans":"日语的「怪我」读作「けが」，指身体受伤。「怪」和「我」，与字的本义几乎没有关系，最好把它当作一种借字来理解。它和中文的「怪我（怪我吗？）」当然毫无关系。","en":"In Japanese, 「怪我」 is read 「けが」 and means an injury to the body. Neither 「怪」 nor 「我」 has much to do with the meaning of the word, so it is best understood as a kind of ateji, a character used for its sound. It has, of course, no connection to the Chinese 「怪我」.","de":"In Japanese, 「怪我」 is read 「けが」 and means an injury to the body. Neither 「怪」 nor 「我」 has much to do with the meaning of the word, so it is best understood as a kind of ateji, a character used for its sound. It has, of course, no connection to the Chinese 「怪我」."},{"zh-Hant":"「出世」在中文裡也有「出生」的意思，但在日語中，幾乎只指「在社會上爬到較高的地位」。「出世魚」則是指隨著成長而改變名字的魚。鰤魚會依序變成ワカシ、イナダ、ワラサ，最後才成為ブリ。","zh-Hans":"「出世」在中文里也有「出生」的意思，但在日语中，几乎只指「在社会上爬到较高的地位」。「出世鱼」则是指随着成长而改变名字的鱼。𫚕鱼会依序变成ワカシ、イナダ、ワラサ，最后才成为ブリ。","en":"「出世」 can mean \"to be born\" in Chinese, but in Japanese it refers almost exclusively to rising to a high position in society. 「出世魚」 are fish whose names change as they grow. Yellowtail, for example, goes through the names ワカシ, イナダ, and ワラサ before finally becoming ブリ.","de":"「出世」 can mean \"to be born\" in Chinese, but in Japanese it refers almost exclusively to rising to a high position in society. 「出世魚」 are fish whose names change as they grow. Yellowtail, for example, goes through the names ワカシ, イナダ, and ワラサ before finally becoming ブリ."},{"zh-Hant":"還有「皮肉」。在日語中，指的是迂迴批評對方的說法，也就是「嫌味」。說「皮肉なことに」，則表示事情的結果與原本的盤算相反。與中文「皮肉（皮與肉）」的意思相去甚遠。","zh-Hans":"还有「皮肉」。在日语中，指的是迂回批评对方的说法，也就是「嫌味」。说「皮肉なことに」，则表示事情的结果与原本的盘算相反。与中文「皮肉（皮与肉）」的意思相去甚远。","en":"And then there is 「皮肉」. In Japanese it means a roundabout way of criticizing someone, that is, 「嫌味」, a barb. Saying 「皮肉なことに」 expresses that the result is the opposite of what one intended. It is quite far from the Chinese meaning of 皮肉, \"skin and flesh.\"","de":"And then there is 「皮肉」. In Japanese it means a roundabout way of criticizing someone, that is, 「嫌味」, a barb. Saying 「皮肉なことに」 expresses that the result is the opposite of what one intended. It is quite far from the Chinese meaning of 皮肉, \"skin and flesh.\""}],"d47":[{"zh-Hant":"說到冬天日式料理中不可或缺的香氣，大概就是柚子了。只要在湯裡漂浮一小塊果皮，揭開湯碗蓋子的瞬間，冬天的香氣就會輕輕地升騰起來。","zh-Hans":"说到冬天日式料理中不可或缺的香气，大概就是柚子了。只要在汤里漂浮一小块果皮，揭开汤碗盖子的瞬间，冬天的香气就会轻轻地升腾起来。","en":"When it comes to the fragrance essential to winter Japanese cuisine, it is probably yuzu. Just floating a single piece of its peel in a clear soup creates a moment where, as you lift the lid of the bowl, the scent of winter gently rises.","de":"When it comes to the fragrance essential to winter Japanese cuisine, it is probably yuzu. Just floating a single piece of its peel in a clear soup creates a moment where, as you lift the lid of the bowl, the scent of winter gently rises."},{"zh-Hant":"日本的柚子，和台灣稱為「柚子」的文旦，屬於完全不同的水果。它小小的，果皮凹凸不平，果汁很酸，幾乎不會直接吃。主要使用的是果皮與果汁，也是柑橘醋（ポン酢）和柚子胡椒的原料。","zh-Hans":"日本的柚子，和台湾称为「柚子」的文旦，属于完全不同的水果。它小小的，果皮凹凸不平，果汁很酸，几乎不会直接吃。主要使用的是果皮与果汁，也是柑橘醋（ポン酢）和柚子胡椒的原料。","en":"Japanese yuzu is an entirely different fruit from what Taiwan calls 柚子, which is the pomelo. It is small, with a bumpy rind, and its juice is sour, so it is almost never eaten on its own. Mainly the peel and juice are used, and they are ingredients for ponzu (citrus soy sauce) and yuzu kosho.","de":"Japanese yuzu is an entirely different fruit from what Taiwan calls 柚子, which is the pomelo. It is small, with a bumpy rind, and its juice is sour, so it is almost never eaten on its own. Mainly the peel and juice are used, and they are ingredients for ponzu (citrus soy sauce) and yuzu kosho."},{"zh-Hant":"柚子胡椒的「胡椒」，在九州方言中指的是辣椒。它是把青色柚子皮、青辣椒和鹽一起磨成的佐料，很適合搭配火鍋或烤雞肉串。別被名字騙了，請務必試一次。","zh-Hans":"柚子胡椒的「胡椒」，在九州方言中指的是辣椒。它是把青色柚子皮、青辣椒和盐一起磨成的佐料，很适合搭配火锅或烤鸡肉串。别被名字骗了，请务必试一次。","en":"The 「胡椒」 in yuzu kosho refers to chili peppers in Kyushu dialect. It is a condiment made by grinding green yuzu peel, green chilies, and salt together, and it pairs well with hot pot or yakitori. Don't be fooled by the name; be sure to try it once.","de":"The 「胡椒」 in yuzu kosho refers to chili peppers in Kyushu dialect. It is a condiment made by grinding green yuzu peel, green chilies, and salt together, and it pairs well with hot pot or yakitori. Don't be fooled by the name; be sure to try it once."}],"d48":[{"zh-Hant":"兩位年輕的紳士，打扮得完全像英國的士兵，扛著閃閃發亮的槍，牽著兩隻像白熊一樣的狗，在深山裡一片樹葉沙沙作響的地方，邊說著各種話邊走著。","zh-Hans":"两位年轻的绅士，打扮得完全像英国的士兵，扛着闪闪发亮的枪，牵着两只像白熊一样的狗，在深山里一片树叶沙沙作响的地方，边说着各种话边走着。","en":"Two young gentlemen, dressed entirely like British soldiers, shouldering gleaming rifles and leading two dogs as big as white bears, walked deep in the mountains where the dry leaves rustled, chatting away about all sorts of things.","de":"Two young gentlemen, dressed entirely like British soldiers, shouldering gleaming rifles and leading two dogs as big as white bears, walked deep in the mountains where the dry leaves rustled, chatting away about all sorts of things."}],"d49":[{"zh-Hant":"二十四節氣中的「大雪」。據說這時群山被雪覆蓋，連平地也開始下雪。不過，在太平洋一側的城市，這個時期很少會下大雪。曆法與實際天氣之間的落差，也是季節樂趣的一部分。","zh-Hans":"二十四节气中的「大雪」。据说这时群山被雪覆盖，连平地也开始下雪。不过，在太平洋一侧的城市，这个时期很少会下大雪。历法与实际天气之间的落差，也是季节乐趣的一部分。","en":"「大雪」, Major Snow, is one of the 24 solar terms. It is said to be the time when the mountains are covered in snow and snow begins to fall even in the lowlands. However, in cities on the Pacific side, heavy snow is rare at this time. The gap between the calendar and the actual weather is also one of the pleasures of the season.","de":"「大雪」, Major Snow, is one of the 24 solar terms. It is said to be the time when the mountains are covered in snow and snow begins to fall even in the lowlands. However, in cities on the Pacific side, heavy snow is rare at this time. The gap between the calendar and the actual weather is also one of the pleasures of the season."},{"zh-Hant":"在雪國，為了迎接真正的寒冬，人們會進行「雪圍」。用木板或稻草把屋子的窗戶與庭樹圍起來，保護它們不受積雪的重量與暴風雪的侵襲。屋簷下垂著冰柱，早上則被除雪車的聲音吵醒。","zh-Hans":"在雪国，为了迎接真正的寒冬，人们会进行「雪围」。用木板或稻草把屋子的窗户与庭树围起来，保护它们不受积雪的重量与暴风雪的侵袭。屋檐下垂着冰柱，早上则被除雪车的声音吵醒。","en":"In snowy regions, people prepare for the real winter by putting up 「雪囲い」, snow enclosures. They wrap windows and garden trees in boards or straw to protect them from the weight of snow and blizzards. Icicles hang from the eaves, and in the morning you wake to the sound of snowplows.","de":"In snowy regions, people prepare for the real winter by putting up 「雪囲い」, snow enclosures. They wrap windows and garden trees in boards or straw to protect them from the weight of snow and blizzards. Icicles hang from the eaves, and in the morning you wake to the sound of snowplows."},{"zh-Hant":"在台灣，幾乎沒有什麼機會看到雪，不過在合歡山等高山上，寒流來襲的日子偶爾會下雪。一下雪就會上新聞，前往觀賞的車輛會讓道路塞車。雪的稀罕，或許也正是它的珍貴之處。","zh-Hans":"在台湾，几乎没有什么机会看到雪，不过在合欢山等高山上，寒流来袭的日子偶尔会下雪。一下雪就会上新闻，前往观赏的车辆会让道路塞车。雪的稀罕，或许也正是它的珍贵之处。","en":"In Taiwan, there are few chances to see snow, but on high mountains such as Hehuanshan, it occasionally snows on days when cold waves arrive. When it snows, it makes the news, and the cars of sightseers jam the roads. The rarity of snow may be exactly what makes it precious.","de":"In Taiwan, there are few chances to see snow, but on high mountains such as Hehuanshan, it occasionally snows on days when cold waves arrive. When it snows, it makes the news, and the cars of sightseers jam the roads. The rarity of snow may be exactly what makes it precious."}],"d50":[{"zh-Hant":"接近年底時，有時會收到這樣的明信片：「本年度之後，恕我不再寄送新年問候，敬請見諒。」這就是通知停止寄送賀年卡的所謂「年賀狀仕舞」。","zh-Hans":"接近年底时，有时会收到这样的明信片：「本年度之后，恕我不再寄送新年问候，敬请见谅。」这就是通知停止寄送贺年卡的所谓「年贺状仕舞」。","en":"As the year end approaches, you sometimes receive a postcard saying, \"With this year, I have decided to omit sending New Year's greetings. Please forgive me.\" This is what is called 「年賀状じまい」, the closing of New Year's card exchanges, a notice that one is stopping the custom of sending New Year's cards.","de":"As the year end approaches, you sometimes receive a postcard saying, \"With this year, I have decided to omit sending New Year's greetings. Please forgive me.\" This is what is called 「年賀状じまい」, the closing of New Year's card exchanges, a notice that one is stopping the custom of sending New Year's cards."},{"zh-Hant":"賀年卡的印製數量比高峰期大幅減少。用社群媒體或訊息App來完成新年問候的人越來越多，明信片漲價更是雪上加霜。也有很多人表示，年紀大了之後寫賀卡成了負擔。","zh-Hans":"贺年卡的印制数量比高峰期大幅减少。用社群媒体或消息App来完成新年问候的人越来越多，明信片涨价更是雪上加霜。也有很多人表示，年纪大了之后写贺卡成了负担。","en":"The number of New Year's cards printed has fallen sharply from its peak. More people now send New Year's greetings through social media or messaging apps, and the rising price of postcards has added to the decline. Many people also say that writing cards has become a burden as they get older.","de":"The number of New Year's cards printed has fallen sharply from its peak. More people now send New Year's greetings through social media or messaging apps, and the rising price of postcards has added to the decline. Many people also say that writing cards has become a burden as they get older."},{"zh-Hant":"儘管如此，一年一次互通近況的關係，仍有很多人感到可惜。附上手寫一句話的賀年卡，有著螢幕貼圖所沒有的溫度。要停止或是繼續，都是自由的。只是，「じまい」這個詞，讓人感受到一種細心地收尾關係的日本式禮儀。","zh-Hans":"尽管如此，一年一次互通近况的关系，仍有很多人感到可惜。附上手写一句话的贺年卡，有着屏幕贴图所没有的温度。要停止或是继续，都是自由的。只是，「じまい」这个词，让人感受到一种细心地收尾关系的日本式礼仪。","en":"Still, many people are reluctant to give up a relationship that keeps in touch once a year. A New Year's card with a handwritten line has a warmth that screen stickers cannot match. Whether to stop or continue is up to each person. Yet the word 「じまい」 conveys a distinctly Japanese etiquette of carefully closing a relationship.","de":"Still, many people are reluctant to give up a relationship that keeps in touch once a year. A New Year's card with a handwritten line has a warmth that screen stickers cannot match. Whether to stop or continue is up to each person. Yet the word 「じまい」 conveys a distinctly Japanese etiquette of carefully closing a relationship."}],"d51":[{"zh-Hant":"日本人喜愛的四字熟語中，有一個是「一期一會」。原本是茶道的用語，意思是「把這次茶會當作一生只有一次，全心招待」。「一期」是佛教用語，指一個人的一生。","zh-Hans":"日本人喜爱的四字熟语中，有一个是「一期一会」。原本是茶道的用语，意思是「把这次茶会当作一生只有一次，全心招待」。「一期」是佛教用语，指一个人的一生。","en":"One of the four-character idioms the Japanese favor is 「一期一会」, ichigo ichie. Originally a term from the tea ceremony, it teaches: \"Treat this tea gathering as the only one in your life, and host it with all your heart.\" 「一期」 is a Buddhist term meaning a person's whole lifetime.","de":"One of the four-character idioms the Japanese favor is 「一期一会」, ichigo ichie. Originally a term from the tea ceremony, it teaches: \"Treat this tea gathering as the only one in your life, and host it with all your heart.\" 「一期」 is a Buddhist term meaning a person's whole lifetime."},{"zh-Hant":"與中文成語相同的四字熟語很多，但也有不少是日本獨自誕生的。「以心傳心」據說是從禪宗的用語流傳開來的，「一石二鳥」則是從英語諺語翻譯而來。「十人十色」是日本的詞語，指每個人的喜好與想法各不相同。","zh-Hans":"与中文成语相同的四字熟语很多，但也有不少是日本独自诞生的。「以心传心」据说是从禅宗的用语流传开来的，「一石二鸟」则是从英语谚语翻译而来。「十人十色」是日本的词语，指每个人的喜好与想法各不相同。","en":"Many four-character idioms are shared with Chinese, but quite a few were born uniquely in Japan. 「以心伝心」 is said to have spread from Zen terminology, and 「一石二鳥」 from a translation of an English proverb. 「十人十色」 is a Japanese expression meaning that each person's tastes and ideas differ.","de":"Many four-character idioms are shared with Chinese, but quite a few were born uniquely in Japan. 「以心伝心」 is said to have spread from Zen terminology, and 「一石二鳥」 from a translation of an English proverb. 「十人十色」 is a Japanese expression meaning that each person's tastes and ideas differ."},{"zh-Hant":"反過來說，有些在中文裡很日常的成語，在日本幾乎不用。兩種語言在相同的漢字根基上，各自伸展出不同的枝條。比較這些差異，大概也是懂得兩種語言的人才能享有的特權吧。","zh-Hans":"反过来说，有些在中文里很日常的成语，在日本几乎不用。两种语言在相同的汉字根基上，各自伸展出不同的枝条。比较这些差异，大概也是懂得两种语言的人才能享有的特权吧。","en":"Conversely, some idioms that are everyday in Chinese are almost never used in Japan. On a shared foundation of kanji, the two languages have each grown different branches. Comparing these differences is perhaps a privilege reserved for those who know both languages.","de":"Conversely, some idioms that are everyday in Chinese are almost never used in Japan. On a shared foundation of kanji, the two languages have each grown different branches. Comparing these differences is perhaps a privilege reserved for those who know both languages."}],"d52":[{"zh-Hant":"受日圓貶值等因素影響，來日本的外國觀光客大幅增加。觀光在帶動地區經濟的同時，熱門景點也出現了被稱為「オーバーツーリズム（觀光公害）」的問題。","zh-Hans":"受日圆贬值等因素影响，来日本的外国观光客大幅增加。观光在带动地区经济的同时，热门景点也出现了被称为「オーバーツーリズム（观光公害）」的问题。","en":"Driven by factors such as the weak yen, the number of foreign tourists visiting Japan has increased dramatically. While tourism boosts local economies, popular destinations are also experiencing what is called \"overtourism\" (kankō kōgai, tourism pollution).","de":"Driven by factors such as the weak yen, the number of foreign tourists visiting Japan has increased dramatically. While tourism boosts local economies, popular destinations are also experiencing what is called \"overtourism\" (kankō kōgai, tourism pollution)."},{"zh-Hant":"在京都，路線公車曾擠滿觀光客，當地居民甚至無法搭乘。在祇園花見小路一帶，有關遊客未經許可拍攝舞妓的投訴接連不斷，也豎立了禁止進入私人道路的告示牌。富士山的登山道則開始徵收入山費，並實施人數限制。","zh-Hans":"在京都，路线公车曾挤满观光客，当地居民甚至无法搭乘。在祇园花见小路一带，有关游客未经许可拍摄舞妓的投诉接连不断，也竖立了禁止进入私人道路的告示牌。富士山的登山道则开始征收入山费，并实施人数限制。","en":"In Kyoto, route buses were sometimes so full of tourists that local residents could not board. Around Hanamikoji in Gion, complaints piled up about tourists photographing maiko without permission, and signs were posted restricting entry to private roads. On the Mount Fuji trails, an entrance fee and limits on the number of climbers were introduced.","de":"In Kyoto, route buses were sometimes so full of tourists that local residents could not board. Around Hanamikoji in Gion, complaints piled up about tourists photographing maiko without permission, and signs were posted restricting entry to private roads. On the Mount Fuji trails, an entrance fee and limits on the number of climbers were introduced."},{"zh-Hant":"從「吸引觀光客」的階段，走向「設計如何接待」的階段。如何讓居民的生活與觀光得以並存，不只是日本的課題，也是許多觀光地共同面對的挑戰。","zh-Hans":"从「吸引观光客」的阶段，走向「设计如何接待」的阶段。如何让居民的生活与观光得以并存，不只是日本的课题，也是许多观光地共同面对的挑战。","en":"The challenge is to move from the stage of \"attracting tourists\" to the stage of \"designing how to welcome them.\" How to make residents' daily lives and tourism coexist is a shared challenge not just for Japan but for many tourist destinations.","de":"The challenge is to move from the stage of \"attracting tourists\" to the stage of \"designing how to welcome them.\" How to make residents' daily lives and tourism coexist is a shared challenge not just for Japan but for many tourist destinations."}],"d53":[{"zh-Hant":"婉拒續攤、走出店門時，外面比想像中還冷。一邊重新圍好圍巾，一邊走向車站。","zh-Hans":"婉拒续摊、走出店门时，外面比想像中还冷。一边重新围好围巾，一边走向车站。","en":"After declining the second round and stepping out of the restaurant, I found it colder outside than I expected. I walked toward the station, re-wrapping my scarf as I went.","de":"After declining the second round and stepping out of the restaurant, I found it colder outside than I expected. I walked toward the station, re-wrapping my scarf as I went."},{"zh-Hant":"今年也發生了很多事。部門變了，主管變了，上班的電車也換了。乾杯的時候，隔壁座的後輩對我說：「明年也請多多指教。」我下意識地回了一句：「彼此彼此。」明明連明年自己還在不在這家公司，都不知道。","zh-Hans":"今年也发生了很多事。部门变了，主管变了，上班的电车也换了。干杯的时候，隔壁座的后辈对我说：「明年也请多多指教。」我下意识地回了一句：「彼此彼此。」明明连明年自己还在不在这家公司，都不知道。","en":"A lot happened this year too. My department changed, my boss changed, and so did the train I take to work. At the toast, a junior colleague in the next seat said, \"Please continue to look after me next year,\" and I instinctively replied, \"Likewise.\" Even though I didn't know whether I would still be at this company next year.","de":"A lot happened this year too. My department changed, my boss changed, and so did the train I take to work. At the toast, a junior colleague in the next seat said, \"Please continue to look after me next year,\" and I instinctively replied, \"Likewise.\" Even though I didn't know whether I would still be at this company next year."},{"zh-Hant":"在車站前的燈飾下，一對年輕人正在拍照。我從旁邊經過，把交通卡靠近閘門。嗶的一聲，很輕。我試著數了數，今年還剩下幾天。手指，好像有點不夠用。","zh-Hans":"在车站前的灯饰下，一对年轻人正在拍照。我从旁边经过，把交通卡靠近闸门。哔的一声，很轻。我试着数了数，今年还剩下几天。手指，好像有点不够用。","en":"Under the illuminations in front of the station, a young couple was taking photos. I passed by them and held my transit card to the ticket gate. A light beep. I tried counting how many days were left in this year. My fingers, it seemed, were not quite enough.","de":"Under the illuminations in front of the station, a young couple was taking photos. I passed by them and held my transit card to the ticket gate. A light beep. I tried counting how many days were left in this year. My fingers, it seemed, were not quite enough."}],"d54":[{"zh-Hant":"主旨：年末問候","zh-Hans":"主旨：年末问候","en":"Subject: Year-end greetings","de":"Subject: Year-end greetings"},{"zh-Hant":"櫻花商事股份有限公司\n業務部　鈴木先生","zh-Hans":"樱花商事股份有限公司\n业务部　铃木先生","en":"Sakura Shoji Co., Ltd.\nAttn: Mr. Suzuki, Sales Department","de":"Sakura Shoji Co., Ltd.\nAttn: Mr. Suzuki, Sales Department"},{"zh-Hant":"一直承蒙您的關照。\n今年也蒙受您格外的厚愛，衷心感謝。","zh-Hans":"一直承蒙您的关照。\n今年也蒙受您格外的厚爱，衷心感谢。","en":"Thank you always for your kind support.\nThank you for your special patronage throughout this year.","de":"Thank you always for your kind support.\nThank you for your special patronage throughout this year."},{"zh-Hant":"冒昧告知，本公司的年末年初休假安排如下。\n休假期間：12月27日（日）至1月4日（一）\n休假期間收到的諮詢，將於1月5日（二）起陸續處理。","zh-Hans":"冒昧告知，本公司的年末年初休假安排如下。\n休假期间：12月27日（日）至1月4日（一）\n休假期间收到的咨询，将于1月5日（二）起陆续处理。","en":"I would like to inform you of our year-end and New Year holiday schedule.\nClosed: Sunday, December 27 to Monday, January 4\nInquiries received during the closure will be addressed in order starting Tuesday, January 5.","de":"I would like to inform you of our year-end and New Year holiday schedule.\nClosed: Sunday, December 27 to Monday, January 4\nInquiries received during the closure will be addressed in order starting Tuesday, January 5."},{"zh-Hant":"明年也請繼續給予我們一如既往的支持，謝謝。\n祝您新年愉快。","zh-Hans":"明年也请继续给予我们一如既往的支持，谢谢。\n祝您新年愉快。","en":"We look forward to your continued support in the coming year.\nWishing you a happy New Year.","de":"We look forward to your continued support in the coming year.\nWishing you a happy New Year."}],"d55":[{"zh-Hant":"十二月十三日是「正月事始」。自這一天起開始準備迎接新年，是自古以來的習俗。","zh-Hans":"十二月十三日是「正月事始」。自这一天起开始准备迎接新年，是自古以来的习俗。","en":"December 13th is 「正月事始」, the Beginning of New Year Preparations. From this day, it has been customary to start preparing to welcome the new year.","de":"December 13th is 「正月事始」, the Beginning of New Year Preparations. From this day, it has been customary to start preparing to welcome the new year."},{"zh-Hant":"首先要做的是「煤払い」。把一年積累的煙灰和灰塵清除，打掃房屋，迎接年神。這就是現代大掃除的原型。在寺廟和神社裡，人們用綁著竹葉的長竹竿清除正殿高處樑上的灰塵，這樣的景象也常成為新聞。","zh-Hans":"首先要做的是「煤払い」。把一年积累的烟灰和灰尘清除，打扫房屋，迎接年神。这就是现代大扫除的原型。在寺庙和神社里，人们用绑着竹叶的长竹竿清除正殿高处梁上的灰尘，这样的景象也常成为新闻。","en":"The first task is 「煤払い」, soot-sweeping, clearing away the soot and dust of the year to purify the house and welcome the New Year deity. This is the origin of today's big year-end cleaning. At temples and shrines, a long bamboo pole with bamboo leaves attached is used to sweep dust from the high beams of the main hall, a scene that often makes the news.","de":"The first task is 「煤払い」, soot-sweeping, clearing away the soot and dust of the year to purify the house and welcome the New Year deity. This is the origin of today's big year-end cleaning. At temples and shrines, a long bamboo pole with bamboo leaves attached is used to sweep dust from the high beams of the main hall, a scene that often makes the news."},{"zh-Hant":"另外，據說十三日也是從山上採來用於門松的松枝的「松迎え」的日子。現代人已經很少有人會特別在意十三日，但比起在年底一口氣收拾到精疲力盡，慢慢開始準備才是明智的做法，這一點古今皆然。","zh-Hans":"另外，据说十三日也是从山上采来用于门松的松枝的「松迎え」的日子。现代人已经很少有人会特别在意十三日，但比起在年底一口气收拾到精疲力尽，慢慢开始准备才是明智的做法，这一点古今皆然。","en":"Also, the 13th was said to be the day for 「松迎え」, fetching pine branches from the mountains for the kadomatsu decorations. Few people today pay special attention to the 13th, but it is still wise to start gradually rather than try to finish everything at once at year's end and exhaust yourself, as it has always been.","de":"Also, the 13th was said to be the day for 「松迎え」, fetching pine branches from the mountains for the kadomatsu decorations. Few people today pay special attention to the 13th, but it is still wise to start gradually rather than try to finish everything at once at year's end and exhaust yourself, as it has always been."}],"d56":[{"zh-Hant":"「這裡就是我的終老之所嗎，積雪五尺深」（小林一茶）","zh-Hans":"「这里就是我的终老之所吗，积雪五尺深」（小林一茶）","en":"So this is to be my final dwelling place, under snow five shaku deep.\n(Kobayashi Issa)","de":"So this is to be my final dwelling place, under snow five shaku deep.\n(Kobayashi Issa)"},{"zh-Hant":"「一次又一次，問著雪積得有多深」（正岡子規）","zh-Hans":"「一次又一次，问着雪积得有多深」（正冈子规）","en":"Again and again, I ask how deep the snow has piled up.\n(Masaoka Shiki)","de":"Again and again, I ask how deep the snow has piled up.\n(Masaoka Shiki)"},{"zh-Hant":"一茶的這首句，是他決定回到故鄉信濃，度過晚年時所作。看著被五尺（約一.五公尺）積雪掩埋的房子，他喃喃自語：「這就是我最後的住所嗎？」字裡行間透出一種說不清是認命還是安心的複雜心境。","zh-Hans":"一茶的这首句，是他决定回到故乡信浓，度过晚年时所作。看着被五尺（约一.五公尺）积雪掩埋的房子，他喃喃自语：「这就是我最后的住所吗？」字里行间透出一种说不清是认命还是安心的复杂心境。","en":"Issa's verse was written when he decided to return to his hometown of Shinano and spend his final years there. Looking at a house buried under snow five shaku deep, he murmurs, \"Is this to be my last dwelling?\" The verse carries a complex mood, neither quite resignation nor quite relief.","de":"Issa's verse was written when he decided to return to his hometown of Shinano and spend his final years there. Looking at a house buried under snow five shaku deep, he murmurs, \"Is this to be my last dwelling?\" The verse carries a complex mood, neither quite resignation nor quite relief."},{"zh-Hant":"子規的這首句，是在病床上寫的。因為生病而無法起身的子規，聽說外面下雪了，就一次又一次地問家人積了多深。無法親眼看見雪的那份憧憬，就凝聚在這十七個音節裡。","zh-Hans":"子规的这首句，是在病床上写的。因为生病而无法起身的子规，听说外面下雪了，就一次又一次地问家人积了多深。无法亲眼看见雪的那份憧憬，就凝聚在这十七个音节里。","en":"Shiki's verse was written from his sickbed. Too ill to get up, he heard that it was snowing outside and asked his family again and again how deep it had piled. The longing for snow he could not see with his own eyes is packed into these seventeen syllables.","de":"Shiki's verse was written from his sickbed. Too ill to get up, he heard that it was snowing outside and asked his family again and again how deep it had piled. The longing for snow he could not see with his own eyes is packed into these seventeen syllables."}],"d57":[{"zh-Hant":"「今天早上，冷得超厲害的吧？」\n「真的啊。車子的擋風玻璃白茫茫的，都刮不乾淨呢。」\n「手套有戴好嗎？」\n「有戴有戴。不過好怕，今天就待在家裡吧。」\n「那麼，明天見囉。」","zh-Hans":"「今天早上，冷得超厉害的吧？」\n「真的啊。车子的挡风玻璃白茫茫的，都刮不干净呢。」\n「手套有戴好吗？」\n「有戴有戴。不过好怕，今天就待在家里吧。」\n「那么，明天见啰。」","en":"\"Wasn't it insanely cold this morning?\"\n\"Really. The car's windshield was completely white and hard to clear.\"\n\"Did you wear your gloves?\"\n\"I did, I did. But it's scary out there, so I'll stay home today.\"\n\"Well then, see you tomorrow.\"","de":"\"Wasn't it insanely cold this morning?\"\n\"Really. The car's windshield was completely white and hard to clear.\"\n\"Did you wear your gloves?\"\n\"I did, I did. But it's scary out there, so I'll stay home today.\"\n\"Well then, see you tomorrow.\""}],"d58":[{"zh-Hant":"從台北來到東京的人，都會異口同聲地說：「東京的冬天，沒有想像中那麼冷。」","zh-Hans":"从台北来到东京的人，都会异口同声地说：「东京的冬天，没有想像中那么冷。」","en":"People who come to Tokyo from Taipei all say the same thing: \"Winter in Tokyo isn't as cold as I expected.\"","de":"People who come to Tokyo from Taipei all say the same thing: \"Winter in Tokyo isn't as cold as I expected.\""},{"zh-Hant":"就數字來說，東京要冷得多。儘管如此，人們之所以有這種感覺，大概是因為東京的冬天乾燥、晴天多，陽光暖和。相對地，台北的冬天雨多，帶著濕氣的寒意會鑽進衣服裡。而且很多家庭沒有暖氣，甚至會出現室內比室外還冷的情況。","zh-Hans":"就数字来说，东京要冷得多。尽管如此，人们之所以有这种感觉，大概是因为东京的冬天干燥、晴天多，阳光暖和。相对地，台北的冬天雨多，带着湿气的寒意会钻进衣服里。而且很多家庭没有暖气，甚至会出现室内比室外还冷的情况。","en":"By the numbers, Tokyo is much colder. Yet people feel this way probably because Tokyo's winters are dry, with many sunny days and warm sunshine. In contrast, Taipei's winters bring a lot of rain, and the damp chill slips right through your clothes. Moreover, many homes have no heating, and it can even be colder indoors than outside.","de":"By the numbers, Tokyo is much colder. Yet people feel this way probably because Tokyo's winters are dry, with many sunny days and warm sunshine. In contrast, Taipei's winters bring a lot of rain, and the damp chill slips right through your clothes. Moreover, many homes have no heating, and it can even be colder indoors than outside."},{"zh-Hant":"另一方面，在東京的家裡，冷氣暖房是理所當然的，冬天就成了與乾燥的戰爭。開著加濕器，嘴唇上抹著護唇膏，被靜電嚇得一跳。","zh-Hans":"另一方面，在东京的家里，冷气暖房是理所当然的，冬天就成了与干燥的战争。开着加湿器，嘴唇上抹着护唇膏，被静电吓得一跳。","en":"In Tokyo homes, on the other hand, air-conditioning heating is taken for granted, and winter becomes a battle against dryness. You run the humidifier, apply lip balm, and jump when you get a shock of static electricity.","de":"In Tokyo homes, on the other hand, air-conditioning heating is taken for granted, and winter becomes a battle against dryness. You run the humidifier, apply lip balm, and jump when you get a shock of static electricity."},{"zh-Hant":"寒冷有一種溫度計量不出來的性質。哪一種冬天比較難熬，最後或許取決於你已經習慣了哪一種冬天。","zh-Hans":"寒冷有一种温度计量不出来的性质。哪一种冬天比较难熬，最后或许取决于你已经习惯了哪一种冬天。","en":"Cold has a quality that no thermometer can measure. Perhaps which winter feels harsher ultimately depends on which winter you have grown used to.","de":"Cold has a quality that no thermometer can measure. Perhaps which winter feels harsher ultimately depends on which winter you have grown used to."}],"d59":[{"zh-Hant":"在日本的超市買「人参」，拿到的是橘色的胡蘿蔔，也就是台灣所說的「紅蘿蔔」。中文的「人參」，在日語中則會區分為「高麗人参」或「朝鮮人参」來稱呼。","zh-Hans":"在日本的超市买「人参」，拿到的是橘色的胡萝卜，也就是台湾所说的「红萝卜」。中文的「人参」，在日语中则会区分为「高丽人参」或「朝鲜人参」来称呼。","en":"When you buy 「人参」 at a Japanese supermarket, you get orange carrots, what Taiwan calls 紅蘿蔔. In Japanese, the Chinese 人參 (ginseng) is distinguished as 高麗人参 or 朝鮮人参.","de":"When you buy 「人参」 at a Japanese supermarket, you get orange carrots, what Taiwan calls 紅蘿蔔. In Japanese, the Chinese 人參 (ginseng) is distinguished as 高麗人参 or 朝鮮人参."},{"zh-Hant":"在日語中，「野菜」也就是非常普通的「蔬菜」。如果是中文「野菜」那樣指山野間自然生長的野草，日語則會說「山菜」。","zh-Hans":"在日语中，「野菜」也就是非常普通的「蔬菜」。如果是中文「野菜」那样指山野间自然生长的野草，日语则会说「山菜」。","en":"In Japanese, 「野菜」 is simply an ordinary vegetable. If you mean wild greens growing naturally in the fields and hills, as the Chinese 野菜 does, Japanese says 「山菜」, mountain vegetables.","de":"In Japanese, 「野菜」 is simply an ordinary vegetable. If you mean wild greens growing naturally in the fields and hills, as the Chinese 野菜 does, Japanese says 「山菜」, mountain vegetables."},{"zh-Hant":"還有「饅頭」。日本的「まんじゅう」，是用麵粉做皮、包上紅豆餡蒸熟的甜點。如果期待像台灣「饅頭」那樣沒有內餡的蒸麵包，大概會有點失望。中文的「包子」（肉包）在日本，則被歸為饅頭的同類來命名。","zh-Hans":"还有「馒头」。日本的「まんじゅう」，是用面粉做皮、包上红豆馅蒸熟的甜点。如果期待像台湾「馒头」那样没有内馅的蒸面包，大概会有点失望。中文的「包子」（肉包）在日本，则被归为馒头的同类来命名。","en":"And then there is 「饅頭」. Japanese 「まんじゅう」 is a sweet wagashi made of a flour skin wrapped around sweet bean paste and steamed. If you expect the unfilled steamed bun of Taiwan's 饅頭, you may be a little disappointed. In Japan, the Chinese 包子 (filled steamed bun) is named as a relative of manjū.","de":"And then there is 「饅頭」. Japanese 「まんじゅう」 is a sweet wagashi made of a flour skin wrapped around sweet bean paste and steamed. If you expect the unfilled steamed bun of Taiwan's 饅頭, you may be a little disappointed. In Japan, the Chinese 包子 (filled steamed bun) is named as a relative of manjū."}],"d60":[{"zh-Hant":"寒冷的冬天，從北方來到了住著狐狸母子的森林。","zh-Hans":"寒冷的冬天，从北方来到了住着狐狸母子的森林。","en":"A cold winter came from the north to the forest where a mother fox and her child lived.","de":"A cold winter came from the north to the forest where a mother fox and her child lived."},{"zh-Hant":"某天早晨，小狐狸正要從洞穴裡出來，卻叫了一聲「啊！」，一邊捂著眼睛，一邊滾到母狐狸身邊。","zh-Hans":"某天早晨，小狐狸正要从洞穴里出来，却叫了一声「啊！」，一边捂着眼睛，一边滚到母狐狸身边。","en":"One morning, the young fox tried to come out of the burrow, but cried out \"Ah!\" and, covering its eyes, tumbled over to its mother.","de":"One morning, the young fox tried to come out of the burrow, but cried out \"Ah!\" and, covering its eyes, tumbled over to its mother."},{"zh-Hant":"第一次看見雪的小狐狸，以為是什麼東西刺進了眼睛，原來是雪反射的耀眼光芒。這是日本的孩子們代代閱讀的冬天童話。","zh-Hans":"第一次看见雪的小狐狸，以为是什么东西刺进了眼睛，原来是雪反射的耀眼光芒。这是日本的孩子们代代阅读的冬天童话。","en":"The young fox, seeing snow for the first time, thought something had pierced its eyes, but it was only the dazzling glare of the snow. This is a winter fairy tale that Japanese children have read in their textbooks for generations.","de":"The young fox, seeing snow for the first time, thought something had pierced its eyes, but it was only the dazzling glare of the snow. This is a winter fairy tale that Japanese children have read in their textbooks for generations."}],"d61":[{"zh-Hant":"日本每年出生的孩子人數，持續刷新歷史新低。在地方上，小學合併的情況越來越多，一個年級只有幾個學生的學校也不算少見。","zh-Hans":"日本每年出生的孩子人数，持续刷新历史新低。在地方上，小学合并的情况越来越多，一个年级只有几个学生的学校也不算少见。","en":"The number of children born in Japan each year keeps setting new record lows. In rural areas, elementary schools are increasingly being merged, and schools with only a few students per grade are not unusual.","de":"The number of children born in Japan each year keeps setting new record lows. In rural areas, elementary schools are increasingly being merged, and schools with only a few students per grade are not unusual."},{"zh-Hant":"少子化的原因不只一個。年輕世代就業與收入不穩定、工時過長、教育費負擔沉重，還有育兒的負擔往往落在女性身上的現實。人們之所以猶豫要不要結婚、生育，與其說是個人的選擇，不如說根植於社會的結構。","zh-Hans":"少子化的原因不只一个。年轻世代就业与收入不稳定、工时过长、教育费负担沉重，还有育儿的负担往往落在女性身上的现实。人们之所以犹豫要不要结婚、生育，与其说是个人的选择，不如说根植于社会的结构。","en":"There is no single cause of the declining birthrate. Young people face unstable jobs and incomes, long working hours, heavy education costs, and the reality that the burden of child-rearing tends to fall on women. The reasons people hesitate to marry or have children are rooted less in individual choice than in the structure of society.","de":"There is no single cause of the declining birthrate. Young people face unstable jobs and incomes, long working hours, heavy education costs, and the reality that the burden of child-rearing tends to fall on women. The reasons people hesitate to marry or have children are rooted less in individual choice than in the structure of society."},{"zh-Hant":"只靠增加津貼，恐怕改變不了這股趨勢。要打造一個讓每個人都能在沒有經濟不安的情況下，選擇是否生育孩子的社會；也要尊重不生育的選擇。只有兩者兼備，才能為面對教室裡的寧靜打下基礎。","zh-Hans":"只靠增加津贴，恐怕改变不了这股趋势。要打造一个让每个人都能在没有经济不安的情况下，选择是否生育孩子的社会；也要尊重不生育的选择。只有两者兼备，才能为面对教室里的宁静打下基础。","en":"Simply adding to benefits will probably not change the trend. What is needed is a society where everyone can choose whether to have children without economic anxiety, and where the choice not to have children is also respected. Only when both are in place can a foundation be built for facing the quiet in the classroom.","de":"Simply adding to benefits will probably not change the trend. What is needed is a society where everyone can choose whether to have children without economic anxiety, and where the choice not to have children is also respected. Only when both are in place can a foundation be built for facing the quiet in the classroom."}],"d62":[{"zh-Hant":"漢字雖然是從中國傳來的，但日本也有自己獨創的漢字。這些字被稱為「國字」或「和製漢字」。","zh-Hans":"汉字虽然是从中国传来的，但日本也有自己独创的汉字。这些字被称为「国字」或「和制汉字」。","en":"Although kanji came from China, Japan also created its own kanji. These are called 「国字」 or 「和製漢字」, Japanese-made kanji.","de":"Although kanji came from China, Japan also created its own kanji. These are called 「国字」 or 「和製漢字」, Japanese-made kanji."},{"zh-Hant":"「峠」指的是上坡與下坡的分界，也就是山路最高的地方。在山字旁上組合「上」與「下」，構思極為巧妙。「凪」指風停了、海面變得平靜。「畑」則表示用火燒掉雜草後開墾出來的旱田。它是為了與水田的「田」加以區分而誕生的。","zh-Hans":"「峠」指的是上坡与下坡的分界，也就是山路最高的地方。在山字旁上组合「上」与「下」，构思极为巧妙。「凪」指风停了、海面变得平静。「畑」则表示用火烧掉杂草后开垦出来的旱田。它是为了与水田的「田」加以区分而诞生的。","en":"「峠」 refers to the boundary between an uphill and a downhill slope, the highest point of a mountain path. Combining 「上」 and 「下」 within the mountain radical is a brilliant idea. 「凪」 means the wind has stopped and the sea has grown calm. 「畑」 denotes dry farmland cleared by burning weeds. It was created to distinguish it from the rice-paddy character 「田」.","de":"「峠」 refers to the boundary between an uphill and a downhill slope, the highest point of a mountain path. Combining 「上」 and 「下」 within the mountain radical is a brilliant idea. 「凪」 means the wind has stopped and the sea has grown calm. 「畑」 denotes dry farmland cleared by burning weeds. It was created to distinguish it from the rice-paddy character 「田」."},{"zh-Hant":"此外，「働」「込」「枠」「匂う」等也被視為國字。其中，「腺」是江戶時代的蘭學者為了翻譯荷蘭文醫學書而造出的字，後來也傳入中文，用在「淋巴腺」等詞中。漢字並不是單向傳播的，而是在往來之間不斷成長的。","zh-Hans":"此外，「働」「込」「枠」「匂う」等也被视为国字。其中，「腺」是江户时代的兰学者为了翻译荷兰文医学书而造出的字，后来也传入中文，用在「淋巴腺」等词中。汉字并不是单向传播的，而是在往来之间不断成长的。","en":"Other characters considered 国字 include 「働」「込」「枠」 and 「匂う」. Among them, 「腺」 (gland) was created by Edo-period Dutch-learning scholars to translate Dutch medical texts. It later entered Chinese and is used in words like 淋巴腺 (lymph gland). Kanji did not travel in one direction only; they grew through constant exchange.","de":"Other characters considered 国字 include 「働」「込」「枠」 and 「匂う」. Among them, 「腺」 (gland) was created by Edo-period Dutch-learning scholars to translate Dutch medical texts. It later entered Chinese and is used in words like 淋巴腺 (lymph gland). Kanji did not travel in one direction only; they grew through constant exchange."}],"d63":[{"zh-Hant":"到了年底，彩券行前會排起長長的隊伍。這就是「年末JUMBO彩券」。頭獎金額高達數億日圓。即使明白中獎機率幾乎等於零，人們還是不由自主地排進隊伍裡。","zh-Hans":"到了年底，彩券行前会排起长长的队伍。这就是「年末JUMBO彩券」。头奖金额高达数亿日圆。即使明白中奖几率几乎等于零，人们还是不由自主地排进队伍里。","en":"At year's end, long lines form in front of lottery counters. This is the 「年末ジャンボ宝くじ」, the year-end Jumbo Lottery. The top prize reaches hundreds of millions of yen. Even knowing that the odds of winning are nearly zero, people still find themselves joining the line.","de":"At year's end, long lines form in front of lottery counters. This is the 「年末ジャンボ宝くじ」, the year-end Jumbo Lottery. The top prize reaches hundreds of millions of yen. Even knowing that the odds of winning are nearly zero, people still find themselves joining the line."},{"zh-Hant":"有趣的是，有些彩券行以「很容易中獎」而口碑相傳。在東京銀座的彩券行，每逢大安日就會排起數小時的隊伍。從統計上看，在銷售量大的彩券行中獎的機率自然比較高，但人們還是忍不住要討個吉利。","zh-Hans":"有趣的是，有些彩券行以「很容易中奖」而口碑相传。在东京银座的彩券行，每逢大安日就会排起数小时的队伍。从统计上看，在销售量大的彩券行中奖的几率自然比较高，但人们还是忍不住要讨个吉利。","en":"Interestingly, some counters have a reputation for being \"lucky.\" At a counter in Ginza, Tokyo, lines of several hours form on 大安 days, the luckiest days on the traditional calendar. Statistically, counters that sell many tickets naturally produce more winners, yet people cannot help seeking good omens.","de":"Interestingly, some counters have a reputation for being \"lucky.\" At a counter in Ginza, Tokyo, lines of several hours form on 大安 days, the luckiest days on the traditional calendar. Statistically, counters that sell many tickets naturally produce more winners, yet people cannot help seeking good omens."},{"zh-Hant":"也有人會把買好的彩券供奉在神龕上。在抽獎日到來前的幾個星期裡，想著「如果中了的話」的那段時間，或許才是彩券真正的商品。","zh-Hans":"也有人会把买好的彩券供奉在神龛上。在抽奖日到来前的几个星期里，想着「如果中了的话」的那段时间，或许才是彩券真正的商品。","en":"Some people even place their purchased tickets on the household shrine. During the weeks before the drawing, the time spent imagining \"what if I win\" may be the true product the lottery sells.","de":"Some people even place their purchased tickets on the household shrine. During the weeks before the drawing, the time spent imagining \"what if I win\" may be the true product the lottery sells."}],"d64":[{"zh-Hant":"今年的冬至也快到了。這是一年中白天最短、夜晚最長的一天。從這天起，白天會一點一點變長。古時候稱之為「一陽來復」，也被視為在連續遭遇不順之後，運氣開始好轉的徵兆。","zh-Hans":"今年的冬至也快到了。这是一年中白天最短、夜晚最长的一天。从这天起，白天会一点一点变长。古时候称之为「一阳来复」，也被视为在连续遭遇不顺之后，运气开始好转的征兆。","en":"The winter solstice is nearly here again. It is the day with the shortest daylight and the longest night of the year. From this day on, the daylight gradually grows longer. In ancient times it was called 「一陽来復」, the return of the yang, and was also seen as a sign that fortune would turn upward after a string of misfortunes.","de":"The winter solstice is nearly here again. It is the day with the shortest daylight and the longest night of the year. From this day on, the daylight gradually grows longer. In ancient times it was called 「一陽来復」, the return of the yang, and was also seen as a sign that fortune would turn upward after a string of misfortunes."},{"zh-Hant":"說到日本的冬至習俗，就是「柚子湯」和「南瓜」。據說在澡盆裡泡著浮有柚子的熱水，就不會感冒。也有一種說法，認為這是把「冬至」與「湯治」、「柚子」與「融通がきく（變通、靈活）」串在一起的諧音玩笑。吃南瓜則是為了攝取營養，好熬過寒冬。也有人說，吃帶有「ん」音的食物，就能招來「運」。","zh-Hans":"说到日本的冬至习俗，就是「柚子汤」和「南瓜」。据说在澡盆里泡着浮有柚子的热水，就不会感冒。也有一种说法，认为这是把「冬至」与「汤治」、「柚子」与「融通がきく（变通、灵活）」串在一起的谐音玩笑。吃南瓜则是为了摄取营养，好熬过寒冬。也有人说，吃带有「ん」音的食物，就能招来「运」。","en":"The main winter solstice customs in Japan are 「ゆず湯」, yuzu baths, and pumpkin. It is said that soaking in a bath with yuzu floating in it will keep you from catching a cold. There is also a theory that this is a pun linking 「冬至」 with 「湯治」 (hot-spring cure) and 「柚子」 with 「融通がきく」 (being flexible). Eating pumpkin provides nutrition to get through the winter. It is also said that eating foods containing the sound \"n\" calls in good luck.","de":"The main winter solstice customs in Japan are 「ゆず湯」, yuzu baths, and pumpkin. It is said that soaking in a bath with yuzu floating in it will keep you from catching a cold. There is also a theory that this is a pun linking 「冬至」 with 「湯治」 (hot-spring cure) and 「柚子」 with 「融通がきく」 (being flexible). Eating pumpkin provides nutrition to get through the winter. It is also said that eating foods containing the sound \"n\" calls in good luck."},{"zh-Hant":"台灣的冬至是吃湯圓的日子。在同一天，隔著海的兩片土地，以完全不同的方式取暖，這很有意思。","zh-Hans":"台湾的冬至是吃汤圆的日子。在同一天，隔着海的两片土地，以完全不同的方式取暖，这很有意思。","en":"In Taiwan, the winter solstice is the day to eat tangyuan. It is interesting that on the same day, two lands across the sea warm themselves in completely different ways.","de":"In Taiwan, the winter solstice is the day to eat tangyuan. It is interesting that on the same day, two lands across the sea warm themselves in completely different ways."}],"d65":[{"zh-Hant":"主旨：商品出貨延誤致歉","zh-Hans":"主旨：商品出货延误致歉","en":"Subject: Apology for the delayed shipment","de":"Subject: Apology for the delayed shipment"},{"zh-Hant":"田中先生","zh-Hans":"田中先生","en":"Dear Mr. Tanaka,","de":"Dear Mr. Tanaka,"},{"zh-Hant":"此次您所訂購的商品出貨延誤，給您帶來極大的不便，謹在此由衷致歉。","zh-Hans":"此次您所订购的商品出货延误，给您带来极大的不便，谨在此由衷致歉。","en":"We sincerely apologize for the delay in shipping the product you ordered, and for the considerable inconvenience this has caused you.","de":"We sincerely apologize for the delay in shipping the product you ordered, and for the considerable inconvenience this has caused you."},{"zh-Hant":"經過調查，已查明是因本公司倉庫庫存管理不周，導致出貨手續出現延誤。\n商品已於本日出貨，預計明天內即可送達。","zh-Hans":"经过调查，已查明是因本公司仓库库存管理不周，导致出货手续出现延误。\n商品已于本日出货，预计明天内即可送达。","en":"Our investigation found that inadequate inventory management at our warehouse caused delays in the shipping process.\nThe product was shipped today, and we expect it to reach you by tomorrow.","de":"Our investigation found that inadequate inventory management at our warehouse caused delays in the shipping process.\nThe product was shipped today, and we expect it to reach you by tomorrow."},{"zh-Hant":"為避免今後再發生類似情況，我們將重新檢視確認機制，努力防止再度發生。\n再次致歉，並懇請您今後一如既往地支持我們。","zh-Hans":"为避免今后再发生类似情况，我们将重新查看确认机制，努力防止再度发生。\n再次致歉，并恳请您今后一如既往地支持我们。","en":"To prevent a recurrence, we will review our verification procedures and work to prevent this from happening again.\nOnce again, we apologize, and we respectfully ask for your continued patronage.","de":"To prevent a recurrence, we will review our verification procedures and work to prevent this from happening again.\nOnce again, we apologize, and we respectfully ask for your continued patronage."}],"d66":[{"zh-Hant":"「東京的冬天比北海道的冬天還冷。」從北海道搬到東京的人，常這麼說。當然，外面的氣溫是北海道低得多。真正冷的，是屋內的情況。","zh-Hans":"「东京的冬天比北海道的冬天还冷。」从北海道搬到东京的人，常这么说。当然，外面的气温是北海道低得多。真正冷的，是屋内的情况。","en":"\"Winter in Tokyo is colder than winter in Hokkaido.\" People who moved from Hokkaido to Tokyo often say this. Of course, outdoor temperatures in Hokkaido are much lower. What is really different is the situation indoors.","de":"\"Winter in Tokyo is colder than winter in Hokkaido.\" People who moved from Hokkaido to Tokyo often say this. Of course, outdoor temperatures in Hokkaido are much lower. What is really different is the situation indoors."},{"zh-Hant":"北海道的住宅，隔熱材很厚，窗戶常常是雙層、三層的。暖氣多用煤油暖爐等來暖和整棟房子，有些家庭即使在冬天，室內也穿著短袖度過。北海道冬天冰淇淋賣得很好，也是北海道獨有的景象。","zh-Hans":"北海道的住宅，隔热材很厚，窗户常常是双层、三层的。暖气多用煤油暖炉等来暖和整栋房子，有些家庭即使在冬天，室内也穿着短袖度过。北海道冬天冰淇淋卖得很好，也是北海道独有的景象。","en":"Hokkaido homes have thick insulation, and windows are often double or triple glazed. Heating with kerosene stoves and the like warms the whole house, and some families even spend winter indoors in short sleeves. Ice cream selling well in winter is also a distinctly Hokkaido sight.","de":"Hokkaido homes have thick insulation, and windows are often double or triple glazed. Heating with kerosene stoves and the like warms the whole house, and some families even spend winter indoors in short sleeves. Ice cream selling well in winter is also a distinctly Hokkaido sight."},{"zh-Hant":"另一方面，本州的老房子，過去建造時是優先考慮避開夏天的悶熱。通風良好，但冬天卻會有刺骨的寒意。越是嚴寒的地方，對寒冷的準備就越徹底。這種因地方不同而生活過的人們的智慧差異，正如實地反映在房屋的建造方式上。","zh-Hans":"另一方面，本州的老房子，过去建造时是优先考虑避开夏天的闷热。通风良好，但冬天却会有刺骨的寒意。越是严寒的地方，对寒冷的准备就越彻底。这种因地方不同而生活过的人们的智能差异，正如实地反映在房屋的建造方式上。","en":"Older houses in Honshu, on the other hand, were built with priority given to escaping the summer's sticky heat. They are airy, but winter brings a bone-chilling cold. The harsher the cold, the more thorough the preparation. The difference in wisdom among people who have lived in each place is reflected directly in how their houses are built.","de":"Older houses in Honshu, on the other hand, were built with priority given to escaping the summer's sticky heat. They are airy, but winter brings a bone-chilling cold. The harsher the cold, the more thorough the preparation. The difference in wisdom among people who have lived in each place is reflected directly in how their houses are built."}],"d67":[{"zh-Hant":"日本聖誕節的餐桌上，擺著草莓與鮮奶油的蛋糕，還有炸雞。從海外來的人，常常為此感到驚訝。","zh-Hans":"日本圣诞节的餐桌上，摆着草莓与鲜奶油的蛋糕，还有炸鸡。从海外来的人，常常为此感到惊讶。","en":"A Japanese Christmas table features strawberry shortcake with fresh cream, and fried chicken. People from overseas are often surprised by this.","de":"A Japanese Christmas table features strawberry shortcake with fresh cream, and fried chicken. People from overseas are often surprised by this."},{"zh-Hant":"炸雞之所以能普及，據說是因為速食店的廣告。在日本很難買到火雞，於是「聖誕節就吃炸雞」這樣的呼籲，成功地扎根下來。如今，有些店要提前幾週預約才買得到。","zh-Hans":"炸鸡之所以能普及，据说是因为速食店的广告。在日本很难买到火鸡，于是「圣诞节就吃炸鸡」这样的呼吁，成功地扎根下来。如今，有些店要提前几周预约才买得到。","en":"Fried chicken is said to have become popular because of fast-food advertising. Turkey was hard to find in Japan, so the call to \"eat chicken for Christmas\" took root remarkably well. Today, some shops require orders several weeks in advance.","de":"Fried chicken is said to have become popular because of fast-food advertising. Turkey was hard to find in Japan, so the call to \"eat chicken for Christmas\" took root remarkably well. Today, some shops require orders several weeks in advance."},{"zh-Hant":"此外，日本的聖誕節，與其說是全家一起度過的宗教節日，不如說更像是與戀人或朋友共度的活動。正因如此，隔天早上聖誕樹就被收起來，整個城市一下子換上門松和注連飾。這種轉換之快，或許正可以說是日本式的。","zh-Hans":"此外，日本的圣诞节，与其说是全家一起度过的宗教节日，不如说更像是与恋人或朋友共度的活动。正因如此，隔天早上圣诞树就被收起来，整个城市一下子换上门松和注连饰。这种转换之快，或许正可以说是日本式的。","en":"Also, Christmas in Japan is less a religious day spent with family and more an event to share with a lover or friends. Because of this, the Christmas tree is taken down the next morning, and the whole city quickly changes into kadomatsu and shimenawa decorations. This quick switch may be exactly what makes it distinctly Japanese.","de":"Also, Christmas in Japan is less a religious day spent with family and more an event to share with a lover or friends. Because of this, the Christmas tree is taken down the next morning, and the whole city quickly changes into kadomatsu and shimenawa decorations. This quick switch may be exactly what makes it distinctly Japanese."}],"d68":[{"zh-Hant":"祇園精舍的鐘聲，有著諸行無常的迴響。沙羅雙樹的花色，顯示出盛者必衰的道理。驕傲的人也不會長久，只如春夜的一場夢。勇猛的人終究也會滅亡，完全與風前的塵土一樣。","zh-Hans":"祇园精舍的钟声，有着诸行无常的回响。沙罗双树的花色，显示出盛者必衰的道理。骄傲的人也不会长久，只如春夜的一场梦。勇猛的人终究也会灭亡，完全与风前的尘土一样。","en":"The bell of the Gion Shōja temple rings with the sound of impermanence: all things change. The color of the sala tree blossoms reveals the truth that the mighty must decline. The proud do not endure for long; they are but a dream of a spring night. The brave, too, will in the end perish, no different from dust before the wind.","de":"The bell of the Gion Shōja temple rings with the sound of impermanence: all things change. The color of the sala tree blossoms reveals the truth that the mighty must decline. The proud do not endure for long; they are but a dream of a spring night. The brave, too, will in the end perish, no different from dust before the wind."},{"zh-Hant":"【白話譯】祇園精舍的鐘聲，蘊含著萬物都會變遷的迴響。沙羅雙樹花的顏色，說明了盛極的人必定衰敗的道理。驕傲的人也不會長久，只是像春夜的夢一樣短暫。勇猛的人最終也會滅亡，完全就像風前的塵土。","zh-Hans":"【白话译】祇园精舍的钟声，蕴含着万物都会变迁的回响。沙罗双树花的颜色，说明了盛极的人必定衰败的道理。骄傲的人也不会长久，只是像春夜的梦一样短暂。勇猛的人最终也会灭亡，完全就像风前的尘土。","en":"[Modern translation] The bell of the Gion Shōja temple carries the echo that everything changes. The color of the sala blossoms shows the principle that those at their height must decline. The arrogant do not last long; they are fleeting, like a dream of a spring night. The brave too will ultimately perish, just like dust before the wind.","de":"[Modern translation] The bell of the Gion Shōja temple carries the echo that everything changes. The color of the sala blossoms shows the principle that those at their height must decline. The arrogant do not last long; they are fleeting, like a dream of a spring night. The brave too will ultimately perish, just like dust before the wind."}],"d69":[{"zh-Hant":"年底的澡堂比平常更擁擠。大概是大掃除結束的人們，前來洗去一年的汙垢吧。","zh-Hans":"年底的澡堂比平常更拥挤。大概是大扫除结束的人们，前来洗去一年的污垢吧。","en":"The public bath at year's end was more crowded than usual. Perhaps people who had finished their year-end cleaning had come to wash away a year's grime.","de":"The public bath at year's end was more crowded than usual. Perhaps people who had finished their year-end cleaning had come to wash away a year's grime."},{"zh-Hant":"在浴池邊，一位不認識的奶奶說：「今年也承蒙您照顧了。」我不確定她是對我說，還是對旁邊的人說，但還是回了一句：「彼此彼此。」奶奶滿意地點點頭，又閉上了眼睛。","zh-Hans":"在浴池边，一位不认识的奶奶说：「今年也承蒙您照顾了。」我不确定她是对我说，还是对旁边的人说，但还是回了一句：「彼此彼此。」奶奶满意地点点头，又闭上了眼睛。","en":"At the edge of the bath, an elderly woman I didn't know said, \"Thank you for everything this year.\" I wasn't sure whether she was speaking to me or to the person next to her, but I replied, \"Likewise.\" She nodded contentedly and closed her eyes again.","de":"At the edge of the bath, an elderly woman I didn't know said, \"Thank you for everything this year.\" I wasn't sure whether she was speaking to me or to the person next to her, but I replied, \"Likewise.\" She nodded contentedly and closed her eyes again."},{"zh-Hant":"在更衣室，櫃台的老闆正在把明年的月曆分給常客。我也拿到了一本。是印有當地工務店名字、隨處可見的那種月曆。","zh-Hans":"在更衣室，柜台的老板正在把明年的月历分给常客。我也拿到了一本。是印有当地工务店名字、随处可见的那种月历。","en":"In the changing room, the owner at the front desk was handing out next year's calendars to the regulars. I received one too. It was an ordinary calendar bearing the name of a local construction company.","de":"In the changing room, the owner at the front desk was handing out next year's calendars to the regulars. I received one too. It was an ordinary calendar bearing the name of a local construction company."},{"zh-Hant":"走出去，寒冷得彷彿會讓剛泡過的身體再次著涼。不過，從頸後升起的水氣，還是護著我待了一會兒。今年，快要結束了。","zh-Hans":"走出去，寒冷得仿佛会让刚泡过的身体再次着凉。不过，从颈后升起的水气，还是护着我待了一会儿。今年，快要结束了。","en":"Outside, it was cold enough that I might catch a chill from the bath. Still, the steam rising from the back of my neck protected me for a while. This year is almost over.","de":"Outside, it was cold enough that I might catch a chill from the bath. Still, the steam rising from the back of my neck protected me for a while. This year is almost over."}],"d70":[{"zh-Hant":"新年吃的「御節料理」，是精美地裝在重箱裡的保存食品。因為新年期間不下廚，也為了讓主婦在新年至少能休息，所以通常會在年底就先做好。","zh-Hans":"新年吃的「御节料理」，是精美地装在重箱里的保存食品。因为新年期间不下厨，也为了让主妇在新年至少能休息，所以通常会在年底就先做好。","en":"「おせち料理」, the New Year's food, is preserved food beautifully packed in tiered lacquer boxes. Because the new year's deity is welcomed during the holidays, one does not cook in the kitchen then, and at least at New Year's the housewife can rest, so it is usually made before the year ends.","de":"「おせち料理」, the New Year's food, is preserved food beautifully packed in tiered lacquer boxes. Because the new year's deity is welcomed during the holidays, one does not cook in the kitchen then, and at least at New Year's the housewife can rest, so it is usually made before the year ends."},{"zh-Hant":"每一道菜都有吉祥的寓意。黑豆寓意「勤勞」，鯡魚卵（數之子）寓意子孫繁盛，蝦則寓意長壽到腰彎為止。昆布卷寓意「喜悅」，栗子金團因其金黃色而祈求財運。很多都是諧音的雙關語，也是日語文字遊戲的寶庫。","zh-Hans":"每一道菜都有吉祥的寓意。黑豆寓意「勤劳」，鲱鱼卵（数之子）寓意子孙繁盛，虾则寓意长寿到腰弯为止。昆布卷寓意「喜悦」，栗子金团因其金黄色而祈求财运。很多都是谐音的双关语，也是日语文本游戏的宝库。","en":"Each dish carries an auspicious meaning. Black beans mean \"working diligently,\" herring roe (kazunoko) means prosperity for descendants, and shrimp means living long until your back is bent. Kombu rolls mean \"joy,\" and kuri kinton, chestnut paste, is named for its golden color, wishing for good fortune. Many are puns, making osechi a treasure trove of Japanese wordplay.","de":"Each dish carries an auspicious meaning. Black beans mean \"working diligently,\" herring roe (kazunoko) means prosperity for descendants, and shrimp means living long until your back is bent. Kombu rolls mean \"joy,\" and kuri kinton, chestnut paste, is named for its golden color, wishing for good fortune. Many are puns, making osechi a treasure trove of Japanese wordplay."},{"zh-Hant":"近年來，在百貨公司或便利商店購買的人也很多。洋式、中式風格的御節料理也出現了。即使內容改變，在新的一年裡帶著願望品嚐，這種習慣並沒有改變。","zh-Hans":"近年来，在百货公司或便利商店购买的人也很多。洋式、中式风格的御节料理也出现了。即使内容改变，在新的一年里带着愿望品尝，这种习惯并没有改变。","en":"In recent years, many people buy osechi at department stores or convenience stores, and Western-style and Chinese-style osechi have also appeared. Even as the contents change, the custom of eating them in the new year with wishes for the future remains the same.","de":"In recent years, many people buy osechi at department stores or convenience stores, and Western-style and Chinese-style osechi have also appeared. Even as the contents change, the custom of eating them in the new year with wishes for the future remains the same."}],"d71":[{"zh-Hant":"「大掃除，好麻煩耶，明天再做好不好？」\n「明天就是除夕了吧。今天不做不行喔。」\n「說得也是啦。不過，只打掃窗戶就好啦。」\n「少囉唆，快把抹布拿來。」\n「好啦好啦……真的好累喔。」","zh-Hans":"「大扫除，好麻烦耶，明天再做好不好？」\n「明天就是除夕了吧。今天不做不行喔。」\n「说得也是啦。不过，只打扫窗户就好啦。」\n「少啰唆，快把抹布拿来。」\n「好啦好啦……真的好累喔。」","en":"\"Big cleaning is such a hassle. Shall we leave it for tomorrow?\"\n\"Tomorrow is New Year's Eve, isn't it? We have to do it today.\"\n\"You're right. But let's just do the windows.\"\n\"Stop complaining and bring me the rags already.\"\n\"Okay, okay... Man, this is really tough.\"","de":"\"Big cleaning is such a hassle. Shall we leave it for tomorrow?\"\n\"Tomorrow is New Year's Eve, isn't it? We have to do it today.\"\n\"You're right. But let's just do the windows.\"\n\"Stop complaining and bring me the rags already.\"\n\"Okay, okay... Man, this is really tough.\""}],"d72":[{"zh-Hant":"年末與人道別時，日本人會說「よいお年を」。這是「祝您有個好的新年」的縮略說法。另一方面，年初再見面時，則會說「あけましておめでとうございます」。","zh-Hans":"年末与人道别时，日本人会说「よいお年を」。这是「祝您有个好的新年」的缩略说法。另一方面，年初再见面时，则会说「あけましておめでとうございます」。","en":"When parting with someone at year's end, Japanese people say 「よいお年を」, \"Have a good year-end and New Year.\" It is a shortened form of 「よいお年をお迎えください」. On the other hand, when meeting after the new year begins, they say 「あけましておめでとうございます」, \"Happy New Year.\"","de":"When parting with someone at year's end, Japanese people say 「よいお年を」, \"Have a good year-end and New Year.\" It is a shortened form of 「よいお年をお迎えください」. On the other hand, when meeting after the new year begins, they say 「あけましておめでとうございます」, \"Happy New Year.\""},{"zh-Hant":"這兩句的使用時機分得很清楚。在年內說「あけましておめでとう」就太早了，而年明後才說「よいお年を」又顯得不合時宜。在公司辦完最後一天工作的日子，當然大家互道的是「よいお年を」。","zh-Hans":"这两句的使用时机分得很清楚。在年内说「あけましておめでとう」就太早了，而年明后才说「よいお年を」又显得不合时宜。在公司办完最后一天工作的日子，当然大家互道的是「よいお年を」。","en":"These two phrases are clearly separated by timing. Saying 「あけましておめでとう」 within the year is too early, and saying 「よいお年を」 after the new year has begun sounds out of place. On the last working day at the office, of course, everyone exchanges 「よいお年を」.","de":"These two phrases are clearly separated by timing. Saying 「あけましておめでとう」 within the year is too early, and saying 「よいお年を」 after the new year has begun sounds out of place. On the last working day at the office, of course, everyone exchanges 「よいお年を」."},{"zh-Hant":"另外，「あけましておめでとう」一般用於松之內（一月七日，部分地區到十五日）。對於服喪中的人，則避免說「おめでとう」，只說「今年也請多多關照」，這是一種體貼。即使是一句問候，也需要懂得讀取季節與對方的感覺。","zh-Hans":"另外，「あけましておめでとう」一般用于松之内（一月七日，部分地区到十五日）。对于服丧中的人，则避免说「おめでとう」，只说「今年也请多多关照」，这是一种体贴。即使是一句问候，也需要懂得读取季节与对方的感觉。","en":"Also, 「あけましておめでとう」 is generally used during the 松の内 (through January 7th, or the 15th in some regions). For people in mourning, it is considerate to avoid \"congratulations\" and simply say 「今年もよろしくお願いします」. Even a single greeting calls for sensitivity to the season and to the other person.","de":"Also, 「あけましておめでとう」 is generally used during the 松の内 (through January 7th, or the 15th in some regions). For people in mourning, it is considerate to avoid \"congratulations\" and simply say 「今年もよろしくお願いします」. Even a single greeting calls for sensitivity to the season and to the other person."}],"d73":[{"zh-Hant":"一年的最後一天，十二月三十一日是「大晦日（おおみそか）」。「晦日」是一個月的最後一天，因為是一年的最後，所以加上「大」字。","zh-Hans":"一年的最后一天，十二月三十一日是「大晦日（おおみそか）」。「晦日」是一个月的最后一天，因为是一年的最后，所以加上「大」字。","en":"The last day of the year, December 31st, is 「大晦日」, Ōmisoka. 「晦日」 is the last day of a month, and because it is the last of the year, the character 「大」 is added.","de":"The last day of the year, December 31st, is 「大晦日」, Ōmisoka. 「晦日」 is the last day of a month, and because it is the last of the year, the character 「大」 is added."},{"zh-Hant":"大晦日夜裡，要吃「年越蕎麥麵」。據說有細水長流、長命百歲的寓意，同時也因蕎麥麵容易斷，象徵斬斷一年的厄運。電視上播放紅白歌合戰，許多家庭一邊圍在暖桌裡看，一邊迎接新年。","zh-Hans":"大晦日夜里，要吃「年越荞麦面」。据说有细水长流、长命百岁的寓意，同时也因荞麦面容易断，象征斩断一年的厄运。电视上播放红白歌合战，许多家庭一边围在暖桌里看，一边迎接新年。","en":"On New Year's Eve, people eat 「年越しそば」, toshikoshi soba. It is said to mean living long and thin, like soba noodles, and also to symbolize cutting off the misfortunes of the year, since soba noodles break easily. On TV, the Kōhaku Uta Gassen song competition airs, and many families watch it from under the kotatsu as they usher in the new year.","de":"On New Year's Eve, people eat 「年越しそば」, toshikoshi soba. It is said to mean living long and thin, like soba noodles, and also to symbolize cutting off the misfortunes of the year, since soba noodles break easily. On TV, the Kōhaku Uta Gassen song competition airs, and many families watch it from under the kotatsu as they usher in the new year."},{"zh-Hant":"深夜，各地的寺院會敲響「除夜之鐘」，次數為一百零八下。據說這代表人類的一百零八種煩惱。台灣的除夕是依農曆過的，全家團聚圍坐在餐桌旁的日子。熱鬧的台灣跨年，與寧靜的日本跨年。兩者之中，都有對逝去的這一年依依不捨的情懷。","zh-Hans":"深夜，各地的寺院会敲响「除夜之钟」，次数为一百零八下。据说这代表人类的一百零八种烦恼。台湾的除夕是依农历过的，全家团聚围坐在餐桌旁的日子。热闹的台湾跨年，与宁静的日本跨年。两者之中，都有对逝去的这一年依依不舍的情怀。","en":"Late at night, temples across the country ring the 「除夜の鐘」, the New Year's Eve bell, 108 times. It is said to represent the 108 worldly desires of humanity. In Taiwan, New Year's Eve follows the lunar calendar and is the day families gather around the dinner table. Taiwan's lively New Year's Eve and Japan's quiet one both carry a reluctance to see the departing year go.","de":"Late at night, temples across the country ring the 「除夜の鐘」, the New Year's Eve bell, 108 times. It is said to represent the 108 worldly desires of humanity. In Taiwan, New Year's Eve follows the lunar calendar and is the day families gather around the dinner table. Taiwan's lively New Year's Eve and Japan's quiet one both carry a reluctance to see the departing year go."}],"d74":[{"zh-Hant":"新年快樂。","zh-Hans":"新年快乐。","en":"Happy New Year.","de":"Happy New Year."},{"zh-Hant":"一月一日是「元日」，那天早晨稱為「元旦」。「旦」字描繪的是太陽從地平線升起的樣子。所以說「元旦的早晨」，嚴格來說是重複的說法。","zh-Hans":"一月一日是「元日」，那天早晨称为「元旦」。「旦」字描绘的是太阳从地平线升起的样子。所以说「元旦的早晨」，严格来说是重复的说法。","en":"January 1st is 「元日」, and that morning is called 「元旦」. The character 「旦」 depicts the sun rising above the horizon. So saying 「元旦の朝」 is, strictly speaking, a redundant expression.","de":"January 1st is 「元日」, and that morning is called 「元旦」. The character 「旦」 depicts the sun rising above the horizon. So saying 「元旦の朝」 is, strictly speaking, a redundant expression."},{"zh-Hant":"在日本，許多人會在元日早晨去看「初日出」，也就是在海邊或山頂拜見當年的第一道太陽。在家裡則吃年糕湯，喝屠蘇酒慶祝。年糕湯因地區差異很大，年糕是方形還是圓形、湯是清湯還是白味噌，據說還能看出一個人的出身地。","zh-Hans":"在日本，许多人会在元日早晨去看「初日出」，也就是在海边或山顶拜见当年的第一道太阳。在家里则吃年糕汤，喝屠苏酒庆祝。年糕汤因地区差异很大，年糕是方形还是圆形、汤是清汤还是白味噌，据说还能看出一个人的出身地。","en":"In Japan, many people go to see 「初日の出」, the first sunrise of the year, on the sea or on a mountaintop, worshipping the year's first sun. At home, they eat ozōni, a soup with mochi, and celebrate with toso, a medicinal sake. Ozōni varies greatly by region, and it is said you can tell where someone is from by whether the mochi is square or round and whether the broth is clear or white miso.","de":"In Japan, many people go to see 「初日の出」, the first sunrise of the year, on the sea or on a mountaintop, worshipping the year's first sun. At home, they eat ozōni, a soup with mochi, and celebrate with toso, a medicinal sake. Ozōni varies greatly by region, and it is said you can tell where someone is from by whether the mochi is square or round and whether the broth is clear or white miso."},{"zh-Hant":"去參拜新年的神社，抽一支御神籤，占卜新的一年。今年的第一篇，謝謝你讀到這裡。也請今年多多指教。","zh-Hans":"去参拜新年的神社，抽一支御神签，占卜新的一年。今年的第一篇，谢谢你读到这里。也请今年多多指教。","en":"Go to the first shrine visit of the year and draw an omikuji fortune to divine the new year. Thank you for reading this first piece of the year. I wish you well this year too.","de":"Go to the first shrine visit of the year and draw an omikuji fortune to divine the new year. Thank you for reading this first piece of the year. I wish you well this year too."}],"d75":[{"zh-Hant":"一月二日，自古以來被視為「初」日，也就是新年後第一次做某件事的日子。其中最具代表性的是「書初め」。用毛筆寫下新年的抱負或吉祥話。也是小學寒假作業的常客。","zh-Hans":"一月二日，自古以来被视为「初」日，也就是新年后第一次做某件事的日子。其中最具代表性的是「书初め」。用毛笔写下新年的抱负或吉祥话。也是小学寒假作业的常客。","en":"January 2nd has long been considered a \"hatsu\" day, the first day of doing something in the new year. The most representative example is 「書き初め」, the first calligraphy of the year. People write their resolutions or auspicious words with a brush. It is also a familiar winter-break assignment for elementary school students.","de":"January 2nd has long been considered a \"hatsu\" day, the first day of doing something in the new year. The most representative example is 「書き初め」, the first calligraphy of the year. People write their resolutions or auspicious words with a brush. It is also a familiar winter-break assignment for elementary school students."},{"zh-Hant":"另一個是「初夢」，一般指從一月一日夜裡到二日早晨所做的夢。作為吉祥的初夢，人們熟知的是「一富士、二鷹、三茄子」。至於為什麼是這三樣，眾說紛紜。最有名的說法是，這些都是駿河的名產，而駿河與德川家康有淵源。","zh-Hans":"另一个是「初梦」，一般指从一月一日夜里到二日早晨所做的梦。作为吉祥的初梦，人们熟知的是「一富士、二鹰、三茄子」。至于为什么是这三样，众说纷纭。最有名的说法是，这些都是骏河的名产，而骏河与德川家康有渊源。","en":"Another is 「初夢」, the first dream of the year, generally the dream dreamt from the night of January 1st into the morning of January 2nd. The well-known lucky first dreams are 「一富士、二鷹、三茄子」: Mt. Fuji, a hawk, and an eggplant. There are many theories about why these three. The most famous holds that they were specialties of Suruga, a place linked to Tokugawa Ieyasu.","de":"Another is 「初夢」, the first dream of the year, generally the dream dreamt from the night of January 1st into the morning of January 2nd. The well-known lucky first dreams are 「一富士、二鷹、三茄子」: Mt. Fuji, a hawk, and an eggplant. There are many theories about why these three. The most famous holds that they were specialties of Suruga, a place linked to Tokugawa Ieyasu."},{"zh-Hant":"為了做好夢，還有把寶船圖畫放在枕頭下睡覺的習俗。今晚，會夢見什麼呢？","zh-Hans":"为了做好梦，还有把宝船图画放在枕头下睡觉的习俗。今晚，会梦见什么呢？","en":"To have a good dream, there was also a custom of placing a picture of the treasure ship under your pillow when you sleep. What dream will you have tonight?","de":"To have a good dream, there was also a custom of placing a picture of the treasure ship under your pillow when you sleep. What dream will you have tonight?"}],"d76":[{"zh-Hant":"一月二日與三日，日本許多家庭的電視上，都會出現大學生傳遞接力帶奔跑的身影。這就是「東京箱根間往返大學接力賽」，俗稱「箱根駅伝」。","zh-Hans":"一月二日与三日，日本许多家庭的电视上，都会出现大学生传递接力带奔跑的身影。这就是「东京箱根间往返大学接力赛」，俗称「箱根駅伝」。","en":"On January 2nd and 3rd, the TV screens of many Japanese households show university students running while passing along the tasuki sash. This is the 「東京箱根間往復大学駅伝競走」, popularly known as the Hakone Ekiden.","de":"On January 2nd and 3rd, the TV screens of many Japanese households show university students running while passing along the tasuki sash. This is the 「東京箱根間往復大学駅伝競走」, popularly known as the Hakone Ekiden."},{"zh-Hant":"從東京的大手町到箱根的蘆之湖，往程與返程共兩天，十名選手要接力跑完兩百多公里。其中，一口氣爬上海拔落差超過八百公尺的「山登り」路段，每年都會誕生戲劇性的故事。","zh-Hans":"从东京的大手町到箱根的芦之湖，往程与返程共两天，十名选手要接力跑完两百多公里。其中，一口气爬上海拔落差超过八百公尺的「山登り」路段，每年都会诞生戏剧性的故事。","en":"From Otemachi in Tokyo to Lake Ashi in Hakone, ten runners relay more than 200 kilometers over two days, outbound and return. Among the stretches, the \"mountain climb\" section, which climbs more than 800 meters in elevation at a stretch, produces drama every year.","de":"From Otemachi in Tokyo to Lake Ashi in Hakone, ten runners relay more than 200 kilometers over two days, outbound and return. Among the stretches, the \"mountain climb\" section, which climbs more than 800 meters in elevation at a stretch, produces drama every year."},{"zh-Hant":"駅伝之所以在日本如此受到喜愛，不只是因為個人的速度，而是因為它看重把接力帶「傳遞」下去。當接力帶因為提前出發而斷掉時，跑完的選手會哭倒在地，看的人也會心頭發緊。為團隊而跑的美學，無論好壞，看起來都像是日本組織文化的縮影。","zh-Hans":"駅伝之所以在日本如此受到喜爱，不只是因为个人的速度，而是因为它看重把接力带「传递」下去。当接力带因为提前出发而断掉时，跑完的选手会哭倒在地，看的人也会心头发紧。为团队而跑的美学，无论好坏，看起来都像是日本组织文化的缩影。","en":"Ekiden is so beloved in Japan probably because value is placed not only on individual speed but on \"connecting\" the sash. When the sash is cut due to an early start, the runner who has finished collapses in tears, and viewers feel a lump in their throats. The aesthetic of running for the team, for better or worse, seems like a miniature of Japan's organizational culture.","de":"Ekiden is so beloved in Japan probably because value is placed not only on individual speed but on \"connecting\" the sash. When the sash is cut due to an early start, the runner who has finished collapses in tears, and viewers feel a lump in their throats. The aesthetic of running for the team, for better or worse, seems like a miniature of Japan's organizational culture."}],"d77":[{"zh-Hant":"走到田子之浦一看　白雪紛紛落在　富士山的高峰\n（山部赤人）","zh-Hans":"走到田子之浦一看　白雪纷纷落在　富士山的高峰\n（山部赤人）","en":"Going out to Tagonoura and looking up, the snow keeps falling on the snowy peak of Mount Fuji.\n(Yamabe no Akahito)","de":"Going out to Tagonoura and looking up, the snow keeps falling on the snowy peak of Mount Fuji.\n(Yamabe no Akahito)"},{"zh-Hant":"晨光微明之中　彷彿見到有明之月　白雪正覆蓋著吉野的村落\n（坂上是則）","zh-Hans":"晨光微明之中　仿佛见到有明之月　白雪正覆盖着吉野的村落\n（坂上是则）","en":"In the faint light of dawn, it looks like the moon of Ariake, the white snow that has fallen on the village of Yoshino.\n(Sakanoue no Korenori)","de":"In the faint light of dawn, it looks like the moon of Ariake, the white snow that has fallen on the village of Yoshino.\n(Sakanoue no Korenori)"},{"zh-Hant":"在新年的家庭裡，有用百人一首玩紙牌遊戲（歌留多）的傳統。讀牌的人一開始念上句，搶牌的人要迅速找到寫有下句的牌並拿起來。","zh-Hans":"在新年的家庭里，有用百人一首玩纸牌游戏（歌留多）的传统。读牌的人一开始念上句，抢牌的人要迅速找到写有下句的牌并拿起来。","en":"In families at New Year's, there is a tradition of playing karuta, the card game using the Hyakunin Isshu. When the reader begins the first half of a poem, the players must quickly find and grab the card bearing its second half.","de":"In families at New Year's, there is a tradition of playing karuta, the card game using the Hyakunin Isshu. When the reader begins the first half of a poem, the players must quickly find and grab the card bearing its second half."},{"zh-Hant":"第一首是說站在田子之浦的海邊抬頭望去，雪正不斷落在純白的富士山頂。第二首是說在黎明微光中，白雪在吉野的村落裡堆積，白得讓人誤以為是有明之月的光。","zh-Hans":"第一首是说站在田子之浦的海边擡头望去，雪正不断落在纯白的富士山顶。第二首是说在黎明微光中，白雪在吉野的村落里堆积，白得让人误以为是有明之月的光。","en":"The first poem says that when you go out to the shore of Tagonoura and look up, snow keeps falling on the snow-white peak of Mount Fuji. The second says that in the dim light before dawn, snow has piled up in the village of Yoshino, so white that one might mistake it for the light of the Ariake moon.","de":"The first poem says that when you go out to the shore of Tagonoura and look up, snow keeps falling on the snow-white peak of Mount Fuji. The second says that in the dim light before dawn, snow has piled up in the village of Yoshino, so white that one might mistake it for the light of the Ariake moon."}],"d78":[{"zh-Hant":"二十四節氣中的「小寒」。從這一天起進入「寒之入」，經過下一個節氣「大寒」，直到二月初立春前一天（節分），約三十天稱為「寒之內」，是一年中最冷的時節。","zh-Hans":"二十四节气中的「小寒」。从这一天起进入「寒之入」，经过下一个节气「大寒」，直到二月初立春前一天（节分），约三十天称为「寒之内」，是一年中最冷的时节。","en":"「小寒」, Lesser Cold, is one of the 24 solar terms. From this day it becomes 「寒の入り」, the entrance of the cold, and the roughly thirty days through the next solar term, 「大寒」, up to the day before 立春 (the start of spring) in early February, are called 「寒の内」, the inside of the cold. It is the coldest time of the year.","de":"「小寒」, Lesser Cold, is one of the 24 solar terms. From this day it becomes 「寒の入り」, the entrance of the cold, and the roughly thirty days through the next solar term, 「大寒」, up to the day before 立春 (the start of spring) in early February, are called 「寒の内」, the inside of the cold. It is the coldest time of the year."},{"zh-Hant":"這個時期寄出的問候叫做「寒中見舞い」。它也用來回覆那些沒來得及寄出賀年卡的人，或是向服喪中的人致意。通常以「寒中お見舞い申し上げます」開頭，並附上關心對方健康的話語。","zh-Hans":"这个时期寄出的问候叫做「寒中见舞い」。它也用来回复那些没来得及寄出贺年卡的人，或是向服丧中的人致意。通常以「寒中お见舞い申し上げます」开头，并附上关心对方健康的话语。","en":"A greeting sent during this period is called 「寒中見舞い」. It is used to reply to people to whom one did not send a New Year's card, or to offer condolences to those in mourning. It usually begins with 「寒中お見舞い申し上げます」 and includes words expressing concern for the recipient's health.","de":"A greeting sent during this period is called 「寒中見舞い」. It is used to reply to people to whom one did not send a New Year's card, or to offer condolences to those in mourning. It usually begins with 「寒中お見舞い申し上げます」 and includes words expressing concern for the recipient's health."},{"zh-Hant":"也有反過來利用寒冷的活動。寒稽古，是在格外寒冷的清晨，刻意進行武道或藝道的練習。寒仕込，則是在雜菌較少的寒冷時節，釀造味噌或酒。寒冷既是麻煩的存在，同時也是鍛鍊、培育事物的力量。","zh-Hans":"也有反过来利用寒冷的活动。寒稽古，是在格外寒冷的清晨，刻意进行武道或艺道的练习。寒仕込，则是在杂菌较少的寒冷时节，酿造味噌或酒。寒冷既是麻烦的存在，同时也是锻炼、培育事物的力量。","en":"There are also events that turn the cold to advantage. 「寒稽古」 is deliberately practicing martial arts or traditional arts in the bitter early morning. 「寒仕込み」 is brewing miso or sake in the cold season, when there are fewer harmful bacteria. Cold is both a nuisance and a force that tempers and nurtures things.","de":"There are also events that turn the cold to advantage. 「寒稽古」 is deliberately practicing martial arts or traditional arts in the bitter early morning. 「寒仕込み」 is brewing miso or sake in the cold season, when there are fewer harmful bacteria. Cold is both a nuisance and a force that tempers and nurtures things."}],"d79":[{"zh-Hant":"我遺傳了父親的莽撞，從小到大總是吃虧。上小學的時候，曾經從學校二樓跳下來，結果腰閃了，躺了一個星期左右。","zh-Hans":"我遗传了父亲的莽撞，从小到大总是吃亏。上小学的时候，曾经从学校二楼跳下来，结果腰闪了，躺了一个星期左右。","en":"I inherited my father's recklessness and have been losing out since I was a child. When I was in elementary school, I jumped down from the second floor of the school and was so badly hurt in the back that I couldn't get up for about a week.","de":"I inherited my father's recklessness and have been losing out since I was a child. When I was in elementary school, I jumped down from the second floor of the school and was so badly hurt in the back that I couldn't get up for about a week."}],"d80":[{"zh-Hant":"一月七日的早晨，有吃「七草粥」的習俗。「芹菜、鼠麴草、蘿蔔、繁縷、田蔥、蕪菁、白蘿蔔，這就是七草」。把春天的七種野菜切碎放進去，是鹹味溫和的粥。","zh-Hans":"一月七日的早晨，有吃「七草粥」的习俗。「芹菜、鼠曲草、萝卜、繁缕、田葱、芜菁、白萝卜，这就是七草」。把春天的七种野菜切碎放进去，是咸味温和的粥。","en":"On the morning of January 7th, there is a custom of eating 「七草粥」, seven-herb rice porridge. \"Seri, nazuna, gyōgi, hakobera, hotoke-no-za, suzuna, suzushiro: these are the seven herbs.\" It is a gently salted porridge made with the seven spring herbs, finely chopped.","de":"On the morning of January 7th, there is a custom of eating 「七草粥」, seven-herb rice porridge. \"Seri, nazuna, gyōgi, hakobera, hotoke-no-za, suzuna, suzushiro: these are the seven herbs.\" It is a gently salted porridge made with the seven spring herbs, finely chopped."},{"zh-Hant":"すずな（すずな）指的是蕪菁，すずしろ指的是白蘿蔔。其餘五種，是生長在原野與溪畔的野草。它既是祈求無病無災，也有實際的意義，就是讓因新年大餐而疲憊的腸胃得到休息。","zh-Hans":"すずな（すずな）指的是芜菁，すずしろ指的是白萝卜。其余五种，是生长在原野与溪畔的野草。它既是祈求无病无灾，也有实际的意义，就是让因新年大餐而疲惫的肠胃得到休息。","en":"「すずな」 means turnip, and 「すずしろ」 means daikon radish. The other five are wild plants that grow in fields and along riverbanks. The custom wishes for health and freedom from illness, and it also has a practical purpose: giving rest to a stomach worn out by the feasts of New Year's.","de":"「すずな」 means turnip, and 「すずしろ」 means daikon radish. The other five are wild plants that grow in fields and along riverbanks. The custom wishes for health and freedom from illness, and it also has a practical purpose: giving rest to a stomach worn out by the feasts of New Year's."},{"zh-Hant":"這項活動據說源自中國的「人日」節，當天吃七種嫩菜煮的羹湯。如今超市有賣「七草套組」，可以輕鬆做。曾經在台灣生活過的人，或許會對「人日」這個詞感到一絲親切。","zh-Hans":"这项活动据说源自中国的「人日」节，当天吃七种嫩菜煮的羹汤。如今超市有卖「七草套组」，可以轻松做。曾经在台湾生活过的人，或许会对「人日」这个词感到一丝亲切。","en":"This event is said to derive from the Chinese 人日 festival, when a soup made of seven kinds of young greens was eaten. Today, supermarkets sell \"seven herb sets\"
