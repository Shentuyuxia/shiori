<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shiori · 声音试听</title>
<style>
:root{--bg:#f7f4ee;--ink:#2b2824;--muted:#7a7268;--line:#e2dcd1;--card:#fffdf9;--acc:#a0522d}
@media (prefers-color-scheme:dark){:root{--bg:#1d1b19;--ink:#ece6dc;--muted:#a39a8e;--line:#3a3631;--card:#262320;--acc:#e0a07a}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}h1{font-weight:500;font-size:22px;margin:0 0 6px}
.t{color:var(--muted);font-size:13px;margin:0 0 18px}.q{font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:18px}
.g{border-top:1px solid var(--line);padding:12px 0}.g h2{font-size:16px;font-weight:500;margin:0 0 6px}
.r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0}.r b{font-weight:400;min-width:110px;font-size:13px;color:var(--muted)}
audio{height:34px;max-width:100%}.id{font-size:12px;color:var(--muted)}
</style></head><body><main>
<h1>Shiori 朗读声音试听</h1>
<p class="t">每个声音都念同一段《はじめての銭湯》。挑一个喜欢的，告诉 Claude 它的名字和编号就好。声音由 VOICEVOX 生成。</p>
<div class="q" id="q"></div><div id="list">载入中…</div>
<script>
fetch("samples/voices.json").then(r=>r.json()).then(d=>{
 document.getElementById("q").textContent=d.text;
 const by={};d.voices.forEach(v=>(by[v.speaker]=by[v.speaker]||[]).push(v));
 document.getElementById("list").innerHTML=Object.entries(by).map(([sp,vs])=>`<div class="g"><h2>${sp}</h2>${vs.map(v=>`<div class="r"><b>${v.style} <span class="id">#${v.id}</span></b><audio controls preload="none" src="${v.file}"></audio></div>`).join("")}</div>`).join("");
 document.addEventListener("play",e=>document.querySelectorAll("audio").forEach(a=>{if(a!==e.target)a.pause()}),true);
}).catch(()=>document.getElementById("list").textContent="样本还在生成中，过几分钟再刷新。");
</script></main></body></html>
